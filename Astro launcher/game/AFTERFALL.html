<script>
/* js/entities.js */
/* =====================================================================
   AFTERFALL — entities.js
   Creature e NPC (IA a stati), proiettili, esplosioni, particelle,
   veicoli, contenitori e sacche di loot.
   ===================================================================== */
'use strict';
(function (AF) {
  const U = AF.U, TS = AF.TS, W = AF.W;
  const CELL = 128;

  /* =====================================================================
     OSTILITÀ
     ===================================================================== */
  const MON = { beast: 1, infected: 1, vault: 1 };
  function facHostile(f1, f2) {
    if (f1 === f2 || f1 === 'prey' || f2 === 'prey') return false;
    if (MON[f1] || MON[f2]) return !(MON[f1] && MON[f2]) || f1 === 'vault' || f2 === 'vault';
    return (AF.RIVALS[f1] || []).includes(f2);
  }
  AF.hostileToPlayer = function (a) {
    if (a.ally || a.fac === 'prey') return false;
    if (MON[a.fac]) return true;
    return AF.G.rep[a.fac] <= -30 || a.angry > 0;
  };
  AF.hostile = function (a, b) {
    if (a === b) return false;
    if (a.isPlayer) return AF.hostileToPlayer(b);
    if (b.isPlayer) return AF.hostileToPlayer(a);
    if (a.ally && b.ally) return false;
    if (a.ally) return AF.hostileToPlayer(b);
    if (b.ally) return AF.hostileToPlayer(a);
    return facHostile(a.fac, b.fac);
  };

  /* =====================================================================
     ATTORI (nemici, animali, NPC)
     ===================================================================== */
  const Act = AF.Actors = {};

  Act.make = function (type, x, y, o) {
    const G = AF.G, d = AF.ENEMIES[type]; o = o || {};
    const monster = MON[d.fac] || d.fac === 'prey';
    const hpMul = monster ? G.D.ehp : 1;
    const hp = Math.round((o.hp || d.hp) * hpMul);
    const a = {
      id: G.nextId++, type, d, x, y, r: d.r, hp, maxHp: hp, fac: o.fac || d.fac, state: 'IDLE', st: U.rnd(.5, 3),
      home: { x: o.hx || x, y: o.hy || y }, tx: x, ty: y, a: Math.random() * 6.28, atkCd: U.rnd(0, 1), perT: Math.random() * .3,
      npc: o.npc || null, role: o.role || null, name: o.n || d.n, persist: !!o.persist, angry: 0, ally: !!o.ally, hitT: -10,
      alertT: 0, ammo: 8, lastSeen: null, lostT: 0, stuck: 0, avoid: Math.random() < .5 ? 1 : -1, walk: 0, slowT: 0, target: null,
      boss: !!o.boss, drop: o.drop, comp: o.comp || null, leash: o.leash || (o.persist ? 260 : 900), skip: 0, acc: 0
    };
    G.actors.push(a);
    return a;
  };

  Act.spawnNamed = function () {
    const G = AF.G;
    G.world.npcs.forEach(n => {
      if (G.deadNpc[n.id]) return;
      const a = Act.make(n.type, n.x, n.y, { n: n.n, fac: n.fac, npc: n.id, role: n.role, persist: true, hp: n.hp, boss: n.boss, drop: n.drop, leash: n.role === 'guard' ? 340 : 120 });
      if (n.fac === 'vault') a.leash = 500;
    });
  };
  Act.spawnCompanion = function (c) {
    const G = AF.G, p = G.player;
    const home = c.home || { x: p.x, y: p.y };
    const pos = c.mode === 'base' ? home : { x: p.x + 30, y: p.y + 20 };
    const a = Act.make(c.type, pos.x, pos.y, { n: c.n, fac: c.fac, ally: true, persist: true, comp: c, hp: 120 });
    a.hp = Math.min(a.maxHp, c.hp || a.maxHp);
    c.actor = a;
    return a;
  };

  /* --- griglia spaziale --- */
  Act.rehash = function () {
    const G = AF.G; G.hash.clear();
    for (const a of G.actors) {
      const k = Math.floor(a.x / CELL) + ',' + Math.floor(a.y / CELL);
      let arr = G.hash.get(k); if (!arr) { arr = []; G.hash.set(k, arr); } arr.push(a);
    }
  };
  Act.query = function (x, y, r, out) {
    const G = AF.G; out = out || []; out.length = 0;
    const x0 = Math.floor((x - r) / CELL), x1 = Math.floor((x + r) / CELL), y0 = Math.floor((y - r) / CELL), y1 = Math.floor((y + r) / CELL);
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
      const arr = G.hash.get(cx + ',' + cy); if (!arr) continue;
      for (const a of arr) if (a.hp > 0 && (a.x - x) * (a.x - x) + (a.y - y) * (a.y - y) < (r + a.r) * (r + a.r)) out.push(a);
    }
    return out;
  };
  const tmp = [];

  /* --- percezione --- */
  function visRange(a, t) {
    const G = AF.G;
    let v = a.d.vis * G.visMul;
    if (t.isPlayer) v *= G.pvis; else v *= Math.max(.35, G.light);
    if (a.state === 'CHASE' || a.state === 'ATTACK') v *= 1.4;
    return v * (a.fac === 'infected' && !G.isDay ? 1.15 : 1);
  }
  Act.findTarget = function (a) {
    const G = AF.G, p = G.player;
    let best = null, bd = 1e9;
    const pt = p.veh ? p.veh : p;
    if (!p.dead && AF.hostileToPlayer(a)) {
      const d = Math.hypot(pt.x - a.x, pt.y - a.y);
      if (d < visRange(a, p) && (d < 60 || AF.los(a.x, a.y, pt.x, pt.y))) { best = p; bd = d; }
    }
    const R = a.d.vis * 1.1;
    Act.query(a.x, a.y, R, tmp);
    for (const o of tmp) {
      if (o === a || o.hp <= 0 || !AF.hostile(a, o)) continue;
      const d = Math.hypot(o.x - a.x, o.y - a.y);
      if (d < bd && d < visRange(a, o) && AF.los(a.x, a.y, o.x, o.y)) { best = o; bd = d; }
    }
    return best;
  };
  const tpos = t => t.isPlayer ? (t.veh || t) : t;

  /* --- movimento con aggiramento ostacoli --- */
  function steer(a, x, y, spd, dt) {
    const dx = x - a.x, dy = y - a.y, d = Math.hypot(dx, dy);
    if (d < 4) return true;
    let ang = Math.atan2(dy, dx);
    const step = Math.min(spd * dt, d);
    const tries = [0, .7 * a.avoid, -.7 * a.avoid, 1.5 * a.avoid, -1.5 * a.avoid];
    for (const off of tries) {
      const an = ang + off, mx = Math.cos(an) * step, my = Math.sin(an) * step;
      const ox = a.x, oy = a.y;
      AF.moveBody(a, mx, my);
      if (Math.abs(a.x - ox) + Math.abs(a.y - oy) > step * .35) {
        a.a = an; a.walk += step; a.stuck = Math.max(0, a.stuck - dt); return false;
      }
    }
    a.stuck += dt;
    if (a.stuck > 1) { a.avoid *= -1; a.stuck = 0; }
    // bloccato da una struttura del giocatore? la attacca
    if (a.state === 'CHASE' && a.atkCd <= 0 && !a.d.passive) {
      const fx = Math.floor((a.x + Math.cos(ang) * (a.r + 14)) / TS), fy = Math.floor((a.y + Math.sin(ang) * (a.r + 14)) / TS);
      const s = AF.G.sgrid.get(fy * W + fx);
      if (s) { AF.Build.damage(s, a.d.dmg * 1.5); a.atkCd = a.d.rate * 1.2; AF.Audio.play('hit', AF.Audio.at(U.dist(a, AF.G.player)) * .6); }
    }
    return false;
  }

  /* --- aggiornamento --- */
  Act.update = function (dt) {
    const G = AF.G, p = G.player;
    Act.rehash();
    const pv = p.veh || p;
    for (let i = G.actors.length - 1; i >= 0; i--) {
      const a = G.actors[i];
      if (a.hp <= 0) { G.actors.splice(i, 1); continue; }
      const dist = Math.hypot(a.x - pv.x, a.y - pv.y);
      if (!a.persist && dist > 1900) { G.actors.splice(i, 1); continue; }
      if (dist > 2600 && !a.ally) continue; // troppo lontano: congelato
      // aggiornamento ridotto per attori lontani
      a.acc += dt;
      if (dist > 1100) { a.skip = (a.skip + 1) % 4; if (a.skip) continue; }
      const dd = Math.min(a.acc, .2); a.acc = 0;
      think(a, dd, dist);
    }
    // separazione morbida
    for (const a of G.actors) {
      if (Math.abs(a.x - pv.x) > 900 || Math.abs(a.y - pv.y) > 700) continue;
      Act.query(a.x, a.y, a.r * 2, tmp);
      for (const o of tmp) {
        if (o === a) continue;
        const dx = a.x - o.x, dy = a.y - o.y, d = Math.hypot(dx, dy) || 1, m = a.r + o.r - d;
        if (m > 0) AF.moveBody(a, dx / d * m * .3, dy / d * m * .3);
      }
    }
  };

  function think(a, dt, distP) {
    const G = AF.G, d = a.d, p = G.player;
    a.atkCd -= dt; a.hitT -= dt; a.alertT -= dt; if (a.angry > 0) a.angry -= dt; if (a.slowT > 0) a.slowT -= dt;
    let spd = d.spd * (a.slowT > 0 ? .5 : 1);
    if (d.nightBoost && !G.isDay) spd *= d.nightBoost;
    if (G.weather.cur === 'snow') spd *= .85;

    if (d.passive) return prey(a, dt, spd, distP);
    if (a.ally) return companion(a, dt, spd);

    a.perT -= dt;
    if (a.perT <= 0) {
      a.perT = .22 + Math.random() * .12;
      const t = Act.findTarget(a);
      if (t) {
        a.target = t; const tp = tpos(t); a.lastSeen = { x: tp.x, y: tp.y }; a.lostT = 0;
        if (a.state === 'IDLE' || a.state === 'PATROL' || a.state === 'SEARCH') {
          a.state = 'ALERT'; a.st = .35 + Math.random() * .4 / G.D.aggro; a.alertT = 1.2;
          if (t.isPlayer) { if (d.shape === 'beast') AF.Audio.play('growl', AF.Audio.at(distP)); else AF.Audio.play('alert', AF.Audio.at(distP) * .6); }
        }
      } else a.target = null;
    }
    const t = a.target && (a.target.isPlayer ? !a.target.dead : a.target.hp > 0) ? a.target : null;
    const home = a.home;

    switch (a.state) {
      case 'IDLE':
        a.st -= dt;
        if (a.st <= 0) {
          const R = a.role === 'trader' || a.role === 'leader' || a.role === 'medic' ? 60 : a.persist ? 170 : 260;
          const an = Math.random() * 6.28, rr = Math.random() * R;
          a.tx = home.x + Math.cos(an) * rr; a.ty = home.y + Math.sin(an) * rr; a.state = 'PATROL'; a.st = 12;
        }
        break;
      case 'PATROL':
        a.st -= dt;
        if (steer(a, a.tx, a.ty, spd * .42, dt) || a.st <= 0 || a.stuck > .8) { a.state = 'IDLE'; a.st = U.rnd(1.5, 5); }
        break;
      case 'ALERT':
        a.st -= dt;
        if (a.lastSeen) a.a = Math.atan2(a.lastSeen.y - a.y, a.lastSeen.x - a.x);
        if (a.st <= 0) { if (t) a.state = 'CHASE'; else { a.state = 'SEARCH'; a.st = 7; } }
        break;
      case 'SEARCH':
        a.st -= dt;
        if (a.lastSeen && !steer(a, a.lastSeen.x, a.lastSeen.y, spd * .6, dt)) { }
        else a.a += dt * 1.6;
        if (t) a.state = 'CHASE';
        if (a.st <= 0) { a.state = 'PATROL'; a.tx = home.x; a.ty = home.y; a.st = 20; a.lastSeen = null; }
        break;
      case 'CHASE': {
        if (!t) {
          a.lostT += dt;
          if (a.lastSeen) steer(a, a.lastSeen.x, a.lastSeen.y, spd, dt);
          if (a.lostT > 4) { a.state = 'SEARCH'; a.st = 7; }
          break;
        }
        const tp = tpos(t), dd = Math.hypot(tp.x - a.x, tp.y - a.y);
        if (Math.hypot(a.x - home.x, a.y - home.y) > a.leash + 500 && a.persist) { a.state = 'PATROL'; a.tx = home.x; a.ty = home.y; a.target = null; break; }
        if (d.ranged) {
          if (dd < d.atk * .85 && AF.los(a.x, a.y, tp.x, tp.y)) a.state = 'ATTACK';
          else steer(a, tp.x, tp.y, spd, dt);
        } else {
          if (dd < d.atk + (tp.r || 12)) a.state = 'ATTACK';
          else steer(a, tp.x, tp.y, spd, dt);
        }
        break;
      }
      case 'ATTACK': {
        if (!t) { a.state = 'CHASE'; break; }
        const tp = tpos(t), dx = tp.x - a.x, dy = tp.y - a.y, dd = Math.hypot(dx, dy);
        a.a = Math.atan2(dy, dx);
        if (d.ranged) {
          // mantiene la distanza e si sposta di lato
          const side = a.a + Math.PI / 2 * a.avoid;
          if (dd < 140) steer(a, a.x - dx, a.y - dy, spd * .6, dt);
          else AF.moveBody(a, Math.cos(side) * spd * .25 * dt, Math.sin(side) * spd * .25 * dt);
          if (Math.random() < dt * .3) a.avoid *= -1;
          if (dd > d.atk * 1.05 || !AF.los(a.x, a.y, tp.x, tp.y)) { a.state = 'CHASE'; break; }
          if (a.atkCd <= 0) {
            if (a.ammo <= 0) { a.ammo = 8; a.atkCd = 1.8; break; }
            a.ammo--; a.atkCd = d.rate * U.rnd(.8, 1.3);
            const r = d.ranged, ang = a.a + U.rnd(-r.acc, r.acc);
            AF.Proj.fire(a.x + Math.cos(a.a) * a.r, a.y + Math.sin(a.a) * a.r, ang, { dmg: r.dmg, spd: r.spd, rng: d.atk * 1.3, own: a, kind: r.laser ? 'laser' : 'bullet' });
            AF.Audio.play(r.laser ? 'laser' : 'shot', AF.Audio.at(distP) * .7);
            AF.makeNoise(a.x, a.y, r.laser ? 200 : 380, a);
            AF.Parts.flash(a.x + Math.cos(a.a) * 16, a.y + Math.sin(a.a) * 16);
          }
        } else {
          if (dd > d.atk + (tp.r || 12) + 8) { a.state = 'CHASE'; break; }
          if (a.atkCd <= 0) {
            a.atkCd = d.rate; a.lunge = .15;
            const dmg = d.dmg * (MON[a.fac] ? G.D.edmg : 1);
            if (t.isPlayer) AF.Player.damage(dmg, a, { infect: d.infect });
            else Act.damage(t, dmg, a);
            AF.Audio.play('swing', AF.Audio.at(distP) * .8);
          }
        }
        break;
      }
    }
    if (a.lunge > 0) a.lunge -= dt;
  }

  // animali da preda: fuggono
  function prey(a, dt, spd, distP) {
    const G = AF.G, p = G.player.veh || G.player;
    const scared = distP < 230 * Math.max(.4, G.pvis) || a.hitT > -3;
    if (scared && distP < 500) {
      const ang = Math.atan2(a.y - p.y, a.x - p.x);
      steer(a, a.x + Math.cos(ang) * 100, a.y + Math.sin(ang) * 100, spd, dt);
      return;
    }
    a.st -= dt;
    if (a.st <= 0 || a.stuck > .8) { a.st = U.rnd(2, 6); const an = Math.random() * 6.28; a.tx = a.home.x + Math.cos(an) * 200; a.ty = a.home.y + Math.sin(an) * 200; }
    steer(a, a.tx, a.ty, spd * .3, dt);
  }

  // compagni: seguono il giocatore o sorvegliano la base
  function companion(a, dt, spd) {
    const G = AF.G, p = G.player, c = a.comp;
    a.perT -= dt;
    if (a.perT <= 0) { a.perT = .3; a.target = Act.findTarget(a); }
    const t = a.target && a.target.hp > 0 ? a.target : null;
    const anchor = c && c.mode === 'base' && c.home ? c.home : (p.veh || p);
    if (t && Math.hypot(t.x - anchor.x, t.y - anchor.y) < 500) {
      const dd = Math.hypot(t.x - a.x, t.y - a.y);
      a.a = Math.atan2(t.y - a.y, t.x - a.x);
      if (a.d.ranged) {
        if (dd > a.d.atk * .8 || !AF.los(a.x, a.y, t.x, t.y)) steer(a, t.x, t.y, spd, dt);
        else if (a.atkCd <= 0) {
          a.atkCd = a.d.rate * 1.2;
          AF.Proj.fire(a.x, a.y, a.a + U.rnd(-.08, .08), { dmg: a.d.ranged.dmg, spd: 1300, rng: 500, own: a, kind: 'bullet' });
          AF.Audio.play('shot', .4); AF.makeNoise(a.x, a.y, 300, a);
        }
      } else {
        if (dd > a.d.atk + t.r) steer(a, t.x, t.y, spd, dt);
        else if (a.atkCd <= 0) { a.atkCd = a.d.rate; Act.damage(t, a.d.dmg * 1.2, a); AF.Audio.play('swing', .4); }
      }
      return;
    }
    const dd = Math.hypot(anchor.x - a.x, anchor.y - a.y);
    if (dd > 600 && c && c.mode !== 'base') { a.x = anchor.x - 40; a.y = anchor.y + 30; return; }
    if (dd > 90) steer(a, anchor.x, anchor.y, spd * (dd > 250 ? 1.1 : .7), dt);
    if (a.hp < a.maxHp) a.hp = Math.min(a.maxHp, a.hp + dt * .5);
  }

  /* --- danni e morte --- */
  Act.damage = function (a, dmg, src, o) {
    const G = AF.G; if (a.hp <= 0) return;
    o = o || {};
    const dd = dmg * (1 - (a.d.arm || 0) * (o.pierce ? .5 : 1));
    a.hp -= dd; a.hitT = .15;
    AF.Parts.blood(a.x, a.y, a.d.shape === 'robot' ? '#d9e2e8' : a.fac === 'infected' ? '#5d6e3a' : '#6e1b1b', Math.min(8, 2 + dd / 6));
    const byPlayer = src && (src.isPlayer || src === 'turret');
    if (byPlayer && !AF.hostileToPlayer(a) && !a.ally && a.fac !== 'prey') {
      // il giocatore ha provocato un NPC neutrale
      if (a.angry <= 0) {
        if (AF.FACTIONS[a.fac]) { AF.Factions.change(a.fac, -12, true); AF.msg(a.name + ' ti considera ora un nemico!', 'bad'); }
        Act.query(a.x, a.y, 520, []).forEach(o2 => { if (o2.fac === a.fac) { o2.angry = 150; o2.target = G.player; o2.state = 'CHASE'; o2.lastSeen = { x: G.player.x, y: G.player.y }; } });
      }
      a.angry = 150;
    }
    if (src && a.hp > 0 && !a.d.passive) {
      const srcObj = src === 'turret' ? null : src;
      if (srcObj && (srcObj.isPlayer || srcObj.hp > 0) && AF.hostile(a, srcObj)) {
        a.target = srcObj; a.state = 'CHASE'; const sp = tpos(srcObj); a.lastSeen = { x: sp.x, y: sp.y };
      }
    }
    if (a.hp <= 0) Act.kill(a, src);
  };

  Act.kill = function (a, src) {
    const G = AF.G; a.hp = 0;
    AF.Parts.blood(a.x, a.y, a.d.shape === 'robot' ? '#cfd8dc' : '#5a1616', 14);
    if (a.d.shape === 'robot') AF.Parts.explode(a.x, a.y, 40, true);
    AF.decal(a.x, a.y, a.d.shape === 'robot' ? 'oil' : 'blood');
    const byPlayer = src && (src.isPlayer || src === 'turret' || (src.ally));
    // bottino
    const items = [];
    (a.d.drops || []).forEach(dr => {
      let q = U.ri(dr[1], dr[2]);
      if (byPlayer && q > 0 && dr[0] !== 'dogtag') q = Math.max(0, Math.round(q * G.D.loot + (Math.random() < .3 ? 0 : -0.2)));
      if (q > 0) items.push(AF.mkItem(dr[0], q, { roll: true, worn: true }));
    });
    if (a.drop) items.push(AF.mkItem(a.drop, 1));
    if (a.npc && AF.FACTIONS[a.fac] && Math.random() < .5) items.push(AF.mkItem(U.pick(['beans', 'water', 'bandage', 'ammo9']), U.ri(1, 4)));
    if (a.d.ranged && a.fac === 'predoni' && Math.random() < .15) items.push(AF.mkItem('pistol', 1, { roll: true, worn: true }));
    if (a.d.ranged && a.fac === 'milizia' && Math.random() < .08) items.push(AF.mkItem('rifle', 1, { roll: true, worn: true }));
    if (items.length) AF.Bags.drop(a.x, a.y, items);
    if (a.npc) { G.deadNpc[a.npc] = a.persist && !/guard|sentinel/.test(a.npc) ? true : G.time.day; }
    if (a.comp) { G.companions = G.companions.filter(c => c !== a.comp); AF.msg(a.name + ' è morto.', 'bad'); }
    if (byPlayer) {
      G.stats.kills++;
      AF.Player.addXp(a.d.xp);
      if (AF.FACTIONS[a.fac]) {
        AF.Factions.change(a.fac, a.boss ? -60 : -10, true);
        (Object.keys(AF.RIVALS)).forEach(f => { if ((AF.RIVALS[f] || []).includes(a.fac)) AF.Factions.change(f, a.boss ? 15 : 3, true); });
      }
      AF.Quests.event('kill', { type: a.type, fac: a.fac, npc: a.npc });
    }
    AF.Quests.event('death', { actor: a });
    if (a.boss) AF.msg(a.name + ' è caduto.', 'warn');
  };

  /* =====================================================================
     RUMORE
     ===================================================================== */
  AF.makeNoise = function (x, y, r, src) {
    const G = AF.G;
    const mul = G.weather.cur === 'storm' ? .55 : G.weather.cur === 'rain' ? .75 : 1;
    G.noises.push({ x, y, r: r * mul, src });
    if (G.noises.length > 30) G.noises.shift();
  };
  Act.hear = function () {
    const G = AF.G;
    for (const n of G.noises) {
      if (n.src && n.src !== G.player) continue; // solo i rumori del giocatore (e dei suoi spari) allertano
      Act.query(n.x, n.y, n.r * 1.6, tmp);
      for (const a of tmp) {
        if (a.ally || a.d.passive || !AF.hostileToPlayer(a)) continue;
        const d = Math.hypot(a.x - n.x, a.y - n.y);
        if (d > n.r * a.d.hear * G.D.aggro) continue;
        if (a.state === 'IDLE' || a.state === 'PATROL' || a.state === 'SEARCH') {
          a.state = 'ALERT'; a.st = .5; a.alertT = 1.4; a.lastSeen = { x: n.x + U.rnd(-40, 40), y: n.y + U.rnd(-40, 40) };
        } else if (a.state === 'CHASE' && !a.target) a.lastSeen = { x: n.x, y: n.y };
      }
    }
    G.noises.length = 0;
  };

  /* =====================================================================
     PROIETTILI ED ESPLOSIONI
     ===================================================================== */
  const Proj = AF.Proj = {};
  Proj.fire = function (x, y, ang, o) {
    AF.G.proj.push({ x, y, vx: Math.cos(ang) * o.spd, vy: Math.sin(ang) * o.spd, dmg: o.dmg, life: o.rng, own: o.own, kind: o.kind || 'bullet', aoe: o.aoe, fire: o.fire, pierce: o.pierce, item: o.item, a: ang, px: x, py: y });
  };
  function bulletBlock(tx, ty) {
    const G = AF.G; if (tx < 0 || ty < 0 || tx >= W || ty >= AF.H) return true;
    const k = ty * W + tx, t = G.world.g[k];
    if (AF.SOLID[t] && t !== AF.T.FENCE && t !== AF.T.DEEP) return true;
    if (G.blk[k]) return true;
    const s = G.sgrid.get(k);
    if (s) { const sd = AF.STRUCTS[s.type]; if (sd.solid && !sd.window && !(sd.door && s.open)) return s; }
    return false;
  }
  Proj.update = function (dt) {
    const G = AF.G, p = G.player;
    for (let i = G.proj.length - 1; i >= 0; i--) {
      const b = G.proj[i];
      const sp = Math.hypot(b.vx, b.vy), steps = Math.max(1, Math.ceil(sp * dt / 12));
      let dead = false;
      b.px = b.x; b.py = b.y;
      for (let s = 0; s < steps && !dead; s++) {
        const mx = b.vx * dt / steps, my = b.vy * dt / steps;
        b.x += mx; b.y += my; b.life -= Math.hypot(mx, my);
        if (b.kind === 'throw') { if (b.life <= 0) { Proj.explode(b); dead = true; } continue; }
        const blk = bulletBlock(Math.floor(b.x / TS), Math.floor(b.y / TS));
        if (blk) {
          if (typeof blk === 'object' && b.own && !b.own.isPlayer && !b.own.ally) AF.Build.damage(blk, b.dmg * .5);
          AF.Parts.sparks(b.x - mx, b.y - my, 4);
          if (b.kind === 'arrow' && Math.random() < .6) AF.Bags.drop(b.x - mx * 2, b.y - my * 2, [AF.mkItem('arrows', 1)], true);
          dead = true; break;
        }
        // colpisce attori
        Act.query(b.x, b.y, 6, tmp);
        for (const a of tmp) {
          if (a === b.own || a.hp <= 0) continue;
          if (b.own && !b.own.isPlayer && !AF.hostile(b.own, a)) continue;
          if (b.own && b.own.isPlayer && a.ally) continue;
          Act.damage(a, b.dmg, b.own, { pierce: b.pierce });
          if (b.kind === 'arrow' && Math.random() < .35) AF.Bags.drop(a.x, a.y, [AF.mkItem('arrows', 1)], true);
          dead = true; break;
        }
        if (dead) break;
        // colpisce il giocatore
        if (b.own && !b.own.isPlayer && !b.own.ally && !p.dead && AF.hostileToPlayer(b.own)) {
          const pp = p.veh || p, pr = p.veh ? 22 : p.r;
          if ((pp.x - b.x) ** 2 + (pp.y - b.y) ** 2 < pr * pr) {
            if (p.veh) AF.Veh.damage(p.veh, b.dmg * .6); else AF.Player.damage(b.dmg * G.D.edmg, b.own, { bullet: true });
            dead = true;
          }
        }
        if (b.life <= 0) dead = true;
      }
      if (dead) G.proj.splice(i, 1);
    }
  };
  Proj.explode = function (b) {
    const G = AF.G, x = b.x, y = b.y, R = b.aoe || 80;
    AF.Parts.explode(x, y, R, !b.fire);
    AF.Audio.play(b.fire ? 'fire' : 'boom', AF.Audio.at(U.dist({ x, y }, G.player)));
    if (b.fire) { AF.Audio.play('boom', AF.Audio.at(U.dist({ x, y }, G.player)) * .4); G.fires = G.fires || []; G.fires.push({ x, y, r: R, t: 8, own: b.own }); }
    AF.makeNoise(x, y, b.fire ? 300 : 700, b.own && b.own.isPlayer ? G.player : null);
    if (!b.fire) AF.decal(x, y, 'scorch');
    Act.query(x, y, R, tmp).forEach(a => { const f = 1 - Math.hypot(a.x - x, a.y - y) / (R + a.r) * .6; Act.damage(a, b.dmg * f, b.own); });
    const pp = G.player.veh || G.player, dp = Math.hypot(pp.x - x, pp.y - y);
    if (dp < R) { if (G.player.veh) AF.Veh.damage(G.player.veh, b.dmg * .7); else AF.Player.damage(b.dmg * (1 - dp / R * .6) * .7, null, {}); }
    G.structs.forEach(s => { const sx = s.x * TS + 16, sy = s.y * TS + 16; if (Math.hypot(sx - x, sy - y) < R) AF.Build.damage(s, b.dmg * (b.fire ? .3 : 1.2)); });
    G.camShake = Math.max(G.camShake || 0, b.fire ? 4 : 12);
  };
  Proj.updateFires = function (dt) {
    const G = AF.G; if (!G.fires) return;
    for (let i = G.fires.length - 1; i >= 0; i--) {
      const f = G.fires[i]; f.t -= dt;
      if (Math.random() < dt * 30) AF.Parts.add('fire', f.x + U.rnd(-f.r, f.r) * .7, f.y + U.rnd(-f.r, f.r) * .7, U.rnd(-10, 10), U.rnd(-50, -20), .8, U.rnd(4, 9));
      if (Math.random() < dt * 3) AF.Audio.play('fire', AF.Audio.at(U.dist(f, G.player)) * .5);
      f.tick = (f.tick || 0) - dt;
      if (f.tick <= 0) {
        f.tick = .5;
        Act.query(f.x, f.y, f.r, tmp).forEach(a => Act.damage(a, 7, f.own));
        const pp = G.player; if (!pp.veh && Math.hypot(pp.x - f.x, pp.y - f.y) < f.r) AF.Player.damage(5, null, { fire: true });
      }
      if (f.t <= 0) G.fires.splice(i, 1);
    }
  };

  /* =====================================================================
     PARTICELLE E DECALCOMANIE
     ===================================================================== */
  const Parts = AF.Parts = {};
  Parts.add = function (type, x, y, vx, vy, life, size, col) {
    const G = AF.G, max = 500 * AF.Settings.data.parts;
    if (G.parts.length >= max) G.parts.shift();
    G.parts.push({ type, x, y, vx, vy, life, max: life, size, col });
  };
  Parts.blood = function (x, y, col, n) {
    for (let i = 0; i < n * AF.Settings.data.parts; i++) Parts.add('blood', x, y, U.rnd(-90, 90), U.rnd(-90, 90), U.rnd(.25, .5), U.rnd(1.5, 3), col);
  };
  Parts.sparks = function (x, y, n) { for (let i = 0; i < n; i++) Parts.add('spark', x, y, U.rnd(-160, 160), U.rnd(-160, 160), U.rnd(.1, .3), 2, '#ffd27a'); };
  Parts.dust = function (x, y, n, col) { for (let i = 0; i < n; i++) Parts.add('smoke', x + U.rnd(-10, 10), y + U.rnd(-10, 10), U.rnd(-30, 30), U.rnd(-30, 30), U.rnd(.6, 1.2), U.rnd(5, 10), col || 'rgba(150,140,120,'); };
  Parts.flash = function (x, y) {
    Parts.add('flash', x, y, 0, 0, .06, 14, '#fff3c4');
    AF.G.flashes = AF.G.flashes || []; AF.G.flashes.push({ x, y, t: .07 });
  };
  Parts.explode = function (x, y, R, big) {
    const G = AF.G;
    for (let i = 0; i < 26; i++) { const a = Math.random() * 6.28, s = U.rnd(40, 220); Parts.add('fire', x, y, Math.cos(a) * s, Math.sin(a) * s, U.rnd(.3, .7), U.rnd(5, 12)); }
    for (let i = 0; i < 18; i++) { const a = Math.random() * 6.28, s = U.rnd(20, 90); Parts.add('smoke', x, y, Math.cos(a) * s, Math.sin(a) * s, U.rnd(1, 2.2), U.rnd(10, 22), 'rgba(60,58,55,'); }
    if (big) Parts.sparks(x, y, 16);
    G.flashes = G.flashes || []; G.flashes.push({ x, y, t: .25, r: R * 3 });
  };
  Parts.update = function (dt) {
    const G = AF.G;
    for (let i = G.parts.length - 1; i >= 0; i--) {
      const q = G.parts[i]; q.life -= dt;
      if (q.life <= 0) { G.parts.splice(i, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.type === 'blood' || q.type === 'spark') { q.vx *= .9; q.vy *= .9; }
      else if (q.type === 'smoke') { q.size += dt * 8; q.vx *= .98; q.vy = q.vy * .98 - dt * 8; }
      else if (q.type === 'fire') { q.vy -= dt * 60; q.size *= .985; }
    }
    if (G.flashes) for (let i = G.flashes.length - 1; i >= 0; i--) { G.flashes[i].t -= dt; if (G.flashes[i].t <= 0) G.flashes.splice(i, 1); }
    for (let i = G.decals.length - 1; i >= 0; i--) { G.decals[i].t -= dt; if (G.decals[i].t <= 0) G.decals.splice(i, 1); }
  };
  AF.decal = function (x, y, kind) {
    const G = AF.G; G.decals.push({ x, y, kind, t: kind === 'scorch' ? 240 : 120, r: U.rnd(8, 14), a: Math.random() * 6 });
    if (G.decals.length > 90) G.decals.shift();
  };

  /* =====================================================================
     CONTENITORI E SACCHE
     ===================================================================== */
  const Bags = AF.Bags = {};
  Bags.drop = function (x, y, items, quiet) {
    const G = AF.G;
    items = items.filter(Boolean);
    if (!items.length) return null;
    let b = G.bags.find(o => Math.hypot(o.x - x, o.y - y) < 28);
    if (!b) {
      b = { id: 'b' + (G.nextId++), x, y, kind: 'bag', exp: G.time.day * 1440 + G.time.min + 1440 };
      G.bags.push(b); G.contMap[b.id] = b; G.cont[b.id] = [];
    }
    const inv = G.cont[b.id];
    items.forEach(it => {
      const d = AF.ITEMS[it.id];
      if (d.s > 1) { const ex = inv.find(s => s && s.id === it.id && s.q + it.q <= d.s); if (ex) { ex.q += it.q; return; } }
      inv.push(it);
    });
    if (!quiet) AF.Audio.play('pickup', .3);
    return b;
  };
  Bags.cleanup = function () {
    const G = AF.G, now = G.time.day * 1440 + G.time.min;
    for (let i = G.bags.length - 1; i >= 0; i--) {
      const b = G.bags[i], inv = G.cont[b.id];
      if (!inv || !inv.some(Boolean) || (now > b.exp && Math.hypot(b.x - G.player.x, b.y - G.player.y) > 600)) {
        delete G.cont[b.id]; delete G.contMap[b.id]; G.bags.splice(i, 1);
      }
    }
  };
  // genera il contenuto di un contenitore alla prima apertura
  Bags.contents = function (c) {
    const G = AF.G;
    if (G.cont[c.id]) return G.cont[c.id];
    const out = [];
    if (c.fixed) c.fixed.forEach(f => out.push(AF.mkItem(f[0], f[1])));
    else {
      const table = AF.LOOT[c.table] || AF.LOOT.house;
      let n = Math.round(U.rnd(1, c.kind === 'cache' ? 5 : c.kind === 'wreck' ? 2.4 : 3.6) * G.D.loot);
      if (c.kind === 'wreck' && Math.random() < .3) n = 0;
      for (let i = 0; i < n; i++) {
        const e = U.weighted(table);
        const q = U.ri(e[2], e[3]);
        const it = AF.mkItem(e[0], Math.max(1, Math.round(q * (AF.ITEMS[e[0]].s > 1 ? G.D.loot : 1))), { roll: true, worn: true });
        const ex = out.find(s => s.id === it.id && AF.ITEMS[it.id].s > 1 && s.q + it.q <= AF.ITEMS[it.id].s);
        if (ex) ex.q += it.q; else out.push(it);
      }
      if (Math.random() < .12 * G.D.loot) G.player.caps += 0; // i tappi si trovano a parte
    }
    G.cont[c.id] = out;
    G.stats.looted++;
    if (!c.fixed && Math.random() < .35) { const caps = U.ri(2, 12); G.player.caps += caps; AF.msg('Hai trovato ' + caps + ' tappi.', 'good'); }
    AF.Player.addXp(2);
    return out;
  };

  /* =====================================================================
     VEICOLI
     ===================================================================== */
  AF.VEH = {
    car:   { n: 'Automobile', maxFuel: 60, hp: 260, top: 340, acc: 210, turn: 2.5, burn: .22, w: 46, h: 22, col: '#5f7480', trunk: 12, repair: { repairkit: 1, metal: 4, comp: 1 } },
    truck: { n: 'Camion', maxFuel: 100, hp: 460, top: 260, acc: 130, turn: 1.8, burn: .3, w: 64, h: 28, col: '#7c6b4c', trunk: 24, repair: { repairkit: 2, metal: 6, comp: 2 } },
    moto:  { n: 'Moto', maxFuel: 30, hp: 130, top: 420, acc: 300, turn: 3.3, burn: .12, w: 30, h: 12, col: '#9a4a3a', trunk: 4, repair: { repairkit: 1, metal: 2 } }
  };
  AF.mkVehicle = function (v) {
    const D = AF.VEH[v.type];
    return { id: v.id, type: v.type, x: v.x, y: v.y, a: v.a || 0, spd: 0, fuel: Math.round(D.maxFuel * U.rnd(.05, .2)), hp: Math.round(D.hp * .35), broken: true, store: [] };
  };
  const Veh = AF.Veh = {};
  Veh.r = v => AF.VEH[v.type].h / 2 + 5;
  Veh.damage = function (v, d) {
    v.hp -= d;
    if (v.hp <= 0) {
      v.hp = 0; v.broken = true; v.spd = 0;
      AF.Parts.explode(v.x, v.y, 60, true); AF.Audio.play('boom', .8);
      if (AF.G.player.veh === v) { AF.Player.exitVehicle(); AF.Player.damage(25, null, {}); AF.msg('Il veicolo è distrutto!', 'bad'); }
    }
  };
  Veh.drive = function (v, dt, inp) {
    const G = AF.G, D = AF.VEH[v.type];
    const thr = inp.y < -.2 ? 1 : inp.y > .2 ? -.6 : 0;
    if (v.fuel <= 0 && thr) { if (!v.warned) { AF.msg('Carburante esaurito.', 'warn'); v.warned = 1; } }
    else v.warned = 0;
    const can = v.fuel > 0 && !v.broken;
    if (thr && can) v.spd += thr * D.acc * dt; else v.spd *= Math.pow(.25, dt);
    v.spd = U.clamp(v.spd, -D.top * .35, D.top * (G.weather.cur === 'snow' ? .7 : 1));
    if (Math.abs(v.spd) > 8) v.a += inp.x * D.turn * dt * U.clamp(v.spd / 140, -1, 1);
    const terrain = AF.tileAt(v.x, v.y);
    let slow = 1;
    if (terrain === AF.T.WATER || terrain === AF.T.SNOW || terrain === AF.T.FOREST) slow = .6;
    if (terrain === AF.T.ASPH || terrain === AF.T.LINE || terrain === AF.T.CONC) slow = 1.1;
    const mx = Math.cos(v.a) * v.spd * dt * slow, my = Math.sin(v.a) * v.spd * dt * slow;
    const r = Veh.r(v);
    const ox = v.x, oy = v.y;
    AF.moveBody({ get x() { return v.x; }, set x(q) { v.x = q; }, get y() { return v.y; }, set y(q) { v.y = q; }, r }, mx, my);
    const moved = Math.hypot(v.x - ox, v.y - oy), want = Math.hypot(mx, my);
    if (want > 1 && moved < want * .5) {
      if (Math.abs(v.spd) > 120) { Veh.damage(v, Math.abs(v.spd) * .05); AF.Audio.play('hit', .8); G.camShake = 6; }
      v.spd *= -.25;
    }
    if (can) v.fuel = Math.max(0, v.fuel - Math.abs(v.spd) / D.top * D.burn * dt);
    // investe gli attori
    if (Math.abs(v.spd) > 90) {
      Act.query(v.x, v.y, r + 6, tmp).forEach(a => {
        if (a.ally) return;
        Act.damage(a, Math.abs(v.spd) * .14, G.player);
        AF.moveBody(a, Math.cos(v.a) * 26, Math.sin(v.a) * 26);
        v.spd *= .8; Veh.damage(v, 3);
      });
    }
    v.noiseT = (v.noiseT || 0) - dt;
    if (v.noiseT <= 0 && Math.abs(v.spd) > 10) { v.noiseT = .5; AF.makeNoise(v.x, v.y, 140 + 300 * Math.abs(v.spd) / D.top, G.player); AF.Audio.play('engine', .5); }
    G.stats.dist += moved;
  };
})(window.AF);

</script>
<script>
/* js/player.js */
/* =====================================================================
   AFTERFALL — player.js
   Movimento, combattimento, uso oggetti, equipaggiamento, interazioni,
   danni, esperienza, sonno e veicoli del giocatore.
   ===================================================================== */
'use strict';
(function (AF) {
  const U = AF.U, TS = AF.TS, W = AF.W, INV = AF.Inv;
  const P = AF.Player = {};
  const FISTS = { type: 'melee', dmg: 6, rng: 30, rate: .45, st: 5, noise: 30 };
  const tmp = [];

  P.sk = id => AF.G.skills[id] || 0;
  P.held = () => { const p = AF.G.player; return p.inv[p.sel] || null; };
  P.weapon = () => { const it = P.held(); const d = it && AF.ITEMS[it.id]; return d && d.wp ? d.wp : FISTS; };
  P.armor = function () {
    const e = AF.G.player.eq; let a = 0;
    ['head', 'body', 'legs'].forEach(s => { if (e[s]) a += (AF.ITEMS[e[s].id].arm || 0) * (e[s].mod || 1); });
    return Math.min(.7, a);
  };
  P.warmth = function () { const e = AF.G.player.eq; let w = 0; for (const s in e) if (e[s]) w += AF.ITEMS[e[s].id].warm || 0; return w; };
  P.carryMax = function () { const p = AF.G.player; let c = 32 + P.sk('carry') * 8; if (p.eq.back) c += AF.ITEMS[p.eq.back.id].carry || 0; return c; };
  P.load = function () { const p = AF.G.player; let w = INV.weight(p.inv); for (const s in p.eq) if (p.eq[s]) w += AF.ITEMS[p.eq[s].id].w; return w; };
  P.invSize = function () { const p = AF.G.player; return 20 + (p.eq.back ? AF.ITEMS[p.eq.back.id].slots : 0); };
  P.resizeInv = function () {
    const p = AF.G.player, n = P.invSize();
    while (p.inv.length < n) p.inv.push(null);
    while (p.inv.length > n) { const it = p.inv.pop(); if (it) AF.Bags.drop(p.x, p.y, [it]); }
  };
  P.needXp = l => Math.round(80 * Math.pow(l, 1.45));
  P.lightRadius = function () {
    const it = P.held(); if (!it) return 0;
    const d = AF.ITEMS[it.id]; return d.light && it.d > 0 && AF.G.player.lightOn ? d.light : 0;
  };

  /* ---------- Aggiornamento ---------- */
  P.update = function (dt, inp) {
    const G = AF.G, p = G.player;
    if (p.dead) return;
    p.hurtT = Math.max(0, p.hurtT - dt);
    p.atkCd -= dt; p.swing = Math.max(0, p.swing - dt);
    if (p.veh) {
      AF.Veh.drive(p.veh, dt, inp.move);
      p.x = p.veh.x; p.y = p.veh.y; p.a = p.veh.a;
      return;
    }
    // ricarica in corso
    if (p.rel > 0) { p.rel -= dt; if (p.rel <= 0) P.finishReload(); }
    // canalizzazione (ricerca tra rottami, riparazioni)
    if (p.chan) {
      p.chan.t += dt;
      if (Math.hypot(inp.move.x, inp.move.y) > .3) { p.chan = null; AF.msg('Azione interrotta.'); }
      else if (p.chan.t >= p.chan.max) { const f = p.chan.fn; p.chan = null; f(); }
    }
    // velocità
    const mvLen = Math.min(1, Math.hypot(inp.move.x, inp.move.y));
    const over = P.load() > P.carryMax();
    let spd = 118;
    p.run = inp.run && mvLen > .2 && p.stam > 2 && !p.crouch && !over;
    if (p.run) spd = 192; else if (p.crouch) spd = 66;
    spd *= 1 + P.sk('move') * .06;
    if (p.eq.legs && AF.ITEMS[p.eq.legs.id].speed) spd *= 1 + AF.ITEMS[p.eq.legs.id].speed;
    if (over) spd *= .6;
    if (p.cond.hypo) spd *= .75;
    if (p.energy <= 0) spd *= .8;
    const tile = AF.tileAt(p.x, p.y);
    if (tile === AF.T.WATER) spd *= .5;
    if (tile === AF.T.SNOW || G.weather.cur === 'snow') spd *= .86;
    if (p.cond.wound) spd *= .9;
    if (mvLen > .05) {
      const ox = p.x, oy = p.y;
      AF.moveBody(p, inp.move.x / Math.max(1, mvLen) * mvLen * spd * dt, inp.move.y / Math.max(1, mvLen) * mvLen * spd * dt);
      const moved = Math.hypot(p.x - ox, p.y - oy);
      G.stats.dist += moved;
      p.stepT -= moved;
      if (p.stepT <= 0) {
        p.stepT = p.run ? 46 : 38;
        const st = 1 - P.sk('stealth') * .18;
        AF.makeNoise(p.x, p.y, (p.run ? 230 : p.crouch ? 26 : 95) * st, p);
        AF.Audio.play(tile === AF.T.SNOW ? 'stepSnow' : 'step', p.crouch ? .3 : p.run ? 1 : .6);
        if (tile === AF.T.WATER) AF.Parts.add('smoke', p.x, p.y + 6, 0, 0, .5, 6, 'rgba(160,200,210,');
      }
    }
    if (p.run) p.stam = Math.max(0, p.stam - 13 * (1 - P.sk('move') * .15) * dt);
    else if (p.atkCd < -.4) p.stam = Math.min(p.maxStam, p.stam + (p.energy < 15 ? 9 : 19) * (p.cond.hypo ? .5 : 1) * dt);
    // direzione dello sguardo
    if (inp.aim != null) p.a = inp.aim;
    else if (mvLen > .2) p.a = Math.atan2(inp.move.y, inp.move.x);
    // attacco
    if (inp.attackPressed || (inp.attack && P.weapon().auto)) P.attack(inp.attackPressed);
    // la fiaccola si consuma
    const h = P.held();
    if (h && AF.ITEMS[h.id].light && p.lightOn && h.d > 0) {
      h.d -= dt * (AF.ITEMS[h.id].burn ? 1 : .5);
      if (h.d <= 0) { h.d = 0; if (AF.ITEMS[h.id].burn) { p.inv[p.sel] = null; AF.msg('La fiaccola si è spenta.', 'warn'); } else AF.msg('Batteria della torcia esaurita.', 'warn'); }
    }
    // zone di spore (laboratorio)
    for (const z of G.world.hazards) {
      if (Math.hypot(p.x - z.x, p.y - z.y) < z.r) {
        if (!(p.eq.head && p.eq.head.id === 'mask')) {
          p.sporeT = (p.sporeT || 0) + dt;
          if (p.sporeT > 1) { p.sporeT = 0; P.damage(4, null, { gas: true }); if (Math.random() < .12) P.addCond('infection'); if (Math.random() < .15) AF.msg('Le spore ti bruciano i polmoni. Ti serve una maschera antigas!', 'bad'); }
        }
      }
    }
  };

  /* ---------- Combattimento ---------- */
  P.attack = function (pressed) {
    const G = AF.G, p = G.player, it = P.held(), d = it && AF.ITEMS[it.id];
    if (p.chan || p.rel > 0 || p.atkCd > 0) return;
    if (d && !d.wp) {
      if (!pressed) return;
      if (d.use) return P.useSlot(p.sel);
      if (d.place) { AF.Build.start(d.place); return; }
      if (it.id === 'radio') { AF.UI.open('radio'); return; }
      if (it.id === 'repairkit') { AF.msg('Usa il kit dal menu inventario per riparare un oggetto, o vicino a un veicolo.'); return; }
      if (d.light) { p.lightOn = !p.lightOn; return; }
    }
    const wp = d && d.wp ? d.wp : FISTS, mod = it && it.mod || 1;
    if (wp.st && p.stam < wp.st * .5) { if (pressed) AF.msg('Sei troppo stanco per attaccare.'); return; }
    p.atkCd = wp.rate;
    p.stam = Math.max(0, p.stam - (wp.st || 0));
    if (wp.type === 'melee') {
      p.swing = .2;
      AF.Audio.play('swing', .7);
      AF.makeNoise(p.x, p.y, wp.noise, p);
      let dmg = wp.dmg * mod * (1 + P.sk('melee') * .15);
      if (p.crouch) dmg *= 1.6; // attacco furtivo
      let hit = false;
      AF.Actors.query(p.x, p.y, wp.rng + 20, tmp).forEach(a => {
        if (a.ally) return;
        const ang = Math.atan2(a.y - p.y, a.x - p.x);
        if (Math.abs(U.angDiff(p.a, ang)) > 1 && Math.hypot(a.x - p.x, a.y - p.y) > a.r + 8) return;
        const sneak = p.crouch && a.state !== 'CHASE' && a.state !== 'ATTACK' ? 1.8 : 1;
        AF.Actors.damage(a, dmg * sneak, p);
        AF.moveBody(a, Math.cos(ang) * 8, Math.sin(ang) * 8);
        hit = true;
      });
      if (hit) { AF.Audio.play('hit', .8); }
      // raccolta di risorse con gli attrezzi
      const hx = p.x + Math.cos(p.a) * (wp.rng - 4), hy = p.y + Math.sin(p.a) * (wp.rng - 4);
      if (P.harvest(Math.floor(hx / TS), Math.floor(hy / TS), d)) hit = true;
      if (hit && it && it.d != null) P.wear(p.sel, 1);
      return;
    }
    if (wp.type === 'throw') {
      const aim = G.aimWorld || { x: p.x + Math.cos(p.a) * 200, y: p.y + Math.sin(p.a) * 200 };
      const dist = U.clamp(Math.hypot(aim.x - p.x, aim.y - p.y), 60, wp.rng);
      AF.Proj.fire(p.x, p.y, p.a, { dmg: wp.dmg, spd: 420, rng: dist, own: p, kind: 'throw', aoe: wp.radius, fire: wp.fire });
      AF.Audio.play('swing', .7);
      it.q--; if (it.q <= 0) p.inv[p.sel] = null;
      return;
    }
    // armi a distanza
    if (!it.m) {
      if (INV.count(p.inv, wp.ammo) > 0) P.reload();
      else { AF.Audio.play('empty'); if (pressed) AF.msg('Niente munizioni (' + AF.ITEMS[wp.ammo].n + ').', 'warn'); p.atkCd = .3; }
      return;
    }
    it.m--;
    const moving = AF.Input && AF.Input.moving;
    let spread = (wp.acc || .05) * (1 - P.sk('aim') * .2) * (moving ? 1.5 : 1) * (p.crouch ? .7 : 1);
    const n = wp.pel || 1;
    const dmg = wp.dmg * mod * (1 + P.sk('ranged') * .12);
    for (let i = 0; i < n; i++) {
      AF.Proj.fire(p.x + Math.cos(p.a) * 14, p.y + Math.sin(p.a) * 14, p.a + U.rnd(-spread, spread), {
        dmg, spd: wp.spd, rng: wp.rng, own: p, kind: wp.ammo === 'arrows' ? 'arrow' : 'bullet', pierce: it.id === 'rifle'
      });
    }
    const st = wp.ammo === 'arrows' ? 1 - P.sk('stealth') * .18 : 1;
    AF.makeNoise(p.x, p.y, wp.noise * st, p);
    if (wp.ammo === 'arrows') AF.Audio.play('bow');
    else { AF.Audio.play(n > 1 ? 'shotgun' : 'shot'); AF.Parts.flash(p.x + Math.cos(p.a) * 20, p.y + Math.sin(p.a) * 20); G.camShake = Math.max(G.camShake || 0, n > 1 ? 6 : 3); }
    P.wear(p.sel, 1);
  };
  P.wear = function (slot, n) {
    const p = AF.G.player, it = p.inv[slot]; if (!it || it.d == null) return;
    it.d -= n;
    if (it.d <= 0) { p.inv[slot] = null; AF.msg(AF.itemName(it) + ' si è rotto!', 'bad'); AF.Audio.play('hit'); }
  };
  P.reload = function () {
    const p = AF.G.player, it = P.held(), wp = P.weapon();
    if (!it || wp.type !== 'ranged' || p.rel > 0) return;
    if (it.m >= wp.mag) return;
    if (!INV.count(p.inv, wp.ammo)) { AF.msg('Niente munizioni.', 'warn'); return; }
    p.rel = wp.rel * (1 - P.sk('ranged') * .1); p.relT = p.rel; p.relSlot = p.sel;
    AF.Audio.play('reload', .8);
  };
  P.finishReload = function () {
    const p = AF.G.player, it = p.inv[p.relSlot]; if (!it || p.relSlot !== p.sel) return;
    const wp = AF.ITEMS[it.id].wp; if (!wp || !wp.mag) return;
    const need = wp.mag - (it.m || 0), have = INV.count(p.inv, wp.ammo), n = Math.min(need, have);
    INV.remove(p.inv, wp.ammo, n); it.m = (it.m || 0) + n;
  };

  /* Raccolta da alberi/rocce */
  P.harvest = function (tx, ty, d) {
    const G = AF.G, id = G.ngrid[ty * W + tx]; if (id < 0) return false;
    const n = G.world.nodes[id];
    const tool = d && d.tool || {};
    const tree = n.t === 'tree' || n.t === 'pine', rock = n.t === 'rock' || n.t === 'ore';
    if (!tree && !rock) return false;
    if (tree && !tool.chop) { if (!P._hintT || G.real - P._hintT > 3) { AF.msg('Ti serve un\'ascia per tagliare gli alberi.'); P._hintT = G.real; } return false; }
    if (rock && !tool.mine) { if (!P._hintT || G.real - P._hintT > 3) { AF.msg('Ti serve un piccone per spaccare le rocce.'); P._hintT = G.real; } return false; }
    n.hp -= tree ? tool.chop : tool.mine;
    AF.Audio.play(tree ? 'chop' : 'mine');
    AF.Parts.dust(tx * TS + 16, ty * TS + 16, 3, tree ? 'rgba(120,90,50,' : 'rgba(150,150,150,');
    AF.makeNoise(G.player.x, G.player.y, 140, G.player);
    if (n.hp <= 0) {
      const g = 1 + P.sk('gather') * .25;
      const out = [];
      if (tree) out.push(['wood', Math.round(U.ri(3, 5) * g)]);
      if (n.t === 'rock') { out.push(['stone', Math.round(U.ri(3, 5) * g)]); if (Math.random() < .35) out.push(['metal', 1]); }
      if (n.t === 'ore') { out.push(['metal', Math.round(U.ri(2, 4) * g)]); out.push(['stone', 2]); if (Math.random() < .3) out.push(['gunpowder', 1]); }
      P.give(out);
      P.removeNode(n);
      P.addXp(3);
    }
    return true;
  };
  P.removeNode = function (n) {
    const G = AF.G, k = n.y * W + n.x;
    G.removed[n.id] = 1; G.ngrid[k] = -1; G.blk[k] = 0;
  };
  // dà oggetti al giocatore; ciò che non entra cade a terra
  P.give = function (list, quiet) {
    const G = AF.G, p = G.player, drop = [];
    list.forEach(([id, q]) => {
      if (q <= 0) return;
      const left = INV.add(p.inv, id, q);
      if (!quiet) AF.msg('+' + (q - left) + ' ' + AF.ITEMS[id].n, 'good');
      if (left > 0) drop.push(AF.mkItem(id, left));
    });
    if (drop.length) { AF.Bags.drop(p.x, p.y, drop); AF.msg('Inventario pieno: oggetti lasciati a terra.', 'warn'); }
    AF.Quests.check();
  };

  /* ---------- Uso degli oggetti ---------- */
  P.useSlot = function (i, inv) {
    const G = AF.G, p = G.player; inv = inv || p.inv;
    const it = inv[i]; if (!it) return;
    const d = AF.ITEMS[it.id];
    if (d.eq) return P.equip(i);
    if (d.place) { AF.UI.closeAll(); AF.Build.start(d.place); return; }
    if (it.id === 'radio') { AF.UI.open('radio'); return; }
    if (!d.use) {
      if (d.wp || d.tool || d.light) { if (i > 5) P.toHotbar(i); else p.sel = i; }
      return;
    }
    const u = d.use, cook = d.c === 'food' ? 1 + P.sk('cook') * .2 : 1;
    if (u.hunger) p.hunger = U.clamp(p.hunger + u.hunger * (u.hunger > 0 ? cook : 1), 0, 100);
    if (u.thirst) p.thirst = U.clamp(p.thirst + u.thirst, 0, 100);
    if (u.hp) p.hp = Math.min(p.maxHp, p.hp + u.hp);
    if (u.energy) p.energy = Math.min(100, p.energy + u.energy);
    if (u.stam) p.stam = Math.min(p.maxStam, p.stam + u.stam);
    if (u.temp) p.body = Math.min(37.6, p.body + u.temp);
    if (u.cure) u.cure.forEach(c => { if (p.cond[c]) { delete p.cond[c]; AF.msg('Curato: ' + AF.COND[c].n, 'good'); } });
    if (u.poison && Math.random() < u.poison) { P.addCond('poison'); }
    it.q--; if (it.q <= 0) inv[i] = null;
    if (d.ret) P.give([[d.ret, 1]], true);
    AF.Audio.play(d.c === 'water' ? 'drink' : 'eat');
    AF.UI && AF.UI.refresh();
  };
  P.toHotbar = function (i) {
    const p = AF.G.player;
    let k = p.inv.findIndex((s, j) => j < 6 && !s);
    if (k < 0) k = p.sel;
    const t = p.inv[k]; p.inv[k] = p.inv[i]; p.inv[i] = t; p.sel = k;
  };
  P.equip = function (i) {
    const p = AF.G.player, it = p.inv[i]; if (!it) return;
    const slot = AF.ITEMS[it.id].eq; if (!slot) return;
    const old = p.eq[slot];
    if (slot === 'back' && old) {
      // controlla che gli slot extra dello zaino attuale siano liberi
      const extraOld = AF.ITEMS[old.id].slots, extraNew = AF.ITEMS[it.id].slots;
      if (extraNew < extraOld) for (let k = 20 + extraNew; k < p.inv.length; k++) if (p.inv[k] && k !== i) { AF.msg('Svuota prima gli slot extra dello zaino.', 'warn'); return; }
    }
    p.eq[slot] = it; p.inv[i] = old || null;
    P.resizeInv();
    AF.Audio.play('pickup', .5);
  };
  P.unequip = function (slot) {
    const p = AF.G.player, it = p.eq[slot]; if (!it) return;
    if (slot === 'back') {
      const extra = AF.ITEMS[it.id].slots;
      for (let k = 20; k < 20 + extra; k++) if (p.inv[k]) { AF.msg('Svuota prima gli slot extra dello zaino.', 'warn'); return; }
      p.eq.back = null; P.resizeInv();
      const k = p.inv.findIndex(s => !s); if (k < 0) { p.eq.back = it; P.resizeInv(); return; }
      p.inv[k] = it; return;
    }
    const k = p.inv.findIndex(s => !s);
    if (k < 0) { AF.msg('Inventario pieno.', 'warn'); return; }
    p.inv[k] = it; p.eq[slot] = null;
  };
  P.repairItem = function (i) {
    const p = AF.G.player, it = p.inv[i]; if (!it || it.d == null) return;
    if (!INV.count(p.inv, 'repairkit')) { AF.msg('Serve un Kit di riparazione.', 'warn'); return; }
    INV.remove(p.inv, 'repairkit', 1);
    it.d = Math.min(AF.maxDur(it), it.d + Math.round(AF.maxDur(it) * .6));
    AF.Audio.play('craft'); AF.msg(AF.itemName(it) + ' riparato.', 'good');
  };

  /* ---------- Condizioni ---------- */
  AF.COND = {
    bleeding:  { n: 'Sanguinamento', i: '🩸', c: '#d0453a', d: 'Perdi salute. Usa una benda.' },
    wound:     { n: 'Ferita', i: '🩹', c: '#d08a3a', d: 'Più lento. Può infettarsi. Kit medico o disinfettante.' },
    infection: { n: 'Infezione', i: '🦠', c: '#8fbf4a', d: 'Porterà la febbre. Antibiotici.' },
    fever:     { n: 'Febbre', i: '🌡️', c: '#e0703a', d: 'Perdi salute e sete. Antidolorifici o antibiotici.' },
    poison:    { n: 'Avvelenamento', i: '☠️', c: '#9a5ad0', d: 'Nausea e danni. Antidoto, o aspetta.' },
    hypo:      { n: 'Ipotermia', i: '❄️', c: '#6fb3e0', d: 'Lento e debole. Scaldati: fuoco, vestiti, riparo.' },
    dehyd:     { n: 'Disidratazione', i: '🏜️', c: '#d9b44a', d: 'Bevi subito.' },
    starving:  { n: 'Fame', i: '🍽️', c: '#c97a4a', d: 'Mangia qualcosa.' },
    exhausted: { n: 'Sfinimento', i: '💤', c: '#8a8aa0', d: 'Dormi in un letto o una tenda.' }
  };
  P.addCond = function (c) {
    const p = AF.G.player;
    if (!p.cond[c]) { p.cond[c] = { t: 0 }; AF.msg('Condizione: ' + AF.COND[c].n, 'bad'); }
  };

  /* ---------- Danni e morte ---------- */
  P.damage = function (dmg, src, o) {
    const G = AF.G, p = G.player; if (p.dead) return;
    o = o || {};
    const armor = o.gas ? 0 : P.armor();
    dmg *= (1 - armor) * (1 - P.sk('defense') * .08);
    p.hp -= dmg; p.hurtT = .3;
    if (p.eq.body && p.eq.body.d != null && !o.gas) { p.eq.body.d -= 1; if (p.eq.body.d <= 0) { AF.msg(AF.itemName(p.eq.body) + ' si è distrutta!', 'bad'); p.eq.body = null; } }
    AF.Parts.blood(p.x, p.y, '#7a1d1d', 3 + dmg / 4);
    if (AF.Settings.data.shake) G.camShake = Math.max(G.camShake || 0, Math.min(10, dmg / 2));
    AF.Audio.play('hurt', .7);
    if (!o.fire && !o.gas && dmg > 5) {
      if (Math.random() < (o.bullet ? .3 : .16)) P.addCond('bleeding');
      if (dmg > 14 && Math.random() < .3) P.addCond('wound');
    }
    if (o.infect && Math.random() < o.infect) P.addCond('infection');
    if (p.hp <= 0) P.die(src);
  };
  P.die = function (src) {
    const G = AF.G, p = G.player;
    p.hp = 0; p.dead = true;
    AF.Audio.play('death');
    G.deathCause = src && src.name ? 'Ucciso da: ' + src.name : 'Non sei sopravvissuto.';
    setTimeout(() => AF.UI.showDeath(), 1200);
  };

  /* ---------- Esperienza ---------- */
  P.addXp = function (n) {
    const G = AF.G, p = G.player;
    p.xp += Math.round(n * (1 + P.sk('research') * .1) * G.D.xp);
    while (p.xp >= P.needXp(p.lvl)) {
      p.xp -= P.needXp(p.lvl); p.lvl++; p.sp++; p.maxHp += 5; p.hp = Math.min(p.maxHp, p.hp + 20);
      AF.msg('Livello ' + p.lvl + '! Hai un punto abilità (K).', 'level');
      AF.Audio.play('level');
    }
  };

  /* ---------- Interazioni ---------- */
  P.findInteract = function () {
    const G = AF.G, p = G.player, w = G.world;
    if (p.veh) return { kind: 'exitveh', label: 'Scendi dal veicolo', key: 'F' };
    const fx = p.x + Math.cos(p.a) * 20, fy = p.y + Math.sin(p.a) * 20;
    let best = null, bd = 58;
    const cand = (kind, ref, x, y, label, extra) => {
      const d = Math.min(Math.hypot(x - p.x, y - p.y), Math.hypot(x - fx, y - fy) + 4);
      if (d < bd) { bd = d; best = Object.assign({ kind, ref, label, x, y }, extra || {}); }
    };
    for (const c of w.containers) {
      if (Math.abs(c.x - p.x) > 70 || Math.abs(c.y - p.y) > 70) continue;
      if (c.hidden && !G.known['cache_' + c.id]) continue;
      const empty = G.cont[c.id] && !G.cont[c.id].some(Boolean);
      cand('cont', c, c.x, c.y, (c.kind === 'wreck' ? 'Fruga il relitto' : c.kind === 'locker' ? 'Apri l\'armadietto' : c.kind === 'cache' ? 'Apri la scorta nascosta' : 'Apri la cassa') + (empty ? ' (vuota)' : ''));
    }
    for (const b of G.bags) cand('cont', b, b.x, b.y, 'Raccogli oggetti');
    for (const d of w.docs) {
      if (Math.abs(d.x - p.x) > 70 || Math.abs(d.y - p.y) > 70) continue;
      const read = d.id === 'note' ? false : G.docs.includes(d.id);
      cand('doc', d, d.x, d.y, (read ? 'Rileggi: ' : 'Leggi: ') + (d.id === 'note' ? 'biglietto' : AF.DOCS[d.id].t));
    }
    for (const s of w.specials) if (Math.abs(s.x - p.x) < 70 && Math.abs(s.y - p.y) < 70) cand('special', s, s.x, s.y, 'Usa: ' + s.n);
    AF.Actors.query(p.x, p.y, 60, tmp).forEach(a => {
      if ((a.npc || a.ally) && !AF.hostileToPlayer(a)) cand('npc', a, a.x, a.y, 'Parla con ' + a.name);
    });
    for (const v of G.vehicles) {
      const d = Math.hypot(v.x - p.x, v.y - p.y);
      if (d < 60) cand('veh', v, v.x, v.y, v.broken ? 'Ripara ' + AF.VEH[v.type].n : 'Sali: ' + AF.VEH[v.type].n + ' (F)');
    }
    // strutture e risorse nelle tile vicine
    const tx0 = Math.floor(p.x / TS), ty0 = Math.floor(p.y / TS);
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
      const tx = tx0 + i, ty = ty0 + j, k = ty * W + tx, cx = tx * TS + 16, cy = ty * TS + 16;
      const s = G.sgrid.get(k);
      if (s) { const l = AF.Build.label(s); if (l) cand('struct', s, cx, cy, l); }
      const nid = G.ngrid[k];
      if (nid >= 0) {
        const n = w.nodes[nid];
        if (n.t === 'bush') cand('node', n, cx, cy, 'Raccogli ' + (n.sub === 'berries' ? 'bacche' : n.sub === 'herbs' ? 'erbe' : 'funghi'));
        else if (n.t === 'scrap') cand('node', n, cx, cy, 'Cerca tra i rottami');
      }
      const t = w.g[k];
      if (t === AF.T.LOCK) cand('lock', w.locks.find(l => l.x === tx && l.y === ty), cx, cy, 'Porta chiusa');
    }
    if (!best) {
      const t = AF.tileAt(fx + Math.cos(p.a) * 10, fy + Math.sin(p.a) * 10);
      if (t === AF.T.WATER || t === AF.T.DEEP || AF.tileAt(p.x, p.y) === AF.T.WATER) {
        best = { kind: 'water', label: INV.count(p.inv, 'bottle') ? 'Riempi una bottiglia' : 'Bevi acqua del lago' };
      }
    }
    return best;
  };

  P.interact = function () {
    const G = AF.G, p = G.player, it = G.interact;
    if (!it || p.dead) return;
    switch (it.kind) {
      case 'exitveh': P.exitVehicle(); break;
      case 'cont': AF.Bags.contents(it.ref); AF.UI.openLoot(it.ref); AF.Audio.play('open'); break;
      case 'doc': P.readDoc(it.ref); break;
      case 'special': AF.Story.special(it.ref.id); break;
      case 'npc': AF.UI.openDialog(it.ref); break;
      case 'veh': P.vehicleAction(it.ref); break;
      case 'struct': AF.Build.use(it.ref); break;
      case 'lock': P.tryLock(it.ref); break;
      case 'node': P.gatherNode(it.ref); break;
      case 'water':
        if (INV.remove(p.inv, 'bottle', 1)) { P.give([['dirtywater', 1]]); AF.Audio.play('drink', .5); }
        else { p.thirst = Math.min(100, p.thirst + 12); if (Math.random() < .35) P.addCond('poison'); AF.Audio.play('drink'); AF.msg('Hai bevuto acqua del lago. Non era una buona idea.', 'warn'); }
        break;
    }
  };
  P.readDoc = function (d) {
    const G = AF.G;
    if (d.id === 'note') { AF.UI.showDoc({ t: 'Biglietto', kind: 'Messaggio', x: AF.NOTES[d.note] }); return; }
    if (!G.docs.includes(d.id)) { G.docs.push(d.id); P.addXp(15); AF.Quests.event('read', { doc: d.id }); }
    AF.UI.showDoc(AF.DOCS[d.id]);
  };
  P.gatherNode = function (n) {
    const G = AF.G, p = G.player;
    if (n.t === 'bush') {
      const g = 1 + P.sk('gather') * .25;
      const out = [[n.sub, Math.round(U.ri(1, 3) * g)]];
      if (Math.random() < .3) out.push(['seeds', 1]);
      if (Math.random() < .25) out.push(['cloth', 1]);
      P.give(out); P.removeNode(n); AF.Audio.play('pickup'); P.addXp(1);
    } else if (n.t === 'scrap') {
      p.chan = { t: 0, max: 1.4, label: 'Cerchi tra i rottami...', fn: () => {
        const g = 1 + P.sk('gather') * .25;
        const pool = [['metal', 6], ['plastic', 4], ['glass', 2], ['wire', 2], ['comp', 1], ['nails', 3], ['cloth', 2], ['tape', .6]];
        const out = [];
        for (let k = 0; k < 2 + (Math.random() < .5 ? 1 : 0); k++) { const e = U.weighted(pool); out.push([e[0], Math.round(U.ri(1, 3) * g)]); }
        P.give(out); P.removeNode(n); AF.Audio.play('mine', .6); P.addXp(2);
        AF.makeNoise(p.x, p.y, 120, p);
      } };
    }
  };
  P.tryLock = function (l) {
    const G = AF.G, p = G.player; if (!l) return;
    let ok = false;
    if (l.req === 'keycard') ok = INV.count(p.inv, 'keycard') > 0;
    if (l.req === 'electools') ok = INV.count(p.inv, 'electools') > 0;
    if (l.req === 'aurora') ok = G.flags.aurora;
    if (!ok) { AF.msg(l.msg, 'warn'); AF.Audio.play('empty'); return; }
    G.lockOpen[l.req] = true;
    G.world.locks.forEach(o => { if (o.req === l.req) { G.world.g[o.y * W + o.x] = o.floor; G.chunks.invalidateTile(o.x, o.y); } });
    AF.Audio.play('door'); AF.msg('La porta si apre.', 'good');
    AF.Quests.event('unlock', { req: l.req });
  };

  /* ---------- Veicoli ---------- */
  P.vehicleAction = function (v, direct) {
    const G = AF.G, p = G.player, D = AF.VEH[v.type];
    if (v.broken) {
      const miss = Object.keys(D.repair).filter(k => INV.count(p.inv, k) < D.repair[k]);
      if (miss.length) { AF.msg('Per riparare servono: ' + Object.keys(D.repair).map(k => D.repair[k] + ' ' + AF.ITEMS[k].n).join(', ') + '.', 'warn'); return; }
      p.chan = { t: 0, max: 3, label: 'Ripari il veicolo...', fn: () => {
        Object.keys(D.repair).forEach(k => INV.remove(p.inv, k, D.repair[k]));
        v.broken = false; v.hp = Math.max(v.hp, Math.round(D.hp * .75));
        AF.msg(D.n + ' riparato! Fai rifornimento con una tanica di carburante.', 'good'); AF.Audio.play('craft'); P.addXp(30);
        AF.Quests.event('repair', { veh: v.type });
      } };
      return;
    }
    if (direct) P.enterVehicle(v); else AF.UI.vehicleMenu(v);
  };
  P.enterVehicle = function (v) {
    const p = AF.G.player;
    if (v.broken) return P.vehicleAction(v);
    p.veh = v; p.x = v.x; p.y = v.y; p.crouch = false;
    if (v.fuel <= 0) AF.msg('Il serbatoio è vuoto: usa una tanica (menu veicolo).', 'warn');
    AF.msg('Sei a bordo: ' + AF.VEH[v.type].n + '. F per scendere.');
  };
  P.exitVehicle = function () {
    const p = AF.G.player, v = p.veh; if (!v) return;
    v.spd = 0;
    for (const off of [Math.PI / 2, -Math.PI / 2, Math.PI, 0]) {
      const x = v.x + Math.cos(v.a + off) * 38, y = v.y + Math.sin(v.a + off) * 38;
      if (AF.freeAt(x, y, p.r)) { p.x = x; p.y = y; break; }
    }
    p.veh = null;
  };
  P.refuel = function (v) {
    const p = AF.G.player, D = AF.VEH[v.type];
    if (!INV.remove(p.inv, 'fuel', 1)) { AF.msg('Ti serve una tanica di carburante.', 'warn'); return; }
    v.fuel = Math.min(D.maxFuel, v.fuel + 22); AF.msg('Rifornimento: ' + Math.round(v.fuel) + '/' + D.maxFuel, 'good'); AF.Audio.play('drink');
  };

  /* ---------- Sonno ---------- */
  P.sleep = function (s) {
    const G = AF.G, p = G.player, sd = AF.STRUCTS[s.type];
    const danger = G.actors.some(a => a.hp > 0 && AF.hostileToPlayer(a) && Math.hypot(a.x - p.x, a.y - p.y) < 420);
    if (danger) { AF.msg('Non puoi dormire con nemici nelle vicinanze.', 'warn'); return; }
    if (p.energy > 85 && p.hp >= p.maxHp) { AF.msg('Non sei stanco.'); return; }
    const hours = sd.sleep >= 100 ? 8 : 6;
    p.spawn = { x: p.x, y: p.y };
    AF.UI.fade(() => {
      AF.Systems.advance(hours * 60, true);
      p.energy = Math.min(100, p.energy + sd.sleep);
      p.hp = Math.min(p.maxHp, p.hp + (sd.sleep >= 100 ? 30 : 12));
      p.stam = p.maxStam;
      AF.msg('Hai dormito ' + hours + ' ore. Punto di rinascita impostato.', 'good');
      AF.Quests.event('sleep', {});
      AF.Save.write('auto'); G.saves++;
      AF.msg('Partita salvata.', 'good');
      if (G.time.min > 20 * 60 || G.time.min < 5 * 60) { if (Math.random() < .3) AF.Events.raid(true); }
    });
  };
})(window.AF);

</script>
<script>
/* js/systems.js */
/* =====================================================================
   AFTERFALL — systems.js
   Ciclo giorno/notte, meteo, temperatura e sopravvivenza, condizioni,
   costruzione della base, crafting, fazioni, motore delle missioni,
   eventi casuali, radio, generazione dinamica dei nemici, scoperta.
   ===================================================================== */
'use strict';
(function (AF) {
  const U = AF.U, TS = AF.TS, W = AF.W, INV = AF.Inv;
  const tmp = [];

  /* =====================================================================
     TEMPO, METEO, SOPRAVVIVENZA
     ===================================================================== */
  const S = AF.Systems = {};
  S.TIME_SCALE = 1; // minuti di gioco per secondo reale
  AF.WEATHER = {
    clear:  { n: 'Sereno', i: '☀', light: 1, vis: 1, temp: 2, w: 4 },
    clouds: { n: 'Nuvoloso', i: '☁', light: .86, vis: .95, temp: 0, w: 3 },
    rain:   { n: 'Pioggia', i: '🌧', light: .72, vis: .82, temp: -4, w: 2.2, wet: 1 },
    storm:  { n: 'Temporale', i: '⛈', light: .55, vis: .68, temp: -6, w: .9, wet: 1.6 },
    fog:    { n: 'Nebbia', i: '🌫', light: .8, vis: .5, temp: -2, w: 1.4 },
    snow:   { n: 'Neve', i: '❄', light: .82, vis: .75, temp: -11, w: .9 }
  };

  S.update = function (dt) {
    const G = AF.G;
    const tm = dt * S.TIME_SCALE;
    S.tick(tm, false, dt);
    // visibilità del giocatore per i nemici: luce, postura, furtività, torce, veicoli
    const p = G.player;
    let v = .35 + .65 * G.light;
    if (p.crouch) v *= .55;
    if (p.run) v *= 1.2;
    v *= 1 - AF.Player.sk('stealth') * .18;
    if (AF.Player.lightRadius()) v = Math.max(v, .95);
    if (p.veh) v = Math.max(v, 1.3);
    if (S.indoors() && !p.veh) v *= .85;
    G.pvis = v;
    // scoperta ogni mezzo secondo
    S._disc = (S._disc || 0) - dt;
    if (S._disc <= 0) { S._disc = .5; S.discover(); }
    S.spawner(dt);
    AF.Events.update(dt);
    AF.Build.update(dt);
    AF.Radio.update(dt);
    if (G.weather.cur === 'storm' && Math.random() < dt * .08) {
      G.weather.flash = .25; setTimeout(() => AF.Audio.play('thunder', .7), U.ri(300, 1500));
    }
    G.weather.flash = Math.max(0, G.weather.flash - dt);
  };

  // avanza il tempo (usato anche per il sonno)
  S.advance = function (minutes, sleeping) {
    const G = AF.G;
    while (minutes > 0) { const m = Math.min(10, minutes); S.tick(m, sleeping, 0); minutes -= m; }
    G.actors.forEach(a => { if (a.state === 'CHASE') { a.state = 'IDLE'; a.target = null; } });
  };

  S.tick = function (tm, sleeping, dt) {
    const G = AF.G, p = G.player;
    G.time.min += tm;
    if (G.time.min >= 1440) { G.time.min -= 1440; G.time.day++; S.newDay(); }
    S.weather(tm);
    S.light();
    if (!p.dead) S.survival(tm, sleeping);
    AF.Build.tick(tm);
    AF.Quests.tickTime();
  };

  S.newDay = function () {
    const G = AF.G;
    AF.msg('Giorno ' + G.time.day + '. Sei ancora vivo.', 'level');
    G.stats.days = G.time.day;
    // le guardie delle fazioni rinascono
    Object.keys(G.deadNpc).forEach(k => { if (typeof G.deadNpc[k] === 'number' && G.deadNpc[k] < G.time.day) delete G.deadNpc[k]; });
    G.world.npcs.forEach(n => {
      if (G.deadNpc[n.id] || G.actors.some(a => a.npc === n.id)) return;
      AF.Actors.make(n.type, n.x, n.y, { n: n.n, fac: n.fac, npc: n.id, role: n.role, persist: true, hp: n.hp, leash: 340 });
    });
    // i compagni alla base raccolgono risorse (o tradiscono)
    G.companions.forEach(c => {
      if (c.mode !== 'base') return;
      if (c.loyal < .25 && Math.random() < .35) {
        const chest = G.structs.find(s => s.type === 'chest' && s.store && s.store.some(Boolean));
        if (chest) { for (let k = 0; k < 3; k++) { const i = chest.store.findIndex(Boolean); if (i >= 0) chest.store[i] = null; } }
        AF.msg(c.n + ' è sparito nella notte, portandosi via parte delle provviste. Tradimento.', 'bad');
        c.gone = true; if (c.actor) c.actor.hp = 0;
        return;
      }
      const chest = G.structs.find(s => s.type === 'chest');
      const found = [[U.pick(['wood', 'metal', 'cloth', 'plastic', 'stone']), U.ri(2, 5)], [U.pick(['beans', 'water', 'herbs', 'berries', 'bandage']), U.ri(1, 2)]];
      if (chest) { found.forEach(f => INV.add(chest.store, f[0], f[1])); AF.msg(c.n + ' ha portato rifornimenti al deposito.', 'good'); }
    });
    G.companions = G.companions.filter(c => !c.gone);
    AF.Bags.cleanup();
  };

  S.weather = function (tm) {

      const list = Object.keys(AF.WEATHER).map(k => {

  S.light = function () {

  S.indoors = function () {

  S.nearFire = function () {
    const G = AF.G, p = G.player;
    for (const s of G.structs) {
      const sd = AF.STRUCTS[s.type]; if (!sd.warm) continue;
      if (s.type === 'campfire' && !(s.fuel > 0)) continue;

    }
    for (const c of G.world.camps) if (Math.hypot(c.x - p.x, c.y - p.y) < 110 && !c.wild) return 14;

  S.survival = function (tm, sleeping) {
    const G = AF.G, p = G.player, D = G.D, c = p.cond;
    const h = G.time.min / 60;
    const bi = G.world.b[Math.floor(p.y / TS) * W + Math.floor(p.x / TS)];
    const wd = AF.WEATHER[G.weather.cur];
    let amb = 11 + 8 * Math.sin((h - 9) / 24 * Math.PI * 2) + AF.BIOMES[bi].temp + wd.temp * G.weather.mix;
    const indoor = S.indoors();
    // bagnato sotto la pioggia
    if (wd.wet && !indoor) p.wet = Math.min(1, p.wet + tm * .02 * wd.wet * G.weather.mix);
    else p.wet = Math.max(0, p.wet - tm * (S.nearFire() ? .06 : .01));
    const fire = S.nearFire();
    G.ambient = amb;
    G.feels = amb + AF.Player.warmth() + (indoor ? 5 : 0) + fire - p.wet * 5;
    const slp = sleeping ? .5 : 1;
    // fabbisogni
    p.hunger -= .072 * D.drain * tm * slp * (p.run ? 1.5 : 1) * (c.hypo ? 1.2 : 1);
    p.thirst -= .1 * D.drain * tm * slp * (c.fever ? 1.6 : 1) * (G.feels > 28 ? 1.4 : 1);
    if (!sleeping) p.energy -= .05 * D.drain * tm;
    p.hunger = U.clamp(p.hunger, 0, 100); p.thirst = U.clamp(p.thirst, 0, 100); p.energy = U.clamp(p.energy, 0, 100);
    // temperatura corporea
    if (c.fever) p.body += (39.2 - p.body) * .03 * tm;
    else if (G.feels < 10) p.body -= (10 - G.feels) * .005 * tm;
    else if (G.feels > 31) p.body += (G.feels - 31) * .004 * tm;
    else p.body += (37 - p.body) * .05 * tm;
    p.body = U.clamp(p.body, 30, 41.5);

    const set = (k, on) => { if (on && !c[k]) AF.Player.addCond(k); else if (!on && c[k]) delete c[k]; };
    set('hypo', p.body < 35.2 || (c.hypo && p.body < 35.6));
    set('starving', p.hunger <= 0);

    set('exhausted', p.energy <= 0);
    let dmg = 0;
    if (c.starving) dmg += .15 * tm;
    if (c.dehyd) dmg += .3 * tm;
    if (p.body < 34) dmg += .25 * tm;
    if (c.bleeding) { dmg += .45 * tm; c.bleeding.t += tm; if (c.bleeding.t > 60 && Math.random() < .01 * tm) { delete c.bleeding; AF.msg('Il sanguinamento si è fermato.', 'good'); } }
    if (c.wound) { c.wound.t += tm; if (Math.random() < .0012 * tm) AF.Player.addCond('infection'); if (c.wound.t > 1440) { delete c.wound; AF.msg('La ferita si è rimarginata.', 'good'); } }
    if (c.infection) { c.infection.t += tm; if (c.infection.t > 150) AF.Player.addCond('fever'); }
    if (c.fever) { dmg += .07 * tm; c.fever.t += tm; if (!c.infection && c.fever.t > 300) { delete c.fever; AF.msg('La febbre è passata.', 'good'); } }
    if (c.poison) { dmg += .22 * tm; p.hunger = Math.max(0, p.hunger - .08 * tm); c.poison.t += tm; if (c.poison.t > 120) { delete c.poison; AF.msg('Il veleno ha smesso di fare effetto.', 'good'); } }
    if (dmg > 0) { p.hp -= dmg; if (p.hp <= 0 && !p.dead) AF.Player.die({ name: c.bleeding ? 'dissanguamento' : c.dehyd ? 'disidratazione' : c.starving ? 'fame' : p.body < 34 ? 'ipotermia' : 'malattia' }); }
    else if (p.hunger > 45 && p.thirst > 45 && !c.poison && !c.fever) p.hp = Math.min(p.maxHp, p.hp + .06 * tm * (sleeping ? 2.5 : 1));

    if (G.structs.some(s => s.type === 'infirmary' && Math.hypot(s.x * TS - p.x, s.y * TS - p.y) < 120)) {

  };

  /* --- scoperta dei luoghi e nebbia della mappa --- */
  S.discover = function () {
    const G = AF.G, p = G.player;
    const cx = Math.floor(p.x / TS / 4), cy = Math.floor(p.y / TS / 4), R = 3 + Math.floor(AF.Player.sk('percept') / 2);
    for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) {
      const x = cx + i, y = cy + j; if (x < 0 || y < 0 || x >= 64 || y >= 64 || i * i + j * j > R * R + 1) continue;
      G.fog[y * 64 + x] = 1;
    }
    const tx = p.x / TS, ty = p.y / TS;
    for (const id in G.pois) {
      const q = G.pois[id];
      if (G.known[id] === 2) continue;
      if (q.hidden && !G.known[id]) continue;
      const d = Math.hypot(q.x - tx, q.y - ty);
      if (d < (q.area ? q.r * .7 : q.r + 5)) {
        G.known[id] = 2;
        if (id !== 'start') { AF.msg('Luogo scoperto: ' + q.n, 'level'); AF.Player.addXp(20); AF.UI.banner(q.n, q.fac ? AF.FACTIONS[q.fac].n : 'Luogo scoperto'); }
        AF.Quests.event('goto', { poi: id });
      }
    }
    // avvisi di territorio
    const bi = G.world.b[Math.floor(ty) * W + Math.floor(tx)];
    if (bi !== S._lastBiome) { S._lastBiome = bi; G.biomeName = AF.BIOMES[bi].n; }
    for (const f in AF.FACTIONS) {
      const F = AF.FACTIONS[f], h = G.pois[F.home];
      const inside = Math.hypot(h.x - tx, h.y - ty) < F.rad + 6;
      if (inside && S._terr !== f) { S._terr = f; if (G.rep[f] <= -30) AF.msg('Sei nel territorio ostile de ' + F.n + '!', 'bad'); else AF.msg('Territorio: ' + F.n + ' (' + AF.Factions.tier(f).n + ')'); }
      else if (!inside && S._terr === f) S._terr = null;
    }
    AF.Quests.check();
  };

  S.inSafeZone = function (x, y, extra) {
    const G = AF.G, tx = x / TS, ty = y / TS;
    for (const f in AF.FACTIONS) {
      const F = AF.FACTIONS[f], h = G.pois[F.home];

  S.spawner = function (dt) {
    const G = AF.G, p = G.player;
    G.spawnT -= dt; if (G.spawnT > 0 || p.dead) return;
    G.spawnT = 2;
    const pp = p.veh || p;
    let n = 0;
    for (const a of G.actors) if (!a.persist && Math.abs(a.x - pp.x) < 1500 && Math.abs(a.y - pp.y) < 1500) n++;
    const cap = Math.round((G.isDay ? 9 : 14) * G.D.spawn);
    if (n >= cap) return;
    if (Math.random() > .55) return;
    for (let t = 0; t < 8; t++) {
      const ang = Math.random() * 6.28, d = U.rnd(760, 1080);
      const x = pp.x + Math.cos(ang) * d, y = pp.y + Math.sin(ang) * d;
      const tx = Math.floor(x / TS), ty = Math.floor(y / TS);
      if (tx < 4 || ty < 4 || tx > W - 5 || ty > AF.H - 5) continue;
      if (!AF.freeAt(x, y, 14) || AF.tileAt(x, y) === AF.T.WATER) continue;
      if (S.inSafeZone(x, y, 8)) continue;
      const bi = G.world.b[ty * W + tx];
      const tbl = SPAWN[bi] || SPAWN[11];
      const type = U.weighted(G.isDay ? tbl.day : tbl.night)[0];
      const d0 = AF.ENEMIES[type];
      const grp = d0.pack ? U.ri(2, 4) : type === 'deer' ? U.ri(1, 3) : (type === 'bandit' || type === 'raider' || type === 'soldier' || type === 'cultist') ? U.ri(1, 3) : U.ri(1, G.isDay ? 2 : 3);
      for (let k = 0; k < grp; k++) {
        const ox = x + U.rnd(-50, 50), oy = y + U.rnd(-50, 50);
        if (AF.freeAt(ox, oy, d0.r)) AF.Actors.make(type, ox, oy);
      }
      return;
    }
  };

  /* =====================================================================

  const B = AF.Build = {};
  B.start = function (type) {
    const G = AF.G; if (G.player.veh) { AF.msg('Scendi dal veicolo per costruire.'); return; }

  B.stop = function () { const G = AF.G; if (G.build) G.build.on = false; AF.UI.showBuild(false); };
  B.ghost = function () {
    const G = AF.G, p = G.player, b = G.build;
    if (AF.Input.pointerWorld && !AF.Input.touchMode) return { x: Math.floor(AF.Input.pointerWorld.x / TS), y: Math.floor(AF.Input.pointerWorld.y / TS) };
    return { x: Math.floor((p.x + Math.cos(p.a) * 46) / TS), y: Math.floor((p.y + Math.sin(p.a) * 46) / TS) };
  };
  B.costOk = function (type) {
    const G = AF.G, inv = G.player.inv, sd = AF.STRUCTS[type];
    if (sd.kit && INV.count(inv, sd.kit)) return { ok: true, kit: true };
    const miss = [];
    for (const k in sd.cost) if (INV.count(inv, k) < sd.cost[k]) miss.push(sd.cost[k] + ' ' + AF.ITEMS[k].n);
    (sd.tools || []).forEach(t => { if (!INV.count(inv, t)) miss.push('attrezzo: ' + AF.ITEMS[t].n); });
    if (sd.sk) for (const k in sd.sk) if (AF.Player.sk(k) < sd.sk[k]) miss.push('abilità ' + skName(k) + ' ' + sd.sk[k]);
    return { ok: !miss.length, miss };
  };
  function skName(id) { for (const t of AF.SKILLS) for (const s of t.list) if (s.id === id) return s.n; return id; }
  AF.skName = skName;
  B.check = function (type, tx, ty) {
    const G = AF.G, p = G.player, sd = AF.STRUCTS[type], k = ty * W + tx;
    if (tx < 3 || ty < 3 || tx > W - 4 || ty > AF.H - 4) return 'Fuori dai limiti';
    if (Math.hypot(tx * TS + 16 - p.x, ty * TS + 16 - p.y) > 170) return 'Troppo lontano';
    const t = G.world.g[k];
    if (AF.SOLID[t] || t === AF.T.WATER) return 'Terreno non adatto';
    if (G.blk[k] || G.ngrid[k] >= 0) return 'Spazio occupato';
    if (type === 'floor') { if (G.fgrid.has(k)) return 'C\'è già un pavimento'; }
    else if (G.sgrid.has(k)) return 'Spazio occupato';
    if (sd.solid) {
      const cx = tx * TS + 16, cy = ty * TS + 16;

      const f = foes[fac] || foes.sopr;
