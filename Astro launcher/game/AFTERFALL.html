<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AFTERFALL</title>
<meta name="description" content="AFTERFALL — survival post-apocalittico per browser in HTML, CSS e JavaScript.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* =====================================================================
   AFTERFALL — style.css
   Direzione: lamiera, cenere e luce al sodio. Un'unica identità scura
   (scelta deliberata per il gioco) con token di colore e tipografia.
   Layout: canvas a tutto schermo, HUD agli angoli, pannelli a foglio.
   ===================================================================== */
:root {
  --bg: #0c0e0d;
  --panel: rgba(18, 21, 19, .95);
  --panel2: #1a1e1b;
  --panel3: #232823;
  --line: #313831;
  --ink: #e6dfcd;
  --muted: #8f8c80;
  --accent: #e8c468;
  --accent-ink: #1d1708;
  --info: #6fb3c9;
  --good: #86c77a;
  --bad: #e05a4a;
  --warn: #d9b44a;
  --display: 'Big Shoulders Stencil Display', 'Impact', 'Arial Narrow', sans-serif;
  --body: 'Barlow Semi Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'Consolas', monospace;
  --r: 6px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: var(--ink); font: 15px/1.35 var(--body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#game { position: fixed; inset: 0; display: block; background: #000; }
kbd { font: 600 11px var(--mono); background: var(--panel3); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink); }
.muted { color: var(--muted); }
.ok { color: var(--good); } .no { color: var(--bad); } .bad { color: var(--bad); } .good { color: var(--good); } .warn { color: var(--warn); }

/* ---------- pulsanti ---------- */
.btn { background: var(--panel3); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 16px; font-weight: 600; letter-spacing: .02em; transition: background .12s, border-color .12s, transform .08s; }
.btn:hover:not([disabled]) { border-color: #4a534a; background: #2a302a; }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not([disabled]) { background: #f2d07c; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: rgba(224, 90, 74, .4); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* =====================================================================
   SCHERMATE (menu, pausa, morte, finale)
   ===================================================================== */
#screen { position: fixed; inset: 0; z-index: 60; }
.menu { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 120%, #3a2a1e 0%, #121412 60%); overflow-y: auto; padding: calc(24px + var(--safe-t)) 16px calc(24px + var(--safe-b)); touch-action: pan-y; }
.menu.dim { background: rgba(8, 10, 9, .82); backdrop-filter: blur(3px); }
.menu.death { background: radial-gradient(ellipse at center, rgba(90, 12, 10, .85), rgba(6, 4, 4, .96)); }
.menu.ending-screen { background: radial-gradient(ellipse at 50% 0%, #2a3640, #0c0e0d 70%); }
#ashes { position: absolute; inset: 0; width: 100%; height: 100%; }
.menu-inner { position: relative; width: min(680px, 100%); display: flex; flex-direction: column; gap: 14px; }
.menu-inner.narrow { width: min(460px, 100%); }
.title-screen .menu-inner { align-items: flex-start; }
.logo { font: 800 clamp(64px, 16vw, 148px)/.85 var(--display); letter-spacing: .02em; margin: 0; color: var(--ink); text-shadow: 0 6px 30px rgba(0, 0, 0, .6); }
.logo span { color: var(--accent); }
.tag { margin: 0 0 18px; font: 500 18px var(--body); color: #c9c0aa; letter-spacing: .06em; text-transform: uppercase; }
.menu-btns { display: flex; flex-direction: column; gap: 8px; width: min(320px, 100%); }
.menu-btns .btn { text-align: left; padding: 12px 18px; font-size: 16px; }
.foot { color: var(--muted); font-size: 13px; margin-top: 24px; }
.menu h2 { font: 800 40px/1 var(--display); margin: 0; letter-spacing: .02em; text-wrap: balance; }
.menu h3 { margin: 10px 0 0; font: 700 13px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.menu p { margin: 0; }
.eyebrow { font: 600 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.diffs { display: grid; gap: 8px; }
.diff { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.diff strong { font: 800 24px var(--display); letter-spacing: .03em; }
.diff span { color: var(--muted); }
.diff:hover { border-color: var(--accent); }
.seed { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 13px; }
.seed input, .set select { background: var(--panel2); border: 1px solid var(--line); color: var(--ink); border-radius: var(--r); padding: 9px 10px; font: 14px var(--mono); user-select: text; }
.saverow { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.saverow > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.saverow span { font-size: 12px; }
.set { display: grid; grid-template-columns: 1fr 1.2fr; align-items: center; gap: 10px; color: #cfc8b6; }
.set.check { display: flex; }
.set input[type=range] { accent-color: var(--accent); width: 100%; }
.keys { display: grid; gap: 6px; }
.keys div { display: grid; grid-template-columns: minmax(110px, 40%) 1fr; gap: 10px; align-items: center; }
.keys kbd { justify-self: start; font-size: 12px; padding: 2px 6px; }
.tips { margin: 0; padding-left: 18px; color: #cfc8b6; display: grid; gap: 4px; }
.endings { display: grid; gap: 8px; }
.ending { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.ending strong { font: 800 26px var(--display); letter-spacing: .03em; color: var(--accent); }
.ending span { color: #cfc8b6; }
.ending.locked strong { color: var(--muted); }
.ending.locked span { color: var(--muted); font-style: italic; }
.ending:hover:not([disabled]) { border-color: var(--accent); }

/* ---------- statistiche (riutilizzate) ---------- */
.stats { display: grid; gap: 2px; font-size: 14px; }
.stats > div { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.stats span { color: var(--muted); }
.stats b { font: 600 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

/* =====================================================================
   HUD
   ===================================================================== */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud button, #hud .slot { pointer-events: auto; }
.hud-tl { position: absolute; top: calc(10px + var(--safe-t)); left: calc(10px + var(--safe-l)); width: 240px; }
.vitals { display: flex; flex-direction: column; gap: 4px; background: rgba(12, 14, 13, .55); border: 1px solid rgba(255, 255, 255, .06); border-radius: var(--r); padding: 8px 9px; backdrop-filter: blur(2px); }
.bar { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 6px; }
.bar i { font-style: normal; font-size: 13px; text-align: center; }
.bar .track { height: 8px; background: rgba(255, 255, 255, .08); border-radius: 2px; overflow: hidden; }
.bar b { display: block; height: 100%; width: 100%; border-radius: 2px; transition: width .25s; }
#b_hp b { background: #c9483d; } #b_hunger b { background: #c99a4a; } #b_thirst b { background: #4f9bd0; } #b_energy b { background: #9a8ad0; } #b_stam b { background: #d9cf8a; }
.bar.low .track { animation: pulse 1s infinite; }
@keyframes pulse { 50% { background: rgba(224, 90, 74, .35); } }
.temp { font: 12px var(--mono); color: #cfc8b6; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; }
.temp b { font-size: 13px; }
.temp span { color: var(--muted); font-size: 11px; }
.temp.cold b { color: var(--info); } .temp.hot b { color: var(--bad); }
#conds { display: flex; flex-wrap: wrap; gap: 4px; }
#conds:empty { display: none; }
.cond { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 3px; background: color-mix(in srgb, var(--cc) 22%, transparent); border: 1px solid color-mix(in srgb, var(--cc) 60%, transparent); color: var(--ink); }
.hud-tr { position: absolute; top: calc(10px + var(--safe-t)); right: calc(10px + var(--safe-r)); display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
#minimap { width: 170px; height: 170px; border-radius: 50%; border: 2px solid rgba(232, 196, 104, .35); box-shadow: 0 4px 18px rgba(0, 0, 0, .5); background: #0d100f; }
.clock { display: flex; gap: 8px; align-items: baseline; font: 12px var(--mono); background: rgba(12, 14, 13, .6); padding: 3px 8px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.clock b { font-size: 16px; color: var(--accent); }
#hBiome { font-size: 12px; color: var(--muted); text-shadow: 0 1px 2px #000; }
.objective { position: absolute; top: calc(10px + var(--safe-t)); left: 50%; transform: translateX(-50%); max-width: min(440px, calc(100vw - 520px)); min-width: 200px; text-align: center; background: rgba(12, 14, 13, .62); border: 1px solid rgba(232, 196, 104, .25); border-radius: var(--r); padding: 6px 12px; font-weight: 600; font-size: 14px; }
.objective small { display: block; font: 600 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
#msgs { position: absolute; left: calc(10px + var(--safe-l)); bottom: calc(96px + var(--safe-b)); width: min(420px, 60vw); display: flex; flex-direction: column; gap: 3px; }
.msg { font-size: 13.5px; font-weight: 500; background: rgba(12, 14, 13, .62); border-left: 3px solid #6a6a60; padding: 3px 8px; border-radius: 0 4px 4px 0; text-shadow: 0 1px 1px #000; animation: msgin .25s ease-out; }
.msg.good { border-color: var(--good); } .msg.bad { border-color: var(--bad); } .msg.warn { border-color: var(--warn); } .msg.quest { border-color: var(--accent); color: #f4e2b0; } .msg.level { border-color: var(--info); color: #cfe6ee; }
@keyframes msgin { from { opacity: 0; transform: translateX(-10px); } }
#prompt { position: absolute; left: 50%; bottom: calc(148px + var(--safe-b)); transform: translateX(-50%); background: rgba(12, 14, 13, .8); border: 1px solid rgba(232, 196, 104, .4); padding: 6px 12px; border-radius: var(--r); font-weight: 600; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
#banner { position: absolute; top: 24%; left: 0; right: 0; text-align: center; opacity: 0; pointer-events: none; }
#banner.show { animation: banner 3.6s ease-out; }
#banner small { display: block; font: 600 12px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
#banner strong { font: 800 clamp(34px, 7vw, 60px)/1 var(--display); letter-spacing: .03em; text-shadow: 0 4px 24px rgba(0, 0, 0, .8); }
@keyframes banner { 0% { opacity: 0; transform: translateY(10px); } 12%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }
#vehHud { position: absolute; left: 50%; top: calc(64px + var(--safe-t)); transform: translateX(-50%); background: rgba(12, 14, 13, .7); padding: 4px 10px; border-radius: 4px; font: 12px var(--mono); }
.hud-bottom { position: absolute; left: 50%; bottom: calc(10px + var(--safe-b)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 5px; }
#weaponInfo { font-size: 13px; background: rgba(12, 14, 13, .6); padding: 2px 10px; border-radius: 4px; white-space: nowrap; }
#weaponInfo .ammo { font: 600 13px var(--mono); color: var(--accent); }
#weaponInfo .caps { font: 12px var(--mono); color: #d8c890; margin-left: 6px; }
#hotbar { display: flex; gap: 5px; }
#xpbar { width: 100%; height: 4px; background: rgba(255, 255, 255, .1); border-radius: 2px; position: relative; }
#xpbar i { display: block; height: 100%; background: var(--info); border-radius: 2px; }
#xpbar::after { content: attr(data-lvl); position: absolute; right: 0; top: 5px; font: 10px var(--mono); color: var(--muted); }
#quickbar { position: absolute; right: calc(10px + var(--safe-r)); top: calc(250px + var(--safe-t)); display: flex; flex-direction: column; gap: 5px; }
#quickbar button { width: 38px; height: 38px; border-radius: var(--r); background: rgba(12, 14, 13, .62); border: 1px solid rgba(255, 255, 255, .1); font-size: 17px; display: grid; place-items: center; }
#quickbar button:hover { border-color: var(--accent); }
#fps { position: absolute; left: 50%; top: calc(56px + var(--safe-t)); transform: translateX(-50%); font: 11px var(--mono); color: var(--muted); }

/* ---------- slot ---------- */
.slot { position: relative; width: 52px; height: 52px; border-radius: 5px; background: rgba(28, 32, 29, .9); border: 1px solid var(--line); box-shadow: inset 0 -3px 0 color-mix(in srgb, var(--rc, #555) 55%, transparent); display: grid; place-items: center; touch-action: none; }
.slot span { font-size: 25px; line-height: 1; pointer-events: none; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .5)); }
.slot em { position: absolute; right: 3px; bottom: 3px; font: 600 11px var(--mono); font-style: normal; text-shadow: 0 1px 2px #000; }
.slot em.mag { color: var(--accent); }
.slot .dur { position: absolute; left: 3px; bottom: 1px; height: 2px; border-radius: 1px; max-width: calc(100% - 6px); }
.slot kbd { position: absolute; top: 2px; left: 3px; font-size: 9px; padding: 0 3px; border: 0; background: rgba(0, 0, 0, .4); color: var(--muted); }
.slot.r1 { border-color: color-mix(in srgb, var(--rc) 40%, var(--line)); }
.slot.r2, .slot.r3, .slot.r4 { border-color: color-mix(in srgb, var(--rc) 70%, var(--line)); }
.slot.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.slot.dragging { opacity: .35; }
.slot.empty { background: rgba(20, 23, 21, .6); }
.slot.hb { width: 48px; height: 48px; }
.slot.hb.on { border-color: var(--accent); background: rgba(60, 52, 30, .9); box-shadow: 0 0 0 1px var(--accent), inset 0 -3px 0 color-mix(in srgb, var(--rc, #555) 55%, transparent); }
#dragGhost { position: fixed; left: 0; top: 0; z-index: 100; width: 44px; height: 44px; display: grid; place-items: center; font-size: 30px; pointer-events: none; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .6)); }

/* =====================================================================
   PANNELLI MODALI
   ===================================================================== */
.modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(6, 8, 7, .55); padding: calc(12px + var(--safe-t)) 12px calc(12px + var(--safe-b)); }
.modal.side { place-items: center end; background: transparent; pointer-events: none; }
.modal.side > * { pointer-events: auto; }
.modal.bottom { place-items: end center; background: linear-gradient(transparent 40%, rgba(6, 8, 7, .7)); }
.sheet { width: min(1060px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); overflow: hidden; }
.sheet header { display: flex; align-items: center; gap: 10px; padding: 8px 10px 0 14px; border-bottom: 1px solid var(--line); }
.sheet header h2 { font: 800 26px var(--display); margin: 6px 0 8px; letter-spacing: .03em; flex: 1; }
.sheet header nav { display: flex; gap: 2px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tab.on { color: var(--ink); border-color: var(--accent); }
.tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); vertical-align: middle; }
.x { background: none; border: 0; font-size: 20px; width: 40px; height: 40px; color: var(--muted); }
.x:hover { color: var(--ink); }
.sheet-body { padding: 14px; overflow-y: auto; touch-action: pan-y; min-height: 0; }
.sheet-body h3 { margin: 0 0 8px; font: 700 12px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sheet-body h3 .muted { letter-spacing: 0; text-transform: none; font-weight: 400; }
.sheet-foot { border-top: 1px solid var(--line); padding: 10px 14px; max-height: 38%; overflow-y: auto; touch-action: pan-y; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, 52px); gap: 6px; margin-bottom: 10px; }

/* inventario */
.inv-layout { display: grid; grid-template-columns: 210px 1fr 260px; gap: 16px; }
.inv-layout > * { min-width: 0; }
.eqrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
.eq .stats { margin-top: 10px; }
.inv-grid { grid-template-columns: repeat(6, 52px); }
.inv-grid .slot:nth-child(-n+6) { box-shadow: inset 0 0 0 1px rgba(232, 196, 104, .22), inset 0 -3px 0 color-mix(in srgb, var(--rc, #555) 55%, transparent); }
.details { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; align-self: start; }
.dhead { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
.dicon { font-size: 34px; width: 52px; height: 52px; display: grid; place-items: center; background: rgba(0, 0, 0, .25); border-radius: 6px; box-shadow: inset 0 -3px 0 var(--rc); }
.dhead strong { display: block; font-size: 17px; }
.dhead em { font: 600 11px var(--mono); font-style: normal; color: var(--rc); letter-spacing: .08em; text-transform: uppercase; }
.desc { color: #cfc8b6; margin: 6px 0 8px; font-size: 14px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* crafting */
.craft-layout { display: grid; grid-template-columns: 190px 1fr; gap: 14px; }
.craft-layout > * { min-width: 0; }
.cats { display: flex; flex-direction: column; gap: 3px; }
.cats button { text-align: left; background: none; border: 1px solid transparent; border-radius: 5px; padding: 8px 10px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
.cats button i { font: 11px var(--mono); font-style: normal; color: var(--good); }
.cats button.on { background: var(--panel3); color: var(--ink); border-color: var(--line); }
.recipes { display: flex; flex-direction: column; gap: 6px; }
.recipe { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; opacity: .78; }
.recipe.can { opacity: 1; border-color: #3d4a3a; }
.ricon { font-size: 26px; width: 46px; height: 46px; display: grid; place-items: center; background: rgba(0, 0, 0, .25); border-radius: 6px; box-shadow: inset 0 -3px 0 var(--rc); }
.rbody { min-width: 0; }
.rbody strong { font-size: 15px; }
.rbody p { margin: 1px 0 4px; font-size: 12.5px; color: var(--muted); }
.req { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; }
.req i { font-style: normal; color: var(--muted); font-family: var(--mono); font-size: 11px; }
.foot-note { font-size: 12px; margin: 10px 0 0; }

/* abilità */
.skills-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
.pts { font: 600 13px var(--mono); color: var(--accent-ink); background: var(--accent); padding: 4px 10px; border-radius: 4px; }
.trees { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tree h3 { color: var(--tc) !important; border-bottom: 2px solid var(--tc); padding-bottom: 6px; }
.skill { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; margin-bottom: 8px; }
.sk-top { display: flex; justify-content: space-between; align-items: center; }
.skill p { font-size: 12.5px; color: var(--muted); margin: 4px 0 8px; }
.pips { display: flex; gap: 3px; }
.pips i { width: 14px; height: 6px; border-radius: 2px; background: var(--panel3); border: 1px solid var(--line); }
.pips i.on { background: var(--tc); border-color: var(--tc); }

/* diario */
.journal { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
.journal > * { min-width: 0; }
.qlist { display: flex; flex-direction: column; gap: 4px; }
.qlist h3 { margin-top: 8px !important; }
.qitem { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 6px; font-weight: 600; }
.qitem i { font: 10px var(--mono); font-style: normal; color: var(--accent); }
.qitem.on { border-color: var(--accent); }
.qitem.done { color: var(--muted); font-weight: 500; }
.qdet small { font: 600 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }

<script>
/* js/data.js */

  // Cibo

<script>
/* js/world.js */
/* =====================================================================
   AFTERFALL — world.js
   Generazione procedurale del mondo (seed), tile, edifici, punti di

   ===================================================================== */
'use strict';
(function (AF) {

  const W = 256, H = 256, TS = 32, CH = 16; // dimensioni mondo, tile e chunk
  AF.W = W; AF.H = H; AF.TS = TS; AF.CH = CH;

  /* ---------- Tipi di terreno ---------- */
  const T = {
    GRASS: 0, DIRT: 1, ASPH: 2, CONC: 3, WATER: 4, DEEP: 5, SAND: 6, SNOW: 7, ROCK: 8, WOOD: 9,
    TILE: 10, BRICK: 11, CWALL: 12, FENCE: 13, FOREST: 14, RUBBLE: 15, LABF: 16, MWALL: 17,
    CLIFF: 18, LOCK: 19, DRYG: 20, LINE: 21, PATH: 22

  const OPAQUE = new Uint8Array(32);
  [T.BRICK, T.CWALL, T.MWALL, T.CLIFF, T.LOCK].forEach(t => OPAQUE[t] = 1);
  const WALLISH = new Uint8Array(32);
  [T.BRICK, T.CWALL, T.MWALL, T.CLIFF, T.LOCK, T.FENCE].forEach(t => WALLISH[t] = 1);

  /* ---------- RNG e rumore deterministici ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;

    let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0;

  function makeNoise(seed) {
    const vn = (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;

      const a = hash2(xi, yi, seed), b = hash2(xi + 1, yi, seed), c = hash2(xi, yi + 1, seed), d = hash2(xi + 1, yi + 1, seed);

    };

      vn,
      fbm(x, y) { return (vn(x, y) * .55 + vn(x * 2.1, y * 2.1) * .3 + vn(x * 4.3, y * 4.3) * .15); }
    };
  }

  /* =====================================================================
     GENERAZIONE
     ===================================================================== */
  AF.genWorld = function (seed) {
    const R = mulberry32(seed);
    const N = makeNoise(seed);
    const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
    const jit = (v, a) => Math.round(v + (R() * 2 - 1) * a);

    const b = new Uint8Array(W * H);      // bioma

      seed, g, b, res, pois: {}, nodes: [], containers: [], docs: [], vehicles: [], npcs: [],
      specials: [], locks: [], hazards: [], camps: [], decor: []
    };
    const idx = (x, y) => y * W + x;
    const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
    const set = (x, y, t) => { if (inb(x, y)) g[idx(x, y)] = t; };

    /* --- 1. Ancore dei biomi (cambiano a ogni seed) --- */
    const cityX = jit(126, 12), cityY = jit(122, 10);
    const indLeft = R() < .5;
    const A = [];
    A.push({ bi: 2, x: cityX, y: cityY, w: 2.5 });
    for (let k = 0; k < 6; k++) {
      const a = k / 6 * Math.PI * 2 + R() * .6;
      A.push({ bi: 1, x: cityX + Math.cos(a) * 56, y: cityY + Math.sin(a) * 50, w: 1.1 });
    }
    const forestA = [[jit(46, 10), jit(64, 10)], [jit(92, 12), jit(52, 8)], [jit(214, 10), jit(150, 14)], [jit(34, 8), jit(212, 10)], [jit(170, 14), jit(58, 8)]];
    forestA.forEach(p => A.push({ bi: 0, x: p[0], y: p[1], w: 1.15 }));
    const ind = { x: indLeft ? jit(72, 10) : jit(188, 10), y: jit(210, 6) };
    A.push({ bi: 3, x: ind.x, y: ind.y, w: 1.25 });
    const vil = { x: indLeft ? jit(196, 8) : jit(70, 8), y: jit(214, 6) };
    A.push({ bi: 10, x: vil.x, y: vil.y, w: 1.05 });
    const lake = { x: jit(210, 10), y: jit(88, 10) };
    A.push({ bi: 5, x: lake.x, y: lake.y, w: 1.2 });
    const mil = { x: jit(30, 4), y: jit(140, 14) };
    A.push({ bi: 9, x: mil.x, y: mil.y, w: 1.05 });
    [[jit(118, 18), jit(196, 6)], [jit(236, 6), jit(222, 10)], [jit(150, 18), jit(84, 8)]].forEach(p => A.push({ bi: 11, x: p[0], y: p[1], w: .95 }));

    const hwY = jit(178, 5);
    const hwAt = x => Math.round(hwY + Math.sin(x * .035 + seed % 7) * 6);
    const mtnAt = x => 30 + N.fbm(x * .045, 3.3) * 14;

    /* --- 2. Assegna bioma e terreno base --- */
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const wx = x + (N.vn(x * .04, y * .04) - .5) * 34, wy = y + (N.vn(x * .04 + 50, y * .04 + 50) - .5) * 34;
      let best = 1e9, bi = 11;
      for (const a of A) { const d = Math.hypot(wx - a.x, wy - a.y) / a.w; if (d < best) { best = d; bi = a.bi; } }
      if (y < mtnAt(x)) bi = 6;
      else if (Math.abs(y - hwAt(x)) < 6 && bi !== 5) bi = 4;
      const ld = Math.hypot(x - lake.x, (y - lake.y) * 1.2) * (0.8 + N.vn(x * .09, y * .09) * .5);
      if (ld < 27) bi = 5;
      b[idx(x, y)] = bi;
      const n = N.fbm(x * .11, y * .11);
      let t = T.GRASS;
      switch (bi) {
        case 0: t = n > .62 ? T.DIRT : T.FOREST; break;
        case 1: t = n > .66 ? T.DIRT : T.GRASS; break;
        case 2: t = n > .58 ? T.RUBBLE : T.CONC; break;
        case 3: t = n > .55 ? T.DIRT : T.CONC; break;
        case 4: t = T.DRYG; break;
        case 5: t = ld < 12 ? T.DEEP : ld < 18 ? T.WATER : ld < 21 ? T.SAND : T.GRASS; break;
        case 6: { const m = mtnAt(x) - y; t = m > 9 || n > .6 ? T.SNOW : T.ROCK; if (N.fbm(x * .14 + 9, y * .14) > .66 && m > 3) t = T.CLIFF; break; }
        case 9: t = n > .5 ? T.CONC : T.DIRT; break;
        case 10: t = n > .6 ? T.DIRT : T.GRASS; break;
        default: t = n > .64 ? T.DIRT : T.DRYG;
      }
      if (x < 2 || y < 2 || x >= W - 2 || y >= H - 2) t = T.CLIFF;
      g[idx(x, y)] = t;
    }

    /* --- 3. Autostrada e strade cittadine --- */
    for (let x = 2; x < W - 2; x++) {
      const cy = hwAt(x);
      for (let dy = -2; dy <= 2; dy++) {
        const y = cy + dy; if (!inb(x, y)) continue;
        const t = g[idx(x, y)]; if (t === T.DEEP || t === T.WATER) { g[idx(x, y)] = T.CONC; }
        else g[idx(x, y)] = (dy === 0 && x % 6 < 3) ? T.LINE : T.ASPH;
        res[idx(x, y)] = 2;
      }
    }
    for (let y = cityY - 50; y < cityY + 50; y++) for (let x = cityX - 52; x < cityX + 52; x++) {
      if (!inb(x, y) || b[idx(x, y)] !== 2) continue;
      if (((x - cityX + 52) % 17) < 3 || ((y - cityY + 50) % 15) < 3) { g[idx(x, y)] = T.ASPH; res[idx(x, y)] = 2; }
    }

    /* --- utilità per edifici --- */
    function areaFree(x, y, bw, bh) {
      for (let j = y; j < y + bh; j++) for (let i = x; i < x + bw; i++) {
        if (i < 3 || j < 3 || i >= W - 3 || j >= H - 3) return false;
        const k = idx(i, j);
        if (res[k] || SOLID[g[k]] || g[k] === T.WATER || g[k] === T.SAND && b[k] === 5) return false;
      }
      return true;
    }
    function clearArea(x, y, bw, bh, t) {
      for (let j = y; j < y + bh; j++) for (let i = x; i < x + bw; i++) if (inb(i, j)) { g[idx(i, j)] = t; res[idx(i, j)] = 0; }
    }
    let cid = 0;
    function addCrate(tx, ty, table, kind, extra) {
      const c = Object.assign({ id: 'c' + (cid++), x: tx * TS + TS / 2, y: ty * TS + TS / 2, table, kind: kind || 'crate' }, extra || {});
      w.containers.push(c); return c;
    }
    // edificio rettangolare con porte e casse
    function building(x, y, bw, bh, o) {
      o = o || {};
      if (!o.force && !areaFree(x - 1, y - 1, bw + 2, bh + 2)) return null;
      const wall = o.wall || T.BRICK, floor = o.floor || T.WOOD;
      for (let j = y; j < y + bh; j++) for (let i = x; i < x + bw; i++) {
        const edge = i === x || j === y || i === x + bw - 1 || j === y + bh - 1;
        g[idx(i, j)] = edge ? wall : floor; res[idx(i, j)] = 1;
      }
      for (let j = y - 1; j <= y + bh; j++) for (let i = x - 1; i <= x + bw; i++) if (inb(i, j) && !res[idx(i, j)]) res[idx(i, j)] = 3;
      const doors = [];
      const nd = o.doors || 1;
      const sides = o.sides || [0, 1, 2, 3].sort(() => R() - .5);
      for (let d = 0; d < nd; d++) {
        const s = sides[d % sides.length];
        let dx, dy;
        if (s === 0) { dx = x + ri(1, bw - 3); dy = y + bh - 1; }
        else if (s === 1) { dx = x + ri(1, bw - 3); dy = y; }
        else if (s === 2) { dx = x; dy = y + ri(1, bh - 3); }
        else { dx = x + bw - 1; dy = y + ri(1, bh - 3); }
        const horiz = s < 2;
        for (let k = 0; k < 2; k++) {
          const tx = horiz ? dx + k : dx, ty = horiz ? dy : dy + k;
          g[idx(tx, ty)] = (o.lock && d === 0) ? T.LOCK : floor;
          if (o.lock && d === 0) w.locks.push({ x: tx, y: ty, req: o.lock, msg: o.lockMsg, floor });
        }
        doors.push({ x: dx, y: dy, s });
      }
      // muro interno
      if (o.inner && bw > 9 && bh > 6) {
        const mx = x + Math.floor(bw / 2);
        for (let j = y + 1; j < y + bh - 1; j++) g[idx(mx, j)] = wall;
        const gap = y + ri(1, bh - 3); g[idx(mx, gap)] = floor; g[idx(mx, gap + 1)] = floor;
      }
      // rovine
      if (o.ruin) for (let j = y; j < y + bh; j++) for (let i = x; i < x + bw; i++)
        if (g[idx(i, j)] === wall && R() < o.ruin) g[idx(i, j)] = T.RUBBLE;
      // casse
      const cr = o.crates == null ? ri(1, 2) : o.crates;
      const cratesOut = [];
      for (let c = 0; c < cr; c++) {
        for (let tries = 0; tries < 20; tries++) {
          const tx = ri(x + 1, x + bw - 2), ty = ri(y + 1, y + bh - 2);
          if (g[idx(tx, ty)] !== floor) continue;
          if (doors.some(d => Math.abs(d.x - tx) + Math.abs(d.y - ty) < 3)) continue;
          if (w.containers.some(cc => cc.x === tx * TS + 16 && cc.y === ty * TS + 16)) continue;
          cratesOut.push(addCrate(tx, ty, o.loot || 'house', o.ckind)); break;
        }
      }
      const B = { x, y, w: bw, h: bh, doors, crates: cratesOut, floor };
      w.nBuild = (w.nBuild || 0) + 1;
      return B;
    }
    function interiorSpot(B) {
      for (let t = 0; t < 40; t++) {
        const tx = ri(B.x + 1, B.x + B.w - 2), ty = ri(B.y + 1, B.y + B.h - 2);
        if (g[idx(tx, ty)] === B.floor && !w.containers.some(c => c.x === tx * TS + 16 && c.y === ty * TS + 16)) return { x: tx, y: ty };
      }
      return { x: B.x + 1, y: B.y + 1 };
    }
    function poi(id, n, x, y, o) {
      w.pois[id] = Object.assign({ id, n, x, y, r: 12 }, o || {});
      return w.pois[id];
    }
    function placeDoc(docId, B) { const s = interiorSpot(B); w.docs.push({ id: docId, x: s.x * TS + 16, y: s.y * TS + 16 }); }
    function npc(id, n, role, fac, type, tx, ty, o) {
      w.npcs.push(Object.assign({ id, n, role, fac, type, x: tx * TS + 16, y: ty * TS + 16 }, o || {}));
    }
    function special(id, n, tx, ty, o) { w.specials.push(Object.assign({ id, n, x: tx * TS + 16, y: ty * TS + 16 }, o || {})); }
    function carve(x0, y0, x1, y1, t, wd) {
      const steps = Math.ceil(Math.hypot(x1 - x0, y1 - y0));
      let ox = 0;
      for (let s = 0; s <= steps; s++) {
        const f = s / steps;
        ox += (R() - .5) * .8; ox *= .9;
        const cx = Math.round(x0 + (x1 - x0) * f + ox), cy = Math.round(y0 + (y1 - y0) * f + ox * .5);
        for (let j = -wd; j <= wd; j++) for (let i = -wd; i <= wd; i++) {
          const x = cx + i, y = cy + j; if (!inb(x, y) || x < 3 || y < 3 || x > W - 4 || y > H - 4) continue;
          const k = idx(x, y);
          if (res[k] === 1 || res[k] === 3) continue;
          const cur = g[k];
          if (t === 'clear') { if (cur === T.CLIFF) g[k] = T.ROCK; continue; }
          if (b[k] === 2) continue; // in città ci sono già le strade
          if (cur === T.ASPH || cur === T.LINE) continue;
          if (cur === T.DEEP || cur === T.WATER) { g[k] = T.WOOD; res[k] = 2; continue; } // ponte
          g[k] = t; res[k] = 2;
        }
      }
    }
    const validGround = (x, y) => inb(x, y) && !SOLID[g[idx(x, y)]] && g[idx(x, y)] !== T.WATER && b[idx(x, y)] !== 6 && b[idx(x, y)] !== 5;

    /* --- 4. Punti di interesse principali --- */
    // Valle Quieta (Sopravvissuti)
    clearArea(vil.x - 14, vil.y - 12, 28, 24, T.GRASS);
    for (let a = 0; a < Math.PI * 2; a += .03) {
      const fx = Math.round(vil.x + Math.cos(a) * 12), fy = Math.round(vil.y + Math.sin(a) * 10);
      const gate = Math.abs(a - Math.PI / 2) < .18 || Math.abs(a - Math.PI * 1.5) < .18 || Math.abs(a) < .14 || Math.abs(a - Math.PI) < .14;
      if (inb(fx, fy) && !gate) { g[idx(fx, fy)] = T.FENCE; res[idx(fx, fy)] = 1; }
    }
    const vh = [];
    [[-8, -6], [3, -6], [-8, 2], [4, 2]].forEach((o, k) => {
      const B = building(vil.x + o[0], vil.y + o[1], 6, 5, { force: true, doors: 1, sides: [k < 2 ? 0 : 1], crates: 1, loot: 'house' });
      vh.push(B);
    });
    for (let j = -1; j <= 1; j++) for (let i = -2; i <= 2; i++) set(vil.x + i, vil.y + j, T.DIRT);
    placeDoc('kid', vh[2]);
    poi('valle', 'Valle Quieta', vil.x, vil.y, { fac: 'sopr', icon: '⛺', r: 14, safe: true });
    npc('elena', 'Elena Ferri', 'leader', 'sopr', 'guard', vil.x, vil.y);
    npc('bruno', 'Bruno', 'trader', 'sopr', 'guard', vil.x - 4, vil.y + 1);
    npc('mira', 'Dott.ssa Mira', 'medic', 'sopr', 'guard', vil.x + 4, vil.y - 1);
    for (let k = 0; k < 3; k++) npc('vguard' + k, 'Guardia della Valle', 'guard', 'sopr', 'guard', vil.x + [-10, 10, 0][k], vil.y + [0, 0, 8][k]);
    w.camps.push({ x: vil.x * TS + 16, y: (vil.y - 1) * TS + 16 });

    // Campo Asfalto (Predoni) sull'autostrada
    const cpx = indLeft ? jit(160, 12) : jit(96, 12), cpy = hwAt(cpx) - 9;
    clearArea(cpx - 9, cpy - 6, 19, 13, T.DIRT);
    for (let i = -9; i <= 9; i++) { set(cpx + i, cpy - 6, T.FENCE); }
    for (let j = -6; j <= 6; j++) { set(cpx - 9, cpy + j, T.FENCE); set(cpx + 9, cpy + j, T.FENCE); }
    for (let i = -9; i <= 9; i++) if (Math.abs(i) > 2) set(cpx + i, cpy + 6, T.FENCE);
    for (let j = -6; j <= 6; j++) for (let i = -9; i <= 9; i++) res[idx(cpx + i, cpy + j)] = 1;
    const kaneHut = building(cpx - 7, cpy - 5, 6, 5, { force: true, wall: T.CWALL, floor: T.CONC, doors: 1, sides: [0], crates: 2, loot: 'industrial' });
    addCrate(cpx + 5, cpy - 3, 'military'); addCrate(cpx + 6, cpy - 3, 'wreck');
    poi('campo', 'Campo Asfalto', cpx, cpy, { fac: 'predoni', icon: '☠', r: 13 });
    npc('kane', 'Kane', 'leader', 'predoni', 'bandit', cpx - 4, cpy - 3, { hp: 260, boss: true, drop: 'frag_g' });
    npc('lisca', 'Lisca', 'trader', 'predoni', 'bandit', cpx + 3, cpy - 1);
    for (let k = 0; k < 4; k++) npc('pguard' + k, 'Predone', 'guard', 'predoni', k % 2 ? 'raider' : 'bandit', cpx - 6 + k * 4, cpy + 3);
    w.camps.push({ x: cpx * TS + 16, y: (cpy + 1) * TS + 16 });

    // Base Ferro (Milizia)
    const bx = mil.x, by = mil.y;
    clearArea(bx - 15, by - 12, 31, 25, T.DIRT);
    for (let i = -15; i <= 15; i++) { if (Math.abs(i) > 1) { set(bx + i, by - 12, T.FENCE); set(bx + i, by + 12, T.FENCE); } }
    for (let j = -12; j <= 12; j++) { set(bx - 15, by + j, T.FENCE); if (Math.abs(j) > 1) set(bx + 15, by + j, T.FENCE); }
    for (let j = -12; j <= 12; j++) for (let i = -15; i <= 15; i++) res[idx(bx + i, by + j)] = 1;
    const hq = building(bx - 12, by - 9, 9, 7, { force: true, wall: T.CWALL, floor: T.TILE, doors: 1, sides: [0], crates: 1, loot: 'military' });
    building(bx + 2, by - 9, 11, 6, { force: true, wall: T.CWALL, floor: T.CONC, doors: 2, sides: [0, 2], crates: 2, loot: 'military' });
    building(bx - 12, by + 3, 8, 7, { force: true, wall: T.CWALL, floor: T.CONC, doors: 1, sides: [1], crates: 2, loot: 'military' });
    placeDoc('military', hq);
    special('mil_safe', 'Cassaforte del Colonnello', hq.x + hq.w - 2, hq.y + 1, { icon: '🔒' });
    poi('base', 'Base Ferro', bx, by, { fac: 'milizia', icon: '✪', r: 16 });
    npc('rinaldi', 'Col. Rinaldi', 'leader', 'milizia', 'soldier', bx - 8, by - 6, { hp: 300, boss: true, drop: 'frag_a' });
    npc('vega', 'Sergente Vega', 'trader', 'milizia', 'soldier', bx + 5, by + 2);
    for (let k = 0; k < 5; k++) npc('mguard' + k, 'Soldato', 'guard', 'milizia', 'soldier', bx + [-3, 3, 8, 13, -6][k], by + [0, 0, 8, -1, 10][k]);
    w.camps.push({ x: (bx + 4) * TS, y: (by + 5) * TS });

    // Cappella della Luce (Culto) nella foresta lontana dal rifugio
    const cf = forestA.slice().filter(p => p[1] > 45).sort((p, q) => Math.hypot(q[0] - cityX, q[1] - cityY) - Math.hypot(p[0] - cityX, p[1] - cityY))[0] || forestA[0];
    clearArea(cf[0] - 8, cf[1] - 7, 17, 15, T.FOREST);
    const chap = building(cf[0] - 5, cf[1] - 4, 10, 8, { force: true, wall: T.BRICK, floor: T.TILE, doors: 1, sides: [0], crates: 2, loot: 'cult' });
    placeDoc('cult', chap);
    poi('cappella', 'Cappella della Luce', cf[0], cf[1], { fac: 'culto', icon: '✦', r: 13 });
    npc('osvaldo', 'Padre Osvaldo', 'leader', 'culto', 'cultist', cf[0], cf[1] - 2, { hp: 240, boss: true, drop: 'frag_b' });
    npc('iris', 'Sorella Iris', 'trader', 'culto', 'cultist', cf[0] - 3, cf[1] + 5);
    for (let k = 0; k < 4; k++) npc('cguard' + k, 'Adepto', 'guard', 'culto', 'cultist', cf[0] + [-6, 6, -6, 6][k], cf[1] + [-6, -6, 6, 6][k]);
    w.camps.push({ x: cf[0] * TS, y: (cf[1] + 5) * TS });

    // Laboratorio Helix (altra foresta)
    const lf = forestA.filter(p => p !== cf).sort((p, q) => Math.hypot(p[0] - cityX, p[1] - cityY) - Math.hypot(q[0] - cityX, q[1] - cityY))[1] || forestA[1];
    const lx = lf[0] - 11, ly = lf[1] - 8;
    clearArea(lx - 3, ly - 3, 28, 22, T.CONC);
    const labB = building(lx, ly, 22, 16, { force: true, wall: T.CWALL, floor: T.LABF, doors: 1, sides: [0], lock: 'keycard', lockMsg: 'Porta blindata Helix: serve la Tessera Helix.', crates: 4, loot: 'lab', inner: true });
    special('lab_terminal', 'Terminale centrale VESPERO', lx + 18, ly + 3, { icon: '🖥' });
    w.docs.push({ id: 'varga2', x: (lx + 4) * TS + 16, y: (ly + 3) * TS + 16 });
    for (let k = 0; k < 3; k++) w.hazards.push({ x: (lx + 5 + k * 6) * TS, y: (ly + 8) * TS, r: 90 });
    poi('lab', 'Laboratorio Helix', lx + 11, ly + 8, { icon: '⚗', r: 14, danger: true });

    // Deposito Helix (zona industriale)
    clearArea(ind.x - 9, ind.y - 7, 19, 15, T.CONC);
    const dep = building(ind.x - 8, ind.y - 6, 16, 12, { force: true, wall: T.CWALL, floor: T.CONC, doors: 2, sides: [1, 2], crates: 3, loot: 'industrial', inner: true });
    const kc = interiorSpot(dep);
    addCrate(kc.x, kc.y, 'industrial', 'locker', { fixed: [['keycard', 1], ['comp', 2]] });
    placeDoc('varga1', dep);
    poi('deposito', 'Deposito Helix', ind.x, ind.y, { icon: '⚙', r: 12 });

    // Stazione radio Monte Corvo e Vault Zero (montagne)
    const rtx = jit(lake.x < 180 ? 200 : 150, 25), rty = Math.round(mtnAt(rtx)) - 6;
    carve(rtx, rty + 14, rtx, rty, 'clear', 3);
    clearArea(rtx - 6, rty - 5, 13, 11, T.ROCK);
    const tower = building(rtx - 4, rty - 3, 8, 6, { force: true, wall: T.CWALL, floor: T.TILE, doors: 1, sides: [0], crates: 1, loot: 'military' });
    special('tower_console', 'Console di Monte Corvo', rtx + 2, rty - 2, { icon: '📡' });
    w.decor.push({ t: 'mast', x: (rtx + 5) * TS, y: (rty - 4) * TS });
    poi('radio', 'Stazione di Monte Corvo', rtx, rty, { icon: '📡', r: 10 });

    const vx = rtx > 128 ? jit(70, 14) : jit(186, 14), vy = 10;
    carve(rtx, rty, vx, vy + 9, 'clear', 2);
    carve(rtx, rty, vx, vy + 9, T.PATH, 1);
    clearArea(vx - 12, vy - 6, 25, 20, T.SNOW);
    const vault = building(vx - 10, vy - 4, 20, 14, { force: true, wall: T.MWALL, floor: T.LABF, doors: 1, sides: [0], lock: 'aurora', lockMsg: 'VAULT ZERO — inserire il Codice AURORA completo.', crates: 3, loot: 'vault', inner: true });
    special('vault_core', 'Nucleo CUSTODE', vx + 7, vy - 2, { icon: '◉' });
    w.docs.push({ id: 'vault', x: (vx - 8) * TS + 16, y: (vy - 2) * TS + 16 });
    w.docs.push({ id: 'varga3', x: (vx + 5) * TS + 16, y: (vy + 7) * TS + 16 });
    poi('vault', 'Vault Zero', vx, vy, { icon: '◉', r: 12, hidden: true, danger: true });
    for (let k = 0; k < 4; k++) npc('sentinel' + k, 'Sentinella CUSTODE', 'guard', 'vault', 'custode', vx - 6 + k * 4, vy + 4);

    // Rifugio iniziale: lontano dagli altri luoghi, tra periferia e foresta
    let sp = null;
    for (let t = 0; t < 600 && !sp; t++) {
      const a = R() * Math.PI * 2, d = 40 + R() * 40;
      const x = Math.round(cityX + Math.cos(a) * d), y = Math.round(cityY + Math.sin(a) * d * .9);
      if (x < 12 || y < 12 || x > W - 12 || y > H - 12) continue;
      const bi = b[idx(x, y)];
      if (![0, 1, 11, 10].includes(bi) || !validGround(x, y) || Math.abs(y - hwAt(x)) < 10) continue;
      if (Object.values(w.pois).some(q => Math.hypot(q.x - x, q.y - y) < 32)) continue;
      if (!areaFree(x - 6, y - 5, 13, 11)) continue;
      sp = [x, y];
    }
    if (!sp) sp = [cityX - 40, cityY + 30];
    clearArea(sp[0] - 6, sp[1] - 5, 13, 11, T.GRASS);
    building(sp[0] - 3, sp[1] - 3, 7, 6, { force: true, floor: T.WOOD, wall: T.BRICK, doors: 1, sides: [0], crates: 0 });
    addCrate(sp[0] - 2, sp[1] - 2, 'start', 'crate', { fixed: [['beans', 2], ['water', 1], ['bandage', 1], ['wood', 3], ['stone', 5], ['cloth', 4], ['torch', 1]] });
    w.docs.push({ id: 'marco', x: (sp[0] + 2) * TS + 16, y: (sp[1] - 2) * TS + 16 });
    poi('start', 'Il Rifugio', sp[0], sp[1], { known: true, icon: '⌂', r: 6 });
    w.start = { x: sp[0] * TS + 16, y: (sp[1] + 3) * TS + 16 };

    // Bunker Echo (segreto)
    let ex = 0, ey = 0;
    for (let t = 0; t < 200; t++) {
      ex = ri(20, 236); ey = ri(60, 230);
      if ((b[idx(ex, ey)] === 0 || b[idx(ex, ey)] === 11) && areaFree(ex - 6, ey - 6, 13, 13) && Math.hypot(ex - sp[0], ey - sp[1]) > 50) break;
    }
    const echo = building(ex - 4, ey - 3, 8, 7, { force: true, wall: T.CWALL, floor: T.CONC, doors: 1, sides: [0], lock: 'electools', lockMsg: 'Serratura elettronica: servono gli Strumenti elettronici.', crates: 1, loot: 'military' });
    for (let j = ey - 3; j < ey + 4; j++) for (let i = ex - 4; i < ex + 4; i++) b[idx(i, j)] = 7;
    special('echo_terminal', 'Terminale del Bunker Echo', ex + 2, ey - 2, { icon: '🖥' });
    w.docs.push({ id: 'echo', x: (ex - 2) * TS + 16, y: (ey - 2) * TS + 16 });
    poi('echo', 'Bunker Echo', ex, ey, { icon: '▣', r: 8, hidden: true });

    // Ospedale e supermercato in città
    const tryBuild = (bw, bh, o) => {
      for (let t = 0; t < 300; t++) {
        const x = cityX + ri(-44, 40), y = cityY + ri(-40, 36);
        const B = building(x, y, bw, bh, o); if (B) return B;
      }
      return null;
    };
    const hosp = tryBuild(12, 10, { wall: T.CWALL, floor: T.TILE, doors: 2, crates: 4, loot: 'hospital', inner: true });
    if (hosp) poi('hosp', 'Ospedale San Luca', hosp.x + 6, hosp.y + 5, { icon: '✚', r: 9 });
    const mkt = tryBuild(12, 9, { wall: T.CWALL, floor: T.TILE, doors: 2, crates: 4, loot: 'city' });
    if (mkt) { poi('market', 'Supermercato', mkt.x + 6, mkt.y + 4, { icon: '🛒', r: 9 }); placeDoc('news', mkt); }
    poi('city', 'Città di Cendre', cityX, cityY, { icon: '▦', r: 30, area: true });

    // Capanno del lago
    for (let t = 0; t < 120; t++) {
      const a = R() * Math.PI * 2, x = Math.round(lake.x + Math.cos(a) * 25), y = Math.round(lake.y + Math.sin(a) * 22);
      const B = building(x - 3, y - 2, 6, 5, { doors: 1, crates: 1, loot: 'camp' });
      if (B) { placeDoc('lake', B); poi('lakehut', 'Capanno del Lago Nero', x, y, { icon: '⌂', r: 8 }); break; }
    }
    poi('lake', 'Lago Nero', lake.x, lake.y, { icon: '≈', r: 24, area: true });

    // Area di servizio autostradale
    const tsx = indLeft ? jit(222, 10) : jit(36, 10), tsy = hwAt(tsx) + 5;
    clearArea(tsx - 6, tsy, 13, 8, T.CONC);
    const truckstop = building(tsx - 4, tsy + 2, 8, 6, { force: true, wall: T.BRICK, floor: T.TILE, doors: 1, sides: [1], crates: 2, loot: 'city' });
    placeDoc('trucker', truckstop);
    poi('truckstop', 'Area di servizio', tsx, tsy + 3, { icon: '⛽', r: 9 });
    w.vehicles.push({ id: 'v_truck', type: 'truck', x: (tsx + 1) * TS, y: (tsy - 2) * TS, a: 0 });

    // Elicottero precipitato
    for (let t = 0; t < 100; t++) {
      const x = ri(30, 226), y = ri(70, 230);
      if ((b[idx(x, y)] === 11 || b[idx(x, y)] === 0) && areaFree(x - 3, y - 3, 7, 7)) {
        for (let j = -2; j <= 2; j++) for (let i = -3; i <= 3; i++) { g[idx(x + i, y + j)] = T.RUBBLE; res[idx(x + i, y + j)] = 1; }
        addCrate(x - 1, y, 'military', 'crate'); addCrate(x + 1, y, 'supply', 'crate');
        w.decor.push({ t: 'heli', x: x * TS + 16, y: y * TS + 16 });
        poi('heli', 'Elicottero precipitato', x, y, { icon: '✈', r: 7 });
        break;
      }
    }

    /* --- 5. Strade sterrate tra i luoghi --- */
    const P = w.pois;
    const links = [['start', 'valle'], ['start', 'city'], ['city', 'valle'], ['city', 'base'], ['city', 'deposito'], ['city', 'lab'], ['city', 'cappella'], ['city', 'hosp'], ['valle', 'truckstop']];
    links.forEach(([a, c]) => { if (P[a] && P[c]) carve(P[a].x, P[a].y + 3, P[c].x, P[c].y + 3, T.DIRT, 1); });
    carve(P.radio.x, P.radio.y + 6, P.radio.x, Math.round(mtnAt(P.radio.x)) + 6, T.PATH, 1);
    carve(P.radio.x, Math.round(mtnAt(P.radio.x)) + 6, cityX, cityY, T.DIRT, 1);
    carve(P.campo.x, P.campo.y + 6, P.campo.x, hwAt(P.campo.x), T.DIRT, 1);
    carve(P.base.x + 15, P.base.y, P.base.x + 30, P.base.y, T.DIRT, 1);

    /* --- 6. Edifici generici --- */
    // città: isolati
    for (let by2 = cityY - 50; by2 < cityY + 50; by2 += 15) for (let bx2 = cityX - 52; bx2 < cityX + 52; bx2 += 17) {
      const x0 = bx2 + 3, y0 = by2 + 3;
      if (!inb(x0 + 6, y0 + 6) || b[idx(x0 + 6, y0 + 6)] !== 2) continue;
      const n = ri(1, 2);
      for (let k = 0; k < n; k++) {
        const bw = ri(6, 10), bh = ri(6, 9);
        const B = building(x0 + 1 + ri(0, 11 - bw), y0 + 1 + ri(0, 10 - bh), bw, bh, { wall: R() < .5 ? T.BRICK : T.CWALL, floor: R() < .5 ? T.TILE : T.WOOD, doors: ri(1, 2), crates: ri(1, 3), loot: 'city', ruin: R() < .35 ? .25 : 0, inner: R() < .4 });
        if (B && R() < .12) w.docs.push({ id: 'note', x: (B.x + 2) * TS, y: (B.y + 2) * TS, note: ri(0, AF.NOTES.length - 1) });
      }
    }
    // periferia, villaggio, terre desolate: case
    let evacPlaced = false;
    for (let t = 0; t < 1500; t++) {
      const x = ri(6, W - 14), y = ri(40, H - 14), bi = b[idx(x, y)];
      const chance = bi === 1 ? .5 : bi === 10 ? .45 : bi === 11 ? .05 : bi === 0 ? .025 : 0;
      if (R() > chance) continue;
      const B = building(x, y, ri(6, 8), ri(5, 7), { wall: T.BRICK, floor: T.WOOD, doors: ri(1, 2), crates: ri(1, 2), loot: bi === 0 ? 'camp' : 'house', ruin: R() < .2 ? .2 : 0 });
      if (B && bi === 1 && !evacPlaced) { placeDoc('evac', B); evacPlaced = true; }
      else if (B && R() < .1) w.docs.push({ id: 'note', x: (B.x + 2) * TS, y: (B.y + 2) * TS, note: ri(0, AF.NOTES.length - 1) });
    }
    // capannoni industriali
    for (let t = 0; t < 300; t++) {
      const x = ri(6, W - 22), y = ri(40, H - 20);
      if (b[idx(x, y)] !== 3) continue;
      building(x, y, ri(10, 16), ri(8, 12), { wall: T.CWALL, floor: T.CONC, doors: ri(2, 3), crates: ri(2, 4), loot: 'industrial', inner: R() < .5 });
    }

    /* --- 7. Risorse (alberi, rocce, cespugli, rottami) e relitti --- */
    let nid = 0;
    for (let y = 3; y < H - 3; y++) for (let x = 3; x < W - 3; x++) {
      const k = idx(x, y);
      const t = g[k], bi = b[k];
      if (res[k] && !(res[k] === 2 && t === T.ASPH)) continue;
      if (SOLID[t] || t === T.WATER || t === T.LINE) continue;
      const r = R();
      let type = null;
      if (t === T.ASPH) { if (r < (bi === 4 ? .014 : .004)) type = 'wreck'; }
      else if (bi === 0) { if (r < .085) type = 'tree'; else if (r < .1) type = 'bush'; else if (r < .104) type = 'rock'; }
      else if (bi === 1 || bi === 10) { if (r < .022) type = 'tree'; else if (r < .03) type = 'bush'; else if (r < .034) type = 'scrap'; }
      else if (bi === 2) { if (r < .012) type = 'scrap'; else if (r < .015) type = 'tree'; }
      else if (bi === 3) { if (r < .02) type = 'scrap'; else if (r < .024) type = 'rock'; }
      else if (bi === 6) { if (r < .03) type = 'rock'; else if (r < .045) type = 'pine'; else if (r < .048) type = 'ore'; }
      else if (bi === 5) { if (t === T.GRASS && r < .03) type = 'tree'; else if (r < .036) type = 'bush'; }
      else if (bi === 9) { if (r < .006) type = 'scrap'; }
      else if (bi === 4) { if (r < .008) type = 'scrap'; else if (r < .012) type = 'tree'; }
      else { if (r < .012) type = 'tree'; else if (r < .018) type = 'bush'; else if (r < .022) type = 'rock'; else if (r < .025) type = 'scrap'; }
      if (!type) continue;
      if (type === 'wreck') { addCrate(x, y, 'wreck', 'wreck', { solid: true, a: R() * Math.PI }); res[k] = 1; continue; }
      const sub = type === 'bush' ? (R() < .55 ? 'berries' : R() < .6 ? 'herbs' : 'mushroom') : null;
      w.nodes.push({ id: nid++, t: type, x, y, hp: type === 'tree' || type === 'pine' ? 5 : type === 'rock' || type === 'ore' ? 6 : 1, sub });
      res[k] = 4;
    }
    // accampamenti nella foresta
    for (let t = 0; t < 60 && w.camps.length < 12; t++) {
      const x = ri(10, W - 10), y = ri(50, H - 10);
      if (b[idx(x, y)] !== 0 || res[idx(x, y)]) continue;
      w.camps.push({ x: x * TS + 16, y: y * TS + 16, wild: true });
      addCrate(x + 1, y + 1, 'camp', 'crate');
    }

    /* --- 8. Veicoli --- */
    const findAsph = (cx, cy, rad) => {
      for (let t = 0; t < 400; t++) {
        const x = cx + ri(-rad, rad), y = cy + ri(-rad, rad);
        if (inb(x, y) && g[idx(x, y)] === T.ASPH && res[idx(x, y)] === 2) return [x, y];
      }
      return [cx, cy];
    };
    const cp = findAsph(cityX, cityY, 25);
    w.vehicles.push({ id: 'v_car', type: 'car', x: cp[0] * TS + 16, y: cp[1] * TS + 16, a: R() * 6 });
    const mp = findAsph(sp[0], hwAt(sp[0]), 20);
    let mx2 = sp[0] + 5, my2 = sp[1] + 6;
    if (!validGround(mx2, my2)) { mx2 = mp[0]; my2 = mp[1]; }
    w.vehicles.push({ id: 'v_moto', type: 'moto', x: mx2 * TS + 16, y: my2 * TS + 16, a: 1.2 });
    const cp2 = findAsph(P.campo.x + 20, hwAt(P.campo.x + 20), 12);
    w.vehicles.push({ id: 'v_car2', type: 'car', x: cp2[0] * TS + 16, y: cp2[1] * TS + 16, a: 0 });

    // cache segrete (rivelate dalla radio / eventi)
    w.caches = [];
    for (let t = 0; t < 400 && w.caches.length < 5; t++) {
      const x = ri(12, W - 12), y = ri(45, H - 12);
      if (res[idx(x, y)] || SOLID[g[idx(x, y)]] || g[idx(x, y)] === T.WATER || b[idx(x, y)] === 6) continue;
      const c = addCrate(x, y, 'supply', 'cache', { hidden: true });
      w.caches.push(c.id); res[idx(x, y)] = 1;
    }

    w.hwAt = hwAt;
    return w;
  };

  /* =====================================================================
     RENDERING DEI CHUNK (terreno pre-disegnato e messo in cache)
     ===================================================================== */
  const COL = {};
  COL[T.GRASS] = [62, 74, 47]; COL[T.FOREST] = [44, 58, 37]; COL[T.DRYG] = [88, 84, 60]; COL[T.DIRT] = [90, 74, 54];

  COL[T.WATER] = [36, 64, 74]; COL[T.DEEP] = [24, 44, 54]; COL[T.SAND] = [120, 108, 80]; COL[T.SNOW] = [196, 201, 205];
  COL[T.ROCK] = [104, 103, 98]; COL[T.CLIFF] = [70, 69, 66]; COL[T.WOOD] = [104, 80, 56]; COL[T.TILE] = [108, 107, 100];
  COL[T.BRICK] = [112, 74, 60]; COL[T.CWALL] = [118, 116, 110]; COL[T.FENCE] = [80, 74, 64]; COL[T.LABF] = [92, 110, 112];

        if (!(below === t || WALLISH[below])) { c.fillStyle = rgb(base, .62); c.fillRect(px, py + 22, TS, 10); }
        if (t === T.BRICK) { c.fillStyle = 'rgba(0,0,0,.15)'; c.fillRect(px, py + 10, TS, 1); c.fillRect(px + (y % 2 ? 8 : 20), py, 1, 10); }
        if (t === T.CLIFF) { c.fillStyle = 'rgba(255,255,255,.08)'; c.fillRect(px + 4, py + 3, 12, 4); }
        if (t === T.LOCK) { c.fillStyle = '#e0b04a'; c.fillRect(px + 12, py + 8, 8, 8); c.fillStyle = '#3a2a10'; c.fillRect(px + 15, py + 11, 2, 4); }
        if (t === T.MWALL) { c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(px + 2, py + 2, TS - 4, 2); }

        const above = at(x, y - 1);
        if (WALLISH[above] && above !== T.FENCE) {
          const gr = c.createLinearGradient(0, py, 0, py + 14); gr.addColorStop(0, 'rgba(0,0,0,.45)'); gr.addColorStop(1, 'rgba(0,0,0,0)');

      if ((t === T.SAND || t === T.GRASS) && (at(x, y - 1) === T.WATER || at(x, y + 1) === T.WATER || at(x - 1, y) === T.WATER || at(x + 1, y) === T.WATER)) {
        c.fillStyle = 'rgba(200,220,220,.1)'; c.fillRect(px, py, TS, TS);
      }
    }
    return cv;
  };

  /* Immagine della mappa completa (1 pixel per tile) */
  AF.makeMapImage = function (world) {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c = cv.getContext('2d'); const img = c.createImageData(W, H);

  };

})(window.AF);

      A.rain = A.loopNoise('highpass', 2400, 0);

      case 'growl':  tone(80 + Math.random() * 30, .5, 'sawtooth', .12 * v, 50); break;
      case 'howl':   tone(300, 1.2, 'sine', .08 * v, 520); break;

/* js/core.js */
/* =====================================================================
   AFTERFALL — core.js
   Stato di gioco, utilità, istanze di oggetti, inventario, griglie di

   ===================================================================== */
'use strict';
(function (AF) {
  const TS = AF.TS, W = AF.W, H = AF.H;

  /* ---------- Utilità ---------- */
  const U = AF.U = {
    clamp: (v, a, b) => v < a ? a : v > b ? b : v,
    lerp: (a, b, t) => a + (b - a) * t,
    dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
    rnd: (a, b) => a + Math.random() * (b - a),
    ri: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
    pick: arr => arr[Math.floor(Math.random() * arr.length)],
    angDiff: (a, b) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; },
    fmtTime: m => { const h = Math.floor(m / 60) % 24, mm = Math.floor(m % 60); return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm; },
    weighted(list) { let s = 0; for (const e of list) s += e[1]; let r = Math.random() * s; for (const e of list) { r -= e[1]; if (r <= 0) return e; } return list[list.length - 1]; },

  };

    explorer:  { n: 'Esploratore', loot: 1.5, edmg: .6, ehp: .8, drain: .7, spawn: .7, aggro: .85, saves: 'free', xp: 1, d: 'Risorse abbondanti, nemici meno pericolosi.' },
    survivor:  { n: 'Sopravvissuto', loot: 1, edmg: 1, ehp: 1, drain: 1, spawn: 1, aggro: 1, saves: 'free', xp: 1, d: 'Esperienza bilanciata.' },
    nightmare: { n: 'Incubo', loot: .6, edmg: 1.5, ehp: 1.3, drain: 1.3, spawn: 1.45, aggro: 1.3, saves: 'bed', xp: 1.25, d: 'Risorse scarse, nemici aggressivi. Si salva solo dormendo.' }
  };

  AF.has = (id, q) => INV.count(AF.G.player.inv, id) >= (q || 1);

  /* ---------- Nuova partita ---------- */
  AF.newGame = function (diff, seed) {
    seed = seed || (Math.random() * 1e9) | 0;
    const world = AF.genWorld(seed);
    const G = AF.G = {
      v: 3, seed, diff, D: AF.DIFFS[diff], world, time: { day: 1, min: 7 * 60 + 30 }, real: 0,
      weather: { cur: 'clear', next: 'clear', mix: 1, t: 180, light: 0, wind: .3, flash: 0 },
      player: null, skills: {}, rep: {}, flags: {}, cont: {}, bags: [], structs: [], actors: [], proj: [], parts: [],
      noises: [], decals: [], removed: {}, quests: { active: {}, done: {}, track: null, gen: {}, genN: 0 },
      docs: [], radioLog: [], known: {}, markers: [], fog: new Uint8Array(64 * 64), vehicles: [],
      deadNpc: {}, saves: 0, stats: { kills: 0, crafted: 0, built: 0, dist: 0, looted: 0 }, events: { t: 240 },
      lockOpen: {}, msgs: [], companions: [], nextId: 1, ended: false
    };
    AF.SKILLS.forEach(t => t.list.forEach(s => G.skills[s.id] = 0));
    Object.keys(AF.FACTIONS).forEach(f => G.rep[f] = AF.FACTIONS[f].rep);
    G.player = AF.mkPlayer(world.start.x, world.start.y);
    const inv = G.player.inv;
    inv[0] = AF.mkItem('rknife'); inv[0].d = 45;
    inv[1] = AF.mkItem('radio');
    INV.add(inv, 'dirtywater', 1);
    INV.add(inv, 'berries', 4);
    world.vehicles.forEach(v => G.vehicles.push(AF.mkVehicle(v)));
    AF.initRuntime();
    AF.Quests.start('wake', true);
    return G;
  };

  AF.mkPlayer = function (x, y) {
    return {
      isPlayer: true, x, y, r: 11, a: 0, vx: 0, vy: 0, hp: 100, maxHp: 100, hunger: 80, thirst: 70, energy: 90, stam: 100, maxStam: 100,
      body: 37, xp: 0, lvl: 1, sp: 0, caps: 15, crouch: false, run: false,
      inv: new Array(20).fill(null), eq: { head: null, body: null, legs: null, back: null }, sel: 0,
      cond: {}, atkCd: 0, rel: 0, relT: 0, veh: null, spawn: { x, y }, dead: false, stepT: 0, hurtT: 0, swing: 0, wet: 0,
      lightOn: true, radioF: 91.3
    };
  };

  /* Strutture runtime derivate dal mondo (griglie, cache) */
  AF.initRuntime = function () {
    const G = AF.G, w = G.world;
    G.blk = new Uint8Array(W * H);             // ostacoli statici (alberi, rocce, relitti)
    G.ngrid = new Int32Array(W * H).fill(-1);  // nodo risorsa per tile
    G.sgrid = new Map();                       // struttura per tile (non pavimento)
    G.fgrid = new Map();                       // pavimenti
    w.nodes.forEach(n => {
      if (G.removed[n.id]) return;
      G.ngrid[n.y * W + n.x] = n.id;
      if (n.t === 'tree' || n.t === 'pine' || n.t === 'rock' || n.t === 'ore') G.blk[n.y * W + n.x] = 1;
    });
    w.containers.forEach(c => { if (c.solid) G.blk[Math.floor(c.y / TS) * W + Math.floor(c.x / TS)] = 1; });
    w.locks.forEach(l => { if (G.lockOpen[l.req]) w.g[l.y * W + l.x] = l.floor; });
    G.structs.forEach(s => AF.Build.index(s, true));
    G.chunks = new AF.ChunkCache(w);
    G.mapImg = AF.makeMapImage(w);
    G.contMap = {}; w.containers.forEach(c => G.contMap[c.id] = c);
    G.cgrid = new Map(); w.containers.forEach(c => G.cgrid.set(Math.floor(c.y / TS) * W + Math.floor(c.x / TS), c));
    G.player.isPlayer = true;
    if (!G.player.inv.length) G.player.inv = new Array(20).fill(null);
    G.bags.forEach(b => G.contMap[b.id] = b);
    G.hash = new Map();
    G.actors = [];
    AF.Actors.spawnNamed();
    G.companions.forEach(c => AF.Actors.spawnCompanion(c));
    // ricrea le persone da scortare delle missioni in corso
    Object.keys(G.quests.active).forEach(id => {
      const o = AF.Quests && AF.Quests.obj(id);
      if (o && o.type === 'escort') {
        const a = AF.Actors.make(o.npcType || 'guard', G.player.x + 30, G.player.y + 30, { n: o.npcName, fac: 'sopr', ally: true, persist: true, hp: 90 });
        a.comp = { mode: 'follow', n: o.npcName, escort: id }; G.quests.active[id].escort = a.id;
      }
    });
    G.pois = w.pois;
    G.pvis = 1; G.light = 1; G.visMul = 1; G.isDay = true;
    G.spawnT = 2;
  };

  /* ---------- Collisioni ---------- */
  AF.tileAt = (px, py) => { const tx = Math.floor(px / TS), ty = Math.floor(py / TS); return (tx < 0 || ty < 0 || tx >= W || ty >= H) ? AF.T.CLIFF : AF.G.world.g[ty * W + tx]; };
  AF.solidTile = function (tx, ty) {
    if (tx < 0 || ty < 0 || tx >= W || ty >= H) return true;
    const G = AF.G, k = ty * W + tx;
    if (AF.SOLID[G.world.g[k]] || G.blk[k]) return true;
    const s = G.sgrid.get(k);
    if (s && AF.STRUCTS[s.type].solid && !(AF.STRUCTS[s.type].door && s.open)) return true;
    return false;
  };
  // collisione cerchio-tile: ritorna true se la posizione è libera
  AF.freeAt = function (x, y, r) {
    const x0 = Math.floor((x - r) / TS), x1 = Math.floor((x + r) / TS), y0 = Math.floor((y - r) / TS), y1 = Math.floor((y + r) / TS);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      if (!AF.solidTile(tx, ty)) continue;
      const cx = U.clamp(x, tx * TS, tx * TS + TS), cy = U.clamp(y, ty * TS, ty * TS + TS);

    }
    return true;
  };
  // movimento con scivolamento sui muri
  AF.moveBody = function (o, dx, dy) {
    let moved = false;
    if (dx && AF.freeAt(o.x + dx, o.y, o.r)) { o.x += dx; moved = true; }
    if (dy && AF.freeAt(o.x, o.y + dy, o.r)) { o.y += dy; moved = true; }
    return moved;
  };
  // linea di vista attraverso il terreno opaco e le strutture opache
  AF.los = function (x0, y0, x1, y1) {
    const G = AF.G, d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 14);
    for (let i = 1; i < n; i++) {
      const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
      const tx = Math.floor(x / TS), ty = Math.floor(y / TS), k = ty * W + tx;
      if (AF.OPAQUE[G.world.g[k]]) return false;
      const s = G.sgrid.get(k);
      if (s) { const sd = AF.STRUCTS[s.type]; if (sd.solid && !sd.window && !(sd.door && s.open)) return false; }
    }
    return true;
  };

  /* ---------- Messaggi a schermo ---------- */
  AF.msg = function (text, kind) {
    const G = AF.G; if (!G) return;
    G.msgs.push({ t: text, k: kind || '', life: 6 });
    if (G.msgs.length > 6) G.msgs.shift();
    if (AF.UI) AF.UI.dirtyMsgs = true;
  };

  /* ---------- Salvataggio ---------- */
  const KEY = 'afterfall_save_';
  AF.Save = {
    slots: ['auto', '1', '2', '3'],
    serialize() {
      const G = AF.G;
      const fog = btoa(String.fromCharCode.apply(null, G.fog));
      return {
        v: G.v, seed: G.seed, diff: G.diff, time: G.time, weather: { cur: G.weather.cur, next: G.weather.next, mix: G.weather.mix, t: G.weather.t },
        player: Object.assign({}, G.player, { veh: G.player.veh ? G.player.veh.id : null, chan: null, rel: 0 }),
        skills: G.skills, rep: G.rep, flags: G.flags, cont: G.cont, bags: G.bags, removed: G.removed,
        structs: G.structs.map(s => { const o = Object.assign({}, s); delete o.pow; return o; }),
        quests: G.quests, docs: G.docs, radioLog: G.radioLog.slice(-40), known: G.known, markers: G.markers, fog,
        vehicles: G.vehicles, deadNpc: G.deadNpc, saves: G.saves, stats: G.stats, events: G.events, lockOpen: G.lockOpen,
        companions: G.companions.map(c => ({ id: c.id, n: c.n, type: c.type, fac: c.fac, hp: c.actor ? c.actor.hp : c.hp, mode: c.mode, loyal: c.loyal, home: c.home })),
        nextId: G.nextId, ts: Date.now(), ended: G.ended
      };
    },
    write(slot) {
      const G = AF.G; if (!G || G.player.dead) return false;
      try {
        const data = AF.Save.serialize();
        localStorage.setItem(KEY + slot, JSON.stringify(data));
        localStorage.setItem(KEY + 'last', slot);
        return true;
      } catch (e) { AF.msg('Salvataggio non riuscito: memoria del browser non disponibile.', 'bad'); return false; }
    },
    info(slot) {
      try {
        const raw = localStorage.getItem(KEY + slot); if (!raw) return null;
        const d = JSON.parse(raw);
        return { slot, day: d.time.day, min: d.time.min, lvl: d.player.lvl, diff: d.diff, ts: d.ts };
      } catch (e) { return null; }
    },
    last() { try { return localStorage.getItem(KEY + 'last'); } catch (e) { return null; } },
    load(slot) {
      let d;
      try { d = JSON.parse(localStorage.getItem(KEY + slot)); } catch (e) { return false; }
      if (!d) return false;
      const world = AF.genWorld(d.seed);
      const G = AF.G = {
        v: d.v, seed: d.seed, diff: d.diff, D: AF.DIFFS[d.diff], world, time: d.time, real: 0,
        weather: Object.assign({ light: 0, wind: .3, flash: 0 }, d.weather), player: d.player, skills: d.skills, rep: d.rep,
        flags: d.flags, cont: d.cont, bags: d.bags || [], structs: d.structs || [], actors: [], proj: [], parts: [], noises: [], decals: [],
        removed: d.removed || {}, quests: d.quests, docs: d.docs || [], radioLog: d.radioLog || [], known: d.known || {}, markers: d.markers || [],
        fog: new Uint8Array(64 * 64), vehicles: [], deadNpc: d.deadNpc || {}, saves: d.saves || 0, stats: d.stats, events: d.events || { t: 240 },
        lockOpen: d.lockOpen || {}, msgs: [], companions: d.companions || [], nextId: d.nextId || 1, ended: d.ended
      };
      try { const s = atob(d.fog); for (let i = 0; i < s.length; i++) G.fog[i] = s.charCodeAt(i); } catch (e) { }
      const vehId = G.player.veh; G.player.veh = null;
      (d.vehicles || []).forEach(v => G.vehicles.push(v));
      if (!G.vehicles.length) world.vehicles.forEach(v => G.vehicles.push(AF.mkVehicle(v)));
      AF.initRuntime();
      if (vehId) { const v = G.vehicles.find(x => x.id === vehId); if (v) { G.player.veh = v; } }
      return true;
    },
    exists(slot) { try { return !!localStorage.getItem(KEY + slot); } catch (e) { return false; } },
    del(slot) { try { localStorage.removeItem(KEY + slot); } catch (e) { } },
    // regola dei salvataggi: in Incubo solo dormendo
    canManual() { return AF.G.D.saves === 'free'; }
  };

  /* Impostazioni */
  AF.Settings = {
    data: { vol: .7, amb: .5, parts: 1, lightRes: .5, fps: false, touch: 'auto', zoom: 1, shake: true },
    load() { try { const s = JSON.parse(localStorage.getItem('afterfall_settings')); if (s) Object.assign(this.data, s); } catch (e) { } },
    save() { try { localStorage.setItem('afterfall_settings', JSON.stringify(this.data)); } catch (e) { } }
  };
})(window.AF);
