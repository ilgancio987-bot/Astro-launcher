      mp.innerHTML = '<div class="mapwrap"><canvas id="mapCanvas"></canvas><div class="maptools"><button class="btn small" data-act="mapz" data-z="1.4">＋</button><button class="btn small" data-act="mapz" data-z=".7">－</button><button class="btn small" data-act="mapc">Centra</button><button class="btn small" data-act="close">Chiudi (M)</button></div><div class="maplegend"><span>⛺ Sopravvissuti</span><span>☠ Predoni</span><span>✪ Milizia</span><span>✦ Culto</span><span>◆ Obiettivo</span><span>✕ Segnalino (tocca la mappa)</span></div></div>';
      const cv = mp.querySelector('canvas');
      let drag = null;
      cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, vx: UI.mapView.x, vy: UI.mapView.y, moved: false }; cv.setPointerCapture(e.pointerId); });
      cv.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true; UI.mapView.x = drag.vx + dx * devicePixelRatio; UI.mapView.y = drag.vy + dy * devicePixelRatio; UI.renderMap(); });
      cv.addEventListener('pointerup', e => {
        if (drag && !drag.moved) {
          const r = cv.getBoundingClientRect(), m = UI.mapGeom;
          const x = ((e.clientX - r.left) * devicePixelRatio - m.ox) / m.k * AF.TS, y = ((e.clientY - r.top) * devicePixelRatio - m.oy) / m.k * AF.TS;
          const G = AF.G, ex = G.markers.findIndex(q => Math.hypot(q.x - x, q.y - y) < 12 / m.k * AF.TS);
          if (ex >= 0) G.markers.splice(ex, 1); else G.markers.push({ x, y, n: 'Segnalino' });
          UI.renderMap();
        }
        drag = null;
      });
      cv.addEventListener('wheel', e => { e.preventDefault(); UI.mapView.z = U.clamp(UI.mapView.z * (e.deltaY < 0 ? 1.15 : .87), .8, 6); UI.renderMap(); }, { passive: false });
    }
    const cv = mp.querySelector('canvas');
    cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio;
    UI.mapGeom = AF.Render.drawMap(cv, UI.mapView);
  };

  /* --- radio --- */
  UI.renderRadio = function () {
    const G = AF.G, f = G.player.radioF;
    const presets = [...new Set(G.radioLog.filter(l => l.f).map(l => l.f.toFixed(1)))];
    $('#radioPanel').innerHTML = '<div class="radio"><header><h2>Radio</h2><button class="x" data-act="close" aria-label="Chiudi">✕</button></header>' +
      '<div class="dial"><div class="freq"><b id="rFreq">' + f.toFixed(1) + '</b><span>MHz</span></div><div class="meter" id="rMeter">' + [0, 1, 2, 3, 4].map(() => '<i></i>').join('') + '</div></div>' +
      '<div class="tune"><button class="btn small" data-act="rstep" data-s="-1">◀ 1.0</button><button class="btn small" data-act="rstep" data-s="-.1">◀ 0.1</button><input type="range" id="rSlider" min="88" max="108" step="0.1" value="' + f + '" aria-label="Frequenza"><button class="btn small" data-act="rstep" data-s=".1">0.1 ▶</button><button class="btn small" data-act="rstep" data-s="1">1.0 ▶</button></div>' +
      '<div class="rscale">' + [88, 92, 96, 100, 104, 108].map(x => '<span>' + x + '</span>').join('') + '</div>' +
      '<div class="rstation" id="rStation"></div><div class="rtext" id="rText"></div>' +
      (presets.length ? '<div class="presets">' + presets.map(x => '<button class="chip" data-act="rset" data-f="' + x + '">' + x + '</button>').join('') + '</div>' : '') +
      '<p class="muted">Gira la manopola e cerca voci nel rumore. Alcuni segnali nascondono coordinate. Il gioco continua mentre ascolti.</p></div>';
    $('#rSlider').addEventListener('input', e => { G.player.radioF = +e.target.value; $('#rFreq').textContent = G.player.radioF.toFixed(1); });
  };
  UI.updateRadio = function () {
    if (!AF.Radio.open) return;
    const sig = AF.Radio.signal(AF.G.player.radioF);
    const bars = Math.round(sig.strength * 5);
    document.querySelectorAll('#rMeter i').forEach((el, i) => el.classList.toggle('on', i < bars));
    $('#rStation').textContent = sig.s && sig.strength > .45 ? sig.s.n + ' · ' + sig.s.f.toFixed(1) + ' MHz' : sig.strength > .1 ? 'Segnale debole…' : 'Solo rumore statico';
    $('#rText').textContent = AF.Radio.shown || '';
  };

  /* --- costruzione --- */
  UI.buildCat = 'Struttura';
  UI.showBuild = function (on) {
    show($('#buildBar'), on);
    if (on) UI.renderBuild();
  };
  UI.renderBuild = function () {
    const G = AF.G, b = G.build; if (!b) return;
    const cats = [...new Set(Object.values(AF.STRUCTS).map(s => s.cat))];
    const list = Object.keys(AF.STRUCTS).filter(k => AF.STRUCTS[k].cat === UI.buildCat);
    $('#buildBar').innerHTML = '<div class="bb-head"><nav>' + cats.map(c => '<button class="' + (c === UI.buildCat ? 'on' : '') + '" data-act="bcat" data-c="' + c + '">' + c + '</button>').join('') + '</nav>' +
      '<div class="bb-modes"><button class="' + (b.mode === 'place' ? 'on' : '') + '" data-act="bmode" data-m="place">Piazza</button><button class="' + (b.mode === 'demolish' ? 'on' : '') + '" data-act="bmode" data-m="demolish">Demolisci</button><button class="' + (b.mode === 'repair' ? 'on' : '') + '" data-act="bmode" data-m="repair">Ripara</button><button data-act="brot">Ruota (R)</button><button data-act="bexit">Esci</button></div></div>' +
      '<div class="bb-list">' + list.map(k => {
        const s = AF.STRUCTS[k], c = AF.Build.costOk(k);
        const cost = c.kit ? '<span class="ok">Kit pronto</span>' : Object.keys(s.cost).map(m => '<span class="' + (INV.count(G.player.inv, m) >= s.cost[m] ? 'ok' : 'no') + '">' + AF.ITEMS[m].i + s.cost[m] + '</span>').join('');
        return '<button class="bitem' + (b.type === k ? ' on' : '') + (c.ok ? '' : ' dim') + '" data-act="bsel" data-s="' + k + '" title="' + esc(s.d || s.n) + (c.miss && c.miss.length ? ' — Mancano: ' + esc(c.miss.join(', ')) : '') + '"><span class="bi">' + s.i + '</span><strong>' + esc(s.n) + '</strong><span class="bcost">' + cost + '</span></button>';
      }).join('') + '</div><div class="bb-hint">' + (AF.Input.touchMode ? 'Il riquadro segue la tua direzione. ' : 'Clic per piazzare, R per ruotare. ') + esc((AF.STRUCTS[b.type].d || '')) + '</div>' +
      (AF.Input.touchMode ? '<button class="btn primary bb-place" data-act="bplace">' + (b.mode === 'place' ? 'Piazza qui' : b.mode === 'demolish' ? 'Demolisci qui' : 'Ripara qui') + '</button>' : '');
  };

  /* --- morte e finali --- */
  UI.showDeath = function () {
    const G = AF.G; UI.closeAll(true); UI.paused = true; UI.openName = 'death';
    show($('#touch'), false);
    const last = AF.Save.last();
    UI.screen('<div class="menu death"><div class="menu-inner narrow"><h2>Sei morto</h2><p class="muted">' + esc(G.deathCause || '') + '</p><div class="stats"><div><span>Giorni sopravvissuti</span><b>' + G.time.day + '</b></div><div><span>Livello</span><b>' + G.player.lvl + '</b></div><div><span>Uccisioni</span><b>' + G.stats.kills + '</b></div></div><div class="menu-btns">' +
      (last && AF.Save.exists(last) ? '<button class="btn primary" data-act="load" data-slot="' + last + '">Carica l\'ultimo salvataggio</button>' : '') +
      '<button class="btn" data-act="quit">Menu principale</button></div></div></div>');
  };
  UI.endingChoice = function () {
    const G = AF.G; UI.closeAll(true); UI.paused = true; UI.openName = 'ending';
    const opts = AF.Story.endings();
    UI.screen('<div class="menu dim"><div class="menu-inner"><small class="eyebrow">Nucleo CUSTODE</small><h2>Il Codice AURORA è accettato.</h2><p class="muted">Il CUSTODE attende un comando. Ciò che scegli ora resterà per sempre. Le scelte disponibili dipendono dalle alleanze che hai stretto.</p><div class="endings">' +
      opts.map(o => '<button class="ending' + (o.ok ? '' : ' locked') + '" data-act="ending" data-e="' + o.id + '"' + (o.ok ? '' : ' disabled') + '><strong>' + esc(o.t) + '</strong><span>' + esc(o.ok ? o.d : o.why) + '</span></button>').join('') + '</div></div></div>');
  };
  UI.showEnding = function (id) {
    const G = AF.G; UI.paused = true; UI.openName = 'ending';
    const lines = AF.Story.epilogue(id);
    UI.screen('<div class="menu ending-screen"><div class="menu-inner narrow"><small class="eyebrow">Finale</small><h2>' + esc(AF.ENDINGS[id].t) + '</h2>' + lines.map(l => '<p>' + esc(l) + '</p>').join('') +
      '<div class="stats"><div><span>Giorni</span><b>' + G.time.day + '</b></div><div><span>Livello</span><b>' + G.player.lvl + '</b></div><div><span>Uccisioni</span><b>' + G.stats.kills + '</b></div><div><span>Documenti trovati</span><b>' + G.docs.length + '</b></div></div><div class="menu-btns"><button class="btn primary" data-act="resume">Continua a esplorare</button><button class="btn" data-act="quit">Menu principale</button></div></div></div>');
    AF.Audio.play('level');
    AF.Save.write('auto');
  };

  /* =====================================================================
     CLIC (delega eventi)
     ===================================================================== */
  UI.onClick = function (e) {
    const el = e.target.closest('[data-act]'); if (!el) return;
    if (el.disabled) return;
    const a = el.dataset.act, G = AF.G;
    AF.Audio.init();
    switch (a) {
      case 'newgame': UI.newGameMenu(); break;
      case 'continue': if (AF.Save.load(AF.Save.last())) UI.startGame(); break;
      case 'loadmenu': UI.loadMenu(el.dataset.from === 'pause'); break;
      case 'load': if (AF.Save.load(el.dataset.slot)) UI.startGame(); else AF.msg('Caricamento non riuscito.'); break;
      case 'delsave': AF.Save.del(el.dataset.slot); UI.loadMenu(); break;
      case 'settings': UI.settingsMenu(el.dataset.from === 'pause'); break;
      case 'savesettings': UI.applySettings(); if (el.dataset.from === 'pause') UI.pauseMenu(); else UI.mainMenu(); break;
      case 'controls': UI.controlsMenu(el.dataset.from === 'pause'); break;
      case 'back': UI.mainMenu(); break;
      case 'start': {
        const seedV = parseInt(($('#seedIn') || {}).value, 10);
        UI.screen('<div class="menu"><div class="menu-inner narrow"><h2>Generazione del mondo…</h2><p class="muted">Città, foreste, bunker e ricordi di un mondo perduto.</p></div></div>');
        setTimeout(() => { AF.newGame(el.dataset.diff, isNaN(seedV) ? 0 : seedV); UI.startGame(); AF.msg('Benvenuto in AFTERFALL. Segui l\'obiettivo in alto.', 'level'); }, 60);
        break;
      }
      case 'resume': UI.closeAll(); break;
      case 'pause': UI.pauseMenu(); break;
      case 'savemenu': UI.saveMenu(); break;
      case 'dosave': if (AF.Save.write(el.dataset.slot)) { AF.msg('Partita salvata nello slot ' + el.dataset.slot + '.', 'good'); } UI.closeAll(); break;
      case 'quit': if (G && !G.player.dead && AF.Save.canManual()) AF.Save.write('auto'); UI.mainMenu(); break;
      case 'close': UI.closeAll(); break;
      case 'qb': { const p = el.dataset.p; if (p === 'pause') UI.pauseMenu(); else UI.open(p); break; }
      case 'tab': UI.tab = el.dataset.t; UI.openName = UI.tab; UI.sel = null; UI.renderPanel(); break;
      case 'item': UI.itemAction(el.dataset.a); break;
      case 'craft': { const r = AF.RECIPES[+el.dataset.r]; if (AF.Craft.make(r)) AF.msg('Creato: ' + (r.label || AF.ITEMS[r.out].n), 'good'); UI.renderPanel(); break; }
      case 'ccat': UI.craftCat = el.dataset.c; UI.renderPanel(); break;
      case 'skill': { const s = el.dataset.s, p = G.player; if (p.sp > 0 && G.skills[s] < 3) { G.skills[s]++; p.sp--; AF.Audio.play('level'); if (s === 'carry') AF.Player.resizeInv(); } UI.renderPanel(); break; }
      case 'qsel': UI.jsel = el.dataset.q; UI.renderPanel(); break;
      case 'track': G.quests.track = el.dataset.q; UI.renderPanel(); break;
      case 'abandon': AF.Quests.fail(el.dataset.q, 'abbandonata'); UI.renderPanel(); break;
      case 'readdoc': UI.showDoc(AF.DOCS[el.dataset.d]); break;
      case 'takeall': UI.takeAll(); break;
      case 'tbuy': UI.tradeAdd('b', +el.dataset.i); break;
      case 'tsell': UI.tradeAdd('s', +el.dataset.i); break;
      case 'tun': { const T = UI.trade, arr = el.dataset.kind === 'b' ? T.buy : T.sell, x = arr[+el.dataset.k]; x.q--; if (x.q <= 0) arr.splice(+el.dataset.k, 1); UI.renderTrade(); break; }
      case 'tconfirm': UI.tradeConfirm(); break;
      case 'dopt': { const o = UI.dlgOpts && UI.dlgOpts[+el.dataset.i]; if (o && !o.dis) o.fn(); break; }
      case 'mapz': UI.mapView.z = U.clamp(UI.mapView.z * +el.dataset.z, .8, 6); UI.renderMap(); break;
      case 'mapc': UI.mapView = { z: UI.mapView.z, x: 0, y: 0 }; UI.renderMap(); break;
      case 'rstep': G.player.radioF = U.clamp(Math.round((G.player.radioF + +el.dataset.s) * 10) / 10, 88, 108); $('#rSlider').value = G.player.radioF; $('#rFreq').textContent = G.player.radioF.toFixed(1); break;
      case 'rset': G.player.radioF = +el.dataset.f; $('#rSlider').value = G.player.radioF; $('#rFreq').textContent = G.player.radioF.toFixed(1); break;
      case 'bcat': UI.buildCat = el.dataset.c; UI.renderBuild(); break;
      case 'bsel': G.build.type = el.dataset.s; G.build.mode = 'place'; UI.renderBuild(); break;
      case 'bmode': G.build.mode = el.dataset.m; UI.renderBuild(); break;
      case 'brot': G.build.rot = (G.build.rot + 1) % 4; break;
      case 'bexit': AF.Build.stop(); break;
      case 'bplace': AF.Build.place(); UI.renderBuild(); break;
      case 'ending': AF.Story.finish(el.dataset.e); break;
    }
  };

  /* =====================================================================
     DRAG & DROP DELL'INVENTARIO (mouse e touch)
     ===================================================================== */
  UI.bindDrag = function () {
    let drag = null, lastTap = { t: 0, key: '' };
    const ghost = $('#dragGhost');
    document.addEventListener('pointerdown', e => {
      const s = e.target.closest('.slot'); if (!s || !s.dataset.inv) return;
      if (s.closest('#hotbar')) { const i = +s.dataset.i; AF.G.player.sel = i; UI.hudT = 0; return; }
      drag = { el: s, inv: s.dataset.inv, i: s.dataset.inv === 'eq' ? s.dataset.i : +s.dataset.i, x: e.clientX, y: e.clientY, on: false, id: e.pointerId };
    });
    document.addEventListener('pointermove', e => {
      if (!drag || drag.id !== e.pointerId) return;
      if (!drag.on && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 7) {
        if (drag.el.classList.contains('empty')) { drag = null; return; }
        drag.on = true; ghost.innerHTML = drag.el.querySelector('span') ? drag.el.querySelector('span').textContent : ''; ghost.hidden = false;
        drag.el.classList.add('dragging');
      }
      if (drag.on) { ghost.style.transform = 'translate(' + (e.clientX - 22) + 'px,' + (e.clientY - 22) + 'px)'; e.preventDefault(); }
    }, { passive: false });
    document.addEventListener('pointerup', e => {
      if (!drag || drag.id !== e.pointerId) return;
      const d = drag; drag = null; ghost.hidden = true;
      d.el.classList.remove('dragging');
      if (!d.on) {
        // clic: seleziona; doppio tocco: azione rapida
        const key = d.inv + ':' + d.i, now = performance.now();
        if (lastTap.key === key && now - lastTap.t < 380) { UI.quick(d.inv, d.i); lastTap.t = 0; return; }
        lastTap = { t: now, key };
        UI.sel = { inv: d.inv, i: d.i }; UI.confirmDel = false;
        UI.refresh(); return;
      }
      const tgt = document.elementFromPoint(e.clientX, e.clientY);
      const ts = tgt && tgt.closest('.slot');
      if (ts && ts.dataset.inv) UI.moveItem(d.inv, d.i, ts.dataset.inv, ts.dataset.inv === 'eq' ? ts.dataset.i : +ts.dataset.i);
      else if (!tgt || !tgt.closest('.sheet')) {
        // trascinato fuori dal pannello: getta a terra
        if (d.inv === 'p') { const p = AF.G.player, it = p.inv[d.i]; if (it) { p.inv[d.i] = null; AF.Bags.drop(p.x, p.y, [it]); } }
      }
      UI.refresh();
    });
  };
  UI.quick = function (inv, i) {
    const G = AF.G, p = G.player;
    if (UI.openName === 'loot') {
      if (inv === 'c') { const it = UI.loot.inv[i]; if (!it) return; const left = INV.addInst(p.inv, it); if (!left) UI.loot.inv[i] = null; else if (AF.ITEMS[it.id].s > 1) it.q = left; AF.Audio.play('pickup'); }
      else if (inv === 'p') { const it = p.inv[i]; if (!it) return; const k = firstFit(UI.loot.inv, it, UI.loot.size); if (k >= 0) { place(UI.loot.inv, k, it); p.inv[i] = null; } }
      AF.Quests.check(); UI.renderLoot(); return;
    }
    if (inv === 'p') AF.Player.useSlot(i); else if (inv === 'eq') AF.Player.unequip(i);
    UI.sel = null; UI.refresh();
  };
  function firstFit(arr, it, size) {
    const d = AF.ITEMS[it.id];
    if (d.s > 1) for (let k = 0; k < size; k++) if (arr[k] && arr[k].id === it.id && arr[k].q + it.q <= d.s) return k;
    for (let k = 0; k < size; k++) if (!arr[k]) return k;
    return -1;
  }
  function place(arr, k, it) {
    const ex = arr[k];
    if (ex && ex.id === it.id) ex.q += it.q; else arr[k] = it;
  }
  UI.moveItem = function (si, sidx, di, didx) {
    const G = AF.G, p = G.player;
    const get = (inv, i) => inv === 'eq' ? p.eq[i] : invOf(inv)[i];
    const set = (inv, i, v) => { if (inv === 'eq') p.eq[i] = v; else invOf(inv)[i] = v || null; };
    if (si === di && sidx === didx) return;
    const a = get(si, sidx); if (!a) return;
    const b = get(di, didx);
    if (di === 'eq') { // equipaggia
      if (AF.ITEMS[a.id].eq !== didx) { AF.msg('Non va in quello slot.', 'warn'); return; }
      if (si === 'p') { AF.Player.equip(sidx); return; }
      return;
    }
    if (si === 'eq') { // togli equipaggiamento
      if (b && AF.ITEMS[b.id].eq !== sidx) { AF.msg('Slot occupato.', 'warn'); return; }
      if (sidx === 'back') { AF.Player.unequip('back'); return; }
      set(di, didx, a); set('eq', sidx, b || null); return;
    }
    if (b && b.id === a.id && AF.ITEMS[a.id].s > 1) {
      const room = AF.ITEMS[a.id].s - b.q, n = Math.min(room, a.q);
      b.q += n; a.q -= n; if (a.q <= 0) set(si, sidx, null);
    } else { set(di, didx, a); set(si, sidx, b); }
    UI.sel = null;
    AF.Quests.check();
    AF.Audio.play('ui', .5);
  };
})(window.AF);

</script>
<script>
/* game.js */
/* =====================================================================
   AFTERFALL — game.js
   Punto d'ingresso: input (tastiera, mouse, touch), ciclo principale
   con requestAnimationFrame, autosalvataggio e avvio.
   I moduli si trovano in js/ (data, world, core, entities, player,
   systems, quests, render, ui, audio).
   ===================================================================== */
'use strict';
(function (AF) {
  const U = AF.U;

  /* =====================================================================
     INPUT
     ===================================================================== */
  const I = AF.Input = {
    keys: {}, mouse: { x: 0, y: 0, down: false, moved: 0 }, pointerWorld: null, touchMode: false,
    joy: { x: 0, y: 0, id: null, cx: 0, cy: 0 }, tAttack: false, tRun: false, attackPressed: false, moving: false
  };
  const KEYMAP = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', ShiftLeft: 'run', ShiftRight: 'run' };

  I.updateTouchMode = function () {
    const s = AF.Settings.data.touch;
    I.touchMode = s === 'on' || (s === 'auto' && (('ontouchstart' in window) || navigator.maxTouchPoints > 0) && matchMedia('(pointer: coarse)').matches);
    document.body.classList.toggle('touch', I.touchMode);
    document.getElementById('touch').hidden = !(I.touchMode && AF.state === 'game');
  };

  function typing(e) { return e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA'); }

  window.addEventListener('keydown', e => {
    if (typing(e)) return;
    AF.Audio.init();
    const k = KEYMAP[e.code]; if (k) { I.keys[k] = true; if (e.code.startsWith('Arrow')) e.preventDefault(); }
    if (e.repeat) return;
    const G = AF.G;
    if (e.code === 'Escape') {
      if (AF.state !== 'game') return;
      if (G.build && G.build.on) { AF.Build.stop(); return; }
      if (AF.UI.openName === 'death' || AF.UI.openName === 'ending') return;
      if (AF.UI.openName) AF.UI.closeAll(); else AF.UI.pauseMenu();
      return;
    }
    if (AF.state !== 'game' || !G || G.player.dead) return;
    if (AF.UI.openName === 'dialog' && /^Digit[1-9]$/.test(e.code)) {
      const o = AF.UI.dlgOpts && AF.UI.dlgOpts[+e.code.slice(5) - 1]; if (o && !o.dis) o.fn(); return;
    }
    const panelKeys = { KeyI: 'inv', Tab: 'inv', KeyC: 'craft', KeyK: 'skills', KeyJ: 'journal', KeyM: 'map', KeyQ: 'radio' };
    if (panelKeys[e.code]) { e.preventDefault(); AF.UI.open(panelKeys[e.code]); return; }
    if (AF.UI.openName && AF.UI.openName !== 'radio') return;
    switch (e.code) {
      case 'KeyE': AF.Player.interact(); break;
      case 'KeyF': I.vehicleKey(); break;
      case 'KeyR': if (G.build && G.build.on) { G.build.rot = (G.build.rot + 1) % 4; } else AF.Player.reload(); break;
      case 'KeyX': case 'ControlLeft': G.player.crouch = !G.player.crouch; break;
      case 'KeyB': if (G.build && G.build.on) AF.Build.stop(); else AF.UI.open('build'); break;
      case 'KeyL': G.player.lightOn = !G.player.lightOn; break;
      case 'Space': e.preventDefault(); I.attackPressed = true; break;
      default:
        if (/^Digit[1-6]$/.test(e.code)) G.player.sel = +e.code.slice(5) - 1;
    }
  });
  window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) I.keys[k] = false; });
  window.addEventListener('blur', () => { I.keys = {}; I.mouse.down = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && AF.state === 'game' && !AF.UI.openName && AF.G && !AF.G.player.dead) AF.UI.pauseMenu(); });

  I.vehicleKey = function () {
    const G = AF.G, p = G.player;
    if (p.veh) { AF.Player.exitVehicle(); return; }
    const v = G.vehicles.find(v => Math.hypot(v.x - p.x, v.y - p.y) < 70);
    if (v) AF.Player.vehicleAction(v, true);
  };

  function bindCanvas(cv) {
    cv.addEventListener('mousemove', e => { I.mouse.x = e.clientX; I.mouse.y = e.clientY; I.mouse.moved = performance.now(); });
    cv.addEventListener('mousedown', e => {
      AF.Audio.init();
      if (I.touchMode || AF.state !== 'game' || AF.UI.paused) return;
      const G = AF.G;
      if (e.button === 2) { if (G.build && G.build.on) G.build.rot = (G.build.rot + 1) % 4; return; }
      if (e.button !== 0) return;
      if (G.build && G.build.on) { AF.Build.place(); AF.UI.renderBuild(); return; }
      I.mouse.down = true; I.attackPressed = true;
    });
    window.addEventListener('mouseup', () => { I.mouse.down = false; });
    cv.addEventListener('contextmenu', e => e.preventDefault());
    cv.addEventListener('wheel', e => {
      if (AF.state !== 'game' || AF.UI.paused) return;
      const p = AF.G.player; p.sel = (p.sel + (e.deltaY > 0 ? 1 : 5)) % 6; e.preventDefault();
    }, { passive: false });
  }

  /* --- controlli touch --- */
  function bindTouch() {
    const zone = document.getElementById('tJoy'), knob = zone.querySelector('.knob'), base = zone.querySelector('.base');
    const J = I.joy;
    zone.addEventListener('pointerdown', e => {
      AF.Audio.init();
      J.id = e.pointerId; zone.setPointerCapture(e.pointerId);
      const r = zone.getBoundingClientRect();
      J.cx = e.clientX; J.cy = e.clientY;
      base.style.left = (e.clientX - r.left) + 'px'; base.style.top = (e.clientY - r.top) + 'px'; base.classList.add('on');
      J.x = J.y = 0;
    });
    zone.addEventListener('pointermove', e => {
      if (e.pointerId !== J.id) return;
      let dx = e.clientX - J.cx, dy = e.clientY - J.cy; const d = Math.hypot(dx, dy), R = 52;
      if (d > R) { dx = dx / d * R; dy = dy / d * R; }
      J.x = dx / R; J.y = dy / R;
      knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    });
    const end = e => { if (e.pointerId !== J.id) return; J.id = null; J.x = J.y = 0; knob.style.transform = ''; base.classList.remove('on'); };
    zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
    const hold = (id, on, off) => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', e => { e.preventDefault(); AF.Audio.init(); el.classList.add('down'); on(); });
      const up = () => { el.classList.remove('down'); off && off(); };
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up);
    };
    hold('tAttack', () => {
      const G = AF.G; if (!G || AF.UI.paused) return;
      if (G.build && G.build.on) { AF.Build.place(); AF.UI.renderBuild(); return; }
      I.tAttack = true; I.attackPressed = true;
    }, () => { I.tAttack = false; });
    hold('tInteract', () => { if (AF.G && !AF.UI.paused) AF.Player.interact(); });
    hold('tRun', () => { I.tRun = !I.tRun; document.getElementById('tRun').classList.toggle('lock', I.tRun); });
    hold('tCrouch', () => { if (AF.G) { AF.G.player.crouch = !AF.G.player.crouch; document.getElementById('tCrouch').classList.toggle('lock', AF.G.player.crouch); } });
    hold('tReload', () => { if (AF.G) { if (AF.G.build && AF.G.build.on) AF.G.build.rot = (AF.G.build.rot + 1) % 4; else AF.Player.reload(); } });
    hold('tVeh', () => { if (AF.G && !AF.UI.paused) I.vehicleKey(); });
  }

  // mira automatica per il touch
  function autoAim(p) {
    const wp = AF.Player.weapon();
    const range = wp.type === 'ranged' ? wp.rng * .9 : wp.type === 'throw' ? wp.rng : 110;
    let best = null, bs = 1e9;
    AF.Actors.query(p.x, p.y, range, []).forEach(a => {
      if (!AF.hostileToPlayer(a) && !(a.fac === 'prey')) return;
      const d = Math.hypot(a.x - p.x, a.y - p.y);
      const ang = Math.atan2(a.y - p.y, a.x - p.x);
      const score = d + Math.abs(U.angDiff(p.a, ang)) * 120;
      if (score < bs && AF.los(p.x, p.y, a.x, a.y)) { bs = score; best = a; }
    });
    if (best) { AF.G.aimWorld = { x: best.x, y: best.y }; return Math.atan2(best.y - p.y, best.x - p.x); }
    AF.G.aimWorld = null;
    return null;
  }

  I.read = function () {
    const G = AF.G, p = G.player;
    let mx = 0, my = 0;
    if (I.keys.left) mx--; if (I.keys.right) mx++; if (I.keys.up) my--; if (I.keys.down) my++;
    if (mx || my) { const l = Math.hypot(mx, my); mx /= l; my /= l; }
    if (I.joy.id !== null && (Math.abs(I.joy.x) > .08 || Math.abs(I.joy.y) > .08)) { mx = I.joy.x; my = I.joy.y; }
    I.moving = Math.hypot(mx, my) > .2;
    let aim = null;
    if (!I.touchMode) {
      I.pointerWorld = AF.Render.toWorld(I.mouse.x, I.mouse.y);
      // il personaggio guarda sempre il mouse (se il cursore è sopra di lui, tiene la direzione)
      const far = Math.hypot(I.pointerWorld.x - p.x, I.pointerWorld.y - p.y) > 14;
      aim = far ? Math.atan2(I.pointerWorld.y - p.y, I.pointerWorld.x - p.x) : p.a;
      G.aimWorld = I.pointerWorld;
      // a piedi si cammina solo in avanti, verso il mouse (W / freccia su)
      if (!p.veh) {
        if (I.keys.up) { mx = Math.cos(aim); my = Math.sin(aim); } else { mx = 0; my = 0; }
        I.moving = !!I.keys.up;
      }
    } else if (I.tAttack || I.attackPressed) aim = autoAim(p);
    const run = I.keys.run || I.tRun || (I.touchMode && Math.hypot(mx, my) > .96 && I.tRun);
    const out = { move: { x: mx, y: my }, run, aim, attack: I.mouse.down || I.tAttack, attackPressed: I.attackPressed };
    I.attackPressed = false;
    return out;
  };

  /* =====================================================================
     CICLO PRINCIPALE
     ===================================================================== */
  AF.state = 'menu';
  AF.fps = 60;
  let last = performance.now(), interT = 0, autoT = 150;

  function update(dt) {
    const G = AF.G;
    G.real += dt;
    const inp = I.read();
    AF.Player.update(dt, inp);
    AF.Actors.update(dt);
    AF.Actors.hear();
    AF.Proj.update(dt);
    AF.Proj.updateFires(dt);
    AF.Parts.update(dt);
    AF.Systems.update(dt);
    AF.Quests.updateRealtime(dt);
    interT -= dt;
    if (interT <= 0) { interT = .12; G.interact = AF.Player.findInteract(); }
    autoT -= dt;
    if (autoT <= 0) { autoT = 150; if (AF.Save.canManual() && !G.player.dead) { AF.Save.write('auto'); } }
  }

  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    AF.fps = AF.fps * .95 + (1 / Math.max(dt, .001)) * .05;
    if (AF.state === 'game' && AF.G) {
      const G = AF.G;
      if (!AF.UI.paused && !G.player.dead) update(dt);
      else if (AF.Radio.open) { AF.Radio.update(dt); }
      if (G.player.dead) { AF.Parts.update(dt); }
      AF.Render.draw(AF.UI.paused ? 0 : dt);
      AF.UI.tickMsgs(dt);
      AF.UI.updateHUD(dt);
      AF.UI.updateRadio();
    }
    requestAnimationFrame(frame);
  }

  /* =====================================================================
     AVVIO
     ===================================================================== */
  function boot() {
    AF.Settings.load();
    AF.Audio.setVolume(AF.Settings.data.vol, AF.Settings.data.amb);
    const cv = document.getElementById('game');
    AF.Render.init(cv);
    bindCanvas(cv);
    bindTouch();
    AF.UI.init();
    I.updateTouchMode();
    window.addEventListener('resize', () => { AF.Render.resize(); if (AF.UI.openName === 'map') AF.UI.renderMap(); });
    requestAnimationFrame(frame);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window.AF);

</script>
</body>
</html>
