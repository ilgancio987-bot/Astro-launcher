      rew.xp += 40;
    } else if (k === 'hunt') {
      q = { t: 'Caccia', d: 'Le scorte di carne scarseggiano.', obj: [{ type: 'kill', match: { type: ['deer', 'wolf', 'dog'] }, n: 3, text: 'Caccia 3 animali' }, { type: 'deliver', item: 'rawmeat', n: 3, npc: giver.npc, text: 'Porta 3 carne cruda a ' + giver.name }] };
    } else if (k === 'recover') {
      // un pacco in un contenitore lontano
      const cands = G.world.containers.filter(c => c.kind === 'crate' && !G.cont[c.id] && Math.hypot(c.x - G.player.x, c.y - G.player.y) > 900 && Math.hypot(c.x - G.player.x, c.y - G.player.y) < 3500);
      const c = U.pick(cands.length ? cands : G.world.containers.filter(x => x.kind === 'crate'));
      G.cont[c.id] = [AF.mkItem('package', 1)];
      q = { t: 'Recupero', d: 'Un corriere è sparito con un pacco. Ritrovalo.', obj: [{ type: 'cont', cont: c.id, item: 'package', text: 'Recupera il pacco sigillato' }, { type: 'deliver', item: 'package', n: 1, npc: giver.npc, text: 'Consegna il pacco a ' + giver.name }] };
      rew.xp += 50;
    } else {
      const unknown = Object.keys(G.pois).filter(p => !G.known[p] && !G.pois[p].hidden && !G.pois[p].area);
      const target = U.pick(unknown.length ? unknown : ['lakehut', 'heli', 'truckstop', 'hosp'].filter(p => G.pois[p]));
      q = { t: 'Esplorazione: ' + G.pois[target].n, d: 'Esplora ' + G.pois[target].n + ' e riferisci.', obj: [{ type: 'goto', poi: target, r: 8, text: 'Esplora ' + G.pois[target].n }, { type: 'talk', npc: giver.npc, text: 'Riferisci a ' + giver.name }] };
    }
    q.rew = rew; q.fac = fac; q.giver = giver.npc; q.gen = true;
    G.quests.gen[id] = q;
    return id;
  };

  /* =====================================================================
     RADIO
     ===================================================================== */
  const R = AF.Radio = { open: false, listen: 0, msgT: 0, idx: {}, shown: '' };
  R.stations = function () {
    const G = AF.G;
    const list = AF.RADIO.filter(s => s.always || G.flags[s.flag]);
    return list.concat(G.radioTemp || []);
  };
  R.boosted = () => AF.G.structs.some(s => AF.STRUCTS[s.type].radio && AF.Build.powered(s));
  R.signal = function (f) {
    let best = null, bs = 0;
    const width = R.boosted() ? .35 : .22;
    for (const s of R.stations()) { const d = Math.abs(s.f - f); const st = 1 - d / width; if (st > bs) { bs = st; best = s; } }
    return { s: bs > 0 ? best : null, strength: Math.max(0, bs) };
  };
  R.update = function (dt) {
    const G = AF.G;
    if (!R.open) { AF.Audio.updateAmbient(G.weather.wind, rainAmount(), 0); return; }
    const sig = R.signal(G.player.radioF);
    AF.Audio.updateAmbient(G.weather.wind, rainAmount(), (1 - sig.strength) * .9 + .1);
    if (sig.s && sig.strength > .45) {
      R.listen += dt;
      const s = sig.s;
      if (R.cur !== s.id) { R.cur = s.id; R.msgT = 0; R.listen = 0; AF.Audio.play('radio', .6); }
      R.msgT += dt;
      const msgs = s.msgs, i = R.idx[s.id] || 0;
      let m = msgs[i % msgs.length].replace('{weather}', 'previsto ' + AF.WEATHER[G.weather.next].n.toLowerCase());
      R.shown = m.slice(0, Math.floor(R.msgT * 28));
      if (R.msgT * 28 > m.length + 60) {
        R.idx[s.id] = i + 1; R.msgT = 0;
        if (!G.radioLog.some(l => l.m === m)) { G.radioLog.push({ s: s.n, f: s.f, m, d: G.time.day, h: AF.U.fmtTime(G.time.min) }); }
      }
      if (R.listen > 2) AF.Quests.event('radio', { f: s.f });
      if (s.mystery && R.listen > 7 && !G.flags.echo_signal) {
        G.flags.echo_signal = true; G.known.echo = 1;
        AF.msg('Decifri lo schema dei numeri: sono coordinate! Un luogo segreto è segnato sulla mappa.', 'quest');
        AF.Quests.start('echo');
      }
      if (s.quest && R.listen > 3 && !G.quests.active[s.quest] && !G.quests.done[s.quest]) { AF.Quests.start(s.quest); }
      if (s.cache && R.listen > 3 && !G.known['cache_' + s.cache]) { G.known['cache_' + s.cache] = 1; const c = G.contMap[s.cache]; G.markers.push({ x: c.x, y: c.y, n: 'Scorta nascosta' }); AF.msg('Coordinate annotate sulla mappa: scorta nascosta.', 'quest'); }
    } else { R.cur = null; R.listen = 0; R.shown = ''; }
  };
  function rainAmount() { const w = AF.G.weather; return (w.cur === 'rain' ? .7 : w.cur === 'storm' ? 1 : 0) * w.mix; }

  /* =====================================================================
     EVENTI CASUALI
     ===================================================================== */
  const E = AF.Events = {};
  E.update = function (dt) {
    const G = AF.G, p = G.player;
    if (p.dead || G.ended) return;
    G.events.t -= dt;
    if (G.events.t > 0) return;
    G.events.t = U.rnd(140, 260);
    const night = !G.isDay;
    const list = [
      ['ambush', G.rep.predoni <= -30 ? 1.2 : .3], ['merchant', 1], ['wounded', 1], ['animals', 1.2], ['collapse', S.indoors() ? 1.4 : .1],
      ['drop', .8], ['broadcast', 1], ['horde', night ? 1.6 : .6], ['storm', .5], ['signal', .7], ['distress', R.boosted() || INV.count(p.inv, 'radio') ? .8 : 0],
      ['raid', night && G.structs.length > 4 ? .8 : 0]
    ];
    const ev = U.weighted(list)[0];
    if (S.inSafeZone(p.x, p.y, 2) && ['ambush', 'horde', 'raid', 'collapse'].includes(ev)) return;
    E[ev] && E[ev]();
  };
  function spotNear(min, max) {
    const p = AF.G.player.veh || AF.G.player;
    for (let t = 0; t < 30; t++) {
      const a = Math.random() * 6.28, d = U.rnd(min, max), x = p.x + Math.cos(a) * d, y = p.y + Math.sin(a) * d;
      if (AF.freeAt(x, y, 16) && AF.tileAt(x, y) !== AF.T.WATER) return { x, y };
    }
    return null;
  }
  E.ambush = function () {
    const n = U.ri(2, 4); AF.msg('Imboscata! Senti delle voci tutt\'intorno...', 'bad'); AF.Audio.play('alert');
    for (let k = 0; k < n; k++) { const s = spotNear(300, 450); if (s) { const a = AF.Actors.make(U.pick(['bandit', 'raider']), s.x, s.y); a.state = 'CHASE'; a.target = AF.G.player; a.lastSeen = { x: AF.G.player.x, y: AF.G.player.y }; } }
  };
  E.horde = function () {
    const n = U.ri(4, 7); AF.msg('Un\'orda di infetti si avvicina!', 'bad'); AF.Audio.play('growl');
    const s0 = spotNear(500, 650); if (!s0) return;
    for (let k = 0; k < n; k++) { const a = AF.Actors.make(U.pick(['infected', 'infected', 'runner']), s0.x + U.rnd(-60, 60), s0.y + U.rnd(-60, 60)); a.state = 'SEARCH'; a.st = 30; a.lastSeen = { x: AF.G.player.x, y: AF.G.player.y }; }
  };
  E.animals = function () {
    const s = spotNear(350, 600); if (!s) return;
    if (Math.random() < .5) { for (let k = 0; k < U.ri(2, 4); k++) AF.Actors.make('deer', s.x + U.rnd(-40, 40), s.y + U.rnd(-40, 40)); AF.msg('Tracce fresche di cervi nelle vicinanze.'); }
    else { for (let k = 0; k < U.ri(2, 4); k++) AF.Actors.make('wolf', s.x + U.rnd(-40, 40), s.y + U.rnd(-40, 40)); AF.msg('Un ululato squarcia il silenzio.', 'warn'); AF.Audio.play('howl'); }
  };
  E.merchant = function () {
    const s = spotNear(200, 320); if (!s) return;
    const a = AF.Actors.make('guard', s.x, s.y, { n: 'Mercante errante', fac: 'sopr', npc: 'merchant', role: 'trader', persist: false });
    a.temp = true; AF.msg('Un mercante errante è nei paraggi.', 'good');
  };
  E.wounded = function () {
    const s = spotNear(220, 340); if (!s) return;
    const names = ['Tommaso', 'Giulia', 'Nadia', 'Ivo', 'Sara', 'Leo', 'Marta', 'Ettore'];
    const a = AF.Actors.make('guard', s.x, s.y, { n: U.pick(names) + ' (ferito)', fac: 'sopr', npc: 'wounded', role: 'wounded', persist: false, hp: 40 });
    a.hp = 18; a.bait = Math.random() < .3; a.temp = true;
    AF.msg('Senti qualcuno chiedere aiuto, poco lontano.', 'warn');
  };
  E.collapse = function () {
    const G = AF.G, p = G.player;
    AF.msg('Il soffitto cede! Calcinacci ovunque!', 'bad'); AF.Audio.play('boom', .6);
    AF.Parts.dust(p.x, p.y, 20); G.camShake = 10;
    AF.Player.damage(U.ri(6, 14), null, {});
    AF.makeNoise(p.x, p.y, 500, p);
    if (Math.random() < .6) AF.Bags.drop(p.x + U.rnd(-30, 30), p.y + U.rnd(-30, 30), [AF.mkItem(U.pick(['metal', 'glass', 'nails', 'comp']), U.ri(2, 4))]);
  };
  E.drop = function () {
    const G = AF.G, s = spotNear(500, 900); if (!s) return;
    const b = AF.Bags.drop(s.x, s.y, [AF.mkItem('mre', 1), AF.mkItem('water', 2), AF.mkItem(U.pick(['medkit', 'antibio', 'battery', 'ammo9']), U.ri(1, 3), { roll: true })], true);
    if (Math.random() < .25) G.cont[b.id].push(AF.mkItem(U.pick(['rifle', 'shotgun', 'vest', 'bigpack']), 1, { roll: true }));
    b.exp += 2000; b.drop = true;
    G.markers.push({ x: s.x, y: s.y, n: 'Rifornimento', t: 'drop' });
    AF.msg('Un aereo passa basso: un rifornimento è caduto nelle vicinanze (segnato sulla mappa).', 'quest');
    AF.Parts.dust(s.x, s.y, 10, 'rgba(200,90,60,');
    for (let k = 0; k < 3; k++) { const q = { x: s.x + U.rnd(-200, 200), y: s.y + U.rnd(-200, 200) }; if (AF.freeAt(q.x, q.y, 14)) AF.Actors.make(U.pick(['bandit', 'infected', 'raider']), q.x, q.y); }
  };
  E.broadcast = function () {
    const G = AF.G;
    const news = ['La Milizia segnala nubi luminose verso nord. Restate al chiuso.', 'Valle Quieta cerca medici e contadini. Ricompense in acqua pulita.', 'Avvistamento di un Bruto corazzato presso la zona industriale.', 'Il Culto annuncia: «Il Codice si ricompone. La Luce è vicina.»', 'Kane alza il pedaggio sull\'autostrada. Chi non paga, sparisce.'];
    const m = U.pick(news);
    G.radioLog.push({ s: 'Trasmissione', f: 0, m, d: G.time.day, h: U.fmtTime(G.time.min) });
    AF.msg('📻 ' + m); AF.Audio.play('radio', .5);
  };
  E.storm = function () { const G = AF.G; const b = G.world.b[Math.floor(G.player.y / TS) * W + Math.floor(G.player.x / TS)]; G.weather.next = b === 6 || Math.random() < .3 ? 'snow' : 'storm'; G.weather.t = U.rnd(60, 150); AF.msg('Il cielo si oscura in fretta. Sta arrivando una tempesta.', 'warn'); };
  E.signal = function () {
    const G = AF.G;
    const c = G.world.caches.find(id => !G.known['cache_' + id]);
    if (!c) return E.broadcast();
    const f = +(U.rnd(88.5, 107.5)).toFixed(1);
    G.radioTemp = (G.radioTemp || []).filter(s => !s.cache);
    G.radioTemp.push({ f, id: 'sig' + c, n: 'Segnale misterioso', msgs: ['...coordinate... ripeto... scorta nascosta... chi ascolta... [tono]'], cache: c, mystery: false });
    AF.msg('La radio gracchia: un segnale misterioso trasmette su ' + f.toFixed(1) + ' MHz.', 'quest'); AF.Audio.play('radio');
  };
  E.distress = function () {
    const G = AF.G;
    const qid = 'g' + (++G.quests.genN);
    const s = spotNear(900, 1500); if (!s) return;
    const fac = 'sopr';
    G.quests.gen[qid] = {
      t: 'Richiesta d\'aiuto', d: 'Una voce disperata via radio: un gruppo assediato da infetti.', fac, gen: true,
      obj: [{ type: 'goto', pos: s, r: 4, text: 'Raggiungi il luogo della richiesta d\'aiuto', onDone: () => { for (let k = 0; k < 4; k++) AF.Actors.make(U.pick(['infected', 'runner']), s.x + U.rnd(-120, 120), s.y + U.rnd(-120, 120)); AF.Bags.drop(s.x, s.y, [AF.mkItem('medkit', 1), AF.mkItem('ammo9', 12)]); } },
        { type: 'kill', match: { type: ['infected', 'runner'] }, n: 4, text: 'Elimina gli infetti' }],
      rew: { xp: 120, caps: 40, rep: { sopr: 8 } }
    };
    const f = +(U.rnd(88.5, 107.5)).toFixed(1);
    G.radioTemp = (G.radioTemp || []).filter(x => !x.quest);
    G.radioTemp.push({ f, id: 'sos' + qid, n: 'SOS', msgs: ['Aiuto! Siamo bloccati, gli infetti sono ovunque! Chiunque ascolti, vi prego!'], quest: qid });
    AF.msg('📻 Richiesta d\'aiuto captata su ' + f.toFixed(1) + ' MHz (apri la radio con Q).', 'quest');
  };
  E.raid = function (wake) {
    const G = AF.G, p = G.player;
    const base = G.structs.find(s => Math.hypot(s.x * TS - p.x, s.y * TS - p.y) < 500);
    if (!base) return;
    AF.msg(wake ? 'Ti svegli di soprassalto: la base è sotto attacco!' : 'Assalto alla base!', 'bad'); AF.Audio.play('alert');
    const n = U.ri(4, 7) + Math.floor(G.time.day / 3);
    for (let k = 0; k < n; k++) {
      const a = Math.random() * 6.28, x = base.x * TS + Math.cos(a) * 520, y = base.y * TS + Math.sin(a) * 520;
      if (!AF.freeAt(x, y, 14)) continue;
      const e = AF.Actors.make(U.pick(['infected', 'infected', 'runner', 'mutant', G.rep.predoni <= -30 ? 'raider' : 'infected']), x, y, { persist: false });
      e.state = 'CHASE'; e.target = p; e.lastSeen = { x: base.x * TS, y: base.y * TS };
    }
  };
})(window.AF);

</script>

        { type: 'goto', poi: 'echo', r: 7, text: 'Trova il Bunker Echo (segnato sulla mappa)' },

        { type: 'interact', id: 'echo_terminal', flag: 'echo_done', text: 'Accedi al terminale del Bunker Echo' }
      ],
      rew: { xp: 250 }

    /* ---------- Sopravvissuti ---------- */
    s_water: {
      t: 'Acqua per la Valle', fac: 'sopr', giver: 'bruno', kind: 'Raccolta',
      d: 'Il pozzo della Valle è contaminato. Bruno ha bisogno di acqua pulita (bollila o filtrala).',

    },

      d: 'Kane cederà il suo frammento a chi gli porta le piastrine di tre soldati della Milizia.',

      ],

  const Story = AF.Story = {};
  Story.special = function (id) {
    const G = G_(), p = G.player;
    switch (id) {
      case 'lab_terminal':
        if (G.flags.lab_done) { AF.msg('Il terminale ripete in loop: «Riequilibrio in corso».'); return; }
        G.flags.lab_done = true;
        AF.Player.give([['vdata', 1]]);
        AF.Audio.play('radio');
        AF.UI.showDoc({ t: 'Terminale VESPERO', kind: 'Dati', x: 'ACCESSO CONSENTITO — LIV. 4 (A. VARGA)\n\nProgetto VESPERO: catalizzatore atmosferico autoreplicante.\nControllo di dispersione: CUSTODE (Vault Zero).\nStato: AUTONOMO. Override umano: disabilitato.\n\nDownload completato. I dati sono cifrati con la chiave della stazione di Monte Corvo.\n\n[Una nuova frequenza si attiva in sottofondo: 88.8 MHz]' });
        for (let k = 0; k < 3; k++) AF.Actors.make('mutant', p.x + U.rnd(-300, 300), p.y + U.rnd(250, 400));
        break;
      case 'tower_console':
        if (G.flags.vault_known) { AF.msg('La console mostra le coordinate del Vault Zero.'); return; }
        if (!INV.count(p.inv, 'vdata')) { AF.msg('La console è attiva, ma non hai dati da decifrare.', 'warn'); return; }
        G.flags.vault_known = true; G.known.vault = 1; G.pois.vault.hidden = false;
        if (!G.docs.includes('custode')) G.docs.push('custode');
        AF.UI.showDoc({ t: 'Decifratura completata', kind: 'Dati', x: 'Chiave di Monte Corvo applicata.\n\nCOORDINATE VAULT ZERO: acquisite (segnate sulla mappa).\nAccesso: Codice AURORA in quattro frammenti.\n\nCustodi dei frammenti secondo l\'archivio Varga:\nα — Comando militare regionale (Base Ferro)\nβ — Cappella di San Michele, oggi «della Luce»\nγ — Sequestrato sull\'autostrada (Campo Asfalto)\nδ — Postazione di ascolto Echo (coordinate trasmesse su 107.1)' });
        AF.Audio.play('quest');
        break;
      case 'vault_core':
        if (G.ended) return;
        if (!AF.Quests.isActive('vault')) { AF.UI.endingChoice(); return; }
        G.quests.active.vault.i = 2;
        break;
      case 'echo_terminal':
        if (G.flags.echo_done) { AF.msg('Il terminale è vuoto.'); return; }
        G.flags.echo_done = true;
        AF.Player.give([['frag_d', 1]]);
        if (!G.docs.includes('echo')) G.docs.push('echo');
        AF.UI.showDoc(AF.DOCS.echo);
        break;
      case 'mil_safe': {
        if (G.flags.safe_open) { AF.msg('La cassaforte è vuota.'); return; }
        const seen = G.actors.some(a => a.fac === 'milizia' && a.hp > 0 && Math.hypot(a.x - p.x, a.y - p.y) < 380 * G.pvis + 40 && AF.los(a.x, a.y, p.x, p.y));
        if (G.rep.milizia >= 60) { AF.msg('Sei un alleato della Milizia: chiedi il frammento al Colonnello invece di rubarlo.'); return; }
        p.chan = { t: 0, max: 2.5, label: 'Forzi la cassaforte...', fn: () => {
          G.flags.safe_open = true;
          AF.Player.give([['frag_a', 1], ['ammo762', 20]]);
          if (seen) { AF.msg('Ti hanno visto! La Milizia ti dà la caccia!', 'bad'); AF.Factions.change('milizia', -60); G.actors.forEach(a => { if (a.fac === 'milizia') { a.angry = 300; a.state = 'CHASE'; a.target = p; a.lastSeen = { x: p.x, y: p.y }; } }); }
          else { AF.msg('Nessuno ti ha visto. Il frammento α è tuo.', 'good'); G.flags.stole_quiet = true; }
          AF.Quests.event('interact', { id: 'mil_safe' });
        } };
        if (seen) AF.msg('Attento: un soldato potrebbe vederti!', 'warn');
        return;
      }
    }
    AF.Quests.event('interact', { id });
  };

  Story.recruit = function (o) {
    const G = G_();
    if (G.companions.length >= 2) { AF.msg('Hai già due compagni.', 'warn'); return false; }
    const c = { id: 'cp' + (G.nextId++), n: o.n, type: o.type || 'guard', fac: o.fac || 'sopr', mode: 'follow', loyal: o.loyal != null ? o.loyal : Math.random(), hp: 120 };
    G.companions.push(c); AF.Actors.spawnCompanion(c);
    return true;
  };

  // i finali dipendono dalla reputazione e dalle scelte
  Story.endings = function () {
    const G = G_(), out = [];
    for (const k in AF.ENDINGS) {
      const e = AF.ENDINGS[k]; let ok = true, why = '';
      if (e.req) for (const f in e.req) if (G.rep[f] < e.req[f]) { ok = false; why = 'Serve reputazione ' + AF.FACTIONS[f].short + ' ≥ ' + e.req[f]; }
      if (k === 'dawn' && G.deadNpc.elena) { ok = false; why = 'Elena è morta.'; }
      if (k === 'order' && G.deadNpc.rinaldi) { ok = false; why = 'Rinaldi è morto.'; }
      if (k === 'ascend' && G.deadNpc.osvaldo) { ok = false; why = 'Osvaldo è morto.'; }
      out.push({ id: k, t: e.t, d: e.d, ok, why });
    }
    return out;
  };
  Story.epilogue = function (id) {
    const G = G_(), lines = [AF.ENDINGS[id].d];
    const R = G.rep;
    if (id !== 'exile') {
      if (G.deadNpc.elena) lines.push('Valle Quieta, senza Elena, si disperde nel giro di un inverno.');
      else if (R.sopr >= 30) lines.push('Valle Quieta prospera. I bambini imparano a leggere il tuo nome sulla lapide dei fondatori.');
      if (G.deadNpc.kane) lines.push('Senza Kane, i Predoni si sbranano tra loro e l\'autostrada torna libera.');
      else if (R.predoni >= 30) lines.push('Kane brinda a te ogni sera al Campo Asfalto. Il pedaggio, per te, non esiste più.');
      if (G.deadNpc.osvaldo) lines.push('La Cappella della Luce resta vuota. Le spore, lentamente, si spengono.');
      if (R.milizia <= -30) lines.push('La Milizia ti inserisce nella lista dei nemici dello Stato. Uno Stato che non esiste più.');
    }
    if (G.companions.length) lines.push(G.companions.map(c => c.n).join(' e ') + (G.companions.length > 1 ? ' restano' : ' resta') + ' al tuo fianco fino alla fine.');
    return lines;
  };

  };
  AF.Trade = {
    shop(npc) {
      const G = G_();
      G.flags.shops = G.flags.shops || {};
      let s = G.flags.shops[npc];
      if (!s || s.day !== G.time.day) {
        const def = SHOPS[npc] || SHOPS.merchant;
        const items = [];
        const n = U.ri(7, 11);
        for (let i = 0; i < n; i++) {
          const id = U.pick(def.pool), d = AF.ITEMS[id];
          if (d.s > 1) { const ex = items.find(x => x.id === id); const q = U.ri(1, Math.min(d.s, d.c === 'ammo' ? 30 : 5)); if (ex) ex.q = Math.min(d.s, ex.q + q); else items.push(AF.mkItem(id, q)); }
          else items.push(AF.mkItem(id, 1, { roll: Math.random() < .5 }));
        }
        s = G.flags.shops[npc] = { day: G.time.day, items, caps: U.ri(120, 260) };
      }
      return s;
    },
    fac(npc) { return (SHOPS[npc] || SHOPS.merchant).fac; },
    buyPrice(it, npc) { return Math.max(1, Math.round(AF.itemValue(it) * 1.3 * AF.Factions.priceMul(this.fac(npc)))); },
    sellPrice(it, npc) { const d = AF.ITEMS[it.id]; if (d.c === 'key' && !d.v) return 0; return Math.max(1, Math.round(AF.itemValue(it) * .55 / AF.Factions.priceMul(this.fac(npc)))); }
  };

    AF.UI.dialog(a, '«Ti prego... mi hanno sparato... ho bisogno di una benda...»', [
      { t: 'Dagli una benda', dis: !INV.count(p.inv, 'bandage'), fn: () => help('bandage') },
      { t: 'Dagli un kit medico', dis: !INV.count(p.inv, 'medkit'), fn: () => help('medkit') },
      { t: 'Perquisiscilo e lascialo lì', fn: () => { AF.Player.give([[U.pick(['beans', 'water', 'ammo9', 'cloth']), U.ri(1, 3)]]); AF.Factions.change('sopr', -5); a.hp = 0; AF.UI.closeAll(); } },
      { t: 'Non posso aiutarti.', fn: () => AF.UI.closeAll() }
    ]);
  };
  Dialog.companion = function (a) {
    const G = G_(), c = a.comp, p = G.player;
    AF.UI.dialog(a, '«' + (c.loyal > .6 ? 'Sono con te, capo.' : c.loyal > .3 ? 'Che si fa?' : 'Spero tu sappia cosa stai facendo...') + '» (Lealtà: ' + Math.round(c.loyal * 100) + '%)', [
      { t: 'Seguimi.', fn: () => { c.mode = 'follow'; AF.UI.closeAll(); } },
      { t: 'Vai alla base e sorvegliala.', fn: () => {
        const bed = G.structs.find(s => AF.STRUCTS[s.type].sleep) || G.structs[0];
        if (!bed) { AF.msg('Non hai ancora una base (costruisci un letto o una tenda).', 'warn'); return; }
        c.mode = 'base'; c.home = { x: bed.x * 32 + 16, y: bed.y * 32 + 40 }; a.home = c.home; AF.UI.closeAll(); AF.msg(c.n + ' sorveglierà la base e cercherà risorse ogni giorno.');
      } },
      { t: 'Prendi del cibo (+lealtà)', dis: !(INV.count(p.inv, 'beans') || INV.count(p.inv, 'cookmeat') || INV.count(p.inv, 'canmeat')), fn: () => {
        const id = ['cookmeat', 'canmeat', 'beans'].find(i => INV.count(p.inv, i)); INV.remove(p.inv, id, 1); c.loyal = Math.min(1, c.loyal + .2); a.hp = a.maxHp; Dialog.companion(a);
      } },
      { t: 'Le nostre strade si separano.', fn: () => { G.companions = G.companions.filter(x => x !== c); a.hp = 0; AF.UI.closeAll(); } },
      { t: 'Niente.', fn: () => AF.UI.closeAll() }
    ]);
  };
})(window.AF);

</script>
<script>
/* js/render.js */
/* =====================================================================
   AFTERFALL — render.js
   Disegno su Canvas: terreno a chunk, oggetti, creature, strutture,
   particelle, meteo, illuminazione dinamica, minimappa e mappa.
   ===================================================================== */
'use strict';
(function (AF) {
  const U = AF.U, TS = AF.TS, W = AF.W, H = AF.H, CH = AF.CH;
  const Rn = AF.Render = { cv: null, ctx: null, lc: null, lctx: null, scale: 1, cam: { x: 0, y: 0 }, rain: [], snow: [] };

  Rn.init = function (cv) {
    Rn.cv = cv; Rn.ctx = cv.getContext('2d', { alpha: false });
    Rn.lc = document.createElement('canvas'); Rn.lctx = Rn.lc.getContext('2d');
    Rn.resize();
    for (let i = 0; i < 220; i++) Rn.rain.push({ x: Math.random(), y: Math.random(), s: U.rnd(.7, 1.3) });
    for (let i = 0; i < 160; i++) Rn.snow.push({ x: Math.random(), y: Math.random(), s: U.rnd(.5, 1.5), p: Math.random() * 6 });
  };
  Rn.resize = function () {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = window.innerWidth, h = window.innerHeight;
    Rn.cv.width = Math.round(w * dpr); Rn.cv.height = Math.round(h * dpr);
    Rn.cv.style.width = w + 'px'; Rn.cv.style.height = h + 'px';
    const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    const base = U.clamp(Math.min(w, h) / 720, coarse ? .82 : .62, 1.15) * (AF.Settings.data.zoom || 1);
    Rn.scale = base * dpr; Rn.dpr = dpr;
    const lr = AF.Settings.data.lightRes || .5;
    Rn.lc.width = Math.ceil(Rn.cv.width * lr); Rn.lc.height = Math.ceil(Rn.cv.height * lr);
  };
  Rn.toWorld = function (sx, sy) {
    return { x: (sx * Rn.dpr - Rn.cv.width / 2) / Rn.scale + Rn.cam.x, y: (sy * Rn.dpr - Rn.cv.height / 2) / Rn.scale + Rn.cam.y };
  };
  Rn.toScreen = function (x, y) {
    return { x: ((x - Rn.cam.x) * Rn.scale + Rn.cv.width / 2) / Rn.dpr, y: ((y - Rn.cam.y) * Rn.scale + Rn.cv.height / 2) / Rn.dpr };
  };

  /* =====================================================================
     FRAME
     ===================================================================== */
  Rn.draw = function (dt) {
    const G = AF.G, c = Rn.ctx, cv = Rn.cv, p = G.player;
    const target = p.veh || p;
    const look = p.veh ? 70 : 0;
    Rn.cam.x += (target.x + Math.cos(p.a) * look - Rn.cam.x) * Math.min(1, dt * 8);
    Rn.cam.y += (target.y + Math.sin(p.a) * look - Rn.cam.y) * Math.min(1, dt * 8);
    let sx = 0, sy = 0;
    if (G.camShake > 0) { sx = U.rnd(-1, 1) * G.camShake; sy = U.rnd(-1, 1) * G.camShake; G.camShake = Math.max(0, G.camShake - dt * 30); }
    const vw = cv.width / Rn.scale, vh = cv.height / Rn.scale;
    const x0 = Rn.cam.x - vw / 2, y0 = Rn.cam.y - vh / 2;
    Rn.view = { x0, y0, x1: x0 + vw, y1: y0 + vh };
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#0b0d0c'; c.fillRect(0, 0, cv.width, cv.height);
    c.setTransform(Rn.scale, 0, 0, Rn.scale, -(x0 - sx) * Rn.scale, -(y0 - sy) * Rn.scale);
    c.imageSmoothingEnabled = false;

    // terreno
    const cs = CH * TS;
    const cx0 = Math.max(0, Math.floor(x0 / cs)), cx1 = Math.min(W / CH - 1, Math.floor((x0 + vw) / cs));
    const cy0 = Math.max(0, Math.floor(y0 / cs)), cy1 = Math.min(H / CH - 1, Math.floor((y0 + vh) / cs));
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) c.drawImage(G.chunks.get(cx, cy), cx * cs, cy * cs);
    c.imageSmoothingEnabled = true;

    const inView = (x, y, m) => x > x0 - m && x < x0 + vw + m && y > y0 - m && y < y0 + vh + m;
    const t = G.real;

    // decalcomanie
    for (const d of G.decals) {
      if (!inView(d.x, d.y, 30)) continue;
      c.globalAlpha = Math.min(1, d.t / 20) * .55;
      c.fillStyle = d.kind === 'scorch' ? '#141210' : d.kind === 'oil' ? '#1c2226' : '#3b0f0f';
      c.beginPath(); c.ellipse(d.x, d.y, d.r, d.r * .6, d.a, 0, 7); c.fill();
    }
    c.globalAlpha = 1;

    // pavimenti
    G.fgrid.forEach(s => { const x = s.x * TS, y = s.y * TS; if (inView(x, y, 40)) drawFloor(c, s, x, y); });

    // zone di spore
    for (const z of G.world.hazards) {
      if (!inView(z.x, z.y, z.r + 20)) continue;
      const gr = c.createRadialGradient(z.x, z.y, 4, z.x, z.y, z.r);
      gr.addColorStop(0, 'rgba(170,120,220,.35)'); gr.addColorStop(1, 'rgba(120,200,120,0)');
      c.fillStyle = gr; c.beginPath(); c.arc(z.x + Math.sin(t + z.x) * 6, z.y, z.r, 0, 7); c.fill();
      if (Math.random() < dt * 6) AF.Parts.add('smoke', z.x + U.rnd(-z.r, z.r) * .6, z.y + U.rnd(-z.r, z.r) * .6, 0, -6, 2, 5, 'rgba(190,150,230,');
    }

    // tile visibili: nodi e contenitori
    const tx0 = Math.max(0, Math.floor(x0 / TS) - 1), tx1 = Math.min(W - 1, Math.floor((x0 + vw) / TS) + 1);
    const ty0 = Math.max(0, Math.floor(y0 / TS) - 1), ty1 = Math.min(H - 1, Math.floor((y0 + vh) / TS) + 2);
    const trees = [];
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      const k = ty * W + tx;
      const nid = G.ngrid[k];
      if (nid >= 0) { const n = G.world.nodes[nid]; if (n.t === 'tree' || n.t === 'pine') trees.push(n); else drawNode(c, n); }
      const cont = G.cgrid.get(k);
      if (cont) drawContainer(c, cont);
    }
    for (const b of G.bags) if (inView(b.x, b.y, 30)) drawBag(c, b, t);
    for (const d of G.world.docs) if (inView(d.x, d.y, 20)) drawDoc(c, d, t);
    for (const s of G.world.specials) if (inView(s.x, s.y, 30)) drawSpecial(c, s, t);
    for (const cp of G.world.camps) if (inView(cp.x, cp.y, 40)) drawCamp(c, cp, t);
    for (const d of G.world.decor) if (inView(d.x, d.y, 120)) drawDecor(c, d);

    // strutture
    G.sgrid.forEach(s => { const x = s.x * TS, y = s.y * TS; if (inView(x, y, 40)) drawStruct(c, s, x, y, t); });

    // veicoli
    for (const v of G.vehicles) if (inView(v.x, v.y, 60)) drawVehicle(c, v, p.veh === v);

    // attori
    for (const a of G.actors) if (inView(a.x, a.y, 40)) drawActor(c, a, t);
    if (!p.veh && !p.dead) drawPlayer(c, p, t);
    if (p.dead) { c.fillStyle = '#3b0f0f'; c.beginPath(); c.ellipse(p.x, p.y, 14, 9, 0, 0, 7); c.fill(); }

    // proiettili
    for (const b of G.proj) {
      if (b.kind === 'throw') {
        c.fillStyle = '#c8b27a'; c.beginPath(); c.arc(b.x, b.y - Math.sin(Math.min(1, b.life / 200) * Math.PI) * 8, 4, 0, 7); c.fill();
        continue;
      }
      c.strokeStyle = b.kind === 'laser' ? '#ff4a5a' : b.kind === 'arrow' ? '#d8c8a0' : 'rgba(255,230,160,.9)';
      c.lineWidth = b.kind === 'laser' ? 2.5 : b.kind === 'arrow' ? 2 : 1.6;
      c.beginPath(); c.moveTo(b.px, b.py); c.lineTo(b.x, b.y); c.stroke();
    }

    // chiome degli alberi (sopra le creature)
    for (const n of trees) drawTree(c, n, p, t);

    // particelle
    drawParticles(c);

    // fantasma della costruzione
    if (G.build && G.build.on) drawGhost(c);

    // evidenziazione interazione
    if (G.interact && G.interact.x != null && !p.veh) {
      c.strokeStyle = 'rgba(232,196,104,' + (.5 + Math.sin(t * 6) * .3) + ')'; c.lineWidth = 1.5;
      c.beginPath(); c.arc(G.interact.x, G.interact.y, 18, 0, 7); c.stroke();
    }

    // indicatore obiettivo nel mondo
    const qt = G.quests.track && AF.Quests.target(G.quests.track);
    if (qt && inView(qt.x, qt.y, 0)) {
      c.fillStyle = '#e8c468'; c.save(); c.translate(qt.x, qt.y - 30 + Math.sin(t * 3) * 4); c.rotate(Math.PI / 4);
      c.fillRect(-6, -6, 12, 12); c.restore();
    }

    // meteo e luce (spazio schermo)
    c.setTransform(1, 0, 0, 1, 0, 0);
    drawWeather(c, dt);
    drawLighting(c, x0 - sx, y0 - sy);
    // vignetta e danno
    const vg = c.createRadialGradient(cv.width / 2, cv.height / 2, cv.height * .3, cv.width / 2, cv.height / 2, cv.height * .85);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
    c.fillStyle = vg; c.fillRect(0, 0, cv.width, cv.height);
    if (p.hurtT > 0 || p.hp < 25) {
      const a = Math.max(p.hurtT * 1.4, p.hp < 25 ? (.25 + Math.sin(t * 4) * .1) * (1 - p.hp / 25) : 0);
      const rg = c.createRadialGradient(cv.width / 2, cv.height / 2, cv.height * .25, cv.width / 2, cv.height / 2, cv.height * .8);
      rg.addColorStop(0, 'rgba(120,0,0,0)'); rg.addColorStop(1, 'rgba(150,10,10,' + Math.min(.7, a) + ')');
      c.fillStyle = rg; c.fillRect(0, 0, cv.width, cv.height);
    }
    if (p.cond.hypo) { c.fillStyle = 'rgba(140,190,230,.12)'; c.fillRect(0, 0, cv.width, cv.height); }
    if (p.cond.poison) { c.fillStyle = 'rgba(110,160,60,' + (.06 + Math.sin(t * 2) * .04) + ')'; c.fillRect(0, 0, cv.width, cv.height); }
    if (G.weather.flash > 0) { c.fillStyle = 'rgba(220,230,255,' + G.weather.flash * 1.6 + ')'; c.fillRect(0, 0, cv.width, cv.height); }
    // freccia verso l'obiettivo fuori schermo
    if (qt && !inView(qt.x, qt.y, -40)) drawEdgeArrow(c, qt);
  };

  /* =====================================================================
     ELEMENTI
     ===================================================================== */
  function shadow(c, x, y, rx, ry) { c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 7); c.fill(); }

  function drawFloor(c, s, x, y) {
    c.fillStyle = '#6d5236'; c.fillRect(x, y, TS, TS);
    c.fillStyle = 'rgba(0,0,0,.2)'; c.fillRect(x, y + 10, TS, 1); c.fillRect(x, y + 21, TS, 1); c.fillRect(x, y, 1, TS);
  }
  function drawNode(c, n) {
    const x = n.x * TS + 16, y = n.y * TS + 16, h = AF.hash2(n.x, n.y, 3);
    if (n.t === 'rock' || n.t === 'ore') {
      shadow(c, x + 2, y + 8, 14, 6);
      c.fillStyle = n.t === 'ore' ? '#6b6157' : '#7b7a76';
      c.beginPath(); c.moveTo(x - 13, y + 6); c.lineTo(x - 9, y - 9); c.lineTo(x + 4, y - 12); c.lineTo(x + 13, y - 2); c.lineTo(x + 10, y + 8); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,255,255,.12)'; c.beginPath(); c.moveTo(x - 9, y - 9); c.lineTo(x + 4, y - 12); c.lineTo(x, y - 3); c.closePath(); c.fill();
      if (n.t === 'ore') { c.fillStyle = '#c99a5a'; c.fillRect(x - 4, y - 2, 3, 3); c.fillRect(x + 5, y + 1, 3, 2); }
    } else if (n.t === 'bush') {
      shadow(c, x, y + 7, 12, 5);
      c.fillStyle = '#3d5a2c'; c.beginPath(); c.arc(x - 5, y, 8, 0, 7); c.arc(x + 5, y + 1, 8, 0, 7); c.arc(x, y - 5, 8, 0, 7); c.fill();
      c.fillStyle = n.sub === 'berries' ? '#6a4cc0' : n.sub === 'herbs' ? '#9cc070' : '#d8c8a8';
      for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(x - 6 + AF.hash2(n.x + i, n.y, 1) * 12, y - 6 + AF.hash2(n.x, n.y + i, 1) * 10, 2, 0, 7); c.fill(); }
    } else if (n.t === 'scrap') {
      shadow(c, x, y + 6, 14, 5);
      c.fillStyle = '#5d5a55'; c.fillRect(x - 12, y - 4, 14, 9);
      c.fillStyle = '#7d6a55'; c.save(); c.translate(x + 3, y); c.rotate(.5 + h); c.fillRect(-8, -3, 16, 6); c.restore();
      c.fillStyle = '#8a8f93'; c.fillRect(x - 3, y - 8, 4, 10);
    }
  }
  function drawTree(c, n, p, t) {
    const x = n.x * TS + 16, y = n.y * TS + 16, h = AF.hash2(n.x, n.y, 7);
    const near = Math.abs(p.x - x) < 34 && p.y < y + 4 && p.y > y - 40;
    c.globalAlpha = near ? .45 : 1;
    const sway = Math.sin(t * 1.2 + h * 9) * 1.5 * (AF.G.weather.wind + .2);
    if (n.t === 'pine') {
      shadow(c, x + 6, y + 10, 16, 7);
      c.fillStyle = '#4a3a2a'; c.fillRect(x - 2, y, 4, 10);
      c.fillStyle = '#23402f'; c.beginPath(); c.moveTo(x + sway, y - 30); c.lineTo(x - 16, y + 4); c.lineTo(x + 16, y + 4); c.fill();
      c.fillStyle = '#2d5038'; c.beginPath(); c.moveTo(x + sway, y - 34); c.lineTo(x - 11, y - 8); c.lineTo(x + 11, y - 8); c.fill();
      if (AF.G.world.b[n.y * W + n.x] === 6) { c.fillStyle = 'rgba(230,235,240,.7)'; c.beginPath(); c.moveTo(x + sway, y - 34); c.lineTo(x - 6, y - 20); c.lineTo(x + 6, y - 20); c.fill(); }
    } else {
      const bi = AF.G.world.b[n.y * W + n.x];
      const dead = (bi === 2 || bi === 11 || bi === 4) && h > .4;
      shadow(c, x + 8, y + 10, 20, 8);
      c.fillStyle = '#4b3826'; c.fillRect(x - 3, y - 4, 6, 14);
      if (dead) {
        c.strokeStyle = '#4b3826'; c.lineWidth = 3; c.beginPath();
        c.moveTo(x, y - 4); c.lineTo(x - 12 + sway, y - 20); c.moveTo(x, y - 6); c.lineTo(x + 10 + sway, y - 24); c.moveTo(x, y - 4); c.lineTo(x + sway, y - 28); c.stroke();
      } else {
        const r = 15 + h * 6, g1 = bi === 0 ? '#284022' : '#3a4a2a', g2 = bi === 0 ? '#335229' : '#4a5a32';
        c.fillStyle = g1; c.beginPath(); c.arc(x + sway, y - 12, r, 0, 7); c.fill();
        c.fillStyle = g2; c.beginPath(); c.arc(x - 4 + sway, y - 16, r * .62, 0, 7); c.fill();
        c.fillStyle = 'rgba(255,255,255,.05)'; c.beginPath(); c.arc(x - 6 + sway, y - 19, r * .3, 0, 7); c.fill();
      }
    }
    c.globalAlpha = 1;
  }
  function drawContainer(c, o) {
    const G = AF.G;
    if (o.hidden && !G.known['cache_' + o.id]) return;
    const x = o.x, y = o.y;
    const empty = G.cont[o.id] && !G.cont[o.id].some(Boolean);
    if (o.kind === 'wreck') {
      c.save(); c.translate(x, y); c.rotate(o.a || 0);
      shadow(c, 3, 5, 26, 14);
      c.fillStyle = '#4b4743'; c.fillRect(-24, -12, 48, 24);
      c.fillStyle = '#6b5a48'; c.fillRect(-20, -10, 40, 20);
      c.fillStyle = '#24292b'; c.fillRect(-8, -9, 14, 18);
      c.fillStyle = '#3d2a1e'; c.fillRect(10, -10, 4, 4); c.fillRect(-16, 6, 6, 4);
      c.restore(); return;
    }
    shadow(c, x + 2, y + 9, 13, 5);
    if (o.kind === 'locker') { c.fillStyle = '#5b6a72'; c.fillRect(x - 9, y - 14, 18, 24); c.fillStyle = '#3d474c'; c.fillRect(x - 1, y - 12, 2, 20); }
    else if (o.kind === 'cache') { c.fillStyle = '#3e5a3a'; c.fillRect(x - 12, y - 8, 24, 16); c.fillStyle = '#e8c468'; c.fillRect(x - 2, y - 3, 4, 4); }
    else {
      c.fillStyle = empty ? '#4f4334' : '#7a5c3a'; c.fillRect(x - 12, y - 9, 24, 17);
      c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(x - 12, y - 2, 24, 2); c.fillRect(x - 1, y - 9, 2, 17);
      c.fillStyle = 'rgba(255,255,255,.1)'; c.fillRect(x - 12, y - 9, 24, 2);
    }
  }
  function drawBag(c, b, t) {
    shadow(c, b.x, b.y + 6, 9, 4);
    c.fillStyle = b.drop ? '#7a8a5a' : '#6b5a3a'; c.beginPath(); c.arc(b.x, b.y, 8, 0, 7); c.fill();
    c.fillStyle = '#4a3c26'; c.fillRect(b.x - 2, b.y - 10, 4, 4);
    if (b.drop) { c.fillStyle = 'rgba(220,90,60,.6)'; c.beginPath(); c.arc(b.x, b.y - 18 - Math.sin(t * 4) * 3, 3, 0, 7); c.fill(); if (Math.random() < .2) AF.Parts.add('smoke', b.x, b.y - 10, U.rnd(-4, 4), -30, 2.5, 5, 'rgba(210,90,60,'); }
  }
  function drawDoc(c, d, t) {
    const read = d.id !== 'note' && AF.G.docs.includes(d.id);
    c.save(); c.translate(d.x, d.y); c.rotate(.2);
    c.fillStyle = read ? '#a9a39a' : '#e6dcc4'; c.fillRect(-6, -8, 12, 15);
    c.fillStyle = 'rgba(0,0,0,.35)'; for (let i = 0; i < 4; i++) c.fillRect(-4, -5 + i * 3, 8, 1);
    c.restore();
    if (!read) { c.fillStyle = 'rgba(232,196,104,' + (.4 + Math.sin(t * 3) * .3) + ')'; c.beginPath(); c.arc(d.x, d.y - 16, 2.5, 0, 7); c.fill(); }
  }
  function drawSpecial(c, s, t) {
    shadow(c, s.x, s.y + 10, 14, 5);
    if (s.id === 'mil_safe') { c.fillStyle = '#3b4247'; c.fillRect(s.x - 11, s.y - 12, 22, 22); c.fillStyle = '#9aa4aa'; c.beginPath(); c.arc(s.x, s.y - 1, 5, 0, 7); c.fill(); return; }
    if (s.id === 'vault_core') {
      const r = 18 + Math.sin(t * 2) * 3;
      const gr = c.createRadialGradient(s.x, s.y, 2, s.x, s.y, r * 2); gr.addColorStop(0, 'rgba(255,80,90,.9)'); gr.addColorStop(1, 'rgba(255,80,90,0)');
      c.fillStyle = gr; c.beginPath(); c.arc(s.x, s.y, r * 2, 0, 7); c.fill();
      c.fillStyle = '#1b1d20'; c.beginPath(); c.arc(s.x, s.y, 14, 0, 7); c.fill(); c.fillStyle = '#ff4a5a'; c.beginPath(); c.arc(s.x, s.y, 6, 0, 7); c.fill();
      return;
    }
    c.fillStyle = '#2e3438'; c.fillRect(s.x - 12, s.y - 12, 24, 20);
    c.fillStyle = (Math.sin(t * 5) > 0) ? '#5fd6a0' : '#3a9a70'; c.fillRect(s.x - 9, s.y - 9, 18, 10);
    c.fillStyle = '#20262a'; c.fillRect(s.x - 10, s.y + 3, 20, 3);

      c.strokeStyle = b.mode === 'demolish' ? '#ff6a5a' : '#6ad08a'; c.lineWidth = 2; c.setLineDash([5, 4]); c.strokeRect(x + 1, y + 1, TS - 2, TS - 2); c.setLineDash([]);
      return;
    }
    const err = AF.Build.check(b.type, g.x, g.y), cost = AF.Build.costOk(b.type);
    const ok = !err && cost.ok;
    // griglia intorno
    c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 1;
    for (let j = -3; j <= 3; j++) for (let i = -3; i <= 3; i++) c.strokeRect(x + i * TS, y + j * TS, TS, TS);
    c.globalAlpha = .55;
    if (b.type === 'floor') drawFloor(c, null, x, y); else drawStruct(c, { type: b.type, x: g.x, y: g.y, rot: b.rot, hp: 1, maxHp: 1, fuel: 0 }, x, y, 0);
    c.globalAlpha = 1;
    c.fillStyle = ok ? 'rgba(90,210,130,.25)' : 'rgba(230,80,70,.3)'; c.fillRect(x, y, TS, TS);
    c.strokeStyle = ok ? '#6ad08a' : '#ff6a5a'; c.lineWidth = 2; c.strokeRect(x + 1, y + 1, TS - 2, TS - 2);
    // freccia di rotazione
    c.save(); c.translate(x + 16, y + 16); c.rotate(b.rot * Math.PI / 2); c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.moveTo(12, 0); c.lineTo(6, -4); c.lineTo(6, 4); c.fill(); c.restore();
  }
  function drawParticles(c) {
    const G = AF.G;
    for (const q of G.parts) {
      const a = q.life / q.max;
      if (q.type === 'blood') { c.fillStyle = q.col; c.globalAlpha = a; c.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size); }
      else if (q.type === 'spark') { c.fillStyle = q.col; c.globalAlpha = a; c.fillRect(q.x, q.y, 2, 2); }
      else if (q.type === 'smoke') { c.fillStyle = q.col + (a * .45) + ')'; c.globalAlpha = 1; c.beginPath(); c.arc(q.x, q.y, q.size, 0, 7); c.fill(); }
      else if (q.type === 'fire') { c.globalAlpha = a; c.fillStyle = a > .6 ? '#ffd27a' : a > .3 ? '#ff8a3a' : '#a03a1a'; c.beginPath(); c.arc(q.x, q.y, q.size * (.5 + a * .5), 0, 7); c.fill(); }
      else if (q.type === 'flash') { c.globalAlpha = a; c.fillStyle = q.col; c.beginPath(); c.arc(q.x, q.y, q.size, 0, 7); c.fill(); }
    }
    c.globalAlpha = 1;
  }
  function drawWeather(c, dt) {
    const G = AF.G, w = G.weather, cv = Rn.cv;
    const k = w.mix;
    if (k <= .02) return;
    const bi = G.world.b[Math.floor(G.player.y / TS) * W + Math.floor(G.player.x / TS)];
    const snowing = w.cur === 'snow' || ((w.cur === 'rain' || w.cur === 'storm') && bi === 6);
    if ((w.cur === 'rain' || w.cur === 'storm') && !snowing) {
      const n = Math.floor(Rn.rain.length * k * (w.cur === 'storm' ? 1 : .6) * AF.Settings.data.parts);
      c.strokeStyle = 'rgba(170,190,210,.35)'; c.lineWidth = 1.2 * Rn.dpr; c.beginPath();
      const slant = w.cur === 'storm' ? .35 : .18;
      for (let i = 0; i < n; i++) {
        const d = Rn.rain[i];
        d.y += dt * 1.6 * d.s; d.x += dt * slant * d.s; if (d.y > 1) { d.y = 0; d.x = Math.random(); }
        if (d.x > 1) d.x -= 1;
        const x = d.x * cv.width, y = d.y * cv.height;
        c.moveTo(x, y); c.lineTo(x + slant * 30 * Rn.dpr, y + 22 * Rn.dpr * d.s);
      }
      c.stroke();
      c.fillStyle = 'rgba(40,60,80,' + .12 * k + ')'; c.fillRect(0, 0, cv.width, cv.height);
    }
    if (snowing) {
      const n = Math.floor(Rn.snow.length * k * AF.Settings.data.parts);
      c.fillStyle = 'rgba(240,245,250,.8)';
      for (let i = 0; i < n; i++) {
        const d = Rn.snow[i];
        d.y += dt * .12 * d.s; d.p += dt; d.x += Math.sin(d.p) * dt * .02 + dt * .03 * G.weather.wind;
        if (d.y > 1) { d.y = 0; d.x = Math.random(); } if (d.x > 1) d.x -= 1;
        c.fillRect(d.x * cv.width, d.y * cv.height, 2.5 * d.s * Rn.dpr, 2.5 * d.s * Rn.dpr);
      }
      c.fillStyle = 'rgba(220,230,240,' + .08 * k + ')'; c.fillRect(0, 0, cv.width, cv.height);
    }
    if (w.cur === 'fog') {
      const t = G.real * .03;
      for (let i = 0; i < 5; i++) {
        const x = ((Math.sin(t + i * 1.7) * .5 + .5)) * cv.width, y = ((Math.cos(t * .8 + i * 2.3) * .5 + .5)) * cv.height;
        const r = cv.height * (.5 + i * .08);
        const gr = c.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(180,185,180,' + .28 * k + ')'); gr.addColorStop(1, 'rgba(180,185,180,0)');
        c.fillStyle = gr; c.fillRect(0, 0, cv.width, cv.height);
      }
      c.fillStyle = 'rgba(160,165,160,' + .18 * k + ')'; c.fillRect(0, 0, cv.width, cv.height);
    }
  }
  function drawLighting(c, x0, y0) {
    const G = AF.G, lc = Rn.lc, l = Rn.lctx, p = G.player;
    const dark = 1 - G.light;
    if (dark < .04) return;
    const lr = lc.width / Rn.cv.width, s = Rn.scale * lr;
    l.globalCompositeOperation = 'source-over';
    l.clearRect(0, 0, lc.width, lc.height);
    l.fillStyle = 'rgba(4,7,16,' + Math.min(.94, dark * 1.02) + ')'; l.fillRect(0, 0, lc.width, lc.height);
    l.globalCompositeOperation = 'destination-out';
    const light = (x, y, r, a) => {
      const sx = (x - x0) * s, sy = (y - y0) * s, sr = r * s;
      if (sx < -sr || sy < -sr || sx > lc.width + sr || sy > lc.height + sr) return;
      const g = l.createRadialGradient(sx, sy, 0, sx, sy, sr);
      g.addColorStop(0, 'rgba(0,0,0,' + (a || 1) + ')'); g.addColorStop(.6, 'rgba(0,0,0,' + (a || 1) * .55 + ')'); g.addColorStop(1, 'rgba(0,0,0,0)');
      l.fillStyle = g; l.beginPath(); l.arc(sx, sy, sr, 0, 7); l.fill();
    };
    const pp = p.veh || p;
    light(pp.x, pp.y, 75, .55);
    const hr = AF.Player.lightRadius();
    if (hr && !p.veh) { light(p.x + Math.cos(p.a) * hr * .3, p.y + Math.sin(p.a) * hr * .3, hr, 1); }
    if (p.veh && p.veh.fuel > 0 && !p.veh.broken) light(p.veh.x + Math.cos(p.veh.a) * 120, p.veh.y + Math.sin(p.veh.a) * 120, 150, 1);
    for (const s of G.structs) {
      const sd = AF.STRUCTS[s.type]; if (!sd.light) continue;
      if (s.type === 'campfire' && !(s.fuel > 0)) continue;
      if (sd.power && !AF.Build.powered(s)) continue;
      light(s.x * TS + 16, s.y * TS + 16, sd.light * (s.type === 'campfire' || s.type === 'torchpost' ? 1 + Math.sin(G.real * 9 + s.id) * .04 : 1), 1);
    }
    for (const cp of G.world.camps) if (!cp.wild) light(cp.x, cp.y, 220, 1);
    for (const sp of G.world.specials) light(sp.x, sp.y, 70, .6);
    if (G.fires) for (const f of G.fires) light(f.x, f.y, f.r * 2.2, 1);
    if (G.flashes) for (const f of G.flashes) light(f.x, f.y, f.r || 120, 1);
    for (const a of G.actors) if (a.d.shape === 'mutant' || a.d.shape === 'robot') light(a.x, a.y, 40, .5);
    for (const z of G.world.hazards) light(z.x, z.y, z.r * 1.2, .35);
    c.drawImage(lc, 0, 0, Rn.cv.width, Rn.cv.height);
    // bagliore caldo additivo dei fuochi
    c.globalCompositeOperation = 'lighter';
    const warm = (x, y, r) => {
      const sx = (x - x0) * Rn.scale, sy = (y - y0) * Rn.scale, sr = r * Rn.scale;
      if (sx < -sr || sy < -sr || sx > Rn.cv.width + sr || sy > Rn.cv.height + sr) return;
      const g = c.createRadialGradient(sx, sy, 0, sx, sy, sr); g.addColorStop(0, 'rgba(255,140,50,' + .18 * dark + ')'); g.addColorStop(1, 'rgba(255,140,50,0)');
      c.fillStyle = g; c.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
    };
    for (const s of G.structs) if ((s.type === 'campfire' && s.fuel > 0) || s.type === 'torchpost') warm(s.x * TS + 16, s.y * TS + 16, 140);
    for (const cp of G.world.camps) if (!cp.wild) warm(cp.x, cp.y, 150);
    if (hr && AF.ITEMS[AF.Player.held().id].burn && !p.veh) warm(p.x, p.y, 110);
    c.globalCompositeOperation = 'source-over';
  }
  function drawEdgeArrow(c, t) {
    const cv = Rn.cv, sp = Rn.toScreen(t.x, t.y);
    const cx = cv.width / 2, cy = cv.height / 2;
    const ang = Math.atan2(sp.y * Rn.dpr - cy, sp.x * Rn.dpr - cx);
    const m = 46 * Rn.dpr;
    const rx = cx - m, ry = cy - m;
    const k = Math.min(Math.abs(rx / Math.cos(ang)), Math.abs(ry / Math.sin(ang)));
    const x = cx + Math.cos(ang) * k, y = cy + Math.sin(ang) * k;

    c.fillStyle = 'rgba(232,196,104,.9)'; c.beginPath(); c.moveTo(14 * Rn.dpr, 0); c.lineTo(-8 * Rn.dpr, -9 * Rn.dpr); c.lineTo(-4 * Rn.dpr, 0); c.lineTo(-8 * Rn.dpr, 9 * Rn.dpr); c.fill();
    c.restore();
    const d = Math.round(Math.hypot(t.x - AF.G.player.x, t.y - AF.G.player.y) / TS);
    c.font = (11 * Rn.dpr) + 'px "IBM Plex Mono", monospace'; c.textAlign = 'center'; c.fillStyle = 'rgba(232,196,104,.95)';
    c.fillText(d + 'm', x - Math.cos(ang) * 26 * Rn.dpr, y - Math.sin(ang) * 26 * Rn.dpr + 4);
  }

  /* =====================================================================
     MINIMAPPA E MAPPA
     ===================================================================== */
  Rn.drawMinimap = function (cv) {
    const G = AF.G, c = cv.getContext('2d'), p = G.player.veh || G.player;
    const S = cv.width, R = 34 + AF.Player.sk('percept') * 8;
    const px = p.x / TS, py = p.y / TS, k = S / (R * 2);
    c.fillStyle = '#0d100f'; c.fillRect(0, 0, S, S);
    c.imageSmoothingEnabled = false;
    c.drawImage(G.mapImg, px - R, py - R, R * 2, R * 2, 0, 0, S, S);
    // nebbia di guerra
    c.fillStyle = 'rgba(10,12,11,.88)';
    for (let j = Math.floor((py - R) / 4); j <= Math.floor((py + R) / 4); j++) for (let i = Math.floor((px - R) / 4); i <= Math.floor((px + R) / 4); i++) {
      if (i < 0 || j < 0 || i >= 64 || j >= 64 || !G.fog[j * 64 + i]) c.fillRect((i * 4 - px + R) * k, (j * 4 - py + R) * k, 4 * k + 1, 4 * k + 1);
    }
    const toM = (x, y) => [((x / TS) - px + R) * k, ((y / TS) - py + R) * k];
    // strutture del giocatore
    c.fillStyle = '#d9b44a';
    G.structs.forEach(s => { const [x, y] = toM(s.x * TS, s.y * TS); if (x > 0 && y > 0 && x < S && y < S) c.fillRect(x, y, Math.max(2, k), Math.max(2, k)); });
    // luoghi
    c.font = '10px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    for (const id in G.pois) {
      const q = G.pois[id]; if (!G.known[id] || q.area) continue;
      const [x, y] = toM(q.x * TS, q.y * TS); if (x < 0 || y < 0 || x > S || y > S) continue;
      c.fillStyle = q.fac ? AF.FACTIONS[q.fac].color : '#e6dcc4'; c.fillText(q.icon || '•', x, y);
    }
    // veicoli, compagni, nemici
    G.vehicles.forEach(v => { const [x, y] = toM(v.x, v.y); c.fillStyle = v.broken ? '#8a7a6a' : '#6fb3c9'; c.fillRect(x - 2, y - 2, 4, 4); });
    const seeEnemies = AF.Player.sk('percept') >= 2;
    G.actors.forEach(a => {
      if (!a.ally && !(seeEnemies && AF.hostileToPlayer(a) && Math.hypot(a.x - p.x, a.y - p.y) < 500)) return;
      const [x, y] = toM(a.x, a.y); c.fillStyle = a.ally ? '#86c77a' : '#e05a4a'; c.beginPath(); c.arc(x, y, 2.2, 0, 7); c.fill();
    });
    G.markers.forEach(m => { const [x, y] = toM(m.x, m.y); c.fillStyle = '#e8c468'; c.fillText('✕', x, y); });
    const qt = G.quests.track && AF.Quests.target(G.quests.track);
    if (qt) {
      let [x, y] = toM(qt.x, qt.y);
      x = U.clamp(x, 5, S - 5); y = U.clamp(y, 5, S - 5);
      c.fillStyle = '#e8c468'; c.save(); c.translate(x, y); c.rotate(Math.PI / 4); c.fillRect(-3.5, -3.5, 7, 7); c.restore();
    }
    // giocatore
    c.save(); c.translate(S / 2, S / 2); c.rotate(G.player.a);
    c.fillStyle = '#ffffff'; c.beginPath(); c.moveTo(6, 0); c.lineTo(-4, -4); c.lineTo(-2, 0); c.lineTo(-4, 4); c.fill(); c.restore();
  };

  Rn.drawMap = function (cv, view) {
    const G = AF.G, c = cv.getContext('2d');
    const S = Math.min(cv.width, cv.height), k = S / W * view.z;
    const ox = (cv.width - S * view.z) / 2 + view.x, oy = (cv.height - S * view.z) / 2 + view.y;
    c.fillStyle = '#0b0d0c'; c.fillRect(0, 0, cv.width, cv.height);
    c.imageSmoothingEnabled = false;
    c.drawImage(G.mapImg, ox, oy, W * k, H * k);
    c.fillStyle = 'rgba(11,13,12,.93)';
    for (let j = 0; j < 64; j++) for (let i = 0; i < 64; i++) if (!G.fog[j * 64 + i]) c.fillRect(ox + i * 4 * k, oy + j * 4 * k, 4 * k + .6, 4 * k + .6);
    const toM = (x, y) => [ox + x / TS * k, oy + y / TS * k];
    // territori delle fazioni
    for (const f in AF.FACTIONS) {
      const F = AF.FACTIONS[f], h = G.pois[F.home]; if (!G.known[F.home]) continue;
      const [x, y] = toM(h.x * TS, h.y * TS);
      c.strokeStyle = F.color; c.globalAlpha = .6; c.setLineDash([4, 4]); c.beginPath(); c.arc(x, y, F.rad * k, 0, 7); c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
    }
    c.fillStyle = '#d9b44a';
    G.structs.forEach(s => { const [x, y] = toM(s.x * TS, s.y * TS); c.fillRect(x, y, Math.max(2, k), Math.max(2, k)); });
    const fs = Math.max(10, Math.min(14, 9 * view.z));
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (const id in G.pois) {
      const q = G.pois[id]; if (!G.known[id]) continue;
      const [x, y] = toM(q.x * TS, q.y * TS);
      c.font = (q.area ? '600 ' + (fs + 2) + 'px ' : '600 ' + fs + 'px ') + '"Barlow Semi Condensed", Arial, sans-serif';
      if (!q.area) { c.font = (fs + 4) + 'px sans-serif'; c.fillStyle = q.fac ? AF.FACTIONS[q.fac].color : '#e6dcc4'; c.fillText(q.icon || '•', x, y); c.font = '600 ' + fs + 'px "Barlow Semi Condensed", Arial, sans-serif'; }
      c.fillStyle = 'rgba(0,0,0,.7)'; c.fillText(q.n, x + 1, y + (q.area ? 1 : 15));
      c.fillStyle = q.area ? 'rgba(230,220,196,.6)' : '#e6dcc4'; c.fillText(q.n, x, y + (q.area ? 0 : 14));
    }
    G.vehicles.forEach(v => { if (!G.fog[Math.floor(v.y / TS / 4) * 64 + Math.floor(v.x / TS / 4)]) return; const [x, y] = toM(v.x, v.y); c.font = '12px sans-serif'; c.fillStyle = '#6fb3c9'; c.fillText(v.type === 'moto' ? '🏍' : v.type === 'truck' ? '🚚' : '🚗', x, y); });
    G.markers.forEach(m => { const [x, y] = toM(m.x, m.y); c.font = '700 14px sans-serif'; c.fillStyle = '#e8c468'; c.fillText('✕', x, y); c.font = '11px sans-serif'; c.fillText(m.n, x, y + 12); });
    const qt = G.quests.track && AF.Quests.target(G.quests.track);
    if (qt) { const [x, y] = toM(qt.x, qt.y); c.strokeStyle = '#e8c468'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 9 + Math.sin(G.real * 4) * 2, 0, 7); c.stroke(); }
    const p = G.player.veh || G.player, [x, y] = toM(p.x, p.y);
    c.save(); c.translate(x, y); c.rotate(G.player.a); c.fillStyle = '#fff'; c.strokeStyle = '#000'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(9, 0); c.lineTo(-6, -6); c.lineTo(-3, 0); c.lineTo(-6, 6); c.closePath(); c.fill(); c.stroke(); c.restore();
    return { ox, oy, k };
  };
})(window.AF);

</script>
<script>
/* js/ui.js */
/* =====================================================================
   AFTERFALL — ui.js
   Interfaccia DOM: HUD, menu, inventario con drag & drop, crafting,
   abilità, diario, fazioni, documenti, mappa, radio, commercio,
   dialoghi, costruzione, schermate di morte e finale.
   ===================================================================== */
'use strict';
(function (AF) {
  const U = AF.U, INV = AF.Inv, esc = U.esc;
  const $ = s => document.querySelector(s);
  const UI = AF.UI = { paused: false, openName: null, sel: null, tab: 'inv', craftCat: 'Sopravvivenza', dirtyMsgs: true, mapView: { z: 1, x: 0, y: 0 } };

  /* ---------- utilità ---------- */
  function show(el, on) { el.hidden = !on; }
  function icon(it) { return AF.ITEMS[it.id].i; }
  function rarColor(it) { return AF.RARITY[AF.itemRar(it)].color; }
  function slotHTML(it, inv, i, extra) {
    if (!it) return '<div class="slot empty" data-inv="' + inv + '" data-i="' + i + '">' + (extra || '') + '</div>';
    const d = AF.ITEMS[it.id], md = AF.maxDur(it);

    const q = it.q > 1 ? '<em>' + it.q + '</em>' : d.wp && d.wp.mag ? '<em class="mag">' + (it.m || 0) + '</em>' : '';
    const selCls = UI.sel && UI.sel.inv === inv && UI.sel.i === i ? ' sel' : '';
    return '<div class="slot r' + AF.itemRar(it) + selCls + '" data-inv="' + inv + '" data-i="' + i + '" style="--rc:' + rarColor(it) + '" title="' + esc(d.n) + '"><span>' + d.i + '</span>' + q + dur + (extra || '') + '</div>';
  }
  function invOf(key) {
    const G = AF.G;
    if (key === 'p') return G.player.inv;
    if (key === 'c') return UI.loot ? UI.loot.inv : null;
    if (key === 'eq') return null;
    return null;
  }
  function fmtW(w) { return w.toFixed(1); }

  /* =====================================================================
     AVVIO E SCHERMATE
     ===================================================================== */
  UI.init = function () {
    UI.buildHUD();
    UI.bindDrag();
    document.addEventListener('click', UI.onClick);
    UI.mainMenu();
  };

  UI.screen = function (html) {
    const s = $('#screen'); s.innerHTML = html; show(s, !!html);
  };
  UI.mainMenu = function () {
    AF.state = 'menu';
    show($('#hud'), false); show($('#touch'), false); UI.closeAll(true);
    const last = AF.Save.last(), has = last && AF.Save.exists(last);
    UI.screen('<div class="menu title-screen"><canvas id="ashes"></canvas><div class="menu-inner">' +
      '<h1 class="logo">AFTER<span>FALL</span></h1><p class="tag">Il cielo è caduto. Tu no.</p>' +
      '<div class="menu-btns">' +
      (has ? '<button class="btn primary" data-act="continue">Continua</button>' : '') +
      '<button class="btn' + (has ? '' : ' primary') + '" data-act="newgame">Nuova partita</button>' +
      '<button class="btn" data-act="loadmenu">Carica partita</button>' +
      '<button class="btn" data-act="settings">Impostazioni</button>' +
      '<button class="btn" data-act="controls">Controlli</button></div>' +
      '<p class="foot">Survival post-apocalittico · salvataggi nel browser</p></div></div>');
    UI.ashes();
  };
  UI.ashes = function () {
    const cv = $('#ashes'); if (!cv) return;
    const c = cv.getContext('2d'); let parts = [];
    const fit = () => { cv.width = innerWidth; cv.height = innerHeight; };
    fit();
    for (let i = 0; i < 90; i++) parts.push({ x: Math.random() * cv.width, y: Math.random() * cv.height, s: Math.random() * 2 + .5, v: Math.random() * 20 + 8 });
    let last = performance.now();
    const loop = now => {
      if (!document.body.contains(cv)) return;
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      if (cv.width !== innerWidth) fit();
      const g = c.createLinearGradient(0, 0, 0, cv.height); g.addColorStop(0, '#1a1c1a'); g.addColorStop(.7, '#2a2420'); g.addColorStop(1, '#3a2a1e');
      c.fillStyle = g; c.fillRect(0, 0, cv.width, cv.height);
      // skyline
      c.fillStyle = '#121312';
      for (let i = 0; i < 26; i++) { const w = cv.width / 26, h = 60 + AF.hash2(i, 3, 9) * 180; c.fillRect(i * w, cv.height - h, w - 3, h); }
      c.fillStyle = 'rgba(220,200,170,.5)';
      for (const p of parts) { p.y += p.v * dt; p.x += Math.sin(now / 1000 + p.y * .01) * .3; if (p.y > cv.height) { p.y = -5; p.x = Math.random() * cv.width; } c.fillRect(p.x, p.y, p.s, p.s); }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  };

  /* --- commercio (baratto + tappi) --- */
  UI.openTrade = function (a) {

  UI.renderTrade = function () {
    const G = AF.G, T = UI.trade; if (!T) return;
    const p = G.player;
    const left = (arr, i) => arr.filter(x => x.i === i).reduce((s, x) => s + x.q, 0);
    const shopRows = T.shop.items.map((it, i) => { if (!it) return ''; const inCart = left(T.buy, i); const rem = it.q - inCart; return rem > 0 ? '<button class="trow" data-act="tbuy" data-i="' + i + '"><span class="ti" style="--rc:' + rarColor(it) + '">' + icon(it) + '</span><span class="tn">' + esc(AF.itemName(it)) + (rem > 1 ? ' ×' + rem : '') + '</span><b>⛁ ' + AF.Trade.buyPrice(it, T.npc) + '</b></button>' : ''; }).join('');
    const myRows = p.inv.map((it, i) => { if (!it) return ''; const pr = AF.Trade.sellPrice(it, T.npc); if (!pr) return ''; const rem = it.q - left(T.sell, i); return rem > 0 ? '<button class="trow" data-act="tsell" data-i="' + i + '"><span class="ti" style="--rc:' + rarColor(it) + '">' + icon(it) + '</span><span class="tn">' + esc(AF.itemName(it)) + (rem > 1 ? ' ×' + rem : '') + '</span><b>⛁ ' + pr + '</b></button>' : ''; }).join('');
    const sumB = T.buy.reduce((s, x) => s + AF.Trade.buyPrice(T.shop.items[x.i], T.npc) * x.q, 0);
    const sumS = T.sell.reduce((s, x) => s + AF.Trade.sellPrice(p.inv[x.i], T.npc) * x.q, 0);
    const bal = sumS - sumB;
    const ok = (p.caps + bal >= 0) && (T.shop.caps - bal >= 0) && (T.buy.length || T.sell.length);
    const cart = (arr, src, kind) => arr.map((x, k) => '<button class="chip" data-act="tun" data-k="' + k + '" data-kind="' + kind + '">' + icon(src[x.i]) + ' ' + x.q + '</button>').join('');
    const pm = AF.Factions.priceMul(AF.Trade.fac(T.npc));
    $('#tradePanel').innerHTML = '<div class="sheet trade"><header><h2>Commercio con ' + esc(T.name) + '</h2><button class="x" data-act="close" aria-label="Chiudi">✕</button></header><div class="sheet-body three">' +
      '<section><h3>Merce <span class="muted">(cassa: ⛁ ' + T.shop.caps + ')</span></h3><div class="tlist">' + (shopRows || '<p class="muted">Niente da vendere.</p>') + '</div></section>' +
      '<section class="cart"><h3>Scambio</h3><p class="muted">Tocca per aggiungere un\'unità; tocca un elemento qui per toglierlo. ' + (pm < 1 ? 'Sconto reputazione attivo.' : pm > 1 ? 'Prezzi maggiorati: non si fidano di te.' : '') + '</p><div class="clabel">Ricevi</div><div class="chips">' + (cart(T.buy, T.shop.items, 'b') || '—') + '</div><div class="clabel">Offri</div><div class="chips">' + (cart(T.sell, p.inv, 's') || '—') + '</div>' +
      '<div class="balance"><div><span>Valore ricevuto</span><b>⛁ ' + sumB + '</b></div><div><span>Valore offerto</span><b>⛁ ' + sumS + '</b></div><div class="tot"><span>' + (bal >= 0 ? 'Ricevi in tappi' : 'Paghi in tappi') + '</span><b>⛁ ' + Math.abs(bal) + '</b></div><div><span>I tuoi tappi</span><b>⛁ ' + p.caps + '</b></div></div>' +
      '<button class="btn primary" data-act="tconfirm"' + (ok ? '' : ' disabled') + '>Conferma scambio</button></section>' +
      '<section><h3>Il tuo inventario</h3><div class="tlist">' + (myRows || '<p class="muted">Niente da offrire.</p>') + '</div></section></div></div>';
  };
  UI.tradeAdd = function (kind, i) {
    const G = AF.G, T = UI.trade;
    const arr = kind === 'b' ? T.buy : T.sell, src = kind === 'b' ? T.shop.items : G.player.inv;
    const it = src[i]; if (!it) return;
    const used = arr.filter(x => x.i === i).reduce((s, x) => s + x.q, 0);
    if (used >= it.q) return;
    const ex = arr.find(x => x.i === i); if (ex) ex.q++; else arr.push({ i, q: 1 });
    UI.renderTrade();
  };
  UI.tradeConfirm = function () {
    const G = AF.G, T = UI.trade, p = G.player;
    const sumB = T.buy.reduce((s, x) => s + AF.Trade.buyPrice(T.shop.items[x.i], T.npc) * x.q, 0);
    const sumS = T.sell.reduce((s, x) => s + AF.Trade.sellPrice(p.inv[x.i], T.npc) * x.q, 0);
    const bal = sumS - sumB;
    if (p.caps + bal < 0) return;
    // togli gli oggetti venduti
    const sold = [];
    T.sell.forEach(x => { const it = p.inv[x.i]; if (!it) return; if (AF.ITEMS[it.id].s > 1) { it.q -= x.q; sold.push(AF.mkItem(it.id, x.q)); if (it.q <= 0) p.inv[x.i] = null; } else { sold.push(it); p.inv[x.i] = null; } });
    // ricevi gli acquisti
    T.buy.forEach(x => {
      const it = T.shop.items[x.i]; if (!it) return;
      if (AF.ITEMS[it.id].s > 1) { const left = INV.add(p.inv, it.id, x.q); if (left) AF.Bags.drop(p.x, p.y, [AF.mkItem(it.id, left)]); it.q -= x.q; if (it.q <= 0) T.shop.items[x.i] = null; }
      else { if (INV.addInst(p.inv, it)) AF.Bags.drop(p.x, p.y, [it]); T.shop.items[x.i] = null; }
    });
    T.shop.items = T.shop.items.filter(Boolean);
    sold.forEach(it => T.shop.items.push(it));
    p.caps += bal; T.shop.caps -= bal;
    T.buy = []; T.sell = [];
    AF.Audio.play('pickup'); AF.msg('Scambio concluso.', 'good');
    AF.Quests.check(); UI.renderTrade();
  };
