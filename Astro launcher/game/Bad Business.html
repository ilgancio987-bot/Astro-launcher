<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bad Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* San Ardente di notte: cielo al tramonto in canvas, pannelli HUD scuri e traslucidi, accento rosa-arancio, verde per i soldi. Tema unico notturno, scelto di proposito. */
:root{
  --night:#0b0913; --panel:rgba(16,13,28,.84); --panel2:rgba(30,25,48,.9); --line:rgba(255,255,255,.1);
  --fg:#f5f0ea; --muted:#a59fb8; --pink:#ff3d7f; --orange:#ff9a3c; --gold:#ffd04a; --cash:#7be07b; --red:#ff4a4a; --blue:#4ab3ff;
  --display:"Oswald","Arial Narrow","Impact",sans-serif;
  --body:"Rubik","Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--night);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;overflow-x:hidden}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none;display:block}
#fps{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:60;font-family:var(--mono);font-size:12px;color:var(--cash);background:rgba(0,0,0,.6);padding:2px 6px;border-radius:3px}
.screen{position:relative;z-index:10}
button{font-family:inherit}
.btn{font-family:var(--display);font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:14px;border:1px solid rgba(255,255,255,.18);
  background:var(--panel2);color:var(--fg);border-radius:3px;padding:9px 14px;cursor:pointer;transition:background .12s,border-color .12s,transform .08s}
.btn:hover:not(:disabled){border-color:var(--orange);background:rgba(255,154,60,.14)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.hot{background:linear-gradient(90deg,var(--pink),var(--orange));border-color:transparent;color:#1a0a10;font-weight:700}
.btn.wide{width:100%}
.label{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

/* ---------- MENU ---------- */
#menu{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-inline:16px;padding-block:40px}
.menu-inner{max-width:520px;width:100%;margin:0 auto 0 8vw}
@media (max-width:700px){.menu-inner{margin:0 auto}}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(56px,13vw,120px);line-height:.88;margin:0;text-transform:uppercase;
  background:linear-gradient(180deg,#fff 0%,#ffd7b0 45%,var(--orange) 70%,var(--pink) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.7)) drop-shadow(0 10px 30px rgba(255,61,127,.35));transform:skewX(-6deg)}
.tagline{font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;color:var(--fg);margin:10px 0 34px;font-size:14px;opacity:.85}
.menu-list{display:flex;flex-direction:column;gap:6px}
.mbtn{all:unset;cursor:pointer;font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,30px);text-transform:uppercase;letter-spacing:.03em;
  padding:6px 14px;border-left:4px solid transparent;color:rgba(245,240,234,.82);transition:all .15s}
.mbtn:hover,.mbtn:focus-visible{color:#fff;border-left-color:var(--pink);background:linear-gradient(90deg,rgba(255,61,127,.28),transparent);padding-left:22px}
.mbtn[hidden]{display:none}
.langs{display:flex;gap:6px;margin-top:30px;flex-wrap:wrap}
.langs button{all:unset;cursor:pointer;font-family:var(--mono);font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:3px;color:var(--muted);background:rgba(0,0,0,.4)}
.langs button.on{color:#1a0a10;background:var(--gold);border-color:var(--gold)}
.ver{position:fixed;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.4);z-index:11}

/* ---------- MODALE ---------- */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(5,4,10,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:rgba(18,15,30,.97);border:1px solid var(--line);border-top:3px solid var(--pink);border-radius:4px;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:22px}
.modal h2{font-family:var(--display);font-size:30px;text-transform:uppercase;margin:0 0 16px;letter-spacing:.02em}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow label{font-weight:500}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;color:var(--muted);border:none;padding:6px 11px;font-family:var(--mono);font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--gold);color:#1a0a10;font-weight:700}
input[type=range]{accent-color:var(--pink);width:150px}
.modal .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.howto p{margin:0 0 10px;color:#ddd6e8}
.howto b{color:var(--gold)}

/* ---------- GIOCO ---------- */
#game{padding-inline:16px;padding-block:0 40px}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-block:10px;margin-inline:-16px;padding-inline:16px;background:linear-gradient(180deg,rgba(8,6,14,.95),rgba(8,6,14,.7));border-bottom:1px solid var(--line);backdrop-filter:blur(4px)}
.hud-left{display:flex;align-items:center;gap:14px}
.hud .mini{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;color:var(--orange);transform:skewX(-6deg);line-height:1}
.stars{display:flex;gap:2px}
.stars svg{width:20px;height:20px}
.stars svg path{fill:rgba(255,255,255,.14);stroke:rgba(0,0,0,.6);stroke-width:1}
.stars svg.on path{fill:#fff}
.stars.flash svg.on path{animation:sf .4s infinite alternate}
@keyframes sf{to{fill:var(--blue)}}
.hud-right{display:flex;align-items:center;gap:14px;margin-left:auto}
.money{text-align:right}
.money .cash{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1;color:var(--cash);text-shadow:0 2px 0 #0a2a0a,0 0 18px rgba(123,224,123,.25);font-variant-numeric:tabular-nums}
.money .ips{font-family:var(--mono);font-size:12.5px;color:#cfe9cf}
.icobtn{width:42px;height:42px;display:grid;place-items:center;padding:0}
.gearbtn{height:42px;display:flex;align-items:center;gap:8px}
@media (max-width:600px){.gearbtn span{display:none}.gearbtn{width:42px;justify-content:center;padding:0}}
.wrap{max-width:1240px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(270px,340px) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;backdrop-filter:blur(3px);min-width:0}

/* Pulsante incasso */
.collect{position:relative;width:100%;aspect-ratio:5/4;border:none;background:none;cursor:pointer;padding:0;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.bag{width:74%;aspect-ratio:4/3;position:relative;transition:transform .07s}
.bag .body{position:absolute;inset:18% 0 0 0;border-radius:10px;background:linear-gradient(160deg,#3a2a1c,#1d140c);border:2px solid #5b4128;box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.08)}
.bag .handle{position:absolute;left:35%;right:35%;top:2%;height:22%;border:6px solid #5b4128;border-bottom:none;border-radius:12px 12px 0 0}
.bag .stack{position:absolute;left:12%;right:12%;top:30%;bottom:16%;border-radius:4px;
  background:repeating-linear-gradient(180deg,#5fbf5f 0 7px,#3e8e3e 7px 9px);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.bag .band{position:absolute;left:44%;width:12%;top:30%;bottom:16%;background:var(--gold);opacity:.9}
.bag .lock{position:absolute;left:44%;width:12%;top:14%;height:10%;background:var(--gold);border-radius:2px}
.collect:hover .bag{transform:scale(1.03) rotate(-1deg)}
.collect:active .bag{transform:scale(.93)}
.collect:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:8px}
.clickinfo{text-align:center;font-family:var(--mono);color:var(--muted);margin-top:4px}
.floater{position:absolute;pointer-events:none;font-family:var(--display);font-weight:700;color:var(--cash);font-size:22px;animation:fl .9s ease-out forwards;text-shadow:0 2px 0 #000;z-index:2}
@keyframes fl{to{transform:translateY(-80px);opacity:0}}

.bar{height:10px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .2s}
.bar.heat i{background:linear-gradient(90deg,var(--blue),var(--red))}
.bar.eff i{background:var(--cash)}
.bar.mis i{background:linear-gradient(90deg,var(--pink),var(--orange))}
.row{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.row b{color:var(--fg);font-weight:500}
.stack-gap{display:flex;flex-direction:column;gap:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto}
.warn{color:var(--orange);font-size:12.5px;margin-top:6px}
.dl{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-family:var(--mono);font-size:12.5px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

/* Missione corrente (pannello) */
.mission{border-left:3px solid var(--pink)}
.mission h3{font-family:var(--display);font-size:20px;text-transform:uppercase;margin:0 0 2px;letter-spacing:.02em}
.mission .obj{color:#ddd6e8;margin-bottom:8px}

/* Tabs */
.tabs{scroll-margin-top:90px;display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;border:none;color:var(--muted);font-family:var(--display);font-weight:500;font-size:15px;text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--pink)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
.panehead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}

.racket{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.racket:first-child{border-top:none}
.racket.locked{opacity:.3}
.racket .n{font-family:var(--display);font-weight:700;font-size:24px;text-align:center;color:var(--orange);font-variant-numeric:tabular-nums}
.racket .name{font-weight:500}
.racket .meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.racket .btn{min-width:124px;font-family:var(--mono);text-transform:none;letter-spacing:0}
.racket .pb{height:3px;background:rgba(255,255,255,.07);margin-top:5px;border-radius:2px;overflow:hidden}
.racket .pb i{display:block;height:100%;background:var(--orange)}
@media (max-width:440px){.racket{grid-template-columns:36px minmax(0,1fr)}.racket .btn{grid-column:1/-1;width:100%}}
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.up{text-align:left;text-transform:none;letter-spacing:0;display:flex;flex-direction:column;gap:2px;font-family:var(--body)}
.up b{font-size:13px;font-weight:500}
.up span{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.up em{font-style:normal;font-family:var(--mono);color:var(--cash);font-size:12.5px}
.empty{color:var(--muted);font-style:italic;margin:0}

/* Mappa */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(220px,1fr);gap:14px}
@media (max-width:640px){.mapwrap{grid-template-columns:minmax(0,1fr)}}
.map{width:100%;height:auto;display:block;background:#0a1626;border-radius:4px;border:1px solid var(--line)}
.map .d{cursor:pointer;stroke:#0a1626;stroke-width:3;transition:fill .2s}
.map .d.free{fill:#2a2540}
.map .d.free:hover{fill:#3a3358}
.map .d.mine{fill:url(#mine)}
.map .d.sel{stroke:var(--gold);stroke-width:3}
.map .d.attacked{animation:att .5s infinite alternate}
@keyframes att{to{fill:var(--red)}}
.map text{font-family:var(--display);font-size:11px;fill:#fff;text-transform:uppercase;pointer-events:none;paint-order:stroke;stroke:#000;stroke-width:3px;letter-spacing:.05em}
.dinfo h3{font-family:var(--display);font-size:22px;text-transform:uppercase;margin:0 0 8px}
.alert{border:1px solid var(--red);background:rgba(255,74,74,.12);padding:10px;border-radius:3px;margin-bottom:12px;font-weight:500}
.alert[hidden]{display:none}

/* Missioni / traguardi liste */
.mlist,.alist{display:flex;flex-direction:column;gap:6px}
.mi{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:3px;background:rgba(255,255,255,.03)}
.mi.done{opacity:.55}
.mi.cur{background:rgba(255,61,127,.12);outline:1px solid rgba(255,61,127,.4)}
.mi .ix{font-family:var(--display);font-size:18px;color:var(--orange);text-align:center}
.mi .t{font-weight:500}
.mi .s{font-size:12.5px;color:var(--muted)}
.mi .r{font-family:var(--mono);font-size:12px;color:var(--cash);text-align:right}
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:3px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.ach .ic{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);font-family:var(--display);color:var(--muted)}
.ach.got{border-color:rgba(255,208,74,.5)}
.ach.got .ic{background:var(--gold);color:#1a0a10}
.ach .t{font-weight:500;font-size:13px}
.ach .s{font-size:11.5px;color:var(--muted)}
.news{font-family:var(--mono);font-size:12.5px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.news div{border-left:2px solid var(--line);padding-left:8px;color:var(--muted)}
.news div.hot{border-color:var(--red);color:var(--fg)}
.news div.good{border-color:var(--cash);color:var(--fg)}

/* Banner missione / toast / soffiata */
#banner{position:fixed;left:0;right:0;top:32%;z-index:65;text-align:center;pointer-events:none;padding-block:18px;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.8) 20%,rgba(0,0,0,.8) 80%,transparent);animation:bn 3s ease forwards}
#banner .big{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,64px);text-transform:uppercase;color:var(--gold);transform:skewX(-6deg);
  text-shadow:0 3px 0 #000,0 0 20px rgba(255,208,74,.4);line-height:1}
#banner .small{font-family:var(--display);font-size:18px;letter-spacing:.12em;text-transform:uppercase;margin-top:6px;color:#fff}
#banner.bad .big{color:var(--red)}
@keyframes bn{0%{opacity:0;transform:scaleY(.2)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:66;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:calc(100% - 32px)}
.toast{background:rgba(14,12,24,.95);border:1px solid var(--line);border-left:3px solid var(--gold);padding:10px 14px;border-radius:3px;font-size:13px;animation:ti .25s ease}
.toast.bad{border-left-color:var(--red)} .toast.good{border-left-color:var(--cash)}
.toast b{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em}
@keyframes ti{from{transform:translateX(30px);opacity:0}}
#tip{position:fixed;z-index:55;border:none;cursor:pointer;background:var(--gold);color:#1a0a10;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:16px;
  padding:10px 14px;border-radius:3px;box-shadow:0 6px 24px rgba(0,0,0,.6),0 0 0 3px rgba(255,208,74,.3);animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
/* Tutorial */
#tutSpot{position:fixed;z-index:80;pointer-events:none;border-radius:6px;box-shadow:0 0 0 9999px rgba(5,4,10,.7),0 0 0 3px var(--gold);transition:left .2s,top .2s,width .2s,height .2s}
#tutCard{position:fixed;z-index:81;width:min(340px,calc(100% - 32px));background:rgba(18,15,30,.98);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:4px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#tutCard h4{font-family:var(--display);text-transform:uppercase;font-size:21px;margin:0 0 6px;letter-spacing:.02em}
#tutCard p{margin:0 0 12px;color:#ddd6e8}
#tutCard .tstep{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.1em}
#tutCard .hint{font-family:var(--mono);font-size:12.5px;color:var(--gold);margin:-4px 0 12px}
#tutCard .btnrow .btn{flex:0 1 auto}
/* Eventi a scelta */
#evcard{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:67;width:min(370px,calc(100% - 32px));background:rgba(18,15,30,.97);border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:4px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:ti .3s ease}
#evcard h4{font-family:var(--display);text-transform:uppercase;font-size:19px;margin:0 0 4px}
#evcard p{margin:0 0 10px;color:#ddd6e8;font-size:13px}
#evcard .btn{text-transform:none;letter-spacing:0;font-family:var(--body);font-size:13px;text-align:left}
#evcard .timer{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px}
/* Combo */
.combo{position:absolute;right:14px;top:10px;font-family:var(--display);font-weight:700;color:var(--gold);font-size:22px;transform:skewX(-6deg);text-shadow:0 2px 0 #000;pointer-events:none}
/* Liste: colpi, mercato, luogotenenti */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.025)}
.item.locked{opacity:.38}
.item .t{font-weight:500;font-size:15px}
.item .meta{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:3px}
.item .meta b{color:var(--fg);font-weight:500}
.item .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.item .btn{font-family:var(--mono);text-transform:none;letter-spacing:0;font-size:12.5px}
.active-heist{border-color:var(--orange);background:rgba(255,154,60,.08);grid-template-columns:minmax(0,1fr)}
.mkt{grid-template-columns:minmax(0,1fr) 110px auto}
.spark{width:110px;height:32px;display:block}
@media (max-width:620px){.mkt{grid-template-columns:minmax(0,1fr) 90px}.mkt .btns{grid-column:1/-1}.spark{width:90px}}
@media (max-width:520px){.item:not(.mkt){grid-template-columns:minmax(0,1fr)}.item .btns{justify-content:stretch}.item .btns .btn{flex:1}}
.up-c{color:var(--cash)!important}.dn-c{color:var(--red)!important}
.lv{display:flex;gap:3px;margin-top:7px}.lv i{width:14px;height:5px;background:rgba(255,255,255,.1);border-radius:1px}.lv i.on{background:var(--gold)}

            <div class="list" id="heistList" style="margin-top:8px"></div>

              <div><p class="label" data-t="ledger"></p><dl class="dl" id="stats"></dl></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

/* =================== FORMULE =================== */
const SUF=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc"];
function fmt(n){if(!isFinite(n))return "∞";if(n<0)return "-"+fmt(-n);if(n<1000)return (n<10&&n%1?n.toFixed(1):Math.floor(n))+"";
  let i=0;while(n>=1000&&i<SUF.length-1){n/=1000;i++}return (n<100?n.toFixed(2):n.toFixed(1))+SUF[i]}
const $=id=>document.getElementById(id);
const upOwned=(f)=>UPS.filter(u=>S.ups[u.id]&&f(u));
function racketMult(i){return upOwned(u=>u.kind==="racket"&&u.r===i).reduce((m,u)=>m*u.val,1)}
function crewMult(){return upOwned(u=>u.kind==="crew").reduce((m,u)=>m*u.val,1)}
function heatMult(){return upOwned(u=>u.kind==="heat").reduce((m,u)=>m*u.val,1)}
function terrCount(){return Object.keys(S.terr).length}
function terrBonus(){let b=0;for(const k in S.terr)b+=DISTRICTS[k].bonus;return b}
function achCount(){return Object.keys(S.ach).length}
function units(){return S.owned.reduce((a,b)=>a+b,0)}
function capacity(){return Math.floor((10+avail()*4)*crewMult())}
function defense(){return Math.floor(avail()*crewMult()*(1+0.15*lt(4)))}
function efficiency(){const u=units();return u<=0?1:Math.min(1,capacity()/u)}
function globalMult(){return (1+0.1*S.respect)*(1+0.02*achCount())*(1+terrBonus())*(1+0.1*lt(0))}
function baseIncome(){let t=0;RACKETS.forEach((r,i)=>t+=S.owned[i]*r.inc*racketMult(i));return t}
function income(){return baseIncome()*globalMult()*efficiency()}
function clickVal(){return (1+income()*0.03)*upOwned(u=>u.kind==="click").reduce((m,u)=>m*u.val,1)*(1+0.1*S.respect)}
function heatRate(){let w=0;RACKETS.forEach((r,i)=>w+=S.owned[i]*r.heat);let t=0;for(const k in S.terr)t+=DISTRICTS[k].heat;
  return Math.log2(1+w)*0.13*heatMult()*Math.max(.4,1-0.06*lt(1))+t-0.35}
function stars(){return Math.min(5,Math.ceil(S.heat/20-0.001))}
function geo(base,g,owned,n){const b=base*Math.pow(g,owned);return b*(Math.pow(g,n)-1)/(g-1)}
function geoMax(base,g,owned,cash){const b=base*Math.pow(g,owned);return Math.max(0,Math.floor(Math.log(cash*(g-1)/b+1)/Math.log(g)))}
const rCost=(i,n)=>geo(RACKETS[i].cost,GROWTH,S.owned[i],n);
const rMax=i=>geoMax(RACKETS[i].cost,GROWTH,S.owned[i],S.cash);
const sCost=n=>geo(SOLD_BASE,SOLD_GROWTH,S.soldiers,n);
function lawyerCost(){return Math.max(60,income()*35)*Math.max(.3,1-0.07*lt(1))}
function respectGain(){return Math.floor(Math.sqrt(S.total/1e6))}
function conquerChance(d){return Math.max(0.05,Math.min(0.95,defense()/DISTRICTS[d].req*0.7))}

let AC=null;
function beep(type){
  if(!CFG.sound||CFG.vol<=0)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  const v=CFG.vol/100*0.15, t0=AC.currentTime;
  const seq={click:[[880,.04]],buy:[[523,.06],[784,.08]],mission:[[523,.1],[659,.1],[784,.1],[1047,.25]],bad:[[220,.25],[180,.3]],ach:[[784,.08],[1175,.18]],tip:[[1047,.06],[1319,.1]]}[type]||[[440,.05]];
  let t=t0;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==="bad"?"sawtooth":"triangle";o.frequency.value=f;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.85});
}

/* =================== GRAFICA: CITTÀ =================== */
const bg=$("bg"), bctx=bg.getContext("2d"), fx=$("fx"), fctx=fx.getContext("2d");
let W=0,H=0,DPR=1,city=null;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  [bg,fx].forEach(c=>{c.width=W*DPR;c.height=H*DPR});bctx.setTransform(DPR,0,0,DPR,0,0);fctx.setTransform(DPR,0,0,DPR,0,0);buildCity()}
function rnd(a,b){return a+Math.random()*(b-a)}
function buildCity(){
  const layers=[];
  [[0.55,.28,28,90,"#2a1838"],[0.66,.42,22,70,"#1a1026"],[0.78,.6,18,60,"#100a18"]].forEach(([base,maxH,minW,maxW,col],li)=>{
    const b=[];let x=-20;while(x<W+20){const w=rnd(minW,maxW),h=rnd(H*0.06,H*maxH);
      const win=[];if(li>0)for(let wy=8;wy<h-6;wy+=10)for(let wx=5;wx<w-5;wx+=8)if(Math.random()<.32)win.push([wx,wy,Math.random()<.15]);
      b.push({x,w,h,win,ant:Math.random()<.15});x+=w+rnd(0,6)}
    layers.push({base:H*base,col,b,li})});
  const palms=[];for(let i=0;i<7;i++)palms.push({x:rnd(0,W),h:rnd(70,140),s:rnd(.8,1.2)});
  const cars=[];for(let i=0;i<14;i++)cars.push({x:rnd(0,W),v:rnd(60,160)*(i%2?1:-1),lane:i%2});
  city={layers,palms,cars,t:0};
}
function drawCity(dt){
  const c=bctx;city.t+=dt;const t=city.t;
  const g=c.createLinearGradient(0,0,0,H*.82);
  g.addColorStop(0,"#120a2a");g.addColorStop(.35,"#3b1450");g.addColorStop(.6,"#b8336a");g.addColorStop(.78,"#ff8a3d");g.addColorStop(.82,"#ffc062");
  c.fillStyle=g;c.fillRect(0,0,W,H);
  // stelle
  c.fillStyle="rgba(255,255,255,.6)";for(let i=0;i<60;i++){const sx=(i*137.5)%W,sy=((i*71.3)%(H*.3));if((i+Math.floor(t*2))%9)c.fillRect(sx,sy,1.2,1.2)}
  // sole
  const sx=W*.72,sy=H*.6;const sg=c.createRadialGradient(sx,sy,10,sx,sy,H*.28);sg.addColorStop(0,"rgba(255,220,140,.95)");sg.addColorStop(.25,"rgba(255,140,80,.5)");sg.addColorStop(1,"rgba(255,80,120,0)");
  c.fillStyle=sg;c.fillRect(0,0,W,H);
  c.fillStyle="#ffd38a";c.beginPath();c.arc(sx,sy,H*.09,0,Math.PI*2);c.fill();
  c.fillStyle="#b8336a";for(let i=0;i<5;i++){c.fillRect(sx-H*.1,sy+i*H*.018-H*.005,H*.2,2+i)}
  // palazzi
  city.layers.forEach(L=>{
    const off=(L.li===0?Math.sin(t*.05)*4:0);
    L.b.forEach(b=>{const y=L.base-b.h;c.fillStyle=L.col;c.fillRect(b.x+off,y,b.w,b.h+H);
      if(b.ant){c.fillRect(b.x+off+b.w/2-1,y-18,2,18);if(Math.floor(t*1.5)%2){c.fillStyle="#ff3344";c.fillRect(b.x+off+b.w/2-2,y-20,4,4)}c.fillStyle=L.col}
      if(b.win.length){b.win.forEach(([wx,wy,blink])=>{c.fillStyle=blink&&Math.sin(t*3+wx)>.6?"rgba(120,200,255,.8)":"rgba(255,200,110,.55)";c.fillRect(b.x+off+wx,y+wy,3,4)})}
    })});
  // strada
  const ry=H*.8;c.fillStyle="#07050c";c.fillRect(0,ry,W,H-ry);
  c.fillStyle="rgba(255,154,60,.25)";c.fillRect(0,ry,W,2);
  city.cars.forEach(car=>{car.x+=car.v*dt;if(car.x>W+40)car.x=-40;if(car.x<-40)car.x=W+40;
    const y=ry+12+car.lane*14;const col=car.v>0?"rgba(255,60,60,":"rgba(255,240,200,";
    const gr=c.createLinearGradient(car.x-(car.v>0?50:-50),0,car.x,0);gr.addColorStop(0,col+"0)");gr.addColorStop(1,col+".9)");
    c.fillStyle=gr;c.fillRect(Math.min(car.x,car.x-(car.v>0?50:-50)),y,50,2.5)});
  // palme
  city.palms.forEach(p=>{const bx=p.x,by=ry+2;c.strokeStyle="#05030a";c.fillStyle="#05030a";c.lineWidth=5*p.s;
    const sway=Math.sin(t*.8+bx)*4;c.beginPath();c.moveTo(bx,by);c.quadraticCurveTo(bx+8*p.s,by-p.h*.5,bx+sway,by-p.h*p.s);c.stroke();
    for(let k=0;k<7;k++){const a=-Math.PI/2+(k-3)*0.45+Math.sin(t+k)*.05;c.beginPath();c.moveTo(bx+sway,by-p.h*p.s);
      c.quadraticCurveTo(bx+sway+Math.cos(a)*30*p.s,by-p.h*p.s+Math.sin(a)*20*p.s-10,bx+sway+Math.cos(a)*48*p.s,by-p.h*p.s+Math.sin(a)*30*p.s+12);c.lineWidth=3*p.s;c.stroke()}});
  // velo per leggibilità
  if(inGame){c.fillStyle="rgba(8,6,14,.45)";c.fillRect(0,0,W,H)}
  // lampeggianti polizia
  if(inGame&&S&&stars()>=3){const a=.08+.06*Math.sin(t*10);c.fillStyle=Math.floor(t*4)%2?`rgba(255,40,60,${a})`:`rgba(40,120,255,${a})`;c.fillRect(0,0,W,H)}
}

const parts=[];
function burst(x,y,n,col){if(!CFG.particles)return;for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-160,160),vy:rnd(-320,-120),r:rnd(-3,3),a:rnd(0,6),life:rnd(.8,1.4),t:0,col:col||(Math.random()<.8?"#6fd46f":"#ffd04a")})}
function drawParts(dt){fctx.clearRect(0,0,W,H);for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue}
  p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.r*dt;fctx.save();fctx.globalAlpha=1-p.t/p.life;fctx.translate(p.x,p.y);fctx.rotate(p.a);
  fctx.fillStyle=p.col;fctx.fillRect(-7,-4,14,8);fctx.fillStyle="rgba(0,0,0,.3)";fctx.fillRect(-2,-2,4,4);fctx.restore()}}

/* =================== TERRITORI =================== */
function dName(i){return A("districts")[i]}
function centroid(pts){const p=pts.split(" ").map(s=>s.split(",").map(Number));return [p.reduce((a,b)=>a+b[0],0)/p.length,p.reduce((a,b)=>a+b[1],0)/p.length]}
function buildMap(){
  let h=`<defs><linearGradient id="mine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3d7f"/><stop offset="1" stop-color="#ff9a3c"/></linearGradient>
    <pattern id="wv" width="12" height="6" patternUnits="userSpaceOnUse"><path d="M0 3 Q3 0 6 3 T12 3" fill="none" stroke="rgba(74,179,255,.18)"/></pattern></defs>
    <rect width="400" height="260" fill="url(#wv)"/>`;
  DISTRICTS.forEach((d,i)=>{h+=`<polygon class="d" id="dp${i}" data-i="${i}" points="${d.pts}"/>`});
  DISTRICTS.forEach((d,i)=>{const [x,y]=centroid(d.pts);h+=`<text x="${x}" y="${y}" text-anchor="middle">${dName(i)}</text>`});
  $("map").innerHTML=h;
  $("map").querySelectorAll(".d").forEach(p=>p.onclick=()=>{selD=+p.dataset.i;renderMap(true)});
  renderMap(true);
}
let dinfoKey="";
function renderMap(force){
  DISTRICTS.forEach((d,i)=>{const p=$("dp"+i);if(!p)return;p.setAttribute("class","d "+(S.terr[i]?"mine":"free")+(selD===i?" sel":"")+(S.attack&&S.attack.d===i?" attacked":""))});
  const al=$("attackAlert");
  if(S.attack){al.hidden=false;al.textContent=T("attackAlert",{g:A("gangs")[S.attack.g],d:dName(S.attack.d),p:fmt(S.attack.p),s:Math.ceil(S.attack.t)})}else al.hidden=true;
  if(selD===null){if(force||dinfoKey!=="none"){$("dinfo").innerHTML=`<p class="empty">${T("selectDistrict")}</p>`;dinfoKey="none"}return}
  const d=DISTRICTS[selD],mine=!!S.terr[selD],ch=conquerChance(selD);
  const key=[selD,mine,Math.round(ch*100),S.cash>=d.cost,CFG.lang,defense()].join();
  if(!force&&key===dinfoKey)return;dinfoKey=key;
  $("dinfo").innerHTML=`<h3>${dName(selD)}</h3><dl class="dl">
    <dt>${T("required")}</dt><dd>${fmt(d.req)}</dd><dt>${T("defense")}</dt><dd>${fmt(defense())}</dd>
    <dt>${T("cost")}</dt><dd>$${fmt(d.cost)}</dd><dt>${T("chance")}</dt><dd>${mine?"—":Math.round(ch*100)+"%"}</dd>
    <dt>${T("bonus")}</dt><dd>+${Math.round(d.bonus*100)}%</dd><dt>${T("heatAdd")}</dt><dd>+${d.heat.toFixed(2)}/s</dd></dl>
    ${mine?`<p class="warn" style="color:var(--cash)">${T("owned")}</p>`:`<button class="btn hot wide" id="conq" style="margin-top:12px" ${S.cash<d.cost?"disabled":""}>${T("conquer")}</button>`}`;
  const b=$("conq");if(b)b.onclick=()=>conquer(selD);
}
function conquer(i){const d=DISTRICTS[i];if(S.cash<d.cost||S.terr[i])return;S.cash-=d.cost;
  if(Math.random()<conquerChance(i)){S.terr[i]=1;news(T("conquered",{d:dName(i)}),"good");banner(dName(i),T("conquered",{d:dName(i)}));beep("mission");
    if(S.nextAttack<60)S.nextAttack=90}
  else{const lost=Math.ceil(S.soldiers*0.15);S.soldiers-=lost;news(T("conquerFail",{d:dName(i),n:lost}),"hot");toast(T("conquerFail",{d:dName(i),n:lost}),"","bad");beep("bad");shake("heatcard")}
  renderAll(true)}
function updateAttacks(dt){
  if(terrCount()===0){S.attack=null;return}
  if(S.attack){S.attack.t-=dt;if(S.attack.t<=0)resolveAttack();return}
  S.nextAttack-=dt;
  if(S.nextAttack<=0){const own=Object.keys(S.terr).map(Number);const d=own[Math.floor(Math.random()*own.length)];
    const p=Math.ceil(DISTRICTS[d].req*(0.9+Math.random()*0.5)*(1+0.12*S.repelled));
    S.attack={d,g:Math.floor(Math.random()*4),p,t:15};S.nextAttack=rnd(120,200);beep("bad");
    toast(T("attackAlert",{g:A("gangs")[S.attack.g],d:dName(d),p:fmt(p),s:15}),"","bad")}
}
function resolveAttack(){const a=S.attack;S.attack=null;const gang=A("gangs")[a.g];
  if(defense()>=a.p){S.repelled++;const v=Math.max(500,income()*45);earn(v);news(T("attackWon",{g:gang,d:dName(a.d),v:fmt(v)}),"good");toast(T("attackWon",{g:gang,d:dName(a.d),v:fmt(v)}),"","good");beep("ach")}
  else{delete S.terr[a.d];const lost=Math.ceil(S.soldiers*0.2);S.soldiers-=lost;news(T("attackLost",{g:gang,d:dName(a.d),n:lost}),"hot");banner(dName(a.d),T("attackLost",{g:gang,d:dName(a.d),n:lost}),true);beep("bad")}
  renderAll(true)}

/* =================== MISSIONI =================== */
function startMission(){S.mBase={clicks:S.totalClicks,life:S.lifetime,lawyers:S.lawyers,repel:S.repelled,heists:S.heistsDone,profit:S.mProfit,events:S.events}}
function mProg(m){
  const b=S.mBase||{clicks:0,life:0,lawyers:0,repel:0};
  switch(m.t){case"clicks":return S.totalClicks-b.clicks;case"own":return S.owned[m.i];case"soldiers":return S.soldiers;case"earn":return S.lifetime-b.life;
    case"territory":return terrCount();case"lawyer":return S.lawyers-b.lawyers;case"ips":return income();case"repel":return S.repelled-b.repel;case"gen":return S.gen;
    case"heist":return S.heistsDone-(b.heists||0);case"lieut":return S.lt.some(x=>x>0)?1:0;case"profit":return S.mProfit-(b.profit||0);case"events":return S.events-(b.events||0);case"lieutAll":return Math.min(...S.lt)}return 0}
function mText(m){const n=fmt(m.n);switch(m.t){case"own":return T("m_own",{n:m.n,r:rName(m.i)});case"clicks":return T("m_clicks",{n});case"soldiers":return T("m_soldiers",{n});
  case"earn":return T("m_earn",{n});case"territory":return T("m_territory",{n:m.n});case"lawyer":return T("m_lawyer");case"ips":return T("m_ips",{n});case"repel":return T("m_repel");case"gen":return T("m_gen");
  case"heist":return T("m_heist",{n:m.n});case"lieut":return T("m_lieut");case"profit":return T("m_profit",{n});case"events":return T("m_events",{n:m.n});case"lieutAll":return T("m_lieutAll",{n:m.n})}}
function mReward(m){return m.resp?T("m_rewardRespect",{n:m.resp}):"$"+fmt(m.r)}
function checkMission(){
  if(S.mIdx>=MISSIONS.length)return;const m=MISSIONS[S.mIdx];
  if(mProg(m)>=m.n){if(m.resp)S.respect+=m.resp;else earn(m.r);
    banner(T("missionPassed"),A("missionTitles")[S.mIdx]+" · "+mReward(m));beep("mission");burst(W/2,H*.38,40);
    news(T("missionPassed")+": "+A("missionTitles")[S.mIdx]+" ("+mReward(m)+")","good");
    S.mIdx++;startMission();renderMissions(true)}
}
let curMKey="";
function renderCurMission(){
  if(S.mIdx>=MISSIONS.length){const k="done"+CFG.lang;if(curMKey!==k){curMKey=k;$("curMission").innerHTML=`<p class="label">${T("tabMissions")}</p><p style="margin:0">${T("allMissions")}</p>`}return}
  const m=MISSIONS[S.mIdx],p=Math.min(1,mProg(m)/m.n);const k=S.mIdx+CFG.lang;
  if(curMKey!==k){curMKey=k;$("curMission").innerHTML=`<p class="label">${T("missionN",{n:S.mIdx+1})}</p><h3>${A("missionTitles")[S.mIdx]}</h3>
    <div class="obj">${mText(m)}</div><div class="bar mis"><i id="mfill"></i></div><div class="row"><span id="mprog"></span><span>${T("reward")}: <b>${mReward(m)}</b></span></div>`}
  $("mfill").style.width=(p*100)+"%";
  $("mprog").textContent=m.t==="lawyer"||m.t==="repel"||m.t==="gen"||m.t==="lieut"?Math.round(p*100)+"%":fmt(Math.min(mProg(m),m.n))+" / "+fmt(m.n);
}
function renderMissions(){
  if(tab!=="mis")return;
  $("mlist").innerHTML=MISSIONS.map((m,i)=>{const st=i<S.mIdx?"done":i===S.mIdx?"cur":"";const vis=i<=S.mIdx+1;
    return `<div class="mi ${st}"><div class="ix">${i<S.mIdx?"✓":i+1}</div><div style="min-width:0"><div class="t">${vis?A("missionTitles")[i]:"???"}</div><div class="s">${vis?mText(m):"—"}</div></div><div class="r">${vis?mReward(m):""}</div></div>`}).join("");
}

/* =================== TRAGUARDI =================== */
function achVal(a){switch(a.t){case"clicks":return S.totalClicks;case"life":return S.lifetime;case"ips":return income();case"soldiers":return S.soldiers;case"terr":return terrCount();
  case"raids":return S.raids;case"repel":return S.repelled;case"tips":return S.tips;case"all":return S.owned.every(x=>x>0)?1:0;case"gen":return S.gen;case"mis":return S.mIdx;case"stars":return S.maxStars>=5?1:0;
  case"heists":return S.heistsDone;case"profit":return S.mProfit;case"combo":return S.maxCombo>=50?1:0;case"events":return S.events;case"ltmax":return S.lt.every(x=>x>=LT_MAX)?1:0}}
function achDesc(a){const n=fmt(a.n||0);const k={clicks:"a_clicks",life:"a_life",ips:"a_ips",soldiers:"a_soldiers",terr:"a_terr",raids:"a_raids",repel:"a_repel",tips:"a_tips",all:"a_all",gen:"a_gen",mis:"a_mis",stars:"a_stars",heists:"a_heists",profit:"a_profit",combo:"a_combo",events:"a_events",ltmax:"a_ltmax"}[a.t];
  return T(k,{n:a.t==="terr"||a.t==="gen"||a.t==="mis"||a.t==="raids"||a.t==="repel"||a.t==="tips"||a.t==="heists"||a.t==="events"?a.n:n})}
function checkAch(){ACH.forEach((a,i)=>{if(S.ach[i])return;const need=a.n||1;if(achVal(a)>=need){S.ach[i]=1;toast(T("achUnlocked"),A("achNames")[i],"");beep("ach");news(T("achUnlocked")+": "+A("achNames")[i],"good");if(tab==="ach")renderAch()}})}
function renderAch(){
  $("achcount").textContent=T("achCount",{a:achCount(),b:ACH.length});$("achbonus").textContent=T("achBonus",{p:achCount()*2});
  $("alist").innerHTML=ACH.map((a,i)=>`<div class="ach ${S.ach[i]?"got":""}"><div class="ic">${S.ach[i]?"★":i+1}</div><div style="min-width:0"><div class="t">${A("achNames")[i]}</div><div class="s">${achDesc(a)}</div></div></div>`).join("");
}


/* =================== COMBO =================== */
let combo=0,lastClick=0;
function comboMult(){return 1+combo/25}

/* =================== LUOGOTENENTI =================== */
function lt(i){return (S&&S.lt&&S.lt[i])||0}
function ltCost(i){return LT_BASE[i]*Math.pow(6,lt(i))}
function ltBuy(i){if(lt(i)>=LT_MAX||S.cash<ltCost(i))return;S.cash-=ltCost(i);S.lt[i]=lt(i)+1;
  news(T("ltNews",{l:A("lieutNames")[i],n:S.lt[i]}),"good");beep("buy");renderAll(true)}
let ltKey="";
function renderLt(force){
  const key=CFG.lang+S.lt.join()+"|"+S.lt.map((_,i)=>S.cash>=ltCost(i)?1:0).join();
  if(!force&&key===ltKey)return;ltKey=key;
  $("ltList").innerHTML=LT_BASE.map((_,i)=>{const l=lt(i),mx=l>=LT_MAX;
    return `<div class="item"><div style="min-width:0"><div class="t">${A("lieutNames")[i]}</div>
      <div class="meta"><span>${A("lieutDesc")[i]}</span><span><b>${T("level",{n:l,m:LT_MAX})}</b></span></div>
      <div class="lv">${Array.from({length:LT_MAX},(_,k)=>`<i class="${k<l?"on":""}"></i>`).join("")}</div></div>
      <div class="btns"><button class="btn ${l===0?"hot":""}" data-l="${i}" ${mx||S.cash<ltCost(i)?"disabled":""}>${mx?T("maxed"):T(l===0?"hireLt":"upLt",{v:fmt(ltCost(i))})}</button></div></div>`}).join("");
  $("ltList").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>ltBuy(+b.dataset.l));
}

/* =================== COLPI =================== */
function busy(){return S.heist?S.heist.crew:0}
function avail(){return Math.max(0,S.soldiers-busy())}
function hName(i){return A("heistNames")[i]}
function hDur(i){return Math.round(HEISTS[i].dur*Math.max(.4,1-0.06*lt(3)))}
function hChance(i){return Math.min(.95,HEISTS[i].base+0.04*lt(2))}
function hReward(i){return HEISTS[i].rew+income()*hDur(i)*0.6}
function hUnl(i){return i===0||S.lifetime>=HEISTS[i].prep*3}
function startHeist(i){const h=HEISTS[i];if(S.heist||!hUnl(i)||avail()<h.crew||S.cash<h.prep)return;
  S.cash-=h.prep;const d=hDur(i);S.heist={i,t:d,T:d,crew:h.crew,rew:hReward(i)};beep("buy");
  toast(T("heistRunning",{h:hName(i)}),T("heistRem",{s:d,n:h.crew}),"");renderAll(true)}
function updateHeist(dt){if(!S.heist)return;S.heist.t-=dt;if(S.heist.t>0)return;
  const h=S.heist;S.heist=null;
  if(Math.random()<hChance(h.i)){earn(h.rew);S.heistsDone++;S.heat+=15;
    banner(T("heistOkBig"),hName(h.i)+" · +$"+fmt(h.rew));news(T("heistOk",{h:hName(h.i),v:fmt(h.rew)}),"good");beep("mission");burst(W/2,H*.4,40)}
  else{const lost=Math.ceil(h.crew*0.3);S.soldiers=Math.max(0,S.soldiers-lost);S.heat+=30;
    banner(T("heistFailBig"),T("heistFail",{h:hName(h.i),n:lost}),true);news(T("heistFail",{h:hName(h.i),n:lost}),"hot");beep("bad")}
  renderAll(true)}
let heistKey="";
function renderHeists(force){
  const a=$("heistActive");
  if(S.heist){const h=S.heist;a.hidden=false;
    a.innerHTML=`<div style="min-width:0"><div class="t">${T("heistRunning",{h:hName(h.i)})}</div><div class="meta">${T("heistRem",{s:Math.ceil(h.t),n:fmt(h.crew)})}</div>
      <div class="bar mis" style="margin-top:8px"><i style="width:${((1-h.t/h.T)*100).toFixed(1)}%"></i></div></div>`}
  else a.hidden=true;
  const rows=HEISTS.map((h,i)=>{const u=hUnl(i);return [u,!S.heist&&u&&avail()>=h.crew&&S.cash>=h.prep,fmt(hReward(i))]});
  const key=CFG.lang+JSON.stringify(rows)+lt(2)+lt(3);
  if(!force&&key===heistKey)return;heistKey=key;
  $("heistList").innerHTML=HEISTS.map((h,i)=>{const [u,can,rw]=rows[i];
    return `<div class="item ${u?"":"locked"}"><div style="min-width:0"><div class="t">${hName(i)}</div>
      <div class="meta">${u?`<span>${T("crewReq")}: <b>${fmt(h.crew)}</b></span><span>${T("prepCost")}: <b>$${fmt(h.prep)}</b></span><span>${T("duration")}: <b>${hDur(i)}s</b></span><span>${T("successCh")}: <b>${Math.round(hChance(i)*100)}%</b></span><span>${T("payout")}: <b class="up-c">~$${rw}</b></span>`
        :`<span>${T("heistLocked",{v:fmt(h.prep*3)})}</span>`}</div></div>
      <div class="btns"><button class="btn hot" data-h="${i}" ${can?"":"disabled"}>${T("startHeist")}</button></div></div>`}).join("");
  $("heistList").querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>startHeist(+b.dataset.h));
}

/* =================== MERCATO NERO =================== */
let MKT=GOODS.map(g=>({p:g.b,h:Array(40).fill(g.b)})), mktN=0, qtyM="1";
function whCap(){return 25*Math.pow(2,S.wh)}
function whCost(){return 2000*Math.pow(8,S.wh)}
function invUsed(){return S.inv.reduce((a,b)=>a+b,0)}
function gUnl(i){return i===0||S.lifetime>=GOODS[i].b*20}
function tickMarket(){mktN++;MKT.forEach((m,i)=>{const g=GOODS[i];let lp=Math.log(m.p);
  lp+=0.07*(Math.log(g.b)-lp)+g.v*0.45*(Math.random()+Math.random()+Math.random()-1.5);
  if(Math.random()<0.03)lp+=(Math.random()<.5?-1:1)*g.v*2.5;
  m.p=Math.exp(lp);m.h.push(m.p);m.h.shift()})}
function mQty(){return qtyM==="max"?Infinity:+qtyM}
function mktBuy(i){if(!gUnl(i))return;const n=Math.min(mQty(),whCap()-invUsed(),Math.floor(S.cash/MKT[i].p));if(n<1)return;
  const c=n*MKT[i].p;S.cash-=c;S.basis[i]=(S.basis[i]*S.inv[i]+c)/(S.inv[i]+n);S.inv[i]+=n;beep("buy");renderAll(true)}
function mktSell(i){const n=Math.min(mQty(),S.inv[i]);if(n<1)return;const v=n*MKT[i].p,pr=v-n*S.basis[i];
  S.cash+=v;if(pr>0){S.total+=pr;S.lifetime+=pr}S.mProfit+=pr;S.inv[i]-=n;if(S.inv[i]===0)S.basis[i]=0;beep(pr>=0?"tip":"bad");renderAll(true)}
$("mqty").querySelectorAll("button").forEach(b=>b.onclick=()=>{qtyM=b.dataset.q;$("mqty").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));renderAll(true)});
$("whup").onclick=()=>{if(S.cash<whCost())return;S.cash-=whCost();S.wh++;beep("buy");renderAll(true)};
let mktKey="";
function renderMarket(force){
  $("whinfo").textContent=T("whCap",{a:fmt(invUsed()),b:fmt(whCap())});
  $("whup").textContent=T("whUp",{v:fmt(whCost())});$("whup").disabled=S.cash<whCost();
  const pf=$("mprofit");pf.textContent=(S.mProfit<0?"-$":"+$")+fmt(Math.abs(S.mProfit));pf.className=S.mProfit<0?"dn-c":"up-c";
  const free=whCap()-invUsed();
  const rows=GOODS.map((g,i)=>[gUnl(i),gUnl(i)&&free>0&&S.cash>=MKT[i].p,S.inv[i]>0]);
  const key=CFG.lang+JSON.stringify(rows)+mktN+qtyM;
  if(!force&&key===mktKey)return;mktKey=key;
  $("mktList").innerHTML=GOODS.map((g,i)=>{const m=MKT[i],u=rows[i][0],prev=m.h[m.h.length-2],ch=(m.p/prev-1)*100;
    const mn=Math.min(...m.h),mx=Math.max(...m.h);
    const pts=m.h.map((v,k)=>`${(k/(m.h.length-1)*110).toFixed(1)},${(31-(v-mn)/((mx-mn)||1)*29).toFixed(1)}`).join(" ");
    const pl=S.inv[i]?(m.p-S.basis[i])*S.inv[i]:0;
    return `<div class="item mkt ${u?"":"locked"}"><div style="min-width:0"><div class="t">${A("goods")[i]}</div>
      <div class="meta"><span>${T("price")}: <b>$${fmt(m.p)}</b> <span class="${ch>=0?"up-c":"dn-c"}">${ch>=0?"▲":"▼"}${Math.abs(ch).toFixed(1)}%</span></span>
      ${u?`<span>${T("held")}: <b>${fmt(S.inv[i])}</b></span>${S.inv[i]?`<span>${T("avg")}: <b>$${fmt(S.basis[i])}</b></span><span class="${pl>=0?"up-c":"dn-c"}">${pl>=0?"+":"-"}$${fmt(Math.abs(pl))}</span>`:""}`
        :`<span>${T("lockedGood",{v:fmt(g.b*20)})}</span>`}</div></div>
      <svg class="spark" viewBox="0 0 110 32" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${ch>=0?"#7be07b":"#ff4a4a"}" stroke-width="1.6"/></svg>
      <div class="btns"><button class="btn" data-b="${i}" ${rows[i][1]?"":"disabled"}>${T("buy")}</button><button class="btn" data-s="${i}" ${rows[i][2]?"":"disabled"}>${T("sell")}</button></div></div>`}).join("");
  $("mktList").querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>mktBuy(+b.dataset.b));
  $("mktList").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>mktSell(+b.dataset.s));
}

/* =================== EVENTI A SCELTA =================== */
const EV_COST=[60,90,45,0,120,60];
function spawnEvent(){if(!S||S.ev||!inGame)return;const pool=[0,2,3,4,5];if(terrCount()>0)pool.push(1);
  const k=pool[Math.floor(Math.random()*pool.length)];S.ev={k,t:45,c:Math.max(100,income()*EV_COST[k])};beep("tip");renderEvent(true)}
function updateEvents(dt){
  if(S.ev){S.ev.t-=dt;if(S.ev.t<=0)resolveEvent(false);else renderEvent();return}
  S.nextEvent-=dt;if(S.nextEvent<=0){S.nextEvent=rnd(150,240);if(income()>0&&S.tut<0)spawnEvent()}}
let evKey="";
function renderEvent(force){
  let el=$("evcard");
  if(!S||!S.ev||!inGame){if(el)el.remove();evKey="";return}
  if(!el){el=document.createElement("div");el.id="evcard";document.body.appendChild(el);force=true}
  const e=S.ev,k=e.k,pay=EV_COST[k]>0,can=!pay||S.cash>=e.c,key=k+CFG.lang+can;
  if(force||key!==evKey){evKey=key;
    el.innerHTML=`<h4>${A("evTitle")[k]}</h4><p>${A("evDesc")[k]}</p><div class="stack-gap">
      <button class="btn" id="evA" ${can?"":"disabled"}>${A("evA")[k].split("{v}").join(fmt(e.c))}</button>
      <button class="btn" id="evB">${A("evB")[k]}</button></div><div class="timer" id="evT"></div>`;
    $("evA").onclick=()=>resolveEvent(true);$("evB").onclick=()=>resolveEvent(false)}
  $("evT").textContent=T("evExpire",{s:Math.ceil(e.t)});
}
function resolveEvent(a){const e=S.ev;if(!e)return;const k=e.k;
  if(a&&EV_COST[k]>0){if(S.cash<e.c)return;S.cash-=e.c}
  S.ev=null;S.events++;let res="";
  switch(k){
    case 0:if(a){S.heat=Math.max(0,S.heat-20);res=T("resHeat",{n:"−20"})}else{S.heat+=25;res=T("resHeat",{n:"+25"})}break;
    case 1:if(a){S.nextAttack+=300;S.attack=null;res=T("resTruce")}else{S.nextAttack=Math.min(S.nextAttack,25);res=T("resWar")}break;
    case 2:if(a){S.heat=Math.max(0,S.heat-35);res=T("resHeat",{n:"−35"})}else if(Math.random()<.5){S.heat+=30;res=T("resHeat",{n:"+30"})}else res=T("resLucky");break;
    case 3:if(a){const l=Math.ceil(S.soldiers*.05);S.soldiers-=l;S.heat=Math.max(0,S.heat-15);res=T("resPurge",{n:l})}else{S.heat+=40;res=T("resHeat",{n:"+40"})}break;
    case 4:if(a){if(Math.random()<.55){const v=e.c*3;earn(v);res=T("resGain",{v:fmt(v)})}else res=T("resLost")}else res=T("resNothing");break;
    case 5:if(a){const n=Math.max(2,Math.ceil(S.soldiers*.1));S.soldiers+=n;res=T("resRecruits",{n})}else res=T("resNothing");break}
  toast(A("evTitle")[k],res,a?"good":"");news(A("evTitle")[k]+": "+res);beep(a?"buy":"click");renderEvent();renderAll(true)}

/* =================== TUTORIAL =================== */
const TUT=[
  {sel:null},
  {sel:"#collect",wait:()=>S.cash>=15||S.owned[0]>0},
  {sel:"#rk0",wait:()=>S.owned[0]>0,pre:()=>{if(tab!=="biz")setTab("biz")}},
  {sel:"#curMission"},
  {sel:"#crewcard"},
  {sel:"#heatcard"},
  {sel:"#tabs"},
  {sel:"#gearBtn"}];
function tutHide(){const a=$("tutSpot"),b=$("tutCard");if(a)a.remove();if(b)b.remove()}
function tutRender(){
  if(!S||S.tut<0||!inGame){tutHide();return}
  if(S.tut>=TUT.length){S.tut=-1;tutHide();return}
  let spot=$("tutSpot"),card=$("tutCard");
  if(!spot){spot=document.createElement("div");spot.id="tutSpot";card=document.createElement("div");card.id="tutCard";document.body.append(spot,card)}
  const st=TUT[S.tut],tx=A("tut")[S.tut],lastStep=S.tut===TUT.length-1;
  if(st.pre)st.pre();
  card.innerHTML=`<div class="tstep">${T("tutStep",{a:S.tut+1,b:TUT.length})}</div><h4>${tx[0]}</h4><p>${tx[1]}</p>${tx[2]?`<div class="hint">→ ${tx[2]}</div>`:""}
    <div class="btnrow">${st.wait?"":`<button class="btn hot" id="tutNext">${lastStep?T("tutDone"):T("tutNext")}</button>`}<button class="btn" id="tutSkip">${T("tutSkip")}</button></div>`;
  const nb=$("tutNext");if(nb)nb.onclick=tutAdvance;
  $("tutSkip").onclick=()=>{S.tut=-1;tutHide();save()};
  if(st.sel){const el=document.querySelector(st.sel);if(el)el.scrollIntoView({behavior:"smooth",block:"center"})}
  tutPos();
}
function tutAdvance(){S.tut++;if(S.tut>=TUT.length){S.tut=-1;tutHide();save();return}beep("click");tutRender()}
function tutCheck(){if(S.tut<0)return;const st=TUT[S.tut];if(st&&st.wait&&st.wait())tutAdvance()}
function tutPos(){const spot=$("tutSpot"),card=$("tutCard");if(!spot||!S||S.tut<0)return;const st=TUT[S.tut];if(!st)return;
  const el=st.sel&&document.querySelector(st.sel);const cw=card.offsetWidth,ch=card.offsetHeight;
  if(!el){spot.style.left=W/2+"px";spot.style.top=H/2+"px";spot.style.width="0px";spot.style.height="0px";
    card.style.left=Math.max(12,(W-cw)/2)+"px";card.style.top=Math.max(12,(H-ch)/2)+"px";return}
  const r=el.getBoundingClientRect(),p=6;
  spot.style.left=(r.left-p)+"px";spot.style.top=(r.top-p)+"px";spot.style.width=(r.width+p*2)+"px";spot.style.height=(r.height+p*2)+"px";
  let top=r.bottom+14;if(top+ch>H-10)top=r.top-ch-14;if(top<10)top=Math.max(10,Math.min(H-ch-10,r.top+10));
  const left=Math.max(12,Math.min(W-cw-12,r.left+r.width/2-cw/2));
  card.style.left=left+"px";card.style.top=top+"px";
}
$("tutReplayBtn").onclick=()=>{if(!S||!inGame)return;S.tut=0;show("ovSettings",0);setPause(false);setTab("biz");tutRender()};

/* =================== STELLE =================== */
function buildStars(){const star=`<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"/></svg>`;$("stars").innerHTML=star.repeat(5)}
function shake(id){const c=$(id);c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake")}

/* =================== RETATE / SOFFIATE =================== */
function raid(){const lost=S.cash*0.3,sl=Math.floor(S.soldiers*0.1);S.cash-=lost;S.soldiers-=sl;S.heat=20;S.raids++;
  news(T("raid",{v:fmt(lost),n:sl}),"hot");banner(T("raidBanner"),"-$"+fmt(lost),true);beep("bad");shake("heatcard")}
function removeTip(){const t=$("tip");if(t)t.remove()}
function spawnTip(){if($("tip")||income()<=0||paused||!inGame)return;
  const tips=A("tips");const b=document.createElement("button");b.id="tip";b.textContent=tips[Math.floor(Math.random()*tips.length)];
  b.style.left=rnd(8,70)+"vw";b.style.top=rnd(18,70)+"vh";
  b.onclick=e=>{const v=Math.max(80,income()*60);earn(v);S.tips++;toast(T("luck",{v:fmt(v)}),"","good");beep("tip");burst(e.clientX,e.clientY,24);b.remove();renderAll()};
  document.body.appendChild(b);setTimeout(()=>b.remove(),9000)}

/* =================== TAB =================== */
function setTab(t){tab=t;
  $("tabs").querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.tab===t));
  document.querySelectorAll("[data-pane]").forEach(p=>p.hidden=p.dataset.pane!==t);
  if(t==="set"){$("setPane").appendChild($("setBody"));buildSettings()}
  renderAll(true)}
$("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

/* =================== RENDER =================== */
function renderAll(force){
  if(!S)return;
  const ips=income();
  $("cash").textContent="$"+fmt(S.cash);
  $("ips").textContent="+$"+fmt(ips)+"/s";
  $("clickinfo").textContent=T("perClick",{v:fmt(clickVal())});
  const st=stars();
  $("stars").querySelectorAll("svg").forEach((s,i)=>s.classList.toggle("on",i<st));
  $("stars").classList.toggle("flash",S.heat>=80);
  $("heatfill").style.width=Math.min(100,S.heat)+"%";
  $("heatpct").textContent=Math.floor(S.heat)+"%";
  const hr=heatRate();$("heatrate").textContent=Math.abs(hr)<0.01?T("heatStable"):(hr>0?"+":"")+hr.toFixed(2)+"/s";
  $("lawyer").textContent=T("lawyerBtn",{v:fmt(lawyerCost())});$("lawyer").disabled=S.cash<lawyerCost()||S.heat<5;
  $("sold").textContent=fmt(S.soldiers);$("cap").textContent=fmt(units())+" / "+fmt(capacity());$("def").textContent=fmt(defense());
  const ef=efficiency();$("effpct").textContent=Math.round(ef*100)+"%";$("efffill").style.width=(ef*100)+"%";
  $("effwarn").hidden=ef>=0.999;if(ef<0.999)$("effwarn").textContent=T("lowEff",{p:Math.round(ef*100)});
  $("hire1").textContent=T("hire",{n:1,v:fmt(sCost(1))});$("hire1").disabled=S.cash<sCost(1);
  $("hire10").textContent=T("hire",{n:10,v:fmt(sCost(10))});$("hire10").disabled=S.cash<sCost(10);
  $("resp").textContent=S.respect;$("respbonus").textContent="+"+S.respect*10+"%";$("respnext").textContent="+"+respectGain();$("retire").disabled=respectGain()<1;
  renderCurMission();
  if(tab==="biz"){
    RACKETS.forEach((r,i)=>{const unl=i===0||S.owned[i-1]>0||S.owned[i]>0;$("rk"+i).classList.toggle("locked",!unl);
      $("rn"+i).textContent=S.owned[i];
      const each=r.inc*racketMult(i)*globalMult()*ef;
      $("rm"+i).textContent=unl?`$${fmt(each)}/s ${T("each")} · $${fmt(each*S.owned[i])}/s`:T("unlockAt",{r:rName(i-1)});
      const nx=[10,25,50,100].find(m=>S.owned[i]<m)||100;$("rp"+i).style.width=Math.min(100,S.owned[i]/nx*100)+"%";
      const n=qty==="max"?Math.max(1,rMax(i)):+qty;const c=rCost(i,n);const b=$("rb"+i);
      b.textContent=(qty==="1"?"":"×"+n+" ")+"$"+fmt(c);b.disabled=!unl||S.cash<c});
    renderUps(force);
  }
  const cb=$("combo");cb.hidden=combo<5;if(combo>=5)cb.textContent=T("combo",{v:comboMult().toFixed(1)});
  if(tab==="heist")renderHeists(force);
  if(tab==="market")renderMarket(force);
  if(tab==="fam")renderLt(force);
  if(tab==="map")renderMap(force);
  if(force&&tab==="mis")renderMissions();
  if(force&&tab==="ach")renderAch();
  if(tab==="log"){if(force)renderNews();renderStats()}
}
function renderStats(){
  const h=Math.floor(S.playTime/3600),m=Math.floor(S.playTime/60)%60;
  $("stats").innerHTML=[["stTotal","$"+fmt(S.lifetime)],["stClicks",fmt(S.totalClicks)],["stRaids",S.raids],["stRepel",S.repelled],["stTips",S.tips],["stMissions",S.mIdx+" / "+MISSIONS.length],["stHeists",S.heistsDone],["stProfit",(S.mProfit<0?"-$":"$")+fmt(Math.abs(S.mProfit))],["stEvents",S.events],["stGen",S.gen],["stTime",T("time",{h,m})]]
    .map(([k,v])=>`<dt>${T(k)}</dt><dd>${v}</dd>`).join("");
}

/* =================== LOOP =================== */
let mktT=0,last=performance.now(),acc=0,uiT=0,logicT=0,fpsT=0,frames=0,saveT=0,tipT=0;
function frame(now){
  requestAnimationFrame(frame);
  const target=CFG.fps>0?1000/CFG.fps:0;
  if(target&&now-last<target-1)return;
  const dt=Math.min(0.25,(now-last)/1000);last=now;
  frames++;fpsT+=dt;if(fpsT>=0.5){$("fps").textContent=Math.round(frames/fpsT)+" FPS";frames=0;fpsT=0}
  if(CFG.bg)drawCity(dt);else if(!city.static){bctx.fillStyle="#0b0913";bctx.fillRect(0,0,W,H)}
  drawParts(dt);
  if(inGame&&!paused&&S){
    earn(income()*dt);S.playTime+=dt;
    S.heat=Math.max(0,S.heat+heatRate()*dt);S.maxStars=Math.max(S.maxStars,stars());
    if(S.heat>=100)raid();
    updateAttacks(dt);updateHeist(dt);updateEvents(dt);
    mktT+=dt;if(mktT>=2){mktT=0;tickMarket()}
    if(combo>0&&performance.now()-lastClick>900)combo=0;
    if(S.tut>=0)tutPos();
    logicT+=dt;if(logicT>=0.5){logicT=0;checkMission();checkAch();tutCheck()}
    uiT+=dt;if(uiT>=0.1){uiT=0;renderAll()}
    saveT+=dt;if(saveT>=5){saveT=0;save()}
    tipT+=dt;if(tipT>=20){tipT=0;if(Math.random()<0.4)spawnTip()}
  }
}
addEventListener("resize",resize);
addEventListener("visibilitychange",()=>{if(document.hidden)save()});

/* =================== BOOT =================== */
function boot(data){
  resize();applyCfg();applyTexts();
  if(data&&data.state){startGame(Object.assign(fresh(),data.state),false);if(data.tab){}}
  requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
}
window.claude?.hot?.snapshot?.(()=>({state:inGame?S:null}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
