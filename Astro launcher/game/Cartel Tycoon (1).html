<title>Cartel Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: notte di città sotto i lampioni al sodio — skyline animato dietro, menu a schermo intero, poi la plancia di gioco a due colonne con schede */
:root{
  --night:#0d1117; --asphalt:rgba(22,28,37,.94); --curb:#222b38; --line:#2f3a4a;
  --text:#e6e1d6; --muted:#8e97a6;
  --sodium:#ffa630; --good:#5fd38d; --bad:#ff5a5a; --siren:#4aa3ff;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--text)}
body{font:15px/1.45 var(--f-body);padding-inline:16px;padding-block:14px 40px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.screen{position:relative;z-index:1}
#fps{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:70;font:600 12px var(--f-mono);color:var(--good);background:rgba(0,0,0,.55);padding:3px 7px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:.02em;text-wrap:balance}
button{font:600 14px var(--f-body);cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--curb);color:var(--text);padding:7px 12px}
button:hover:not(:disabled){border-color:var(--sodium);color:var(--sodium)}
button:focus-visible,input:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--sodium);color:#1a1004;border-color:var(--sodium)}
button.primary:hover:not(:disabled){background:#ffbb5c;color:#1a1004}
button.danger{border-color:#5a2424;color:var(--bad)}
input[type=number]{font:14px var(--f-mono);width:66px;background:var(--night);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* menu */
#menu{min-height:calc(100vh - 54px);display:grid;align-content:center;justify-items:start;max-width:1240px;margin:0 auto;padding-block:20px}
.logo{font:900 clamp(56px,13vw,150px)/.82 var(--f-display);text-transform:uppercase;color:var(--sodium);text-shadow:0 0 40px rgba(255,166,48,.4)}
.logo span{display:block;color:var(--text);text-shadow:none}
.tag{margin:14px 0 30px;color:var(--muted);font-size:14px;letter-spacing:.2em;text-transform:uppercase}
.mbtns{display:grid;gap:10px;width:min(360px,100%)}
.mbtns button{font:800 24px var(--f-display);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:12px 18px;background:rgba(13,17,23,.78);display:grid;gap:2px}
.mbtns button small{font:500 12px var(--f-body);letter-spacing:.04em;text-transform:none;color:var(--muted)}
.mbtns button.primary{background:var(--sodium);color:#1a1004}
.mbtns button.primary small{color:#5a3a0a}
.ver{margin-top:28px;font:12px var(--f-mono);color:var(--muted)}

/* settings */
#settings .box{max-width:600px;margin:6vh auto 0;background:var(--asphalt);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:18px}
#settings h2{font-size:40px;font-weight:900;text-transform:uppercase;color:var(--sodium)}
.set{display:grid;gap:8px}
.set .k,.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed=true],.tabs button[aria-selected=true]{background:var(--sodium);color:#1a1004;border-color:var(--sodium)}
.setfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}

/* game header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-size:clamp(34px,6vw,54px);font-weight:900;line-height:.85;color:var(--sodium);text-transform:uppercase;text-shadow:0 0 24px rgba(255,166,48,.35)}
.brand .rank{font:600 13px var(--f-mono);color:var(--muted);margin-top:6px}
.xpbar{height:4px;width:220px;max-width:100%;background:var(--curb);border-radius:2px;margin-top:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--sodium)}
.where{text-align:right;display:flex;gap:14px;align-items:flex-end}
.where .zone{font:800 28px var(--f-display);text-transform:uppercase;line-height:1}
.where .day{font-family:var(--f-mono);color:var(--sodium)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{background:var(--asphalt);padding:10px 12px;min-width:0}
.stat .v{font:600 18px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:5px;border-radius:3px;background:var(--night);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;transition:width .4s}

.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--asphalt);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.panel h2{font-size:24px;font-weight:800;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.panel h2 small{font:500 12px var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:none}
.col{display:grid;gap:14px;align-content:start;min-width:0}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--curb);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.prod b{font:800 18px var(--f-display);letter-spacing:.03em;text-transform:uppercase}
td.prod span{display:block;font-size:12px;color:var(--muted)}
td.prod em{display:block;font-style:normal;font-size:12px;color:var(--siren)}
.low{color:var(--bad)}
.trend-up{color:var(--good)} .trend-down{color:var(--bad)}
.na{color:var(--muted);font-style:italic}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts button{padding:6px 9px}

.travel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.travel button{text-align:left;padding:10px 12px;display:grid;gap:2px}
.travel button b{font:800 19px var(--f-display);text-transform:uppercase}
.travel button span{font:500 12px var(--f-body);color:var(--muted)}
.travel button.here{border-color:var(--sodium);background:rgba(255,166,48,.08)}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{padding:6px 10px;font-size:13px;position:relative}
.tabs button .dot{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--good)}

.chip{display:inline-block;font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid #24553a;color:var(--good)}
.chip.lock{border-color:var(--line);color:var(--muted)}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px}
.item header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.item header b{font:800 18px var(--f-display);text-transform:uppercase}
.item .meta{font-size:13px;color:var(--muted)}
.item.done{border-color:#24553a}
.item.locked{opacity:.6}
.pbar{height:5px;background:var(--night);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good)}
.svc{display:grid;gap:8px}
.svc .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--curb)}
.svc .row:first-child{border-top:0}
.svc .row div{min-width:0}
.svc .row small{display:block;color:var(--muted);font-size:12px}
.inv{display:grid;gap:4px;font-size:14px}
.inv div{display:flex;justify-content:space-between;gap:8px}
.empty{color:var(--muted);font-size:13px;margin:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv span:nth-child(even){font-family:var(--f-mono);text-align:right}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ach div{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:12px;color:var(--muted)}
.ach div b{display:block;font:800 15px var(--f-display);text-transform:uppercase;color:var(--muted)}
.ach div.on{border-color:var(--sodium)}
.ach div.on b{color:var(--sodium)}

.log{max-height:220px;overflow-y:auto;display:grid;gap:4px;font-size:13px}
.log p{margin:0;padding-left:10px;border-left:2px solid var(--line)}
.log p.g{border-color:var(--good)} .log p.b{border-color:var(--bad)} .log p.s{border-color:var(--siren)} .log p.a{border-color:var(--sodium)}
.log p .d{font-family:var(--f-mono);color:var(--muted);margin-right:6px}

.modal{position:fixed;inset:0;background:rgba(5,7,10,.78);display:grid;place-items:center;padding:16px;z-index:50}
.modal .box{background:#161c25;border:1px solid var(--line);border-radius:12px;max-width:460px;width:100%;padding:20px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal.siren .box{animation:siren 1s infinite alternate;border-width:2px}
@keyframes siren{from{border-color:var(--bad)}to{border-color:var(--siren)}}
.modal h3{font-size:32px;font-weight:900;text-transform:uppercase;color:var(--sodium);line-height:1}
.modal p{margin:0}
.modal .btns{display:flex;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion:reduce){.modal.siren .box{animation:none;border-color:var(--bad)}.meter i{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--curb);border:1px solid var(--sodium);padding:8px 14px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.foot{color:var(--muted);font-size:12px;text-align:center}
.tut-back{position:fixed;inset:0;background:rgba(5,7,10,.66);z-index:40}
.tut-hl{position:relative;z-index:42;box-shadow:0 0 0 3px var(--sodium),0 0 36px rgba(255,166,48,.45)}
.tut{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;width:min(560px,calc(100% - 32px));background:#161c25;border:1px solid var(--sodium);border-radius:12px;padding:16px 18px;display:grid;gap:8px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.tut .step{font:600 12px var(--f-mono);color:var(--muted);letter-spacing:.1em}
.tut h3{font-size:30px;font-weight:900;text-transform:uppercase;color:var(--sodium);line-height:1}
.tut p{margin:0;max-width:62ch}
.tut .tbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.tut .ghost{background:none;border-color:transparent;color:var(--muted);padding-inline:4px}
.tut .dots{display:flex;gap:4px}
#gHelp{font:800 16px var(--f-display);width:36px;padding:7px 0}
</style>

let S=null,screen='menu',tab='spots';
const invCount=()=>S?Object.values(S.inv).reduce((a,b)=>a+b,0):0;
const cap=()=>BAGS[S.bag].cap;
const avgPrice=id=>(P[id].min+P[id].max)/2;
const has=u=>!!(S&&S.upg[u]);
function netWorth(st=S){
  let g=0;Object.entries(st.inv).forEach(([k,q])=>g+=q*avgPrice(k));
  Object.values(st.spots).forEach(s=>Object.entries(s.stock).forEach(([k,q])=>g+=q*avgPrice(k)*.8));
  Object.entries(st.biz||{}).forEach(([id,lv])=>{const b=BIZ.find(x=>x.id===id);let inv=0;for(let i=0;i<lv;i++)inv+=b.cost*Math.pow(1.6,i);g+=inv*.6});
  return st.cash+st.bank-st.debt+g;
}
function log(k,p,c=''){S.log.unshift({d:S.day,k,p:p||{},c});S.log=S.log.slice(0,100)}

function addXp(n){
  const before=levelOf(S.xp);S.xp=Math.max(0,Math.round(S.xp+n));const after=levelOf(S.xp);
  if(after>before){log('l.level',{x:lvlName(after)},'a');queue.push(()=>modal(t('e.lvl'),esc(t('e.lvlT',{x:lvlName(after),n:after})),[{label:t('e.ok'),cls:'primary',fn:nextEvent}]))}
}

function newGame(){
  const d=DIFF[SET.diff]||DIFF.normal;
  const zmul={};ZONES.forEach(z=>{zmul[z.id]={};PRODUCTS.forEach(p=>zmul[z.id][p.id]=rnd(.8,1.25))});
  S={day:1,maxDays:SET.len,cash:d.cash,debt:d.debt,rate:d.rate,heatMul:d.heat,diff:SET.diff,bank:0,health:100,heat:10,bag:0,zone:'stazione',
     inv:{},cost:{},prices:{},prev:{},supply:{},demand:{},zmul,guns:0,lawyer:0,spots:{},biz:{},upg:{},missions:[],ach:{},xp:0,
     stats:{revenue:0,units:0,missions:0,raids:0,escapes:0,fights:0,bizInc:0},log:[],over:false};
  rollMarket();
  log('l.start1',{M:d.cash,M2:d.debt},'a');log('l.start2',{n:S.maxDays},'a');
  S.missions.push(genMission(),genMission());
  queue=[];tab='spots';save();show('game');
  if(!load(KEY_TUT))startTutorial();
}
function rollMarket(){
  S.prev=S.prices;S.prices={};S.supply={};S.demand={};
  ZONES.forEach(z=>{S.prices[z.id]={};S.supply[z.id]={};S.demand[z.id]={};
    PRODUCTS.forEach(p=>{
      if(Math.random()<.18){S.prices[z.id][p.id]=null;S.supply[z.id][p.id]=0;S.demand[z.id][p.id]=0;return}
      S.prices[z.id][p.id]=Math.round(rnd(p.min,p.max)*S.zmul[z.id][p.id]);
      S.supply[z.id][p.id]=ri(p.sup[0],p.sup[1]);
      S.demand[z.id][p.id]=Math.round(ri(p.sup[0],p.sup[1])*rnd(.7,1.2)*z.dem);
    })});
}
function heatUp(n){S.heat=clamp(S.heat+Math.round(n*S.heatMul*(has('phone')?.7:1)),0,100)}
function hurt(n){const d=Math.round(n*(has('vest')?.6:1));S.health-=d;return d}

/* ================= MISSIONI ================= */
function genMission(){
  const lv=levelOf(S.xp);const types=['deliver','deliver','sell'];
  const free=ZONES.filter(z=>!S.spots[z.id]&&!S.missions.some(m=>m.type==='spot'&&m.z===z.id));
  if(free.length&&Object.keys(S.spots).length<4)types.push('spot');
  const type=types[ri(0,types.length-1)];
  const m={id:Date.now()+'-'+ri(0,9999),type,due:S.day+ri(3,7)};
  if(type==='deliver'){
    const p=PRODUCTS[ri(0,Math.min(5,1+Math.floor(lv/1.5)))];
    const zs=ZONES.filter(z=>z.id!==S.zone);m.z=zs[ri(0,zs.length-1)].id;m.p=p.id;
    m.q=clamp(Math.round(rnd(1500,9000)*(1+lv*.35)/avgPrice(p.id)),2,150);
    m.reward=Math.round(m.q*avgPrice(p.id)*1.6);m.xp=40+lv*10;
  }else if(type==='sell'){
    m.target=Math.round(rnd(5000,20000)*(1+lv*.5)/500)*500;m.base=S.stats.revenue;
    m.reward=Math.round(m.target*.25);m.xp=50+lv*10;m.due=S.day+ri(4,8);
  }else{
    m.z=free[ri(0,free.length-1)].id;m.reward=3000+lv*500;m.xp=60;m.due=S.day+ri(4,7);
  }
  return m;
}
function missionReady(m){
  if(m.type==='deliver')return S.zone===m.z&&(S.inv[m.p]||0)>=m.q;
  if(m.type==='sell')return S.stats.revenue-m.base>=m.target;
  return !!S.spots[m.z];
}
function completeMission(id){
  const m=S.missions.find(x=>x.id===id);if(!m||!missionReady(m))return;
  if(m.type==='deliver'){S.inv[m.p]-=m.q;if(!S.inv[m.p]){delete S.inv[m.p];delete S.cost[m.p]}}
  S.cash+=m.reward;S.stats.missions++;
  S.missions=S.missions.filter(x=>x.id!==id);
  log('l.mDone',{M:m.reward,x:m.xp},'g');addXp(m.xp);render();nextEvent();
}

/* ================= COMMERCIO ================= */
function qtyOf(id){const v=parseInt($('q-'+id).value,10);return isNaN(v)||v<1?0:v}
function buy(id){
  const pr=S.prices[S.zone][id];if(!pr||S.over)return;
  const free=cap()-invCount(),sup=S.supply[S.zone][id],want=qtyOf(id);
  const q=Math.min(want,free,sup,Math.floor(S.cash/pr));
  if(q<=0){toast(sup<=0?t('t.supply',{n:0}):free<=0?t('t.full'):t('t.noCash'));return}
  if(want>sup)toast(t('t.supply',{n:sup}));
  const old=S.inv[id]||0;
  S.cost[id]=Math.round(((S.cost[id]||0)*old+pr*q)/(old+q));
  S.inv[id]=old+q;S.cash-=pr*q;S.supply[S.zone][id]-=q;heatUp(Math.ceil(q*pr/4000));
  log('l.bought',{q,P:id,M:pr});render();
}
function sell(id){
  const pr=S.prices[S.zone][id];if(!pr||S.over)return;
  const dem=S.demand[S.zone][id],want=Math.min(qtyOf(id),S.inv[id]||0);
  const q=Math.min(want,dem);
  if(want<=0){toast(t('t.noneSell'));return}
  if(q<=0){toast(t('t.demand',{n:0}));return}
  if(want>dem)toast(t('t.demand',{n:dem}));
  const profit=(pr-(S.cost[id]||0))*q;
  S.inv[id]-=q;if(!S.inv[id]){delete S.inv[id];delete S.cost[id]}
  S.cash+=pr*q;S.demand[S.zone][id]-=q;S.stats.revenue+=pr*q;S.stats.units+=q;
  heatUp(Math.ceil(q*pr/3000));
  log('l.sold',{q,P:id,M:pr},'g');
  addXp(Math.max(1,profit/400));
  render();nextEvent();
}
function setMax(id){const pr=S.prices[S.zone][id];$('q-'+id).value=pr?Math.max(0,Math.min(cap()-invCount(),S.supply[S.zone][id],Math.floor(S.cash/pr))):0}

/* ================= NOTTE ================= */
function advance(dest){
  if(S.over)return;
  S.day++;queue=[];
  if(S.debt>0)S.debt=Math.round(S.debt*(1+S.rate/100));
  S.bank=Math.round(S.bank*1.01);
  let cover=0,inc=0;
  Object.entries(S.biz).forEach(([id,lv])=>{const b=BIZ.find(x=>x.id===id);inc+=b.inc*lv;cover+=b.heat});
  if(inc){S.cash+=inc;S.stats.bizInc+=inc;log('l.bizInc',{M:inc},'g')}
  S.heat=clamp(S.heat-7-cover+Object.keys(S.spots).length*2,0,100);
  rollMarket();runSpots();
  if(dest){S.zone=dest;log('l.travel',{Z:dest})}else log('l.wait',{Z:S.zone});
  // missioni
  S.missions=S.missions.filter(m=>{if(S.day>m.due&&!missionReady(m)){const pen=20;S.xp=Math.max(0,S.xp-pen);log('l.mFail',{x:pen},'b');return false}return true});
  if(S.missions.length<3&&(S.missions.length===0||Math.random()<.55)){S.missions.push(genMission());log('l.mNew',{},'a')}
  marketNews();travelEvents();
  if(S.day>S.maxDays)queue.push(endGame);
  render();nextEvent();
}
function marketNews(){
  if(Math.random()>=.35)return;
  const p=PRODUCTS[ri(0,PRODUCTS.length-1)],z=ZONES[ri(0,ZONES.length-1)];
  if(Math.random()<.5){S.prices[z.id][p.id]=Math.round(p.min*rnd(.25,.5));S.supply[z.id][p.id]=p.sup[1]*3;log('l.crash',{P:p.id,Z:z.id},'g')}
  else{S.prices[z.id][p.id]=Math.round(p.max*rnd(1.8,3));S.supply[z.id][p.id]=0;S.demand[z.id][p.id]=p.sup[1]*2;log('l.spike',{P:p.id,Z:z.id},'a')}
}
function travelEvents(){
  const z=Zd[S.zone],car=has('car')?.8:1;
  const cop=clamp((S.heat/100)*.55*z.risk*car+(invCount()>0?.05:0),0,.75);
  if(Math.random()<cop){queue.push(policeStop);return}
  const r=Math.random();
  if(r<.08*car&&S.cash>200)queue.push(mugging);
  else if(r<.14)queue.push(findStash);
  else if(r<.20&&S.debt>0&&S.day>8)queue.push(loanShark);
  else if(r<.26&&Object.keys(S.spots).length)queue.push(rivalCrew);
  else if(r<.31)queue.push(cheapDeal);
}
function runSpots(){
  Object.entries(S.spots).forEach(([zid,sp])=>{
    const pay=sp.dealers*DEALER_PAY;
    if(S.cash>=pay)S.cash-=pay;
    else{const lost=Math.max(1,sp.dealers-Math.floor(S.cash/DEALER_PAY));S.cash=0;sp.dealers=Math.max(0,sp.dealers-lost);log('l.unpaid',{Z:zid,n:lost},'b')}
    const raid=.04*Zd[zid].risk+sp.dealers*.01+S.heat/1200-(S.lawyer?.03:0);
    if(sp.dealers>0&&Math.random()<raid){
      const q=Object.values(sp.stock).reduce((a,b)=>a+b,0);sp.stock={};
      const n=Math.ceil(sp.dealers/2);sp.dealers-=n;heatUp(12);S.stats.raids++;
      log('l.raid',{Z:zid,q,n},'s');
    }else{
      let capa=sp.dealers*ri(5,10),earned=0;
      PRODUCTS.slice().reverse().forEach(p=>{
        const have=sp.stock[p.id]||0;if(!have||capa<=0)return;
        const price=S.prices[zid][p.id]||Math.round(avgPrice(p.id)*S.zmul[zid][p.id]);
        const q=Math.min(have,capa);capa-=q;sp.stock[p.id]-=q;if(!sp.stock[p.id])delete sp.stock[p.id];
        earned+=Math.round(q*price*.85);S.stats.units+=q;});
      if(earned){S.cash+=earned;sp.earned+=earned;S.stats.revenue+=earned;addXp(earned/2000);log('l.earn',{Z:zid,M:earned},'g')}
    }
    if(sp.dealers<=0){delete S.spots[zid];log('l.closed',{Z:zid},'b')}
  });
}

/* ================= EVENTI ================= */
function loseInv(f){let lost=0;Object.keys(S.inv).forEach(k=>{const q=Math.ceil(S.inv[k]*f);S.inv[k]-=q;lost+=q;if(S.inv[k]<=0){delete S.inv[k];delete S.cost[k]}});return lost}
function checkDeath(){if(S.health<=0){S.health=0;queue=[endGame]}}
function policeStop(){
  const n=ri(1,3)+Math.floor(S.heat/35);
  const bribe=Math.round(400+S.heat*40+invCount()*15);
  modal(t('e.police'),esc(t('e.policeT',{n,Z:S.zone,q:invCount(),M:S.cash})),[
    {label:t('e.run'),cls:'primary',fn:()=>{
      if(Math.random()<clamp(.65-n*.08+S.health/400+(has('shoes')?.15:0),.15,.92)){log('l.escaped',{},'g');S.stats.escapes++;heatUp(5)}
      else{const d=hurt(ri(8,25));const q=loseInv(.5);heatUp(10);log('l.caught',{q,n:d},'s');checkDeath()}
      nextEvent();}},
    {label:t('e.bribe',{M:bribe}),disabled:S.cash<bribe,fn:()=>{S.cash-=bribe;S.heat=clamp(S.heat-8,0,100);log('l.bribed',{M:bribe},'a');nextEvent()}},
    {label:t('e.fight'),cls:'danger',disabled:S.guns<1,fn:()=>{
      if(Math.random()<clamp(.25+S.guns*.18-n*.07,.1,.85)){heatUp(25);const c=ri(200,800)*n;S.cash+=c;S.stats.fights++;log('l.fightW',{M:c},'b');addXp(30)}
      else{const d=hurt(ri(25,50));loseInv(1);heatUp(20);log('l.fightL',{n:d},'s');checkDeath()}
      nextEvent();}}],true);
}
function mugging(){
  const take=Math.round(S.cash*rnd(.15,.4));
  modal(t('e.mug'),esc(t('e.mugT')),[
    {label:t('e.give',{M:take}),fn:()=>{S.cash-=take;log('l.robbed',{M:take},'b');nextEvent()}},
    {label:t('e.resist'),cls:'danger',fn:()=>{
      if(Math.random()<.35+S.guns*.2){log('l.repelled',{},'g');addXp(10)}
      else{const d=hurt(ri(10,30));S.cash-=take;log('l.beaten',{n:d,M:take},'b');checkDeath()}
      nextEvent();}}]);
}
function findStash(){
  const p=PRODUCTS[ri(0,3)].id;const q=Math.min(ri(3,12),cap()-invCount());
  if(q<=0){nextEvent();return}
  modal(t('e.stash'),esc(t('e.stashT',{q,P:p})),[
    {label:t('e.take'),cls:'primary',fn:()=>{S.inv[p]=(S.inv[p]||0)+q;S.cost[p]=S.cost[p]||0;log('l.found',{q,P:p},'g');nextEvent()}},
    {label:t('e.leave'),fn:nextEvent}]);
}
function loanShark(){
  const due=Math.round(S.debt*.25);
  modal(t('e.shark'),esc(t('e.sharkT',{M:due})),[
    {label:t('e.pay',{M:due}),cls:'primary',disabled:S.cash<due,fn:()=>{S.cash-=due;S.debt-=due;log('l.sharkPaid',{M:due},'a');nextEvent()}},
    {label:t('e.broke'),cls:'danger',fn:()=>{const d=hurt(ri(15,35));log('l.sharkHurt',{n:d},'b');checkDeath();nextEvent()}}]);
}
function rivalCrew(){
  const ids=Object.keys(S.spots);const zid=ids[ri(0,ids.length-1)];const sp=S.spots[zid];
  const cost=1500+sp.dealers*300;
  modal(t('e.rival'),esc(t('e.rivalT',{Z:zid})),[
    {label:t('e.defend'),cls:'primary',fn:()=>{
      if(Math.random()<clamp(.3+sp.dealers*.08+S.guns*.15,.1,.9)){heatUp(8);log('l.defended',{Z:zid},'g');addXp(25)}
      else{delete S.spots[zid];log('l.lostSpot',{Z:zid},'b')}
      nextEvent();}},
    {label:t('e.peace',{M:cost}),disabled:S.cash<cost,fn:()=>{S.cash-=cost;log('l.peace',{M:cost},'a');nextEvent()}},
    {label:t('e.cede'),fn:()=>{Object.entries(sp.stock).forEach(([k,q])=>{S.inv[k]=(S.inv[k]||0)+q;S.cost[k]=S.cost[k]||0});delete S.spots[zid];log('l.ceded',{Z:zid},'b');nextEvent()}}]);
}
function cheapDeal(){
  const p=PRODUCTS[ri(1,4)];const price=Math.round(p.min*.6);
  const q=Math.min(ri(5,20),cap()-invCount(),Math.floor(S.cash/price));
  if(q<=0){nextEvent();return}
  modal(t('e.deal'),esc(t('e.dealT',{q,P:p.id,M:price})),[
    {label:t('e.accept',{M:q*price}),cls:'primary',fn:()=>{
      S.cash-=q*price;
      if(Math.random()<.2){heatUp(20);log('l.sting',{},'s')}
      else{const old=S.inv[p.id]||0;S.cost[p.id]=Math.round(((S.cost[p.id]||0)*old+price*q)/(old+q));S.inv[p.id]=old+q;log('l.deal',{q,P:p.id},'g')}
      nextEvent();}},
    {label:t('e.refuse'),fn:nextEvent}]);
}
function endGame(){
  S.over=true;
  const score=Math.round(netWorth()),dead=S.health<=0;
  const best=load(KEY_BEST)||0,isBest=!dead&&score>best;
  if(isBest)store(KEY_BEST,score);
  const rank=dead?'r.dead':score>1000000?'r.king':score>250000?'r.boss':score>60000?'r.cap':score>0?'r.street':'r.sunk';
  log(dead?'l.dead':'l.end',{M:score},'a');save();
  modal(t(rank),esc(t('end.final'))+': <b class="num">'+money(score)+'</b><br>'+esc(t('end.detail',{M:S.cash,M2:S.bank,M3:S.debt}))+'<br>'+esc(lvlName(levelOf(S.xp)))+' · Lv '+levelOf(S.xp)+(isBest?'<br><b style="color:var(--sodium)">'+esc(t('end.record'))+'</b>':''),[
    {label:t('end.again'),cls:'primary',fn:newGame},
    {label:t('end.menu'),fn:()=>{del(KEY_SAVE);show('menu')}}]);
}

    {l:t('sv.dep'),dis:S.cash<=0,fn:()=>{log('l.dep',{M:S.cash});S.bank+=S.cash;S.cash=0}},
    {l:t('sv.wd'),dis:S.bank<=0,fn:()=>{log('l.wd',{M:S.bank});S.cash+=S.bank;S.bank=0}}]});
  if(z.svc.includes('avvocato'))rows.push({t:t('sv.law'),s:t('sv.lawS'),b:[
    {l:t('sv.pay',{M:3000}),dis:S.cash<3000||S.heat<=0,fn:()=>{S.cash-=3000;S.heat=clamp(S.heat-30,0,100);S.lawyer=1;log('l.law',{},'a')}}]});
  if(z.svc.includes('armi')){const c=2500+S.guns*1500;

document.addEventListener('click',e=>{

  if(d.md){S.missions=S.missions.filter(m=>m.id!==d.md);render();return}

  if(d.upg){const u=UPGS.find(x=>x.id===d.upg);if(u&&!has(u.id)&&S.cash>=u.cost){S.cash-=u.cost;S.upg[u.id]=1;log('l.upg',{x:tr(u.n)},'a');addXp(20)}render();nextEvent();return}
  if(d.biz){const bz=BIZ.find(x=>x.id===d.biz),own=S.biz[bz.id]||0,c=Math.round(bz.cost*Math.pow(1.6,own));
    if(own<3&&S.cash>=c&&levelOf(S.xp)>=bz.lvl){S.cash-=c;S.biz[bz.id]=own+1;log(own?'l.bizUp':'l.bizBuy',{x:tr(bz.n),n:own+1},'a');addXp(own?30:50)}
    render();nextEvent();return}
  if(d.sp){const sp=S.spots[S.zone];if(!sp)return;
    if(d.sp==='stock'){let q=0;Object.entries(S.inv).forEach(([k,v])=>{sp.stock[k]=(sp.stock[k]||0)+v;q+=v});S.inv={};S.cost={};if(q)log('l.left',{q,Z:S.zone})}

    if(d.sp==='hire'&&S.cash>=DEALER_COST){S.cash-=DEALER_COST;sp.dealers++;log('l.hired',{Z:S.zone},'a')}
    render();}
});

const cv=$('bg'),cx=cv.getContext('2d');
let W=0,H=0,blds=[],drops=[],raf=0,last=0,acc=0,frames=0,fpsT=0;
function resize(){
  const DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
  blds=[];let x=-10;
  while(x<W+10){const w=rnd(40,110),h=rnd(H*.18,H*.55);const wins=[];
    for(let yy=H-h+14;yy<H-14;yy+=16)for(let xx=x+8;xx<x+w-10;xx+=14)if(Math.random()<.45)wins.push([xx,yy,Math.random()<.85,rnd(0,1)]);
    blds.push({x,w,h,wins});x+=w+rnd(2,12)}
  drops=Array.from({length:Math.round(W/9)},()=>({x:rnd(0,W),y:rnd(0,H),v:rnd(500,900),l:rnd(8,18)}));
  if(!SET.anim){cx.fillStyle='#0d1117';cx.fillRect(0,0,W,H)}
}
function draw(dt,now){
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0d14');g.addColorStop(1,'#1a1410');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  const heat=(screen==='game'&&S)?S.heat/100:.15;
  if(heat>.2){const ph=Math.sin(now/220);cx.fillStyle=ph>0?'rgba(255,60,60,'+(heat*.12*ph)+')':'rgba(60,140,255,'+(heat*.12*-ph)+')';cx.fillRect(0,0,W,H)}
  const rg=cx.createRadialGradient(W*.5,-40,10,W*.5,-40,H*.9);rg.addColorStop(0,'rgba(255,166,48,.22)');rg.addColorStop(1,'rgba(255,166,48,0)');
  cx.fillStyle=rg;cx.fillRect(0,0,W,H);
  for(const b of blds){
    cx.fillStyle='#07090d';cx.fillRect(b.x,H-b.h,b.w,b.h);
    for(const wn of b.wins){
      if(Math.random()<.0008*dt)wn[2]=!wn[2];
      if(wn[2]){cx.fillStyle=wn[3]>.8?'rgba(140,190,255,.55)':'rgba(255,190,90,'+(.35+wn[3]*.35)+')';cx.fillRect(wn[0],wn[1],7,9)}
    }
  }
  cx.strokeStyle='rgba(170,190,220,.22)';cx.lineWidth=1;cx.beginPath();
  for(const d of drops){d.y+=d.v*dt/1000;d.x-=d.v*dt/9000;if(d.y>H){d.y=-20;d.x=rnd(0,W+40)}cx.moveTo(d.x,d.y);cx.lineTo(d.x-d.l*.12,d.y+d.l)}
  cx.stroke();
}
function loop(now){
  raf=requestAnimationFrame(loop);
  const dt=last?now-last:16;last=now;
  const target=SET.fps?1000/SET.fps:0;
  acc+=dt;
  if(target&&acc<target-.5)return;
  const step=target?acc:dt;acc=target?acc%target:0;
  if(SET.anim)draw(Math.min(step,100),now);
  frames++;
  if(now-fpsT>=500){$('fps').textContent=Math.round(frames*1000/(now-fpsT))+' FPS';frames=0;fpsT=now}
}
function applyFpsSettings(){$('fps').hidden=!SET.showFps;if(!SET.anim){cx.fillStyle='#0d1117';cx.fillRect(0,0,W,H)}}
addEventListener('resize',resize);

/* ================= AVVIO ================= */
function start(data){
  const s=load(KEY_SET);if(s)SET=Object.assign(SET,s);
  if(data&&data.S){S=data.S;tab=data.tab||'spots'}
  resize();applyFpsSettings();
  if(!raf)raf=requestAnimationFrame(loop);
  show(data&&data.screen&&data.S?data.screen:'menu');
}
window.claude?.hot?.snapshot?.(()=>({S,screen,tab}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
