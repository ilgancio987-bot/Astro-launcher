<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zombie Anarchy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800;900&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Special+Elite&family=Oswald:wght@500;700&family=PT+Sans+Narrow:wght@400;700&family=PT+Mono&display=swap">
<style>
/* Layout: sezione del bunker su canvas a sinistra, console di comando a destra; menu principale a tutto schermo sopra il gioco */
:root{
  --bg:#100f0c; --panel:#1b1914; --panel2:#25221b; --line:#3a3428; --line2:#4d4535; --fg:#ece4cd; --muted:#9d937b;
  --amber:#f2a531; --amber-dim:#8a5c17; --hazard:#e4532c; --rot:#9cc449; --steel:#6b7573; --ice:#9fd3ff;
  --display:'Big Shoulders Stencil Display','Oswald',Impact,'Arial Narrow',sans-serif;
  --body:'Barlow Semi Condensed','PT Sans Narrow','Arial Narrow',Arial,sans-serif;
  --log:'Special Elite','PT Mono','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:radial-gradient(120% 80% at 50% 0%,#1d1a14 0%,var(--bg) 60%) fixed;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{display:flex;flex-direction:column;min-height:100%;padding-inline:16px;padding-block:10px 16px;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:4px 10px;border-bottom:1px solid var(--line);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:3px;background:repeating-linear-gradient(-45deg,var(--amber) 0 8px,#17140f 8px 16px);opacity:.55}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:900;font-size:32px;letter-spacing:.04em;margin:0;line-height:1;color:var(--amber);text-transform:uppercase;text-shadow:0 0 18px rgba(242,165,49,.25)}
#clock{font-family:var(--log);color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.res{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{display:flex;align-items:center;gap:6px;background:linear-gradient(#211e18,#191712);border:1px solid var(--line);padding:4px 10px 4px 7px;border-radius:4px;font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.chip svg{width:18px;height:18px;flex:none}
.chip .lab{display:flex;flex-direction:column;line-height:1.05}
.chip small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.chip b{font-size:16px;font-weight:700}
.chip .cap{color:var(--muted);font-size:12px;font-weight:500}
.chip .tr{font-size:11px;width:10px}
.chip.low{border-color:var(--hazard);background:linear-gradient(#2c1913,#1d1410)}
.chip.low b{color:var(--hazard)}
#r-food svg{color:#d7b46a}#r-energy svg{color:var(--amber)}#r-scrap svg{color:#a9b2ae}#r-pop svg{color:#c9bfa6}#r-door svg{color:var(--rot)}
.up{color:var(--rot)} .down{color:var(--hazard)}
.hbtns{display:flex;gap:8px;align-items:center}
.speed{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.speed button{background:var(--panel);border:0;border-left:1px solid var(--line);padding:6px 11px;font-weight:700;font-variant-numeric:tabular-nums}
.speed button:first-child{border-left:0}
.speed button[aria-pressed="true"]{background:var(--amber);color:#1a1307}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;flex:1;min-height:0}
@media (min-width:980px){main{grid-template-columns:minmax(0,1fr) 350px}}
@media (max-width:979px){.res{flex:1 1 100%;order:3}.hbtns{margin-left:auto}h1{font-size:26px}}
#stage{position:relative;overflow:hidden;border:1px solid var(--line2);border-radius:4px;background:#0a0908;align-self:start;max-width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.6)}
#stage.alarm{border-color:var(--hazard);animation:alarm 1s steps(2) infinite}
@keyframes alarm{50%{border-color:#5a1d10}}
canvas{display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
canvas.drag{cursor:grabbing}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;align-items:stretch;background:rgba(14,12,10,.88);border:1px solid var(--line2);border-radius:4px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#zoom button{background:transparent;border:0;border-left:1px solid var(--line);width:38px;height:36px;font-weight:700;font-size:19px;line-height:1;display:grid;place-items:center}
#zoom button:first-child{border-left:0}
#zoom button:hover{background:var(--panel2);color:var(--amber)}
#zoom output{min-width:54px;display:grid;place-items:center;font:600 12px var(--log);border-left:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;pointer-events:none;width:max-content;max-width:90%}
.toast{background:rgba(18,16,12,.94);border:1px solid var(--line2);border-left:4px solid var(--amber);padding:6px 12px;font-weight:600;font-size:14px;animation:tin .25s ease-out;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.toast.bad{border-left-color:var(--hazard)} .toast.good{border-left-color:var(--rot)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
@media (max-width:600px){#toast{top:auto;bottom:112px}}
#mission{position:absolute;left:10px;top:10px;width:min(330px,calc(100% - 20px));background:rgba(16,14,11,.92);border:1px solid var(--line2);border-left:4px solid var(--rot);border-radius:4px;padding:9px 11px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:5px}
#mission .mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
#mission .ey{font:600 11px var(--log);letter-spacing:.14em;text-transform:uppercase;color:var(--rot)}
#mission .mt{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.03em;line-height:1.1;text-transform:uppercase;text-wrap:balance}
#mission .mhint{font-size:13.5px;color:#d4c9ad;margin:0;line-height:1.35}
#mission .rw{font-size:12px;color:var(--amber);font-weight:600}
#mission .bar{height:5px;background:#2e2a22;border-radius:3px;overflow:hidden}
#mission .bar i{display:block;height:100%;background:var(--rot);transition:width .3s}
#mission .tg{background:transparent;border:1px solid var(--line2);border-radius:3px;width:26px;height:22px;line-height:1;color:var(--muted);padding:0}
#mission.min .mhint,#mission.min .rw,#mission.min .bar,#mission.min .pc{display:none}
#mission.flash{animation:mflash .9s ease-out 2}
@keyframes mflash{30%{border-left-color:var(--amber);box-shadow:0 0 0 3px rgba(156,196,73,.55)}}
#ctxbar{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 210px);background:rgba(16,14,11,.94);border:1px solid var(--line2);border-top:3px solid var(--amber);border-radius:4px;padding:7px 9px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#ctxbar b{font-family:var(--display);font-size:18px;letter-spacing:.03em;text-transform:uppercase;color:var(--amber)}
#ctxbar .btn{padding:5px 9px;font-size:13px}
@media (max-width:640px){#ctxbar{max-width:calc(100% - 20px);bottom:56px}}
#buildpop{position:absolute;z-index:3;width:260px;max-width:calc(100% - 12px);background:rgba(18,16,12,.97);border:1px solid var(--amber-dim);border-top:3px solid var(--amber);border-radius:4px;padding:9px;box-shadow:0 12px 32px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:7px}
#buildpop .pg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#buildpop .bt{padding:6px 8px;font-size:13px}
#buildpop .ttl{font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.objs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.objs li{display:flex;gap:8px;align-items:baseline;color:var(--muted)}
.objs li.done{color:#7f796a;text-decoration:line-through}
.objs li.cur{color:var(--fg);font-weight:700}
.objs li i{font-style:normal;width:14px;flex:none;color:var(--rot)}
.intro p{font-size:16px;line-height:1.5}
.dots{display:flex;gap:6px}.dots span{width:8px;height:8px;border-radius:50%;background:var(--line2)}.dots span.on{background:var(--amber)}
#fps{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);border:1px solid var(--line);color:var(--rot);font:600 12px/1 var(--log);padding:5px 7px;border-radius:3px;pointer-events:none;font-variant-numeric:tabular-nums}
#panel{display:flex;flex-direction:column;gap:12px;min-width:0}
#panel section{background:linear-gradient(180deg,#1f1c16,#191712);border:1px solid var(--line);border-radius:4px;padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
h2{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.07em;text-transform:uppercase;margin:0 0 9px;color:var(--fg);display:flex;align-items:center;gap:8px}
h2::before{content:"";width:10px;height:10px;background:var(--amber);clip-path:polygon(0 0,100% 50%,0 100%)}
h3{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.04em;margin:0;line-height:1.05;text-transform:uppercase;color:var(--amber)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{background:linear-gradient(#2c2820,#221f19);border:1px solid var(--line2);border-radius:4px;padding:6px 11px;font-weight:600;font-size:14px;transition:border-color .12s,transform .08s}
.btn:hover:not(:disabled){border-color:var(--amber)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.pri{background:linear-gradient(#f6b448,#e0941f);color:#1a1307;border-color:#f6b448}
.btn.warn{border-color:#7a2f1c;color:#ffb8a3}
.btn.on{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
#build{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.bt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;padding:7px 9px;min-width:0}
.bt span{font-size:12px;color:var(--muted);font-weight:500}
.bt.wide{grid-column:1/-1}
.people{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto}
.p{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:4px;padding:5px 7px}
.p:hover{border-color:var(--line);background:var(--panel2)}
.p.sel{border-color:var(--amber);background:var(--panel2)}
.p .nm{font-weight:700}
.p .loc{font-size:12px;color:var(--muted);text-align:right}
.stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.stats em{font-style:normal;color:var(--fg);font-weight:700}
.hp{display:block;grid-column:1/-1;height:4px;background:#2e2a22;border-radius:2px;overflow:hidden}
.hp i{display:block;width:100%;height:100%;background:var(--rot);transition:width .3s}
.hp.mid i{background:var(--amber)} .hp.lo i{background:var(--hazard)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px;margin-block:8px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.occ{display:flex;flex-direction:column;gap:4px;margin-block:6px}
.occ .spread{background:var(--panel2);padding:4px 8px;border-radius:3px}
#log{list-style:none;margin:0;padding:0;font-family:var(--log);font-size:13px;display:flex;flex-direction:column;gap:5px;max-height:210px;overflow-y:auto;color:#d2c9ae}
#log li span{color:var(--muted);margin-right:6px}
#log li.bad{color:#f39e83} #log li.good{color:#c0dc8e}
.hint{font-size:14px;color:var(--muted);margin:0}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:2px;background:var(--panel2);border:1px solid var(--line)}
.badge.fire{background:var(--hazard);border-color:var(--hazard);color:#1a0d07}
.badge.z{background:var(--rot);border-color:var(--rot);color:#121a06}
#modal{position:fixed;inset:0;background:rgba(5,5,4,.72);display:grid;place-items:center;padding:16px;z-index:20;backdrop-filter:blur(3px)}
.mbox{background:linear-gradient(#211e17,#191711);border:1px solid var(--amber-dim);border-top:4px solid var(--amber);border-radius:4px;max-width:440px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox p{margin:0}
.mbox .acts{display:flex;flex-direction:column;gap:6px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
/* menu principale */
#menu{position:fixed;inset:0;z-index:15;display:flex;align-items:center;padding:24px 16px;background:linear-gradient(90deg,rgba(8,7,6,.92) 0%,rgba(8,7,6,.78) 45%,rgba(8,7,6,.25) 100%);backdrop-filter:blur(2px);overflow-y:auto}
.mwrap{width:100%;max-width:470px;margin-left:clamp(0px,6vw,90px);display:flex;flex-direction:column;gap:22px;padding-block:20px}
.eyebrow{font:600 12px/1 var(--log);letter-spacing:.3em;color:var(--hazard);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:28px;height:8px;background:repeating-linear-gradient(-45deg,var(--amber) 0 5px,#111 5px 10px)}
.big{font-size:clamp(52px,11vw,96px);line-height:.86;letter-spacing:.02em;margin-top:10px;text-shadow:0 0 40px rgba(242,165,49,.25),0 4px 0 #3a2508}
.tag{margin:12px 0 0;color:#cfc4a8;font-size:17px;max-width:36ch}
.mlist{display:flex;flex-direction:column;gap:8px}
.mbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(90deg,rgba(40,36,28,.95),rgba(26,24,19,.85));border:1px solid var(--line2);border-left:4px solid var(--line2);padding:12px 16px;font:800 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;text-align:left;border-radius:3px;transition:border-color .12s,padding .12s,background .12s}
.mbtn:hover:not(:disabled),.mbtn:focus-visible{border-left-color:var(--amber);padding-left:22px;background:linear-gradient(90deg,rgba(60,48,26,.95),rgba(30,26,19,.85))}
.mbtn small{font:500 13px/1.2 var(--body);letter-spacing:.02em;text-transform:none;color:var(--muted);text-align:right}
.mbtn.pri{border-left-color:var(--amber);color:var(--amber)}
.mcard{background:rgba(24,22,17,.94);border:1px solid var(--line2);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:14px}
.setrow{display:flex;flex-direction:column;gap:6px}
.setrow > .lab{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{background:var(--panel2);border:1px solid var(--line2);padding:7px 12px;border-radius:3px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--amber);color:#1a1307;border-color:var(--amber)}
.keys{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center}
.keys .kn{font-size:15px}
.kbd{min-width:70px;text-align:center;font:600 13px/1 var(--log);background:#120f0b;border:1px solid var(--line2);border-bottom-width:3px;border-radius:4px;padding:7px 9px}
button.kbd:hover{border-color:var(--amber)}
.kbd.wait{border-color:var(--amber);color:var(--amber);animation:blink .8s steps(2) infinite}
.kbd.fixed{opacity:.7}
@keyframes blink{50%{opacity:.5}}
.mfoot{font:13px var(--log);color:var(--muted)}
@media (prefers-reduced-motion:reduce){#stage.alarm,.kbd.wait{animation:none}.toast{animation:none}}
</style>

<div id="app">
  <header>
    <div class="brand"><h1 data-t="title">Zombie Anarchy</h1><span id="clock"></span></div>
    <div class="res">
      <div class="chip" id="r-food"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M6 4h12v3H6zM5 8.5h14V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2zM8 12v5h8v-5z"/></svg><span class="lab"><small data-t="res.food"></small><span><b>0</b><span class="cap"></span></span></span><span class="tr"></span></div>
      <div class="chip" id="r-energy"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4 14h6.5L9 22l10-12.5h-6.5z"/></svg><span class="lab"><small data-t="res.energy"></small><span><b>0</b><span class="cap"></span></span></span><span class="tr"></span></div>
      <div class="chip" id="r-scrap"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M13 2h-2l-.6 2.6a7.6 7.6 0 0 0-2 .8L6.2 4 4.8 5.4 6.2 7.7c-.4.6-.6 1.3-.8 2L2.8 10.3v2l2.6.6c.2.7.4 1.4.8 2L4.8 17.2l1.4 1.4 2.3-1.4c.6.4 1.3.7 2 .9l.6 2.5h2l.6-2.5c.7-.2 1.4-.5 2-.9l2.2 1.4 1.4-1.4-1.4-2.3c.4-.6.7-1.3.9-2l2.5-.6v-2l-2.5-.6c-.2-.7-.5-1.4-.9-2l1.4-2.3-1.4-1.4-2.2 1.4c-.6-.4-1.3-.6-2-.8zM12 8a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7z"/></svg><span class="lab"><small data-t="res.scrap"></small><span><b>0</b><span class="cap"></span></span></span><span class="tr"></span></div>
      <div class="chip" id="r-pop"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a4.2 4.2 0 1 0 0-8.4 4.2 4.2 0 0 0 0 8.4zM4 21c0-4.3 3.6-7.2 8-7.2s8 2.9 8 7.2z"/></svg><span class="lab"><small data-t="res.pop"></small><span><b>0</b><span class="cap"></span></span></span></div>

    <div class="hbtns">
      <div class="speed" role="group" aria-label="Speed">
        <button id="sp0" data-speed="0" aria-pressed="false">❚❚</button>
        <button id="sp1" data-speed="1" aria-pressed="true">1×</button>
        <button id="sp2" data-speed="2" aria-pressed="false">2×</button>
        <button id="sp3" data-speed="3" aria-pressed="false">3×</button>
      </div>
      <button class="btn" id="openMenu" data-t="menu.btn">Menu</button>
    </div>
  </header>
  <main>
    <div id="stage"><canvas id="cv"></canvas><div id="toast"></div><div id="fps" hidden>60 FPS</div><div id="mission"></div><div id="ctxbar" hidden></div><div id="buildpop" hidden></div><div id="zoom"><button id="zOut" type="button">−</button><output id="zLab">100%</output><button id="zIn" type="button">+</button><button id="zFit" type="button">⤢</button></div></div>

      <section id="sel"></section>

<script>

const SKEY='ultimo-rifugio-settings';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
const navLang=(navigator.language||'it').slice(0,2);
let cfg={lang:L[navLang]?navLang:'it',fps:60,showFps:false,quality:'high',keys:{...DEFKEYS}};
try{const o=JSON.parse(lsGet(SKEY)||'null');if(o){cfg={...cfg,...o,keys:{...DEFKEYS,...(o.keys||{})}};if(!L[cfg.lang])cfg.lang='it';}}catch(e){}
const saveCfg=()=>lsSet(SKEY,JSON.stringify(cfg));
function t(k,p){
  let s=L[cfg.lang]&&L[cfg.lang][k]; if(s==null)s=L.it[k]; if(s==null)s=k;
  if(p)s=s.replace(/\{(\w+)\}/g,(m,n)=>{let v=p[n];if(typeof v==='string'&&v[0]==='@')v=t(v.slice(1));return v==null?'':v;});
  return s;
}
const rn=type=>t('room.'+type);

/* ================= DATI DI GIOCO ================= */
const DAY=45, COLS=6, FLOORS=6, LVLM=[0,1,1.6,2.3];
const RAMP=0.95, SHAFT=0.5, SURF=1.6, TOP=0.16, CH=0.76;
const RT={
  ingresso:{stat:'F',cap:3,cost:60,use:0.1,wall:'#3c3a33'},
  generatore:{stat:'F',cap:2,cost:40,prod:'energy',rate:0.9,use:0,wall:'#3d3326'},
  serra:{stat:'A',cap:2,cost:35,prod:'food',rate:0.42,use:0.35,wall:'#25331f'},
  officina:{stat:'I',cap:2,cost:30,prod:'scrap',rate:0.3,use:0.3,wall:'#34312c'},
  dormitorio:{cap:0,cost:45,use:0.15,wall:'#2f2c36'},
  infermeria:{stat:'I',cap:1,cost:60,use:0.4,wall:'#27373b'},
  armeria:{stat:'F',cap:2,cost:70,use:0.3,wall:'#37302a'},
  radio:{stat:'I',cap:1,cost:80,use:0.4,wall:'#262c3a'},
  magazzino:{cap:0,cost:40,use:0.1,wall:'#35312a'}
};
const BUILD=['generatore','serra','officina','dormitorio','infermeria','armeria','radio','magazzino'];
const NAMES=['Marta','Ivo','Greta','Dario','Nadia','Bruno','Lia','Ettore','Sara','Tobia','Irene','Ugo','Vera','Carlo','Elsa','Nico','Pia','Remo','Agata','Fosco','Livia','Oscar','Ada','Gino','Teo','Rita','Aldo','Mila','Zeno','Bice'];
const SUR=['R.','B.','F.','M.','C.','D.','S.','T.','V.','L.','G.','P.'];
const CLOTH=['#8a6a3c','#4f6a7a','#7a4a3e','#5b6b44','#6e5a7c','#8c7d5a','#3f5f5a','#9a5b2f','#55606e'];
const SKIN=['#e2b896','#c68c63','#8d5a3b','#f0caa8','#a87250'];
const HAIR=['#2a1f17','#5a3a22','#9b7a4a','#1a1a1a','#7c7c78','#8a3b1e'];
const KEY='ultimo-rifugio-v2', BKEY='ultimo-rifugio-best';
const FB="'Barlow Semi Condensed','PT Sans Narrow','Arial Narrow',sans-serif";
const FD="'Big Shoulders Stencil Display','Oswald',Impact,sans-serif";

let S=null;
const ui={sel:null,build:null,modal:false,menu:false,mpage:'main',rebind:null,parts:[],lastSpeed:1,trend:{food:0,energy:0,scrap:0}};

const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

/* ================= STATO ================= */
function newGame(){
  S={v:2,day:1,t:DAY*(2/24),speed:1,res:{food:30,energy:25,scrap:70},floors:2,rooms:[],surv:[],zomb:[],
     door:{hp:120},inv:{timer:DAY*2.6,warned:false,active:false},log:[],nid:1,over:false,best:+(lsGet(BKEY)||0),mi:0,stats:{waves:0},won:false,introSeen:false};
  addRoom('ingresso',0,0); const g=addRoom('generatore',0,1); const se=addRoom('serra',0,2); addRoom('dormitorio',0,3);
  for(let i=0;i<4;i++) addSurv();
  S.surv[0].room=g.id; S.surv[1].room=se.id; S.surv[2].room=S.rooms[0].id;
  log('log.start');
  ui.sel=null; ui.build=null; ui.parts=[];
  }
function addRoom(type,f,c){const r={id:S.nid++,type,f,c,lvl:1,fire:0};S.rooms.push(r);return r;}
function mkSurv(){
  const pts=ri(12,17); let F=1,I=1,A=1;
  for(let i=3;i<pts;i++){const k=Math.random();if(k<.34&&F<10)F++;else if(k<.67&&I<10)I++;else if(A<10)A++;else F=Math.min(10,F+1);}
  let name; const used=new Set(S.surv.map(s=>s.name));
  for(let k=0;k<20;k++){name=pick(NAMES)+' '+pick(SUR); if(!used.has(name))break;}
  return {id:S.nid++,name,F,I,A,hp:100,room:null,x:rnd(.15,.85),tx:rnd(.15,.85),wait:rnd(0,3),walk:0,dir:1,
    cloth:pick(CLOTH),skin:pick(SKIN),hair:pick(HAIR),pack:Math.random()<.4,exp:null};
}
function addSurv(){const s=mkSurv();S.surv.push(s);return s;}
function log(k,p,c=''){S.log.unshift({d:S.day,h:clockStr(),k,p:p||null,c}); if(S.log.length>50)S.log.length=50;}
function save(){if(S&&!S.over) lsSet(KEY,JSON.stringify(S));}
function load(){const x=lsGet(KEY); if(!x)return null; try{const o=JSON.parse(x); return o&&o.v===2&&!o.over?o:null}catch(e){return null}}

/* ================= QUERY ================= */
const roomById=id=>S.rooms.find(r=>r.id===id);
const roomAt=(f,c)=>S.rooms.find(r=>r.f===f&&r.c===c);
const entrance=()=>S.rooms.find(r=>r.type==='ingresso');
function idleRoom(){const d=S.rooms.find(r=>r.type==='dormitorio');return d?d.id:entrance().id;}
function locId(s){if(s.exp)return null; return s.room??idleRoom();}
const present=r=>S.surv.filter(s=>locId(s)===r.id);
const workers=r=>S.surv.filter(s=>s.room===r.id&&!s.exp);
const zIn=r=>S.zomb.filter(z=>z.loc===r.id);
function neighbors(r){
  const out=[]; const a=roomAt(r.f,r.c-1), b=roomAt(r.f,r.c+1); if(a)out.push(a); if(b)out.push(b);
  if(r.c===0) for(const o of S.rooms) if(o.c===0&&o.f!==r.f) out.push(o);
  return out;
}
function caps(){
  let food=60,scrap=120,energy=40,beds=2;
  for(const r of S.rooms){
    if(r.type==='magazzino'){food+=60*r.lvl;scrap+=80*r.lvl;}
    if(r.type==='generatore')energy+=30*r.lvl;
    if(r.type==='dormitorio')beds+=4*r.lvl;
  }
  return {food,scrap,energy,beds};
}
const doorMax=()=>{const e=entrance();return 120+90*(e.lvl-1);};
const powered=r=>r.type==='generatore'||S.res.energy>0.05;
function workFactor(r){const st=RT[r.type].stat; if(!st)return 0; return workers(r).reduce((a,s)=>a+0.5+s[st]*0.1,0);}
function roomRate(r){
  const d=RT[r.type]; if(!d.prod)return 0;
  if(!powered(r)||zIn(r).length)return 0;
  return d.rate*LVLM[r.lvl]*workFactor(r)*(1-r.fire/100);
}
function roomUse(r){
  const d=RT[r.type]; if(!d.use)return 0;
  if(d.cap>0&&r.type!=='ingresso'&&workers(r).length===0)return 0;
  return d.use*(1+0.35*(r.lvl-1));
}
function armBonus(){let b=0;for(const r of S.rooms)if(r.type==='armeria'&&powered(r)&&workers(r).length)b+=r.lvl*2+workers(r).reduce((a,s)=>a+s.F*0.3,0);return b;}
function radioPower(){let b=0;for(const r of S.rooms)if(r.type==='radio'&&powered(r)&&workers(r).length)b+=r.lvl*(0.6+workers(r)[0].I*0.06);return b;}
const upCost=r=>Math.round(RT[r.type].cost*(0.9+r.lvl*0.8));
const digCost=()=>40+S.floors*35;
function canBuildAt(f,c){
  if(f>=S.floors||c<0||c>=COLS||roomAt(f,c))return false;
  return c===0||!!roomAt(f,c-1)||!!roomAt(f,c+1);
}
function canDemolish(r){return r.type!=='ingresso'&&!roomAt(r.f,r.c+1)&&!(r.c===0&&S.rooms.some(o=>o.f===r.f&&o!==r));}
function clockStr(){if(!S)return '';const h=(6+S.t/DAY*24)%24;const hh=Math.floor(h),mm=Math.floor((h-hh)*6)*10;return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
const hour=()=>(6+S.t/DAY*24)%24;

/* ================= SIMULAZIONE ================= */
function step(dt){
  if(S.over)return;
  const cp=caps();
  S.t+=dt; if(S.t>=DAY){S.t-=DAY;S.day++;dawn();}
  const before={food:S.res.food,energy:S.res.energy,scrap:S.res.scrap};
  let use=0,prod=0;
  for(const r of S.rooms){use+=roomUse(r); if(r.type==='generatore')prod+=roomRate(r);}
  S.res.energy=clamp(S.res.energy+(prod-use)*dt,0,cp.energy);
  for(const r of S.rooms){
    const d=RT[r.type];
    if(d.prod==='food')S.res.food+=roomRate(r)*dt;
    if(d.prod==='scrap')S.res.scrap+=roomRate(r)*dt;
  }
  const here=S.surv.filter(s=>!s.exp);
  S.res.food-=here.length*0.055*dt;
  const starving=S.res.food<=0; if(starving)S.res.food=0;
  S.res.food=Math.min(S.res.food,cp.food); S.res.scrap=Math.min(S.res.scrap,cp.scrap);
  let heal=0;
  for(const r of S.rooms)if(r.type==='infermeria'&&powered(r)&&!zIn(r).length)heal+=0.35*LVLM[r.lvl]*workFactor(r);
  for(const s of here){ if(starving)s.hp-=0.35*dt; else s.hp=Math.min(100,s.hp+(0.06+heal)*dt); }
  if(starving&&!ui.starveWarn){ui.starveWarn=true;toast('t.starve',null,'bad');log('log.starve',null,'bad');}
  if(!starving)ui.starveWarn=false;
  if(S.res.energy<=0.05&&!ui.darkWarn){ui.darkWarn=true;toast('t.blackout',null,'bad');log('log.blackout',null,'bad');}
  if(S.res.energy>2)ui.darkWarn=false;
  fires(dt); invasion(dt); zombies(dt); expeditions(dt); walkers(dt);
  for(const s of [...S.surv]) if(s.hp<=0) kill(s, starving?'log.diedStarve':'log.died');
  for(const k of ['food','energy','scrap'])ui.trend[k]=ui.trend[k]*0.9+((S.res[k]-before[k])/Math.max(dt,1e-3))*0.1;
  if(S.surv.length===0)gameOver();
}
function fires(dt){
  for(const r of S.rooms){
    const ws=present(r);
    if(r.fire<=0){
      const active=(RT[r.type].prod||r.type==='radio'||r.type==='armeria')&&workers(r).length&&powered(r);
      const ch=r.type==='generatore'?0.0016:0.0005;
      if(active&&Math.random()<ch*dt){r.fire=8;log('log.fire',{room:'@room.'+r.type,f:r.f},'bad');toast('t.fire',{room:'@room.'+r.type},'bad');}
      continue;
    }
    const fight=ws.reduce((a,s)=>a+0.8+s.A*0.28,0);
    r.fire=clamp(r.fire+(2.6-fight)*dt,0,100);
    for(const s of ws)s.hp-=1.3*(r.fire/100)*dt;
    if(r.fire>=100&&Math.random()<0.05*dt){const n=neighbors(r).filter(o=>o.fire<=0);if(n.length){const o=pick(n);o.fire=12;log('log.spread',{room:'@room.'+o.type},'bad');}}
    if(r.fire<=0){r.fire=0;log('log.fireOut',{room:'@room.'+r.type},'good');}
    if(Math.random()<dt*5)ember(r);
  }
}
function invasion(dt){
  const iv=S.inv;
  if(!iv.active){
    iv.timer-=dt;
    if(iv.timer<12&&!iv.warned){iv.warned=true;toast('t.siren',null,'bad');log('log.siren',null,'bad');}
    if(iv.timer<=0){
      iv.active=true; iv.warned=false;
      const big=S.day>=4&&Math.random()<0.25+S.day*0.02;
      const n=2+Math.floor(S.day*0.7);
      for(let i=0;i<n;i++)S.zomb.push(mkZ(i,false));
      if(big)S.zomb.push(mkZ(n,true));
      log(big?'log.waveBig':'log.wave',{n:n+(big?1:0)},'bad');
    }
  }else if(S.zomb.length===0){
    iv.active=false; iv.timer=DAY*rnd(1.3,2.2);
    const loot=ri(8,18)+S.day*2; S.res.scrap+=loot;
    S.stats.waves++;
    log('log.repelled',{n:loot},'good');toast('t.repelled',null,'good');
  }
  const dm=doorMax();
  if(!S.zomb.some(z=>z.loc==='out'&&z.p>=0.9)&&S.door.hp<dm&&S.res.scrap>0.3){S.door.hp=Math.min(dm,S.door.hp+5*dt);S.res.scrap-=0.18*dt;}
}
function mkZ(i,big){
  const hp=(26+S.day*4.5)*(big?3.2:1);
  return {id:S.nid++,loc:'out',p:-i*0.07-rnd(0,.04),hp,max:hp,atk:(2.6+S.day*0.32)*(big?1.7:1),big,x:.1,mv:rnd(1.5,3),ph:rnd(0,6),shirt:pick(['#4f5148','#5a4c3e','#3e4a52','#55463f'])};
}
function zombies(dt){
  const ent=entrance(), bonus=armBonus(), now=performance.now();
  const out=S.zomb.filter(z=>z.loc==='out').sort((a,b)=>b.p-a.p);
  out.forEach((z,i)=>{const lim=1-i*0.045; z.p=Math.min(lim,z.p+(z.big?0.03:0.042)*dt);});
  const atDoor=out.filter(z=>z.p>=0.9);
  if(S.door.hp>0){for(const z of atDoor){S.door.hp-=z.atk*0.9*dt; if(Math.random()<dt*2)doorHit();}}
  if(S.door.hp<=0){
    if(!ui.doorBroken){ui.doorBroken=true;log('log.gate',null,'bad');toast('log.gate',null,'bad');}
    S.door.hp=0; for(const z of atDoor){z.loc=ent.id;z.x=0.04;}
  }else ui.doorBroken=false;
  const def=present(ent).filter(s=>s.room===ent.id);
  const tgt=out.find(z=>z.p>0.35);
  if(tgt&&def.length&&S.door.hp>0){
    for(const s of def){tgt.hp-=(2.4+s.F*0.75+bonus)*0.75*dt; if(Math.random()<dt*3)tracer(ent,tgt);}
  }
  for(const r of S.rooms){
    const zs=zIn(r); if(!zs.length)continue;
    const ss=present(r);
    if(ss.length){
      for(const s of ss){const z=zs.find(q=>q.hp>0); if(!z)break; z.hp-=(2.4+s.F*0.85+bonus)*dt; if(Math.random()<dt*1.5)hitFx(r,z.x);}
      zs.forEach((z,i)=>{if(z.hp>0){const s=ss[(z.id+i)%ss.length];s.hp-=z.atk*dt;}});
    }
  }
  for(const z of [...S.zomb]) if(z.hp<=0){S.zomb.splice(S.zomb.indexOf(z),1);S.res.scrap+=1;if(z.loc!=='out'){const r=roomById(z.loc);if(r)splat(roomX(r.c)+(.06+z.x*.88)*cs,floorY(r.f)+CH*cs*.72);}else{const p=zPos(z);splat(p.x,p.y-cs*.1);}}
  for(const z of S.zomb){
    if(z.loc==='out')continue;
    const r=roomById(z.loc); if(!r){z.loc=ent.id;continue;}
    z.x+=(0.5+Math.sin(z.ph+now/900)*0.25-z.x)*dt*0.4;
    if(present(r).length)continue;
    z.mv-=dt; if(z.mv>0)continue; z.mv=z.big?3.4:2.4;
    const nx=nextStep(r); if(nx){z.loc=nx.id; z.x=nx.c>r.c?0.05:nx.c<r.c?0.95:0.1;}
  }
}
function nextStep(from){
  const seen=new Map([[from.id,null]]); const q=[from];
  while(q.length){
    const r=q.shift();
    if(r!==from&&present(r).length){let cur=r;while(seen.get(cur.id)!==from)cur=seen.get(cur.id);return cur;}
    for(const n of neighbors(r)) if(!seen.has(n.id)){seen.set(n.id,r);q.push(n);}
  }
  const n=neighbors(from); return n.length?pick(n):null;
}
function expeditions(dt){
  for(const s of [...S.surv]){
    if(!s.exp)continue;
    s.exp.t+=dt;
    if(s.exp.t<s.exp.dur)continue;
    s.exp=null; s.x=.1;
    const luck=rnd(.6,1.4), sc=Math.round((14+s.A*2+S.day)*luck), fd=Math.round((6+s.I*1.2)*luck);
    const dmg=rnd(0,60)*(1-s.A*0.055)+S.day*0.8*Math.random();
    s.hp-=dmg;
    if(s.hp<=0){kill(s,'log.lost');continue;}
    S.res.scrap+=sc; S.res.food+=fd;
    log('log.returned',{name:s.name,s:sc,f:fd},'good');
    if(Math.random()<0.28&&S.surv.length<caps().beds){const n=addSurv();n.hp=rnd(50,90);log('log.brought',{name:s.name,n:n.name},'good');}
    toast('t.returned',{name:s.name},'good');
  }
}
function walkers(dt){
  for(const s of S.surv){
    if(s.exp)continue;
    if(s.wait>0){s.wait-=dt;s.walk=0;continue;}
    const d=s.tx-s.x; const sp=0.11*dt;
    if(Math.abs(d)<sp){s.x=s.tx;s.tx=rnd(.12,.88);s.wait=rnd(1,5);s.walk=0;}
    else{s.x+=Math.sign(d)*sp;s.walk+=dt*8;s.dir=Math.sign(d);}
  }
}
function kill(s,key){
  S.surv.splice(S.surv.indexOf(s),1);
  log(key,{name:s.name},'bad'); toast(key,{name:s.name},'bad');
  if(ui.sel&&ui.sel.t==='s'&&ui.sel.id===s.id)ui.sel=null;
}
function gameOver(){
  S.over=true; const days=S.day;
  if(days>S.best){S.best=days;lsSet(BKEY,String(days));}
  lsDel(KEY);
  modal(`<h3>${t('go.t')}</h3><p>${t('go.b',{d:days})}</p><p class="muted small">${t('go.rec',{n:S.best})}</p>`,
    [{t:t('go.btn'),pri:1,f:()=>{newGame();save();showIntro(0);}}]);
}

/* ================= OBIETTIVI ================= */
const cnt=ty=>S.rooms.filter(r=>r.type===ty).length;
const MISSIONS=[
 {id:'workshop',chk:()=>cnt('officina')>=1,rw:{food:15},hl:'build:officina'},
 {id:'staff',chk:()=>S.rooms.some(r=>r.type==='officina'&&workers(r).length),rw:{scrap:15},hl:'room:officina'},
 {id:'scrap',chk:()=>S.res.scrap>=100,prog:()=>[S.res.scrap,100],rw:{food:20},hl:'room:officina'},
 {id:'gen2',chk:()=>cnt('generatore')>=2,rw:{scrap:25},hl:'build:generatore'},
 {id:'wave',chk:()=>S.stats.waves>=1,prog:()=>[S.stats.waves,1],rw:{scrap:30},hl:'room:ingresso'},
 {id:'pop',chk:()=>S.surv.length>=6,prog:()=>[S.surv.length,6],rw:{food:25}},
 {id:'infirmary',chk:()=>cnt('infermeria')>=1,rw:{scrap:30},hl:'build:infermeria'},
 {id:'gate',chk:()=>entrance().lvl>=2,rw:{food:30},hl:'room:ingresso'},
 {id:'dig',chk:()=>S.floors>=3,rw:{scrap:30},hl:'dig'},
 {id:'radio',chk:()=>S.rooms.some(r=>r.type==='radio'&&workers(r).length),rw:{scrap:40},hl:'build:radio'},
 {id:'armory',chk:()=>cnt('armeria')>=1,rw:{food:30},hl:'build:armeria'},
 {id:'final',chk:()=>S.day>=20,prog:()=>[S.day,20],final:true,hl:'room:radio'}
];
function rwText(rw){return Object.entries(rw).map(([k,v])=>`+${v} ${t('res.'+k).toLowerCase()}`).join(', ');}
function checkMissions(){
  if(!S||S.over||ui.modal||ui.menu)return;
  const m=MISSIONS[S.mi]; if(!m||!m.chk())return;
  S.mi++;
  if(m.final){victory();return;}
  const cp=caps(); for(const [k,v] of Object.entries(m.rw))S.res[k]=Math.min((cp[k]||9999)+v,S.res[k]+v);
  log('log.obj',{m:'@m.'+m.id+'.t',r:rwText(m.rw)},'good');
  toast('t.obj',{r:rwText(m.rw)},'good');
  const el=$('#mission'); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  renderPanel(true); save();
}
function victory(){
  S.won=true; log('log.win',null,'good'); save();
  modal(`<h3>${t('win.t')}</h3><p>${t('win.b',{n:S.surv.length})}</p>`,[{t:t('win.cont'),pri:1},{t:t('win.new'),f:()=>{newGame();save();showIntro(0);}}]);

  const d=RT[r.type];

  if(s.room===r.id)return true;
  if(workers(r).length>=d.cap){toast('t.full',{room:'@room.'+r.type,n:d.cap},'bad');return false;}
  s.room=r.id; s.x=rnd(.15,.85); s.tx=rnd(.15,.85);

}
function build(type,f,c){

function mix(a,b,k){

  const pa=hex2(a),pb=hex2(b);v='#'+pa.map((x,i)=>Math.round(x+(pb[i]-x)*k).toString(16).padStart(2,'0')).join('');
  if(mixCache.size>4000)mixCache.clear();mixCache.set(key,v);return v;
}

function handleClick(e){
  if(ui.modal||ui.menu||S.over)return;
  closePop();
  const rc=cv.getBoundingClientRect(); const mx=(e.clientX-rc.left)*VW/rc.width+camX, my=(e.clientY-rc.top)*VH/rc.height+camY;
  const c=Math.floor((mx-roomX(0))/cs), f=Math.floor((my-floorY(0))/(CH*cs));
  const inGrid=c>=0&&c<COLS&&f>=0&&f<FLOORS&&mx>=roomX(0);
  if(ui.build){
    if(inGrid&&canBuildAt(f,c))build(ui.build,f,c); else ui.build=null;
    renderPanel(true);return;
  }
  if(inGrid&&f===S.floors&&S.floors<FLOORS){dig();renderPanel(true);return;}
  let hit=null,best=1e9;
  for(const s of S.surv){const id=locId(s);if(id==null)continue;const r=roomById(id);if(!r)continue;
    const px=roomX(r.c)+cs*.06+s.x*cs*.88, py=floorY(r.f)+CH*cs-cs*.075-cs*.15;
    const d=Math.hypot(px-mx,(py-my)*.6); if(d<cs*.13&&d<best){best=d;hit=s;}}
  const room=inGrid?roomAt(f,c):null;
  if(inGrid&&f<S.floors&&!room&&!hit){if(canBuildAt(f,c))openBuildPop(f,c);else toast('pop.cant',null,'bad');renderPanel(true);return;}
  if(room&&room.fire>0){douse(room);ui.sel={t:'r',id:room.id};renderPanel(true);return;}
  if(ui.sel&&ui.sel.t==='s'&&room&&(!hit||locId(hit)!==room.id||hit.id===ui.sel.id)){
    const s=S.surv.find(q=>q.id===ui.sel.id);
    if(s&&assign(s,room))ui.sel={t:'r',id:room.id};
    renderPanel(true);return;
  }
  if(hit)ui.sel={t:'s',id:hit.id}; else if(room)ui.sel={t:'r',id:room.id}; else ui.sel=null;
  renderPanel(true);
}
const ptrs=new Map(); let drag=null,pinch=null;
function sp(e){const rc=cv.getBoundingClientRect();return {x:(e.clientX-rc.left)*VW/rc.width,y:(e.clientY-rc.top)*VH/rc.height,cx:e.clientX,cy:e.clientY};}
cv.addEventListener('pointerdown',e=>{
  if(ui.menu||ui.modal||e.button>0)return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,sp(e));
  if(ptrs.size===1)drag={x0:e.clientX,y0:e.clientY,cx:camX,cy:camY,moved:false};
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:cfg.zoom};if(drag)drag.moved=true;}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,sp(e));
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];zoomTo(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);return;}
  if(drag){const rc=cv.getBoundingClientRect(),k=VW/rc.width,dx=(e.clientX-drag.x0)*k,dy=(e.clientY-drag.y0)*k;
    if(!drag.moved&&Math.hypot(dx,dy)>7){drag.moved=true;cv.classList.add('drag');closePop();}
    if(drag.moved){camX=drag.cx-dx;camY=drag.cy-dy;clampCam();}}
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===1){const p=[...ptrs.values()][0];drag={x0:p.cx,y0:p.cy,cx:camX,cy:camY,moved:true};return;}
  if(ptrs.size===0){if(drag&&!drag.moved&&e.type==='pointerup')handleClick(e);drag=null;cv.classList.remove('drag');}
}

      <button class="mbtn" data-m="howto">${t('menu.howto')}<small>${t('menu.howtoD')}</small></button>
      <button class="mbtn" data-m="settings">${t('menu.settings')}<small>${LANGS.find(l=>l[0]===cfg.lang)[1]} · ${cfg.fps?cfg.fps+' FPS':t('set.unl')}</small></button>
      <button class="mbtn" data-m="controls">${t('menu.controls')}<small>${esc(keyLabel(cfg.keys.pause))} · ${esc(keyLabel(cfg.keys.build))} · Esc</small></button>
    </div>`;
  }else if(pg==='settings'){
    const seg=(name,opts,val)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button data-set="${name}" data-v="${v}" aria-pressed="${String(v)===String(val)}">${l}</button>`).join('')}</div>`;
    h=`<div class="mcard">
      <div class="setrow"><span class="lab">${t('set.lang')}</span>${seg('lang',LANGS,cfg.lang)}</div>
      <div class="setrow"><span class="lab">${t('set.fps')}</span>${seg('fps',[[30,'30'],[60,'60'],[120,'120'],[0,t('set.unl')]],cfg.fps)}</div>
      <div class="setrow"><span class="lab">${t('set.showFps')}</span>${seg('showFps',[['true',t('on')],['false',t('off')]],cfg.showFps)}</div>
      <div class="setrow"><span class="lab">${t('set.quality')}</span>${seg('quality',[['high',t('q.high')],['low',t('q.low')]],cfg.quality)}</div>
    </div><div class="mlist"><button class="mbtn" data-m="back">${t('menu.back')}</button></div>`;
  }else if(pg==='controls'){
    h=`<div class="mcard"><p class="hint">${t('ctl.hint')}</p><div class="keys">
      <span class="kn">${t('ctl.mouse')} <span class="muted small">· ${t('ctl.mouseD')}</span></span><span class="kbd fixed">🖱</span>
      <span class="kn">${t('ctl.esc')}</span><span class="kbd fixed">Esc</span>
      <span class="kn">${t('ctl.drag')} <span class="muted small">· ${t('ctl.dragD')}</span></span><span class="kbd fixed">🖱 / ☝</span>
      <span class="kn">${t('ctl.wheel')} <span class="muted small">· ${t('ctl.wheelD')}</span></span><span class="kbd fixed">⇕</span>
      <span class="kn">${t('ctl.arrows')} <span class="muted small">· ${t('ctl.arrowsD')}</span></span><span class="kbd fixed">← ↑ → ↓</span>
      ${Object.keys(DEFKEYS).map(a=>`<span class="kn">${t('a.'+a)}</span><button class="kbd ${ui.rebind===a?'wait':''}" data-bind="${a}">${ui.rebind===a?t('ctl.press'):esc(keyLabel(cfg.keys[a]))}</button>`).join('')}
    </div><div class="row"><button class="btn" data-m="resetKeys">${t('ctl.reset')}</button></div></div>
    <div class="mlist"><button class="mbtn" data-m="back">${t('menu.back')}</button></div>`;
  }
  $('#mpage').innerHTML=h;
  $('#mbest').textContent=t('best',{n:(S&&S.best)||+(lsGet(BKEY)||0)});
}
$('#menu').addEventListener('click',e=>{
  const m=e.target.closest('[data-m]'), st=e.target.closest('[data-set]'), bd=e.target.closest('[data-bind]');
  if(m){const a=m.dataset.m;
    if(a==='continue'){if(S.over)newGame();closeMenu();if(!S.introSeen)showIntro(0);}
    else if(a==='howto'){showIntro(0);}
    else if(a==='new'){modal(`<h3>${t('ng.t')}</h3><p>${t('ng.b')}</p>`,[{t:t('ng.yes'),pri:1,f:()=>{newGame();save();closeMenu();showIntro(0);}},{t:t('cancel')}]);}
    else if(a==='settings'||a==='controls'){ui.mpage=a;renderMenu();}
    else if(a==='back'){ui.mpage='main';ui.rebind=null;renderMenu();}
    else if(a==='resetKeys'){cfg.keys={...DEFKEYS};saveCfg();renderMenu();}
  }
  if(st){const k=st.dataset.set,v=st.dataset.v;
    if(k==='lang'){cfg.lang=v;applyLang();}
    if(k==='fps')cfg.fps=+v;
    if(k==='showFps'){cfg.showFps=v==='true';$('#fps').hidden=!cfg.showFps;}
    if(k==='quality'){cfg.quality=v;layout();}
    saveCfg();renderMenu();}
  if(bd){ui.rebind=bd.dataset.bind;renderMenu();}
});
$('#openMenu').addEventListener('click',()=>openMenu('main'));
function applyLang(){
  document.documentElement.lang=cfg.lang;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t);});
  document.title=t('title');
  $('#sp0').title=t('a.pause');
  for(const [id,k] of [['zIn','z.in'],['zOut','z.out'],['zFit','z.fit']]){const el=$('#'+id);el.title=t(k);el.setAttribute('aria-label',t(k));}
  if(S){renderPanel(true);hud();}
}

/* ================= TASTIERA ================= */
document.addEventListener('keydown',e=>{
  if(ui.rebind){
    e.preventDefault();
    if(e.code!=='Escape'){for(const k in cfg.keys)if(cfg.keys[k]===e.code)cfg.keys[k]='';cfg.keys[ui.rebind]=e.code;saveCfg();}
    ui.rebind=null;renderMenu();return;
  }
  if(e.code==='Escape'){
    if(ui.modal)return;
    if(ui.menu){if(ui.mpage!=='main'){ui.mpage='main';renderMenu();}else closeMenu();return;}
    if(ui.pop){closePop();return;}
    if(ui.build||ui.sel){ui.build=null;ui.sel=null;renderPanel(true);return;}
    openMenu('main');return;
  }
  if(ui.menu||ui.modal||!S||S.over)return;
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const panK={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.code];
  if(panK&&!Object.values(cfg.keys).includes(e.code)){e.preventDefault();camX+=panK[0]*cs*.6;camY+=panK[1]*cs*.6;clampCam();return;}
  const act=Object.keys(cfg.keys).find(k=>cfg.keys[k]===e.code); if(!act)return;
  e.preventDefault();
  const selR=ui.sel&&ui.sel.t==='r'?roomById(ui.sel.id):null, selS=ui.sel&&ui.sel.t==='s'?S.surv.find(q=>q.id===ui.sel.id):null;
  switch(act){
    case 'pause':setSpeed(S.speed?0:ui.lastSpeed||1);break;
    case 'speed1':setSpeed(1);break; case 'speed2':setSpeed(2);break; case 'speed3':setSpeed(3);break;
    case 'build':{const opts=BUILD.filter(b=>S.res.scrap>=RT[b].cost);if(!opts.length){toast('t.noScrap',null,'bad');ui.build=null;break;}const i=opts.indexOf(ui.build);ui.build=i+1<opts.length?opts[i+1]:(ui.build?null:opts[0]);if(ui.build){ui.sel=null;toast('t.tapCell');}break;}
    case 'dig':dig();break;
    case 'nextSurv':{const list=S.surv;if(!list.length)break;const i=selS?list.indexOf(selS):-1;ui.build=null;ui.sel={t:'s',id:list[(i+(e.shiftKey?-1:1)+list.length)%list.length].id};break;}
    case 'exp':if(selS)sendExp(selS);break;
    case 'rest':if(selS&&!selS.exp){selS.room=null;toast('t.rest',{name:selS.name});}break;
    case 'upgrade':if(selR)upgrade(selR);break;
    case 'demolish':if(selR)demolish(selR);break;
    case 'fps':cfg.showFps=!cfg.showFps;$('#fps').hidden=!cfg.showFps;saveCfg();break;
    case 'zoomIn':zoomTo(cfg.zoom*1.2,VW/2,VH/2,true);break;
    case 'zoomOut':zoomTo(cfg.zoom/1.2,VW/2,VH/2,true);break;
    case 'zoomFit':fitView();break;
  }
  renderPanel(true);
});

/* ================= HUD ================= */
function hud(){
  const cp=caps(), r=S.res;
  const set=(id,v,cap,tr)=>{const el=$('#'+id);el.querySelector('b').textContent=Math.floor(v);el.querySelector('.cap').textContent=cap!=null?'/'+cap:'';
    const te=el.querySelector('.tr'); if(te&&tr!=null){te.textContent=tr>0.02?'▲':tr<-0.02?'▼':'';te.className='tr '+(tr>0.02?'up':'down');}
    el.classList.toggle('low',cap!=null&&v<cap*0.15);};
  set('r-food',r.food,cp.food,ui.trend.food); set('r-energy',r.energy,cp.energy,ui.trend.energy); set('r-scrap',r.scrap,cp.scrap,ui.trend.scrap);
  set('r-pop',S.surv.length,cp.beds,null); $('#r-pop').classList.remove('low');
  set('r-door',Math.ceil(S.door.hp),doorMax(),null); $('#r-door').classList.toggle('low',S.door.hp<doorMax()*.3);
  $('#clock').textContent=t('clock',{d:S.day,h:clockStr()})+(S.speed===0?' · '+t('paused'):'');
  $('#stage').classList.toggle('alarm',S.inv.warned||S.zomb.length>0);
}

/* ================= LOOP ================= */
let prev=performance.now(), acc=0, panelT=0, saveT=0, lastDraw=0, fpsN=0, fpsT=0;
function frame(now){
  requestAnimationFrame(frame);
  const interval=cfg.fps?1000/cfg.fps:0;
  if(interval&&now-lastDraw<interval-1)return;
  lastDraw=now;
  const dt=Math.min(.1,(now-prev)/1000); prev=now;
  const running=!ui.modal&&!ui.menu&&!S.over&&S.speed>0;
  if(running){acc+=dt*S.speed;while(acc>=0.05){step(0.05);acc-=0.05;}}
  else if(ui.menu&&!S.over){walkers(dt);}
  for(const p of ui.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g??80)*dt;p.l-=dt;}
  ui.parts=ui.parts.filter(p=>p.l>0);
  const gy=gyF(); for(const a of ash){a.y+=a.v*dt;a.x+=(a.d+Math.sin(now/1000+a.y*.05)*4)*dt;if(a.y>gy){a.y=-4;a.x=Math.random()*W;}}
  if(ui.layersDirty&&now-ui.zoomT>160){buildLayers();ui.layersDirty=false;}
  draw(now);
  fpsN++; fpsT+=dt; if(fpsT>=.5){if(cfg.showFps)$('#fps').textContent=Math.round(fpsN/fpsT)+' FPS';fpsN=0;fpsT=0;}
  panelT+=dt; if(panelT>.35){panelT=0;checkMissions();hud();if(!ui.menu)renderPanel(false);}
  saveT+=dt; if(saveT>5){saveT=0;save();}
}
function boot(data){
  S=(data&&data.S&&data.S.v===2)?data.S:(load()||null);
  if(!S)newGame(); else if(S.best==null)S.best=+(lsGet(BKEY)||0);
  if(S.mi==null)S.mi=0; if(!S.stats)S.stats={waves:0}; if(S.introSeen==null)S.introSeen=S.day>1;
  if(typeof window.claude?.hot?.snapshot==='function')window.claude.hot.snapshot(()=>({S}));
  setSpeed(S.speed??1);
  $('#fps').hidden=!cfg.showFps;
  applyLang(); layout(); hud(); renderPanel(true);
  if(!(data&&data.S))openMenu('main');
  window.addEventListener('resize',layout);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>layout());
  window.addEventListener('pagehide',save);
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
